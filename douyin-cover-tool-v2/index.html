<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抖音封面工具 v2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;color:#222;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid #e6e8eb;padding:11px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:9;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header .v{background:#111;color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.5px}
header span{color:#8a9099;font-size:12px}
header a{color:#3b6ef6;text-decoration:none;font-size:12px;border:1px solid #dcdfe4;padding:4px 10px;border-radius:999px}
header a:hover{border-color:#3b6ef6}
.wrap{max-width:1340px;margin:0 auto;padding:16px;display:grid;grid-template-columns:340px 1fr;gap:16px}
.card{background:#fff;border:1px solid #e6e8eb;border-radius:12px;padding:15px;margin-bottom:14px}
.card h2{font-size:12px;color:#8a9099;margin:0 0 10px;font-weight:700;letter-spacing:.6px}
label{display:block;margin-bottom:11px;font-size:13px;color:#555}
label input{width:100%;margin-top:5px;padding:9px 11px;border:1px solid #dcdfe4;border-radius:8px;font-size:14px;background:#fafbfc;font-family:inherit}
label input:focus{outline:none;border-color:#111;background:#fff}
label .hint{font-size:11px;color:#a6acb4;margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border:1px solid #dcdfe4;border-radius:999px;cursor:pointer;font-size:13px;background:#fff}
.chip.on{background:#111;border-color:#111;color:#fff}
.drop{border:2px dashed #c9ced6;border-radius:12px;padding:18px;text-align:center;color:#8a9099;cursor:pointer;background:#fafbfc}
.drop:hover,.drop.hot{border-color:#111;color:#111;background:#f5f5f5}
.drop img{max-width:100%;max-height:110px;border-radius:8px;margin-bottom:8px}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.t{border:2px solid #e6e8eb;border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;position:relative}
.t.on{border-color:#111;box-shadow:0 4px 14px rgba(0,0,0,.13)}
.t canvas{width:100%;display:block}
.t .n{padding:6px 9px;font-size:12px;color:#555;display:flex;justify-content:space-between;align-items:center}
.t.on .n{color:#111;font-weight:700}
.rec{position:absolute;top:6px;left:6px;background:#111;color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700}
.stage{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.pv{background:#fff;border:1px solid #e6e8eb;border-radius:12px;padding:12px}
.pv h4{margin:0 0 9px;font-size:11px;color:#8a9099;font-weight:700}
.pv canvas{display:block;border-radius:6px}
.pv .main canvas{width:300px;box-shadow:0 6px 20px rgba(0,0,0,.09)}
.pv .mini canvas{width:132px;box-shadow:0 3px 10px rgba(0,0,0,.09)}
.pv .mini{text-align:center}
.pv .mini .cap{font-size:11px;color:#8a9099;margin-top:6px}
.pv .v9 canvas{width:150px;box-shadow:0 3px 10px rgba(0,0,0,.09)}
.btns{display:flex;flex-direction:column;gap:9px;min-width:200px}
button.big{background:#111;color:#fff;border:none;border-radius:9px;padding:13px 15px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
button.big:hover{background:#000}
button.ghost{background:#fff;color:#333;border:1px solid #dcdfe4;border-radius:9px;padding:11px 15px;font-size:13px;cursor:pointer;font-family:inherit;text-align:left}
button.ghost:hover{border-color:#111}
button.ghost b{float:right;color:#111}
.tips{font-size:12px;color:#8a9099;line-height:1.9}
.ok{color:#12a150}.bad{color:#e5484d}
.hook{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hook button{font-size:11px;padding:4px 9px;border:1px solid #dcdfe4;background:#fff;border-radius:999px;cursor:pointer;font-family:inherit}
.hook button:hover{border-color:#111}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>抖音封面工具</h1><span class="v">v2 重制版</span>
  <span>3:4 主画布 · 底部 160px 已避让抖音 UI · 缩略图可读性自检</span>
  <a href="cover-tool.html">← v1 经典版（对比用）</a>
</header>
<div class="wrap">
  <div>
    <div class="card">
      <h2>① 标题（最多 3 层文字）</h2>
      <label>主标题 <span class="hint">建议 3–8 字，手机上一眼能读完</span>
        <input id="title" placeholder="例：纸杯塔能有多高"></label>
      <label>副标题 <span class="hint">主标题的一半大小，只留一句</span>
        <input id="sub" placeholder="例：今天实验做到第 12 轮"></label>
      <label>角标（期数/编号）<input id="badge" placeholder="例：实验 012"></label>
      <label>标签 <input id="tag" placeholder="例：亲子游戏"></label>
      <div style="font-size:12px;color:#8a9099;margin:-4px 0 8px">钩子句式一键改写：</div>
      <div class="hook" id="hooks"></div>
    </div>

    <div class="card">
      <h2>② 主图</h2>
      <div class="drop" id="drop">
        <div id="dropTxt">点击选择图片，或拖进来<br><span style="font-size:12px">竖图更佳 · 不传则用示例图</span></div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </div>

    <div class="card">
      <h2>③ 合集（决定配色与角标）</h2>
      <div class="chips" id="cols"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>④ 版式（8 款骨架，任意合集可用；带「荐」的是该合集推荐）</h2>
      <div class="tpl" id="tpls"></div>
    </div>

    <div class="card">
      <h2>预览与导出</h2>
      <div class="stage">
        <div class="pv main">
          <h4>封面 1080×1440（3:4 实际显示尺寸）</h4>
          <canvas id="pv" width="1080" height="1440"></canvas>
          <label style="margin:8px 0 0;font-size:12px"><input type="checkbox" id="guides" style="width:auto;margin-right:5px">显示安全区参考线</label>
        </div>
        <div class="pv mini">
          <h4>信息流缩略图实际大小</h4>
          <canvas id="mini" width="132" height="176"></canvas>
          <div class="cap">132px 宽 · 还认得出吗？</div>
        </div>
        <div class="pv v9">
          <h4>竖屏 1080×1920</h4>
          <canvas id="pv9" width="1080" height="1920"></canvas>
        </div>
        <div class="btns">
          <button class="big" id="exp34">导出封面 1080×1440（PNG）</button>
          <button class="ghost" id="exp916">导出竖屏 1080×1920（PNG）<b>9:16</b></button>
          <button class="ghost" id="expjpg">导出封面 JPG<b>小体积</b></button>
          <button class="ghost" id="exptrio">导出同合集 8 款拼图<b>3240×1440</b></button>
          <div class="tips" id="check"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   乐小侠 · 抖音封面工作台 v2.0（重制版引擎）
   设计依据（2026 优秀封面共性）：
   1. 文字面积 ≤40%；主标题 3–8 字，字号占画面高 12–18%
   2. 层级只有 3 级：主标题 → 副标题(≈主标题一半) → 标签(再小一半)
   3. 一张封面最多 1主标题 + 1副标题 + 1标签
   4. 三分法：主体在 1/3 线，文字在对角，留白在中间
   5. 底部 160px 为 UI 遮挡区，内容止于 y=1280
   6. 描边宽度 ≈ 字号 5%；主色 ≤3；对齐不混用
   主画布 1080×1440（3:4，抖音主页/合集实际显示比例）
   ========================================================= */

const CW = 1080, CH = 1440;          /* 封面主画布 3:4 */
const SAFE = { top: 72, bottom: 1280, left: 80, right: 80 };  /* 内容安全区 */

/* ---------- 工具函数 ---------- */
function rgba(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g2=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return 'rgba('+r+','+g2+','+b+','+a+')';
}
const F = (w,s)=>`${w} ${s}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`;

function rr(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* 图片等比裁切填充 */
function coverDraw(ctx,img,x,y,w,h,r){
  ctx.save();
  if(r){rr(ctx,x,y,w,h,r);ctx.clip();}
  if(img){
    const ir=img.width/img.height, tr=w/h;
    let sw,sh,sx,sy;
    if(ir>tr){sh=img.height;sw=sh*tr;sx=(img.width-sw)/2;sy=0;}
    else{sw=img.width;sh=sw/tr;sx=0;sy=(img.height-sh)/2;}
    ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  }else{
    ctx.fillStyle='#c9c4bb';ctx.fillRect(x,y,w,h);
  }
  ctx.restore();
}
/* 自适应字号：不超过 maxW，最小 min */
function fitText(ctx,txt,maxW,size,weight=900,min=28){
  let s=size;ctx.font=F(weight,s);
  while(ctx.measureText(txt).width>maxW&&s>min){s-=2;ctx.font=F(weight,s);}
  return s;
}
/* 单行文字 */
function text1(ctx,txt,x,y,maxW,size,color,weight=900,align='left'){
  const s=fitText(ctx,txt,maxW,size,weight);
  ctx.font=F(weight,s);ctx.fillStyle=color;
  ctx.textAlign=align;ctx.textBaseline='alphabetic';
  ctx.fillText(txt,x,y);ctx.textAlign='left';
  return s;
}
/* 多行折行（按字符断行，适合中文） */
function wrapLines(ctx,txt,maxW,size,weight,maxLines){
  ctx.font=F(weight,size);
  const out=[];let line='';
  for(const ch of txt){
    const t=line+ch;
    if(ctx.measureText(t).width>maxW&&line){
      out.push(line);line=ch;
      if(out.length>=maxLines)break;
    } else line=t;
  }
  if(line&&out.length<maxLines)out.push(line);
  return out;
}
/* 主标题块：优先单行；装不下折 2 行；返回 {lines,size} */
function titleBlock(ctx,txt,maxW,size,min,maxLines){
  let s=size;ctx.font=F(900,s);
  while(ctx.measureText(txt).width>maxW&&s>min){s-=2;ctx.font=F(900,s);}
  if(ctx.measureText(txt).width<=maxW)return{lines:[txt],size:s};
  const lines=wrapLines(ctx,txt,maxW,s,900,maxLines||2);
  return{lines,size:s};
}
/* 画标题（可描边/阴影），返回最后一行基线 y */
function drawTitle(ctx,txt,x,yBase,maxW,size,fill,opt={}){
  const min=opt.min||72, maxLines=opt.maxLines||2;
  const b=titleBlock(ctx,txt,maxW,size,min,maxLines);
  const lh=Math.round(b.size*1.14);
  let first=yBase-(b.lines.length-1)*lh;
  b.lines.forEach((l,i)=>{
    const yy=first+i*lh;
    ctx.font=F(900,b.size);ctx.textAlign=opt.align||'left';ctx.lineJoin='round';ctx.miterLimit=2;
    if(opt.stroke){
      ctx.strokeStyle=opt.stroke;
      ctx.lineWidth=Math.max(4,b.size*0.05);   /* 描边 ≈ 字号 5% */
      ctx.strokeText(l,x,yy);
    }
    if(opt.shadow){
      ctx.shadowBlur=opt.shadowBlur||18;ctx.shadowColor=opt.shadow;ctx.shadowOffsetY=6;
    }
    ctx.fillStyle=fill;ctx.fillText(l,x,yy);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.shadowOffsetY=0;
  });
  ctx.textAlign='left';
  return yBase;
}
/* 合集小胶囊（统一标识） */
function colPill(ctx,C,x,y,size=42,align='left'){
  ctx.font=F(800,size);
  const label=C.icon+'  '+C.name;
  const w=ctx.measureText(label).width+size*1.4;
  const h=size*2;
  const px=align==='center'?CW/2-w/2:(align==='right'?x-w:x);
  ctx.fillStyle=C.primary;rr(ctx,px,y,w,h,h/2);ctx.fill();
  ctx.strokeStyle=rgba(C.dark,.35);ctx.lineWidth=2;rr(ctx,px,y,w,h,h/2);ctx.stroke();
  ctx.fillStyle=C.dark;ctx.textBaseline='middle';ctx.fillText(label,px+size*0.7,y+h/2+1);
  ctx.textBaseline='alphabetic';
  return {w,h};
}
/* 小标签胶囊（描边/实心二选一） */
function tagPill(ctx,txt,x,y,size,fg,bg,stroke){
  ctx.font=F(800,size);
  const w=ctx.measureText(txt).width+size*1.6, h=size*1.9;
  if(bg){ctx.fillStyle=bg;rr(ctx,x,y,w,h,h/2);ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2.5;rr(ctx,x,y,w,h,h/2);ctx.stroke();}
  ctx.fillStyle=fg;ctx.textBaseline='middle';ctx.fillText(txt,x+size*0.8,y+h/2+1);
  ctx.textBaseline='alphabetic';
  return {w,h};
}
/* 安全区参考线（仅编辑器显示，不导出） */
function drawGuides(ctx){
  ctx.save();
  ctx.strokeStyle='rgba(0,180,255,.9)';ctx.lineWidth=3;ctx.setLineDash([14,10]);
  ctx.strokeRect(SAFE.left,SAFE.top,CW-SAFE.left-SAFE.right,SAFE.bottom-SAFE.top);

  ctx.fillText('▼ UI 遮挡区以下不放文字',SAFE.left,SAFE.bottom+34);
  ctx.restore();
}

    tg.addColorStop(0,rgba(C.dark,.30));tg.addColorStop(1,rgba(C.dark,0));
    ctx.fillStyle=tg;ctx.fillRect(0,840,CW,140);
    drawTitle(ctx,d.title,SAFE.left,960,CW-SAFE.left-SAFE.right,124,'#FFF6E6',
      {min:72,maxLines:2,shadow:rgba(C.dark,.5),shadowBlur:14});
    text1(ctx,d.sub,SAFE.left,1032,CW-SAFE.left-SAFE.right,50,'rgba(255,246,230,.92)',700);
    /* 底部标签 */
    ctx.fillStyle=C.primary;rr(ctx,SAFE.left,1076,140,56,28);ctx.fill();
    ctx.fillStyle=C.dark;ctx.font=F(800,34);ctx.textBaseline='middle';
    ctx.fillText(d.badge||'合集',SAFE.left+70,1104);ctx.textBaseline='alphabetic';
    if(d.tag)text1(ctx,d.tag,SAFE.left+180,1114,400,42,'rgba(255,246,230,.88)',700);
  }
};


/* ================= 状态与交互 ================= */
const state={col:'play',layout:'A1',title:'',sub:'',badge:'',tag:'',img:null};
const imgs={};

function D(){
  const pc=PRESETS[state.col]||{};
  const p=pc[state.layout]||{};
  return {col:state.col,layout:state.layout,
    title:state.title||p.title||'', sub:state.sub||p.sub||'',
    badge:state.badge||p.badge||'', tag:state.tag||p.tag||''};
}
function drawDesign(ctx,id,guides){
  const img=state.img||imgs[state.col]||null;
  try{ RENDER[id](ctx,D(),img); }
  catch(e){ console.error('render',id,e);
    ctx.fillStyle='#3a1f1f';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#ffb4b4';ctx.font=F(700,44);ctx.textAlign='center';
    ctx.fillText('渲染出错：'+id,CW/2,700);ctx.textAlign='left'; }
  if(guides) drawGuides(ctx);
}
function refresh(){
  const c=document.getElementById('pv'),x=c.getContext('2d');
  x.clearRect(0,0,CW,CH);drawDesign(x,state.layout,document.getElementById('guides').checked);
  const m=document.getElementById('mini'),mx=m.getContext('2d');
  mx.clearRect(0,0,132,176);mx.drawImage(c,0,0,CW,CH,0,0,132,176);
  const v9=document.getElementById('pv9'),v9x=v9.getContext('2d');
  v9x.clearRect(0,0,1080,1920);
  /* 9:16 = 3:4 封面居中 + 同图模糊延展 */
  v9x.save();v9x.filter='blur(28px) brightness(.72)';
  v9x.drawImage(c,-30,180,1140,1140);v9x.restore();
  v9x.drawImage(c,0,240);
  check();
}
function check(){
  const d=D(),o=[];
  const n=(d.title||'').replace(/\s/g,'').length;
  o.push(n===0?['bad','还没填主标题']:(n<=8?['ok','主标题 '+n+' 字 ✓']:['bad','主标题 '+n+' 字，建议 ≤8 字（缩略图看不清）']));
  o.push([(d.sub||'').length<=20?'ok':'bad','副标题 '+(d.sub||'').length+' 字，建议 ≤20 字']);
  /* 文字面积粗估：主标题宽×高 / 画布 */
  const est=(d.title.length*(d.title.length>8?130:170)*(d.title.length>6?2:1))/(CW*CH);
  o.push([est<0.40?'ok':'bad','文字占比约 '+Math.round(est*100)+'%（应 <40%）']);
  const banned=['爆款','热播','强推','第一','全网最低','国家级','绝对','天花板','yyds'];
  const hit=banned.filter(w=>((d.title+d.sub+d.badge+d.tag).includes(w)));
  o.push(hit.length?['bad','命中敏感词：'+hit.join('、')]:['ok','无违禁/绝对化用词 ✓']);
  o.push(['ok','AI 素材：发布页勾「含有 AI 生成内容」+ 官方 AI 标识工具']);
  document.getElementById('check').innerHTML=o.map(v=>`<div class="${v[0]}">${v[0]==='ok'?'✓':'⚠'} ${v[1]}</div>`).join('');
}
function buildCols(){
  const box=document.getElementById('cols');box.innerHTML='';
  Object.keys(COLLECTIONS).forEach(k=>{
    const b=document.createElement('div');
    b.className='chip'+(state.col===k?' on':'');
    b.textContent=COLLECTIONS[k].icon+' '+COLLECTIONS[k].name;
    b.onclick=()=>{state.col=k;state.layout=COLLECTIONS[k].rec[0];buildCols();buildTpls();refresh();};
    box.appendChild(b);
  });
}
function buildTpls(){
  const box=document.getElementById('tpls');box.innerHTML='';
  const rec=COLLECTIONS[state.col].rec;
  LAYOUTS.forEach(l=>{
    const d=document.createElement('div');
    d.className='t'+(state.layout===l.id?' on':'');
    if(rec.includes(l.id)){const r=document.createElement('div');r.className='rec';r.textContent='荐';d.appendChild(r);}
    const c=document.createElement('canvas');c.width=280;c.height=373;
    drawDesign(c.getContext('2d'),l.id,false);
    const n=document.createElement('div');n.className='n';
    n.innerHTML='<span>'+l.id+' '+l.name+'</span>';
    n.title=l.desc;
    d.appendChild(c);d.appendChild(n);
    d.onclick=()=>{state.layout=l.id;buildTpls();refresh();};
    box.appendChild(d);
  });
}
/* 钩子句式 */
const HOOKS={
  '数字承诺':['3 步搞定亲子实验','纸杯塔能有多高','搭了 12 轮才倒'],
  '悬念提问':['为什么娃总问为什么','纸杯塔能有多高','云是不是棉花糖'],
  '结果反差':['从 0 到 30 层','娃今天说了什么','去过的地方越来越多了']
};
function buildHooks(){
  const box=document.getElementById('hooks');box.innerHTML='';
  Object.keys(HOOKS).forEach(k=>{
    HOOKS[k].forEach(t=>{
      const b=document.createElement('button');b.textContent=t;
      b.onclick=()=>{state.title=t;document.getElementById('title').value=t;refresh();};
      box.appendChild(b);
    });
  });
}
/* 上传 */
function useFile(f){
  const u=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{state.img=im;
    document.getElementById('dropTxt').innerHTML='<img src="'+u+'"><div style="font-size:12px;color:#12a150">已使用上传图片 · 再次点击可换</div>';
    buildTpls();refresh();};
  im.src=u;
}
document.getElementById('drop').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{if(e.target.files[0])useFile(e.target.files[0]);};
['dragover','dragenter'].forEach(ev=>document.getElementById('drop').addEventListener(ev,e=>{e.preventDefault();document.getElementById('drop').classList.add('hot');}));
['dragleave','drop'].forEach(ev=>document.getElementById('drop').addEventListener(ev,e=>{e.preventDefault();document.getElementById('drop').classList.remove('hot');}));
document.getElementById('drop').addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))useFile(f);});
['title','sub','badge','tag'].forEach(k=>{
  document.getElementById(k).oninput=e=>{state[k]=e.target.value;refresh();};
});
document.getElementById('guides').onchange=refresh;
/* 导出 */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function renderFull(id){
  const t=document.createElement('canvas');t.width=CW;t.height=CH;
  drawDesign(t.getContext('2d'),id,false);return t;
}
function exportCanvas(w,h,type,name,id){
  const src=renderFull(id||state.layout);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  if(w===CW&&h===CH)x.drawImage(src,0,0);
  else{ x.save();x.filter='blur(28px) brightness(.72)';x.drawImage(src,-40,200,w+80,w+80);x.restore(); x.drawImage(src,0,(h-CH)/2); }
  c.toBlob(b=>dl(b,name),type||'image/png',0.92);
}
document.getElementById('exp34').onclick=()=>exportCanvas(CW,CH,'image/png','cover-1080x1440.png');
document.getElementById('exp916').onclick=()=>exportCanvas(1080,1920,'image/png','cover-1080x1920.png');
document.getElementById('expjpg').onclick=()=>exportCanvas(CW,CH,'image/jpeg','cover-1080x1440.jpg');
document.getElementById('exptrio').onclick=()=>{
  const ids=LAYOUTS.map(l=>l.id);
  const c=document.createElement('canvas');c.width=1080*4;c.height=1440;const x=c.getContext('2d');
  ids.forEach((id,i)=>{const s=renderFull(id);x.drawImage(s,(i%4)*1080,Math.floor(i/4)*0,1080,1440);});
  c.toBlob(b=>dl(b,'layouts-8.png'),'image/png');
};
/* 启动 */
buildHooks();buildCols();buildTpls();
let pending=Object.keys(COLLECTIONS).length;
Object.keys(COLLECTIONS).forEach(k=>{
  const im=new Image();
  im.onload=()=>{imgs[k]=im;if(--pending===0){buildTpls();refresh();}};
  im.onerror=()=>{imgs[k]=null;if(--pending===0){buildTpls();refresh();}};
  im.src=COLLECTIONS[k].img;
});
refresh();
</script>
