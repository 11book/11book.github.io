<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>滴酒未沾 · 今夜开戒</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0d0b12;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:2;max-width:420px;margin:0 auto;padding:40px 26px;text-align:center}
h1{font-size:38px;line-height:1.3;font-weight:800;background:linear-gradient(90deg,#ffd76e,#ff8a5b,#ff5f9e);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:16px;color:#c9c4d6;margin-top:14px;line-height:1.8}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);margin:26px 0 30px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd76e,#ff5f9e)}
.cup{font-size:78px;animation:cheer .6s}
@keyframes cheer{0%{transform:scale(.3) rotate(-30deg);opacity:0}60%{transform:scale(1.2) rotate(12deg)}100%{transform:scale(1)}}
h2{font-size:22px;color:#ffd76e;margin-top:18px}
.btn{margin-top:32px;width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#2a1206;background:linear-gradient(90deg,#ffd76e,#ff9d5c);box-shadow:0 10px 30px rgba(255,160,60,.3);cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.foot{margin-top:26px;font-size:11px;color:#6f6a7e}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <div class="cup">🥂</div>
  <h1>11月至今<br>滴酒未沾</h1>
  <div class="bar"><i></i></div>
  <h2>今晚得喝点庆祝一下</h2>
  <p>11 月至今滴水未沾，给自己庆个功</p>
  <button class="btn" id="go">🍶 干杯</button>
  <div class="foot">无厘头实验室 · 017</div>
</div>
<script>
var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,ps=[];
function rz(){W=c.width=innerWidth;H=c.height=innerHeight;}rz();addEventListener('resize',rz);
var cols=['#ffd76e','#ff8a5b','#ff5f9e','#7ee7c0','#8ab6ff'];
function burst(){for(var k=0;k<100;k++)ps.push({x:innerWidth/2+(Math.random()-.5)*180,y:innerHeight*.4,vx:(Math.random()-.5)*9,vy:-6-Math.random()*9,g:.32,w:6+Math.random()*7,h:4+Math.random()*6,c:cols[(Math.random()*cols.length)|0],a:1});}
document.getElementById('go').onclick=burst;
function loop(){x.clearRect(0,0,W,H);
var g=x.createRadialGradient(W*.5,H*.35,0,W*.5,H*.35,H*.8);g.addColorStop(0,'rgba(255,140,60,.12)');g.addColorStop(1,'rgba(13,11,18,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
for(var i=ps.length-1;i>=0;i--){var p=ps[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a-=.006;p.vx*=.995;
if(p.a<=0||p.y>H+30){ps.splice(i,1);continue;}
x.save();x.globalAlpha=Math.max(p.a,0);x.translate(p.x,p.y);x.rotate(p.x/12);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();}
requestAnimationFrame(loop);}loop();
</script>
</body>
</html>
