<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>11月至今滴酒未沾</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Heiti SC",-apple-system,sans-serif;background:#000;color:#fff;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0}
.stage{position:relative;z-index:2;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.cup{font-size:88px;margin-bottom:26px;animation:cheer .6s}
@keyframes cheer{0%{transform:scale(.3) rotate(-30deg);opacity:0}60%{transform:scale(1.2) rotate(12deg)}100%{transform:scale(1)}}
h1{font-size:15vw;line-height:1.15;font-weight:900;letter-spacing:2px}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd76e,#ff8a5b,#ff5f9e);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:64px;height:4px;border-radius:99px;background:linear-gradient(90deg,#ffd76e,#ff5f9e);margin:34px 0}
h2{font-size:7.4vw;line-height:1.5;font-weight:800;color:#ffd76e}
.btn{margin-top:52px;border:0;border-radius:99px;padding:16px 44px;font-size:20px;font-weight:800;color:#2a1206;background:linear-gradient(90deg,#ffd76e,#ff9d5c);box-shadow:0 12px 34px rgba(255,160,60,.35);cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="stage">
  <div class="cup">🥂</div>
  <h1>11月至今<br><em>滴酒未沾</em></h1>
  <div class="rule"></div>
  <h2>今晚喝点<br>庆祝一下</h2>
  <button class="btn" id="go">🍶 干杯</button>
</div>
<script>
var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,ps=[];
function rz(){W=c.width=innerWidth;H=c.height=innerHeight;}rz();addEventListener('resize',rz);
var cols=['#ffd76e','#ff8a5b','#ff5f9e','#7ee7c0','#8ab6ff'];
function burst(){for(var k=0;k<110;k++)ps.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.42,vx:(Math.random()-.5)*10,vy:-7-Math.random()*10,g:.34,w:7+Math.random()*8,h:5+Math.random()*7,c:cols[(Math.random()*cols.length)|0],a:1});}
document.getElementById('go').onclick=burst;
function loop(){x.clearRect(0,0,W,H);
var g=x.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,H*.75);g.addColorStop(0,'rgba(255,140,60,.14)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
for(var i=ps.length-1;i>=0;i--){var p=ps[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a-=.006;p.vx*=.995;
if(p.a<=0||p.y>H+30){ps.splice(i,1);continue;}
x.save();x.globalAlpha=Math.max(p.a,0);x.translate(p.x,p.y);x.rotate(p.x/12);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();}
requestAnimationFrame(loop);}loop();
</script>
</body>
</html>
