<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .calculator {
    background: #2d2d2d;
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    width: min(320px, 90vw);
  }

  .display {
    background: #0d0d0d;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: right;
    margin-bottom: 16px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .display-expression {
    color: #888;
    font-size: 20px;
    min-height: 28px;
    word-break: break-all;
    line-height: 1.2;
  }

  .display-result {
    color: #fff;
    font-size: 48px;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1.1;
    transition: all 0.15s;
  }

  .display-result.big { font-size: 36px; }
  .display-result.huge { font-size: 26px; }
  .display-result.waiting {
    color: #555;
    font-size: 36px;
    letter-spacing: 0;
  }
  .display-result.error { color: #ff6b6b; font-size: 18px; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .btn {
    height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 26px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.1s;
  }

  .btn:active { transform: scale(0.93); }
  .btn-num { background: #333; color: #fff; }
  .btn-num:hover { background: #3d3d3d; }
  .btn-op { background: #ff9f0a; color: #fff; }
  .btn-op:hover { background: #ffb03a; }
  .btn-fn { background: #616161; color: #000; }
  .btn-fn:hover { background: #757575; }
  .btn-eq { background: #ff9f0a; color: #fff; border-radius: 50%; }

  /* ===== 动画遮罩 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    cursor: pointer;
  }

  .overlay.active { display: flex; }

  /* 运算式条 */
  .expr-bar {
    position: absolute;
    top: max(env(safe-area-inset-top), 28px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.06);
    padding: 8px 22px;
    border-radius: 20px;
    font-size: 18px;
    color: #666;
    letter-spacing: 2px;
    font-family: 'Courier New', monospace;
  }

  .thinking {
    color: #4ecca3;
    font-size: 17px;
    font-weight: bold;
    margin-top: 16px;
    min-height: 26px;
  }

  /* ===== 手数区域 ===== */
  .counting-stage {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  /* 数数进度条 */
  .progress-bar {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .progress-bar.show { opacity: 1; }

  .progress-fill {
    height: 100%;
    background: #4ecca3;
    border-radius: 3px;
    transition: width 0.3s ease;
    width: 0%;
  }

  /* 手 - 扁平卡通风格 */
  .hand-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s, transform 0.4s;
  }

  .hand-wrapper.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* 袖子 */
  .sleeve {
    width: 72px;
    height: 80px;
    background: linear-gradient(180deg, #4a8bc2, #3d7db5);
    border-radius: 8px 8px 0 0;
  }

  /* 手掌 + 手指 */
  .hand-body {
    position: relative;
    width: 140px;
    height: 120px;
  }

  /* 掌心底 */
  .palm-bg {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 65px;
    background: #f8d5b8;
    border-radius: 40% 40% 45% 45%;
    border: 2px solid #e8b89a;
  }

  /* 手指们 */
  .finger-row {
    position: absolute;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    align-items: flex-end;
  }

  .fin {
    background: #f8d5b8;
    border: 2px solid #e8b89a;
    border-radius: 8px 8px 5px 5px;
    transition: transform 0.2s ease, height 0.2s ease;
    transform-origin: bottom center;
  }

  .fin.thumb {
    position: absolute;
    bottom: 25px;
    left: -8px;
    width: 20px;
    height: 32px;
    border-radius: 8px;
    transform: rotate(-35deg);
    transform-origin: bottom right;
  }

  /* 每根手指位置 */
  .fin-0 { width: 16px; height: 0; }
  .fin-1 { width: 16px; height: 0; }
  .fin-2 { width: 16px; height: 0; }
  .fin-3 { width: 14px; height: 0; }

  /* 伸直状态 */
  .fin-0.up { height: 44px; }
  .fin-1.up { height: 50px; }
  .fin-2.up { height: 47px; }
  .fin-3.up { height: 40px; }
  .fin.thumb.up { height: 34px; }

  /* 弯曲状态 */
  .fin-0.bent { height: 30px; transform: rotate(-30deg); }
  .fin-1.bent { height: 30px; transform: rotate(-25deg); }
  .fin-2.bent { height: 30px; transform: rotate(-20deg); }
  .fin-3.bent { height: 26px; transform: rotate(-15deg); }
  .fin.thumb.bent { height: 26px; transform: rotate(-60deg); }

  /* 当前数字显示 */
  .count-badge {
    position: absolute;
    top: -10px;
    right: -20px;
    width: 44px;
    height: 44px;
    background: #4ecca3;
    color: #fff;
    border-radius: 50%;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 3px 12px rgba(78,204,163,0.4);
  }

  .count-badge.show {
    opacity: 1;
    transform: scale(1);
  }

  /* 思考气泡 */
  .think-bubble {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #555;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 14px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .think-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #fff;
    border-bottom: none;
  }

  .think-bubble.show { opacity: 1; }

  /* 错号 */
  .cross-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 70px;
    color: #ff6b6b;
    opacity: 0;
    transition: all 0.3s;
    z-index: 10;
  }

  .cross-icon.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* 脚趾区域 */
  .feet-row {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .feet-row.show { opacity: 1; }

  .foot-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .toe-row {
    display: flex;
    gap: 3px;
  }

  .t {
    width: 12px;
    height: 14px;
    background: #f8d5b8;
    border: 1.5px solid #e8b89a;
    border-radius: 5px 5px 3px 3px;
    transition: transform 0.2s, height 0.2s;
    transform-origin: bottom center;
  }

  .t.up { height: 18px; }
  .t.bent { height: 10px; transform: rotate(-35deg); }

  .sole {
    width: 44px;
    height: 18px;
    background: #f8d5b8;
    border: 1.5px solid #e8b89a;
    border-radius: 20px 20px 10px 10px;
  }

  /* 结果卡片 */
  .result-card {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%) scale(0.7);
    background: #fff;
    color: #000;
    padding: 16px 32px 14px;
    border-radius: 20px;
    text-align: center;
    opacity: 0;
    transition: all 0.45s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .result-card.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .rc-eq { font-size: 13px; color: #aaa; margin-bottom: 2px; }
  .rc-result { font-size: 36px; font-weight: 700; letter-spacing: -1px; display: block; }
  .rc-sub { font-size: 12px; color: #bbb; margin-top: 4px; display: block; }

  @keyframes cardShake {
    0%,100% { transform: translateX(-50%) scale(1); }
    20% { transform: translateX(calc(-50% - 8px)) scale(1.03); }
    40% { transform: translateX(calc(-50% + 8px)) scale(1.03); }
    60% { transform: translateX(calc(-50% - 4px)) scale(1.01); }
    80% { transform: translateX(calc(-50% + 4px)) scale(1.01); }
  }

  .result-card.shake { animation: cardShake 0.5s ease; }

  .tap-hint {
    position: absolute;
    bottom: 5%;
    color: #444;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="display-expression" id="expression"></div>
    <div class="display-result" id="result">0</div>
  </div>
  <div class="keypad">
    <button class="btn btn-fn" onclick="clearCalc()">AC</button>
    <button class="btn btn-fn" onclick="backspace()">⌫</button>
    <button class="btn btn-fn" onclick="appendOp('÷')">÷</button>
    <button class="btn btn-op" onclick="appendOp('×')">×</button>

    <button class="btn btn-num" onclick="appendNum('7')">7</button>
    <button class="btn btn-num" onclick="appendNum('8')">8</button>
    <button class="btn btn-num" onclick="appendNum('9')">9</button>
    <button class="btn btn-op" onclick="appendOp('-')">−</button>

    <button class="btn btn-num" onclick="appendNum('4')">4</button>
    <button class="btn btn-num" onclick="appendNum('5')">5</button>
    <button class="btn btn-num" onclick="appendNum('6')">6</button>
    <button class="btn btn-op" onclick="appendOp('+')">+</button>

    <button class="btn btn-num" onclick="appendNum('1')">1</button>
    <button class="btn btn-num" onclick="appendNum('2')">2</button>
    <button class="btn btn-num" onclick="appendNum('3')">3</button>
    <button class="btn btn-eq" onclick="calculate()">=</button>

    <button class="btn btn-num" onclick="appendNum('0')" style="grid-column: span 2; border-radius: 32px; text-align: left; padding-left: 28px;">0</button>
    <button class="btn btn-num" onclick="appendOp('.')">.</button>
  </div>
</div>

<!-- 动画遮罩 -->
<div class="overlay" id="overlay" onclick="closeAnim()">
  <div class="expr-bar" id="exprBar"></div>
  <div class="thinking" id="thinking">🤔 让我想想…</div>

  <div class="counting-stage" id="stage">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="hand-wrapper" id="handWrapper">
      <div class="think-bubble" id="thinkBubble">手指头…</div>
      <div class="count-badge" id="countBadge">1</div>
      <div class="cross-icon" id="crossIcon">✗</div>

      <div class="hand-body">
        <div class="finger-row">
          <div class="fin fin-0" id="f0"></div>
          <div class="fin fin-1" id="f1"></div>
          <div class="fin fin-2" id="f2"></div>
          <div class="fin fin-3" id="f3"></div>
          <div class="fin thumb" id="fThumb"></div>
        </div>
        <div class="palm-bg"></div>
      </div>
      <div class="sleeve"></div>
    </div>

    <div class="feet-row" id="feetRow">
      <div class="foot-unit">
        <div class="toe-row">
          <div class="t" id="tL0"></div>
          <div class="t" id="tL1"></div>
          <div class="t" id="tL2"></div>
          <div class="t" id="tL3"></div>
          <div class="t" id="tL4"></div>
        </div>
        <div class="sole"></div>
      </div>
      <div class="foot-unit">
        <div class="toe-row">
          <div class="t" id="tR0"></div>
          <div class="t" id="tR1"></div>
          <div class="t" id="tR2"></div>
          <div class="t" id="tR3"></div>
          <div class="t" id="tR4"></div>
        </div>
        <div class="sole"></div>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="rc-eq" id="rcEq"></div>
      <span class="rc-result" id="rcResult"></span>
      <span class="rc-sub" id="rcSub"></span>
    </div>
  </div>

  <div class="tap-hint">点击继续</div>
</div>

<script>
// ====== 状态 ======
let expression = '';
let justCalculated = false;
let pendingResult = null;

const resultEl = document.getElementById('result');
const expEl = document.getElementById('expression');

// ====== 按键 ======
function appendNum(n) {
  if (justCalculated) { expression = ''; justCalculated = false; }
  expression += n;
  updateDisplay();
}

function appendOp(op) {
  if (justCalculated && expression) {
    expression = resultEl.textContent + op;
    justCalculated = false;
  } else {
    expression += op;
  }
  updateDisplay();
}

function clearCalc() {
  expression = '';
  justCalculated = false;
  pendingResult = null;
  resultEl.textContent = '0';
  resultEl.className = 'display-result';
  updateDisplay();
}

function backspace() {
  if (justCalculated) return;
  expression = expression.slice(0, -1);
  updateDisplay();
}

function updateDisplay() {
  expEl.textContent = expression
    .replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  if (resultEl.textContent.length > 6) resultEl.className = 'display-result big';
  else if (resultEl.textContent.length > 9) resultEl.className = 'display-result huge';
  else resultEl.className = 'display-result';
}

// ====== 计算 ======
function calculate() {
  if (!expression || justCalculated) return;

  // 屏幕显示"…"等待
  resultEl.textContent = '…';
  resultEl.className = 'display-result waiting';

  const jsExpr = expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  let realResult;
  try {
    if (!/^[\d+\-*/.() ]+$/.test(jsExpr)) throw new Error();
    // eslint-disable-next-line no-eval
    realResult = eval(jsExpr);
    if (!isFinite(realResult)) throw new Error();
  } catch(e) {
    resultEl.textContent = 'Error';
    resultEl.className = 'display-result error';
    justCalculated = true;
    return;
  }

  justCalculated = true;
  pendingResult = realResult;
  setTimeout(() => startCounting(expression, realResult), 200);
}

// ====== 动画 ======
function startCounting(expr, result) {
  const overlay = document.getElementById('overlay');
  const exprBar = document.getElementById('exprBar');
  const thinking = document.getElementById('thinking');
  const handWrapper = document.getElementById('handWrapper');
  const thinkBubble = document.getElementById('thinkBubble');
  const countBadge = document.getElementById('countBadge');
  const crossIcon = document.getElementById('crossIcon');
  const feetRow = document.getElementById('feetRow');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const resultCard = document.getElementById('resultCard');

  overlay.classList.add('active');
  exprBar.textContent = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−') + ' =';

  // 重置
  resetAll();
  resultCard.classList.remove('show','shake');

  let t = 400;

  // 手出现
  setTimeout(() => {
    thinking.textContent = '📱 让我数数…';
    handWrapper.classList.add('show');
    const thoughts = ['手指头…', '有几个？', '等等…', '🤔'];
    thinkBubble.textContent = thoughts[Math.floor(Math.random()*thoughts.length)];
    thinkBubble.classList.add('show');
  }, t);
  t += 700;

  // 进度条
  setTimeout(() => {
    progressBar.classList.add('show');
  }, t);

  const abs = Math.abs(Math.round(result));
  const n = Math.min(abs, 20);
  let count = 0;
  let wrongDone = false;

  const fingerIds = ['f0','f1','f2','f3','fThumb'];

  const updateFingers = (cnt) => {
    fingerIds.forEach((id, i) => {
      const el = document.getElementById(id);
      el.classList.remove('up', 'bent');
      if (i < cnt) el.classList.add('up');
      else if (i === cnt) el.classList.add('bent');
    });
  };

  // 初始状态：0根伸直
  updateFingers(0);

  const countStep = () => {
    if (count >= n) {
      showFinal(expr, result, resultCard, thinking, progressFill);
      return;
    }

    // 数到一半随机出错
    if (!wrongDone && count === Math.floor(n * 0.5) && n >= 5) {
      wrongDone = true;
      thinking.textContent = '呃…数到哪了？';
      thinkBubble.textContent = '刚才几个来着…';
      thinkBubble.classList.add('show');
      countBadge.textContent = '?';
      countBadge.classList.add('show');

      setTimeout(() => {
        crossIcon.classList.add('show');
        thinking.textContent = '啊！数错了！';
      }, 500);

      setTimeout(() => {
        crossIcon.classList.remove('show');
        thinkBubble.classList.remove('show');
        countBadge.classList.remove('show');
        thinking.textContent = '重新数！';
        updateFingers(0);
        count = 0;
        progressFill.style.width = '0%';
        setTimeout(countStep, 500);
      }, 1400);
      return;
    }

    // 更新进度
    progressFill.style.width = ((count+1) / n * 100) + '%';

    // 更新手指：伸直 count+1 根
    updateFingers(count + 1);

    // 数字气泡
    countBadge.textContent = count + 1;
    countBadge.classList.remove('show');
    void countBadge.offsetWidth;
    countBadge.classList.add('show');

    // 思考气泡随机出现
    if (count === 2) {
      thinkBubble.textContent = '继续…';
      thinkBubble.classList.add('show');
      setTimeout(() => thinkBubble.classList.remove('show'), 600);
    }
    if (count === 4) {
      thinkBubble.textContent = '手指用完啦！';
      thinkBubble.classList.add('show');
      thinking.textContent = '🦶 用脚趾…';
    }
    if (count === 9) {
      feetRow.classList.add('show');
      thinking.textContent = '🦶 脚趾也来帮忙…';
    }

    // 数到10时脚趾开始
    if (count >= 10 && count < 20) {
      const toeIndex = (count - 10) % 10;
      const toes = ['tL0','tL1','tL2','tL3','tL4','tR0','tR1','tR2','tR3','tR4'];
      for (let i = 0; i <= toeIndex && i < toes.length; i++) {
        document.getElementById(toes[i]).classList.add('up');
      }
      if (toeIndex >= 4) {
        thinking.textContent = '🦶 脚趾也不够用了…';
      }
    }

    count++;
    setTimeout(countStep, 300 + Math.random() * 100);
  };

  setTimeout(countStep, t);
}

function showFinal(expr, result, resultCard, thinking, progressFill) {
  thinking.textContent = '✅ 算好了！';
  const subs = [
    '一个一个数的，没有偷懒',
    '数完手指数脚趾，终于算出来了',
    '答案正确，就是费了好大劲',
    '数完了！手指都数酸了…',
  ];
  document.getElementById('rcEq').textContent = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−') + ' =';
  document.getElementById('rcResult').textContent = result;
  document.getElementById('rcSub').textContent = subs[Math.floor(Math.random() * subs.length)];
  setTimeout(() => {
    resultCard.classList.add('show', 'shake');
    // 最后才在计算器屏上显示结果
    resultEl.textContent = result;
    resultEl.className = 'display-result';
    updateDisplay();
  }, 300);
}

function resetAll() {
  ['f0','f1','f2','f3','fThumb'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('up', 'bent');
  });
  ['tL0','tL1','tL2','tL3','tL4','tR0','tR1','tR2','tR3','tR4'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('up', 'bent');
  });
  document.getElementById('countBadge').classList.remove('show');
  document.getElementById('thinkBubble').classList.remove('show');
  document.getElementById('crossIcon').classList.remove('show');
  document.getElementById('feetRow').classList.remove('show');
  document.getElementById('progressBar').classList.remove('show');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('handWrapper').classList.remove('show');
}

function closeAnim() {
  document.getElementById('overlay').classList.remove('active');
  justCalculated = false;
  expression = '';
  if (pendingResult !== null) {
    resultEl.textContent = pendingResult;
    pendingResult = null;
  } else {
    resultEl.textContent = '0';
  }
  resultEl.className = 'display-result';
  updateDisplay();
}

// ====== 键盘 ======
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') appendNum(e.key);
  else if (e.key === '.') appendOp('.');
  else if (e.key === '+') appendOp('+');
  else if (e.key === '-') appendOp('-');
  else if (e.key === '*') appendOp('×');
  else if (e.key === '/') appendOp('÷');
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Escape' || e.key === 'Backspace') backspace();
  else if (e.key === 'Delete') clearCalc();
});

updateDisplay();
</script>
</body>
</html>
