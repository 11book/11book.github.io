<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .calculator {
    background: #2d2d2d;
    border-radius: 30px;
    padding: 20px;
    box-shadow:
      0 25px 60px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.1);
    width: min(320px, 90vw);
  }

  @media (max-width: 360px) {
    .calculator { width: 92vw; padding: 14px; }
    .btn { height: 56px; font-size: 22px; }
    .keypad { gap: 8px; }
  }

  .display {
    background: #0d0d0d;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: right;
    margin-bottom: 16px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  .display-expression {
    color: #888;
    font-size: 20px;
    min-height: 28px;
    word-break: break-all;
    line-height: 1.2;
  }

  .display-result {
    color: #fff;
    font-size: 48px;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1.1;
    transition: all 0.15s;
  }

  .display-result.big { font-size: 36px; }
  .display-result.huge { font-size: 26px; }
  .display-result.error { color: #ff6b6b; font-size: 18px; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .btn {
    height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 26px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
  }

  .btn:active { transform: scale(0.93); }

  .btn-num { background: #333; color: #fff; }
  .btn-num:hover { background: #3d3d3d; }
  .btn-op { background: #ff9f0a; color: #fff; }
  .btn-op:hover { background: #ffb03a; }
  .btn-fn { background: #616161; color: #000; }
  .btn-fn:hover { background: #757575; }
  .btn-eq { background: #ff9f0a; color: #fff; border-radius: 50%; }

  /* ===== 动画遮罩 ===== */
  .anim-zone {
    position: fixed;
    inset: 0;
    background: rgba(26,26,46,0.97);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    cursor: pointer;
  }

  .anim-zone.active { display: flex; }

  .calc-mini {
    position: absolute;
    top: 16px;
    transform: scale(0.5);
    opacity: 0.25;
    pointer-events: none;
  }

  .thinking-text {
    color: #4ecca3;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 28px;
    min-height: 32px;
    text-align: center;
  }

  .anim-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    width: 100%;
    max-width: 500px;
    padding: 0 20px;
  }

  /* 手指数数 */
  .hands-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .hand-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.35s, transform 0.35s;
  }

  .hand-wrap.appear { opacity: 1; transform: translateY(0); }

  .hand-wrap.slide-l { animation: slideL 0.45s cubic-bezier(0.22,1,0.36,1) forwards; }
  .hand-wrap.slide-r { animation: slideR 0.45s cubic-bezier(0.22,1,0.36,1) forwards; }

  @keyframes slideL {
    from { transform: translateX(-80px) translateY(20px); opacity: 0; }
    to { transform: translateX(0) translateY(0); opacity: 1; }
  }

  @keyframes slideR {
    from { transform: translateX(80px) translateY(20px); opacity: 0; }
    to { transform: translateX(0) translateY(0); opacity: 1; }
  }

  .hand-lbl {
    color: #666;
    font-size: 11px;
    margin-top: 5px;
  }

  /* 竖式计算 */
  .竖式 {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: 'Courier New', monospace;
  }

  .竖式-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 28px;
    color: #ddd;
    letter-spacing: 3px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .竖式-row.show { opacity: 1; }

  .竖式-digit {
    display: inline-block;
    width: 28px;
    text-align: center;
    transition: transform 0.3s, color 0.3s;
  }

  .竖式-digit.pop {
    animation: digitPop 0.4s ease;
    color: #4ecca3;
  }

  .竖式-op { color: #ff9f0a; font-size: 22px; }

  .竖式-line {
    width: 180px;
    height: 2px;
    background: #555;
    margin: 4px 0;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .竖式-line.show { opacity: 1; }

  .竖式-result {
    font-size: 36px;
    color: #fff;
    font-weight: bold;
    letter-spacing: 3px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .竖式-result.show { opacity: 1; }

  /* 算筹 */
  .算筹舞台 {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 400px;
  }

  .算筹行 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 20px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .算筹行.show { opacity: 1; }

  .筹棍 {
    width: 4px;
    height: 18px;
    background: #fad6a5;
    border-radius: 2px;
    transition: transform 0.25s ease, opacity 0.25s;
  }

  .筹棍横 { width: 18px; height: 4px; }

  .筹棍.pop {
    animation: 棍动 0.3s ease;
  }

  @keyframes 棍动 {
    0% { transform: scaleY(0); }
    60% { transform: scaleY(1.3); }
    100% { transform: scaleY(1); }
  }

  .算筹-label {
    font-size: 13px;
    color: #555;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .算筹-label.show { opacity: 1; }

  /* 结果气泡 */
  .result-bubble {
    position: absolute;
    bottom: 12%;
    background: #fff;
    color: #000;
    padding: 16px 30px;
    border-radius: 18px;
    text-align: center;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 90vw;
  }

  .result-bubble.show { opacity: 1; transform: scale(1); }

  .bubble-eq {
    font-size: 13px;
    color: #999;
    margin-bottom: 2px;
  }

  .bubble-result {
    font-size: 34px;
    font-weight: 700;
    display: block;
    letter-spacing: -1px;
  }

  .bubble-sub {
    font-size: 12px;
    color: #bbb;
    margin-top: 4px;
    display: block;
  }

  @keyframes bubbleShake {
    0%,100% { transform: translateX(0) scale(1); }
    20% { transform: translateX(-8px) scale(1.04); }
    40% { transform: translateX(8px) scale(1.04); }
    60% { transform: translateX(-4px) scale(1.02); }
    80% { transform: translateX(4px) scale(1.02); }
  }

  .result-bubble.shake { animation: bubbleShake 0.55s ease; }

  .tap-hint {
    position: absolute;
    bottom: 4%;
    color: #444;
    font-size: 13px;
  }

  /* 手指弯曲动画 */
  @keyframes fingerBend {
    0% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(-50deg) translateY(-4px); }
    100% { transform: rotate(-35deg) translateY(0); }
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="display-expression" id="expression"></div>
    <div class="display-result" id="result">0</div>
  </div>
  <div class="keypad">
    <button class="btn btn-fn" onclick="clearCalc()">AC</button>
    <button class="btn btn-fn" onclick="backspace()">⌫</button>
    <button class="btn btn-fn" onclick="appendOp('÷')">÷</button>
    <button class="btn btn-op" onclick="appendOp('×')">×</button>

    <button class="btn btn-num" onclick="appendNum('7')">7</button>
    <button class="btn btn-num" onclick="appendNum('8')">8</button>
    <button class="btn btn-num" onclick="appendNum('9')">9</button>
    <button class="btn btn-op" onclick="appendOp('-')">−</button>

    <button class="btn btn-num" onclick="appendNum('4')">4</button>
    <button class="btn btn-num" onclick="appendNum('5')">5</button>
    <button class="btn btn-num" onclick="appendNum('6')">6</button>
    <button class="btn btn-op" onclick="appendOp('+')">+</button>

    <button class="btn btn-num" onclick="appendNum('1')">1</button>
    <button class="btn btn-num" onclick="appendNum('2')">2</button>
    <button class="btn btn-num" onclick="appendNum('3')">3</button>
    <button class="btn btn-eq" onclick="calculate()">=</button>

    <button class="btn btn-num" onclick="appendNum('0')" style="grid-column: span 2; border-radius: 32px; text-align: left; padding-left: 28px;">0</button>
    <button class="btn btn-num" onclick="appendOp('.')">.</button>
  </div>
</div>

<!-- 缩小计算器（动画时显示在顶部） -->
<div class="calculator calc-mini">
  <div class="display">
    <div class="display-expression" id="expMini"></div>
    <div class="display-result" id="resMini">0</div>
  </div>
</div>

<!-- 动画遮罩 -->
<div class="anim-zone" id="animZone" onclick="closeAnim()">
  <div class="thinking-text" id="thinkingText">🤔 AI正在思考…</div>
  <div class="anim-area" id="animArea"></div>
  <div class="result-bubble" id="resultBubble">
    <div class="bubble-eq" id="bubbleEq"></div>
    <span class="bubble-result" id="bubbleResult"></span>
    <span class="bubble-sub" id="bubbleSub"></span>
  </div>
  <div class="tap-hint">点击继续</div>
</div>

<script>
// ====== 状态 ======
let expression = '';
let justCalculated = false;

const resultEl = document.getElementById('result');
const expEl = document.getElementById('expression');
const resMini = document.getElementById('resMini');
const expMini = document.getElementById('expMini');

function updateDisplay() {
  expEl.textContent = expression
    .replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  resMini.textContent = resultEl.textContent;
  expMini.textContent = expEl.textContent;
  if (resultEl.textContent.length > 6) resultEl.className = 'display-result big';
  else if (resultEl.textContent.length > 9) resultEl.className = 'display-result huge';
  else resultEl.className = 'display-result';
}

// ====== 按键 ======
function appendNum(n) {
  if (justCalculated) { expression = ''; justCalculated = false; }
  expression += n;
  updateDisplay();
}

function appendOp(op) {
  if (justCalculated && expression) {
    expression = resultEl.textContent + op;
    justCalculated = false;
  } else {
    expression += op;
  }
  updateDisplay();
}

function clearCalc() {
  expression = '';
  justCalculated = false;
  resultEl.textContent = '0';
  resultEl.className = 'display-result';
  updateDisplay();
}

function backspace() {
  if (justCalculated) return;
  expression = expression.slice(0, -1);
  updateDisplay();
}

// ====== 计算 ======
function calculate() {
  if (!expression || justCalculated) return;
  const jsExpr = expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  let realResult;
  try {
    if (!/^[\d+\-*/.() ]+$/.test(jsExpr)) throw new Error();
    // eslint-disable-next-line no-eval
    realResult = eval(jsExpr);
    if (!isFinite(realResult)) throw new Error();
  } catch(e) {
    resultEl.textContent = 'Error';
    resultEl.classList.add('error');
    justCalculated = true;
    return;
  }
  justCalculated = true;
  resultEl.textContent = realResult;
  updateDisplay();
  setTimeout(() => startAnim(expression, realResult), 350);
}

// ====== 动画启动 ======
function startAnim(expr, result) {
  const zone = document.getElementById('animZone');
  const area = document.getElementById('animArea');
  const thinking = document.getElementById('thinkingText');
  const bubble = document.getElementById('resultBubble');

  zone.classList.add('active');
  area.innerHTML = '';
  bubble.classList.remove('show', 'shake');

  const displayExpr = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');

  const abs = Math.abs(result);
  if (abs <= 10) {
    animFingers(displayExpr, result, thinking, area, bubble);
  } else if (abs <= 999) {
    anim竖式(displayExpr, result, thinking, area, bubble);
  } else {
    anim算筹(displayExpr, result, thinking, area, bubble);
  }
}

// ====== 动画1: 手指数数 (1-10) ======
function animFingers(displayExpr, result, thinking, area, bubble) {
  thinking.textContent = '🤔 让我掰指头算算…';
  area.innerHTML = '';

  const n = Math.abs(Math.round(result));
  const isNeg = result < 0;
  const hands = Math.ceil(n / 5);

  const row = document.createElement('div');
  row.className = 'hands-row';
  area.appendChild(row);

  const handEls = [];
  let t = 400;

  for (let h = 0; h < hands; h++) {
    const hw = document.createElement('div');
    hw.className = 'hand-wrap ' + (h%2===0 ? 'slide-l' : 'slide-r');
    const lbl = document.createElement('div');
    lbl.className = 'hand-lbl';
    lbl.textContent = h%2===0 ? '左手' : '右手';
    hw.appendChild(createHandSVG(0));
    hw.appendChild(lbl);
    row.appendChild(hw);
    handEls.push(hw);
    setTimeout(() => hw.classList.add('appear'), t);
    t += 180;
  }

  t += 300;

  // 数数动画：每数一个数，一根手指弯下去
  let counted = 0;
  const step = () => {
    if (counted >= n) {
      showResult(displayExpr, result, bubble);
      return;
    }
    const handIdx = Math.floor(counted / 5);
    const fingerIdx = counted % 5;
    const hw = handEls[handIdx];
    if (!hw) { counted++; setTimeout(step, 50); return; }

    hw.innerHTML = '';
    hw.appendChild(createHandSVG(fingerIdx + 1));
    hw.appendChild(hw.querySelector('.hand-lbl') || document.createElement('div'));
    thinking.textContent = `正在数第 ${counted + 1} 个…`;
    counted++;
    setTimeout(step, 300);
  };

  setTimeout(step, t);
}

// ====== 动画2: 竖式计算 (11-999) ======
function anim竖式(displayExpr, result, thinking, area, bubble) {
  thinking.textContent = '📝 列个竖式算算…';
  area.innerHTML = '';

  const abs = Math.abs(result);
  const isNeg = result < 0;

  // 分解数字为位数数组
  const digits = String(abs).split('').map(Number);

  // 构造竖式DOM
  const 竖 = document.createElement('div');
 竖.className = '竖式';
  area.appendChild(竖);

  // 第一行：被加数/被减数
  const row1 = document.createElement('div');
  row1.className = '竖式-row';
  if (isNeg) {
    const neg = document.createElement('span');
    neg.className = '竖式-op';
    neg.textContent = '−';
    row1.appendChild(neg);
  }
  digits.forEach((d, i) => {
    const sp = document.createElement('span');
    sp.className = '竖式-digit';
    sp.textContent = d;
    sp.dataset.idx = i;
    row1.appendChild(sp);
  });
  竖.appendChild(row1);

  // 第二行：运算符 + 另一个数（从表达式解析）
  const row2 = document.createElement('div');
  row2.className = '竖式-row';
  const opSpan = document.createElement('span');
  opSpan.className = '竖式-op';
  // 尝试从expression提取第二个数
  const parts = displayExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').split(/([+\-×÷])/);
  opSpan.textContent = displayExpr.match(/[+\-×÷]/)?.[0] || '+';
  row2.appendChild(opSpan);

  // 用一个随机数填第二行（整蛊效果）
  const num2 = Math.floor(Math.abs(Math.round(result)) * (0.3 + Math.random() * 0.7));
  const digits2 = String(num2).padStart(digits.length, '0').split('').slice(-digits.length);
  digits2.forEach(d => {
    const sp = document.createElement('span');
    sp.className = '竖式-digit';
    sp.textContent = d;
    row2.appendChild(sp);
  });
  竖.appendChild(row2);

  // 横线
  const ln = document.createElement('div');
  ln.className = '竖式-line';
  竖.appendChild(ln);

  // 结果行
  const rowR = document.createElement('div');
  rowR.className = '竖式-row 竖式-result';
  const resultDigits = String(abs).split('');
  if (isNeg) {
    const neg = document.createElement('span');
    neg.className = '竖式-op';
    neg.textContent = '−';
    rowR.appendChild(neg);
  }
  resultDigits.forEach(d => {
    const sp = document.createElement('span');
    sp.className = '竖式-digit';
    sp.textContent = d;
    rowR.appendChild(sp);
  });
  竖.appendChild(rowR);

  // 动画时序
  let t = 400;
  row1.querySelectorAll('.竖式-digit').forEach((el, i) => {
    setTimeout(() => { el.classList.add('pop'); row1.classList.add('show'); }, t + i * 80);
  });
  t += digits.length * 80 + 300;

  row2.querySelectorAll('.竖式-digit').forEach((el, i) => {
    setTimeout(() => { el.classList.add('pop'); row2.classList.add('show'); }, t + i * 80);
  });
  t += digits.length * 80 + 400;

  setTimeout(() => ln.classList.add('show'), t);
  t += 400;

  rowR.querySelectorAll('.竖式-digit').forEach((el, i) => {
    setTimeout(() => { el.classList.add('pop'); rowR.classList.add('show'); }, t + i * 120);
  });
  t += digits.length * 120 + 500;

  thinking.textContent = '✅ 算出来了！';
  setTimeout(() => showResult(displayExpr, result, bubble), t);
}

// ====== 动画3: 算筹 (1000+) ======
function anim算筹(displayExpr, result, thinking, area, bubble) {
  thinking.textContent = '🧮 用算筹来算…';
  area.innerHTML = '';

  const abs = Math.abs(result);
  const isNeg = result < 0;
  const numStr = String(abs);
  const len = numStr.length;

  // 创建算筹舞台
  const 舞台 = document.createElement('div');
  舞台.className = '算筹舞台';
  area.appendChild(舞台);

  // 每位数字一行算筹
  const digitRows = [];
  for (let i = 0; i < Math.min(len, 5); i++) { // 最多显示5行
    const 行 = document.createElement('div');
    行.className = '算筹行';
    const lbl = document.createElement('div');
    lbl.className = '算筹-label';
    lbl.textContent = numStr[i] + ' =';
    行.appendChild(lbl);

    // 画算筹棍：每5根横过来为一组
    const d = parseInt(numStr[i]);
    const groups = Math.floor(d / 5);
    const remainder = d % 5;

    for (let g = 0; g < groups; g++) {
      // 5根横棍
      for (let k = 0; k < 5; k++) {
        const 棍 = document.createElement('div');
        棍.className = '筹棍 筹棍横';
        行.appendChild(棍);
      }
    }
    // 剩余竖棍
    for (let k = 0; k < remainder; k++) {
      const 棍 = document.createElement('div');
      棍.className = '筹棍';
      行.appendChild(棍);
    }

    舞台.appendChild(行);
    digitRows.push(行);
  }

  if (len > 5) {
    const more = document.createElement('div');
    more.className = '算筹-label';
    more.textContent = `… 共 ${len} 位`;
    more.style.opacity = '1';
    more.style.color = '#666';
    舞台.appendChild(more);
  }

  // 动画时序
  let t = 400;
  digitRows.forEach((行, ri) => {
    setTimeout(() => {
      行.classList.add('show');
      const 棍s = 行.querySelectorAll('.筹棍');
      棍s.forEach((棍, ci) => {
        setTimeout(() => 棍.classList.add('pop'), ci * 40);
      });
    }, t + ri * 250);
    t += 250;
  });

  t += digitRows.length * 250 + 600;
  thinking.textContent = '✅ 算出来了！';
  setTimeout(() => showResult(displayExpr, result, bubble), t);
}

// ====== 显示正确结果 ======
function showResult(displayExpr, result, bubble) {
  thinking.textContent = '';
  bubble.classList.add('show', 'shake');

  const resultStr = String(result);
  document.getElementById('bubbleEq').textContent = displayExpr + ' =';
  document.getElementById('bubbleResult').textContent = resultStr;

  const subs = [
    '算对了，就是费手',
    '答案正确，就是过程有点离谱',
    '手指数完、脚趾数完，算筹也用上了',
    '用算筹验算过了，确实是这个数',
    '没错，就是费了点功夫',
  ];
  document.getElementById('bubbleSub').textContent = subs[Math.floor(Math.random() * subs.length)];
}

function closeAnim() {
  document.getElementById('animZone').classList.remove('active');
  resultEl.classList.remove('error');
  expression = '';
  justCalculated = false;
  resultEl.textContent = '0';
  updateDisplay();
}

// ====== 手型SVG ======
function createHandSVG(fingersExtended) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '72');
  svg.setAttribute('height', '120');
  svg.setAttribute('viewBox', '0 0 72 120');

  // 手掌
  const palm = document.createElementNS(NS, 'ellipse');
  palm.setAttribute('cx', '36'); palm.setAttribute('cy', '95');
  palm.setAttribute('rx', '22'); palm.setAttribute('ry', '17');
  palm.setAttribute('fill', '#fad6a5');
  palm.setAttribute('stroke', '#d4a574');
  palm.setAttribute('stroke-width', '1.5');
  svg.appendChild(palm);

  // 四指（食指→小指）
  const cfg = [
    {x:20, tilt:-5,  len:38},
    {x:30, tilt:-1,  len:44},
    {x:40, tilt:2,   len:42},
    {x:49, tilt:6,   len:36},
  ];

  for (let i = 0; i < 4; i++) {
    const c = cfg[i];
    const ext = fingersExtended > i;
    const bend = ext ? 0 : 14;
    const tip = 95 - c.len + bend;

    const g = document.createElementNS(NS, 'g');

    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d',
      `M${c.x-5} 95 ` +
      `C${c.x-6+c.tilt*0.2} ${95-14} ${c.x-4+c.tilt} ${tip+8} ${c.x} ${tip} ` +
      `C${c.x+4+c.tilt} ${tip+8} ${c.x+6+c.tilt*0.2} ${95-14} ${c.x+5} 95 Z`
    );
    path.setAttribute('fill', '#fad6a5');
    path.setAttribute('stroke', '#d4a574');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-linejoin', 'round');
    if (!ext) {
      const j2 = document.createElementNS(NS, 'path');
      j2.setAttribute('d', `M${c.x-3.5} ${tip+10} Q${c.x} ${tip+17} ${c.x+3.5} ${tip+10}`);
      j2.setAttribute('stroke', '#d4a574');
      j2.setAttribute('stroke-width', '1');
      j2.setAttribute('fill', 'none');
      g.appendChild(j2);
    }
    g.appendChild(path);
    svg.appendChild(g);
  }

  // 拇指
  const thumbExt = fingersExtended > 3;
  const tp = document.createElementNS(NS, 'path');
  if (thumbExt) {
    tp.setAttribute('d', 'M10 80 C6 75 4 68 7 62 C10 56 17 54 20 59 C23 64 20 72 15 78 Z');
  } else {
    tp.setAttribute('d', 'M14 80 C11 76 9 70 12 65 C15 60 20 60 21 64 C22 69 18 75 16 79 Z');
  }
  tp.setAttribute('fill', '#fad6a5');
  tp.setAttribute('stroke', '#d4a574');
  tp.setAttribute('stroke-width', '1.5');
  svg.appendChild(tp);

  return svg;
}

// ====== 键盘 ======
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') appendNum(e.key);
  else if (e.key === '.') appendOp('.');
  else if (e.key === '+') appendOp('+');
  else if (e.key === '-') appendOp('-');
  else if (e.key === '*') appendOp('×');
  else if (e.key === '/') appendOp('÷');
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Escape' || e.key === 'Backspace') backspace();
  else if (e.key === 'Delete') clearCalc();
});

updateDisplay();
</script>
</body>
</html>
