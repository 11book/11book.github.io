<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .calculator {
    background: #2d2d2d;
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    width: min(320px, 90vw);
  }

  .display {
    background: #0d0d0d;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: right;
    margin-bottom: 16px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .display-expression {
    color: #888;
    font-size: 20px;
    min-height: 28px;
    word-break: break-all;
    line-height: 1.2;
  }

  .display-result {
    color: #fff;
    font-size: 48px;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1.1;
    transition: all 0.15s;
  }

  .display-result.big { font-size: 36px; }
  .display-result.huge { font-size: 26px; }
  .display-result.waiting {
    color: #555;
    font-size: 36px;
    letter-spacing: 0;
  }
  .display-result.error { color: #ff6b6b; font-size: 18px; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .btn {
    height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 26px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.1s;
  }

  .btn:active { transform: scale(0.93); }
  .btn-num { background: #333; color: #fff; }
  .btn-num:hover { background: #3d3d3d; }
  .btn-op { background: #ff9f0a; color: #fff; }
  .btn-op:hover { background: #ffb03a; }
  .btn-fn { background: #616161; color: #000; }
  .btn-fn:hover { background: #757575; }
  .btn-eq { background: #ff9f0a; color: #fff; border-radius: 50%; }

  /* ===== 动画遮罩 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    cursor: pointer;
  }

  .overlay.active { display: flex; }

  .expr-bar {
    position: absolute;
    top: max(env(safe-area-inset-top), 28px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.06);
    padding: 8px 22px;
    border-radius: 20px;
    font-size: 18px;
    color: #666;
    letter-spacing: 2px;
    font-family: 'Courier New', monospace;
  }

  .thinking {
    color: #4ecca3;
    font-size: 17px;
    font-weight: bold;
    margin-top: 16px;
    min-height: 26px;
  }

  /* ===== 手数舞台 ===== */
  .counting-stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .progress-bar {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .progress-bar.show { opacity: 1; }

  .progress-fill {
    height: 100%;
    background: #4ecca3;
    border-radius: 3px;
    transition: width 0.3s ease;
    width: 0%;
  }

  /* ===== 卡通手 SVG ===== */
  .hand-wrapper {
    position: relative;
    width: 220px;
    height: 280px;
    opacity: 0;
    transform: translateY(20px) scale(0.9);
    transition: opacity 0.4s, transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }

  .hand-wrapper.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .hand-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35));
  }

  /* SVG 内部元素的过渡 */
  .finger {
    transform-origin: var(--ox) var(--oy);
    transform-box: fill-box;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
                fill 0.2s;
  }

  .finger.up {
    animation: fingerPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes fingerPop {
    0%   { transform: scale(0.9); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* 计数徽章 */
  .count-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #4ecca3, #3dbb91);
    color: #fff;
    border-radius: 50%;
    font-size: 26px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5) rotate(-30deg);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 4px 18px rgba(78,204,163,0.5);
    z-index: 5;
  }

  .count-badge.show {
    opacity: 1;
    transform: scale(1) rotate(0);
  }

  /* 思考气泡 */
  .think-bubble {
    position: absolute;
    top: 0;
    right: -120px;
    background: #fff;
    color: #555;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 16px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    font-weight: bold;
  }

  .think-bubble::after {
    content: '';
    position: absolute;
    bottom: 12px;
    left: -8px;
    border: 7px solid transparent;
    border-right-color: #fff;
    border-left: none;
  }

  .think-bubble.show { opacity: 1; }

  /* 错号 */
  .cross-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0) rotate(-45deg);
    font-size: 100px;
    color: #ff6b6b;
    opacity: 0;
    transition: all 0.35s;
    z-index: 10;
    text-shadow: 0 4px 20px rgba(255,107,107,0.5);
  }

  .cross-icon.show {
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    opacity: 1;
  }

  /* 脚趾 */
  .feet-row {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .feet-row.show { opacity: 1; }

  .foot-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .toe-row {
    display: flex;
    gap: 3px;
    margin-bottom: -2px;
  }

  .t {
    background: #ffd7b5;
    border: 1.5px solid #e8b89a;
    border-radius: 50% 50% 35% 35%;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    transform-origin: bottom center;
  }

  .t.up {
    background: linear-gradient(135deg, #4ecca3, #3dbb91);
    border-color: #3dbb91;
    transform: translateY(-3px) scale(1.1);
  }

  .sole {
    width: 50px;
    height: 22px;
    background: #ffd7b5;
    border: 1.5px solid #e8b89a;
    border-radius: 50% 50% 40% 40%;
  }

  /* 结果卡 */
  .result-card {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%) scale(0.7);
    background: #fff;
    color: #000;
    padding: 18px 36px 14px;
    border-radius: 22px;
    text-align: center;
    opacity: 0;
    transition: all 0.45s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    z-index: 6;
  }

  .result-card.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .rc-eq { font-size: 13px; color: #aaa; margin-bottom: 2px; }
  .rc-result { font-size: 42px; font-weight: 800; letter-spacing: -2px; display: block; color: #1a1a2e; }
  .rc-sub { font-size: 12px; color: #999; margin-top: 4px; display: block; }

  @keyframes cardShake {
    0%,100% { transform: translateX(-50%) scale(1); }
    20% { transform: translateX(calc(-50% - 10px)) scale(1.04); }
    40% { transform: translateX(calc(-50% + 10px)) scale(1.04); }
    60% { transform: translateX(calc(-50% - 5px)) scale(1.02); }
    80% { transform: translateX(calc(-50% + 5px)) scale(1.02); }
  }

  .result-card.shake { animation: cardShake 0.5s ease; }

  .tap-hint {
    position: absolute;
    bottom: 5%;
    color: #444;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="display-expression" id="expression"></div>
    <div class="display-result" id="result">0</div>
  </div>
  <div class="keypad">
    <button class="btn btn-fn" onclick="clearCalc()">AC</button>
    <button class="btn btn-fn" onclick="backspace()">⌫</button>
    <button class="btn btn-fn" onclick="appendOp('÷')">÷</button>
    <button class="btn btn-op" onclick="appendOp('×')">×</button>

    <button class="btn btn-num" onclick="appendNum('7')">7</button>
    <button class="btn btn-num" onclick="appendNum('8')">8</button>
    <button class="btn btn-num" onclick="appendNum('9')">9</button>
    <button class="btn btn-op" onclick="appendOp('-')">−</button>

    <button class="btn btn-num" onclick="appendNum('4')">4</button>
    <button class="btn btn-num" onclick="appendNum('5')">5</button>
    <button class="btn btn-num" onclick="appendNum('6')">6</button>
    <button class="btn btn-op" onclick="appendOp('+')">+</button>

    <button class="btn btn-num" onclick="appendNum('1')">1</button>
    <button class="btn btn-num" onclick="appendNum('2')">2</button>
    <button class="btn btn-num" onclick="appendNum('3')">3</button>
    <button class="btn btn-eq" onclick="calculate()">=</button>

    <button class="btn btn-num" onclick="appendNum('0')" style="grid-column: span 2; border-radius: 32px; text-align: left; padding-left: 28px;">0</button>
    <button class="btn btn-num" onclick="appendOp('.')">.</button>
  </div>
</div>

<!-- 动画遮罩 -->
<div class="overlay" id="overlay" onclick="closeAnim()">
  <div class="expr-bar" id="exprBar"></div>
  <div class="thinking" id="thinking">🤔 让我想想…</div>

  <div class="counting-stage" id="stage">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="hand-wrapper" id="handWrapper">
      <div class="think-bubble" id="thinkBubble">手指头…</div>
      <div class="count-badge" id="countBadge">1</div>
      <div class="cross-icon" id="crossIcon">✗</div>

      <!-- SVG 手 -->
      <svg class="hand-svg" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffe4c8"/>
            <stop offset="100%" stop-color="#ffd0a8"/>
          </linearGradient>
          <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5a9bd4"/>
            <stop offset="100%" stop-color="#3d7db5"/>
          </linearGradient>
          <linearGradient id="upGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#7fecb8"/>
            <stop offset="100%" stop-color="#3dbb91"/>
          </linearGradient>
          <radialGradient id="palmShade" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffd7b5" stop-opacity="0"/>
            <stop offset="100%" stop-color="#d49b78" stop-opacity="0.4"/>
          </radialGradient>
        </defs>

        <!-- 袖子 -->
        <path d="M 60 250 Q 60 270 50 280 L 170 280 Q 160 270 160 250 L 160 230 L 60 230 Z"
              fill="url(#sleeveGrad)" stroke="#2d6095" stroke-width="1.5"/>
        <ellipse cx="110" cy="232" rx="52" ry="6" fill="#2d6095" opacity="0.4"/>

        <!-- 手掌主体（5根手指 + 掌心）合在一起，更自然 -->
        <!-- 整体：手掌心 -->
        <path id="palm"
              d="M 70 230
                 Q 70 200 80 180
                 Q 90 160 110 158
                 Q 130 160 140 180
                 Q 150 200 150 230
                 Z"
              fill="url(#skinGrad)" stroke="#d49b78" stroke-width="2"/>
        <ellipse cx="110" cy="200" rx="40" ry="40" fill="url(#palmShade)"/>

        <!-- 拇指（在左侧） -->
        <g id="g_thumb" class="finger" style="--ox: 60%; --oy: 100%;">
          <ellipse cx="76" cy="200" rx="12" ry="22" fill="url(#skinGrad)" stroke="#d49b78" stroke-width="2"
                   transform="rotate(-30 76 200)"/>
        </g>

        <!-- 食指 -->
        <g id="g_index" class="finger" style="--ox: 50%; --oy: 100%;">
          <rect x="86" y="100" width="20" height="80" rx="10" fill="url(#skinGrad)" stroke="#d49b78" stroke-width="2"/>
        </g>

        <!-- 中指（最高） -->
        <g id="g_middle" class="finger" style="--ox: 50%; --oy: 100%;">
          <rect x="111" y="85" width="20" height="95" rx="10" fill="url(#skinGrad)" stroke="#d49b78" stroke-width="2"/>
        </g>

        <!-- 无名指 -->
        <g id="g_ring" class="finger" style="--ox: 50%; --oy: 100%;">
          <rect x="135" y="95" width="20" height="85" rx="10" fill="url(#skinGrad)" stroke="#d49b78" stroke-width="2"/>
        </g>

        <!-- 小指 -->
        <g id="g_pinky" class="finger" style="--ox: 50%; --oy: 100%;">
          <rect x="158" y="120" width="16" height="62" rx="8" fill="url(#skinGrad)" stroke="#d49b78" stroke-width="2"/>
        </g>

        <!-- 高光 -->
        <ellipse cx="100" cy="200" rx="8" ry="14" fill="#fff" opacity="0.3"/>
        <ellipse cx="120" cy="195" rx="6" ry="10" fill="#fff" opacity="0.25"/>

        <!-- 手腕阴影 -->
        <ellipse cx="110" cy="246" rx="44" ry="4" fill="#d49b78" opacity="0.5"/>
      </svg>

      <!-- 脚趾 -->
      <div class="feet-row" id="feetRow">
        <div class="foot-unit">
          <div class="toe-row">
            <div class="t" id="tL0" style="width:10px;height:12px"></div>
            <div class="t" id="tL1" style="width:12px;height:14px"></div>
            <div class="t" id="tL2" style="width:14px;height:16px"></div>
            <div class="t" id="tL3" style="width:13px;height:15px"></div>
            <div class="t" id="tL4" style="width:11px;height:13px"></div>
          </div>
          <div class="sole"></div>
        </div>
        <div class="foot-unit">
          <div class="toe-row">
            <div class="t" id="tR0" style="width:10px;height:12px"></div>
            <div class="t" id="tR1" style="width:12px;height:14px"></div>
            <div class="t" id="tR2" style="width:14px;height:16px"></div>
            <div class="t" id="tR3" style="width:13px;height:15px"></div>
            <div class="t" id="tR4" style="width:11px;height:13px"></div>
          </div>
          <div class="sole"></div>
        </div>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="rc-eq" id="rcEq"></div>
      <span class="rc-result" id="rcResult"></span>
      <span class="rc-sub" id="rcSub"></span>
    </div>
  </div>

  <div class="tap-hint">点击继续</div>
</div>

<script>
// ====== 状态 ======
let expression = '';
let justCalculated = false;
let pendingResult = null;

const resultEl = document.getElementById('result');
const expEl = document.getElementById('expression');

// ====== 按键 ======
function appendNum(n) {
  if (justCalculated) { expression = ''; justCalculated = false; }
  expression += n;
  updateDisplay();
}

function appendOp(op) {
  if (justCalculated && expression) {
    expression = resultEl.textContent + op;
    justCalculated = false;
  } else {
    expression += op;
  }
  updateDisplay();
}

function clearCalc() {
  expression = '';
  justCalculated = false;
  pendingResult = null;
  resultEl.textContent = '0';
  resultEl.className = 'display-result';
  updateDisplay();
}

function backspace() {
  if (justCalculated) return;
  expression = expression.slice(0, -1);
  updateDisplay();
}

function updateDisplay() {
  expEl.textContent = expression
    .replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  if (resultEl.textContent.length > 6) resultEl.className = 'display-result big';
  else if (resultEl.textContent.length > 9) resultEl.className = 'display-result huge';
  else resultEl.className = 'display-result';
}

// ====== 计算 ======
function calculate() {
  if (!expression || justCalculated) return;
  resultEl.textContent = '…';
  resultEl.className = 'display-result waiting';

  const jsExpr = expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  let realResult;
  try {
    if (!/^[\d+\-*/.() ]+$/.test(jsExpr)) throw new Error();
    realResult = eval(jsExpr);
    if (!isFinite(realResult)) throw new Error();
  } catch(e) {
    resultEl.textContent = 'Error';
    resultEl.className = 'display-result error';
    justCalculated = true;
    return;
  }

  justCalculated = true;
  pendingResult = realResult;
  setTimeout(() => startCounting(expression, realResult), 200);
}

// ====== 动画 ======
function startCounting(expr, result) {
  const overlay = document.getElementById('overlay');
  const exprBar = document.getElementById('exprBar');
  const thinking = document.getElementById('thinking');
  const handWrapper = document.getElementById('handWrapper');
  const thinkBubble = document.getElementById('thinkBubble');
  const countBadge = document.getElementById('countBadge');
  const crossIcon = document.getElementById('crossIcon');
  const feetRow = document.getElementById('feetRow');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const resultCard = document.getElementById('resultCard');

  overlay.classList.add('active');
  exprBar.textContent = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−') + ' =';

  resetAll();
  resultCard.classList.remove('show','shake');

  let t = 300;

  // 手出现
  setTimeout(() => {
    thinking.textContent = '📱 让我数数…';
    handWrapper.classList.add('show');
    const thoughts = ['掰手指头…', '有几个来着？', '🤔 等一下'];
    thinkBubble.textContent = thoughts[Math.floor(Math.random()*thoughts.length)];
    thinkBubble.classList.add('show');
  }, t);
  t += 600;

  setTimeout(() => progressBar.classList.add('show'), t);

  const abs = Math.abs(Math.round(result));
  const n = Math.min(abs, 20);

  // 手指顺序：拇指→食指→中指→无名指→小指
  const fingerOrder = ['g_thumb', 'g_index', 'g_middle', 'g_ring', 'g_pinky'];

  let count = 0;
  let wrongDone = false;

  const updateFingers = (cnt) => {
    fingerOrder.forEach((id, i) => {
      const el = document.getElementById(id);
      // 重置所有finger子元素
      el.querySelectorAll('rect, ellipse, path').forEach(shape => {
        shape.setAttribute('fill', 'url(#skinGrad)');
      });
      el.classList.remove('up');

      if (i < cnt) {
        // 伸直：变绿
        el.querySelectorAll('rect, ellipse, path').forEach(shape => {
          shape.setAttribute('fill', 'url(#upGrad)');
        });
        el.classList.add('up');
      }
    });
  };

  updateFingers(0);

  const countStep = () => {
    if (count >= n) {
      showFinal(expr, result, resultCard, thinking, progressFill);
      return;
    }

    // 半数出错
    if (!wrongDone && count === Math.floor(n * 0.5) && n >= 5) {
      wrongDone = true;
      thinking.textContent = '呃…数到哪了？';
      thinkBubble.textContent = '刚才几个来着…';
      thinkBubble.classList.add('show');
      countBadge.textContent = '?';
      countBadge.classList.add('show');

      setTimeout(() => {
        crossIcon.classList.add('show');
        thinking.textContent = '啊！数错了！';
      }, 500);

      setTimeout(() => {
        crossIcon.classList.remove('show');
        thinkBubble.classList.remove('show');
        countBadge.classList.remove('show');
        thinking.textContent = '重新数！';
        updateFingers(0);
        count = 0;
        progressFill.style.width = '0%';
        setTimeout(countStep, 500);
      }, 1400);
      return;
    }

    progressFill.style.width = ((count + 1) / n * 100) + '%';

    updateFingers(count + 1);

    countBadge.textContent = count + 1;
    countBadge.classList.remove('show');
    void countBadge.offsetWidth;
    countBadge.classList.add('show');

    if (count === 2) {
      thinkBubble.textContent = '继续…';
      thinkBubble.classList.add('show');
      setTimeout(() => thinkBubble.classList.remove('show'), 600);
    }
    if (count === 4) {
      thinkBubble.textContent = '手指用完啦！';
      thinkBubble.classList.add('show');
      thinking.textContent = '🦶 用脚趾…';
    }
    if (count === 9) {
      feetRow.classList.add('show');
      thinking.textContent = '🦶 脚趾也来帮忙…';
    }

    // 数到 10 后启用脚趾
    if (count >= 10 && count < 20) {
      const toeIndex = (count - 10);
      const toes = ['tL0','tL1','tL2','tL3','tL4','tR0','tR1','tR2','tR3','tR4'];
      for (let i = 0; i <= toeIndex && i < toes.length; i++) {
        document.getElementById(toes[i]).classList.add('up');
      }
      if (toeIndex >= 4) thinking.textContent = '🦶 脚趾也不够…';
    }

    count++;
    setTimeout(countStep, 350 + Math.random() * 150);
  };

  setTimeout(countStep, t);
}

function showFinal(expr, result, resultCard, thinking, progressFill) {
  thinking.textContent = '✅ 算好了！';
  const subs = [
    '一个一个数的，没有偷懒',
    '数完手指数脚趾，终于算出来了',
    '答案正确，就是费了好大劲',
    '数完了！手指都数酸了…',
    '🤓 这下记住了吧？'
  ];
  document.getElementById('rcEq').textContent = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−') + ' =';
  document.getElementById('rcResult').textContent = result;
  document.getElementById('rcSub').textContent = subs[Math.floor(Math.random() * subs.length)];
  setTimeout(() => {
    resultCard.classList.add('show', 'shake');
    resultEl.textContent = result;
    resultEl.className = 'display-result';
    updateDisplay();
  }, 300);
}

function resetAll() {
  ['g_thumb', 'g_index', 'g_middle', 'g_ring', 'g_pinky'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('up');
    el.querySelectorAll('rect, ellipse, path').forEach(shape => {
      shape.setAttribute('fill', 'url(#skinGrad)');
    });
  });
  ['tL0','tL1','tL2','tL3','tL4','tR0','tR1','tR2','tR3','tR4'].forEach(id => {
    document.getElementById(id).classList.remove('up');
  });
  document.getElementById('countBadge').classList.remove('show');
  document.getElementById('thinkBubble').classList.remove('show');
  document.getElementById('crossIcon').classList.remove('show');
  document.getElementById('feetRow').classList.remove('show');
  document.getElementById('progressBar').classList.remove('show');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('handWrapper').classList.remove('show');
}

function closeAnim() {
  document.getElementById('overlay').classList.remove('active');
  justCalculated = false;
  expression = '';
  if (pendingResult !== null) {
    resultEl.textContent = pendingResult;
    pendingResult = null;
  } else {
    resultEl.textContent = '0';
  }
  resultEl.className = 'display-result';
  updateDisplay();
}

// ====== 键盘 ======
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') appendNum(e.key);
  else if (e.key === '.') appendOp('.');
  else if (e.key === '+') appendOp('+');
  else if (e.key === '-') appendOp('-');
  else if (e.key === '*') appendOp('×');
  else if (e.key === '/') appendOp('÷');
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Escape' || e.key === 'Backspace') backspace();
  else if (e.key === 'Delete') clearCalc();
});

updateDisplay();
</script>
