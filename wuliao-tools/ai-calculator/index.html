<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .calculator {
    width: 100%;
    max-width: 380px;
    padding: 20px;
  }

  /* 显示屏 */
  .display {
    background: #000;
    padding: 8px 4px 24px;
    text-align: right;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .display-formula {
    color: #858585;
    font-size: 36px;
    font-weight: 300;
    min-height: 44px;
    line-height: 1.1;
    word-break: break-all;
    letter-spacing: -1px;
  }

  .display-result {
    color: #fff;
    font-size: 80px;
    font-weight: 100;
    letter-spacing: -4px;
    line-height: 1.05;
    transition: font-size 0.15s;
  }

  .display-result.large { font-size: 60px; letter-spacing: -3px; }
  .display-result.xlarge { font-size: 44px; letter-spacing: -2px; }
  .display-result.xxlarge { font-size: 32px; letter-spacing: -1px; }

  /* 按键 */
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: #000;
  }

  .btn {
    height: 78px;
    border-radius: 50%;
    border: none;
    font-size: 32px;
    font-weight: 400;
    cursor: pointer;
    transition: background 0.1s, transform 0.08s;
    position: relative;
    overflow: hidden;
  }

  .btn:active {
    transform: scale(0.94);
  }

  .btn-num {
    background: #333;
    color: #fff;
  }

  .btn-num:active { background: #4a4a4a; }

  .btn-op {
    background: #ff9f0a;
    color: #fff;
  }

  .btn-op:active { background: #ffb33a; }

  .btn-fn {
    background: #a5a5a5;
    color: #000;
  }

  .btn-fn:active { background: #bebebe; }

  /* 0 按钮占两格 */
  .btn-zero {
    grid-column: span 2;
    border-radius: 38px;
    text-align: left;
    padding-left: 36px;
  }

  /* ===== 动画遮罩 ===== */
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 60px;
    z-index: 200;
    cursor: pointer;
  }

  .overlay.active { display: flex; }

  .overlay-hint {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #555;
    font-size: 16px;
    text-align: center;
    width: 90%;
  }

  .overlay-formula {
    color: #666;
    font-size: 28px;
    font-weight: 200;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }

  /* 手掌容器 */
  .hands-area {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 180px;
    width: 100%;
    max-width: 540px;
    padding: 0 16px;
  }

  .hand-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .hand-wrap.show { opacity: 1; }

  .hand-wrap.slide-left {
    animation: slideL 0.45s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  .hand-wrap.slide-right {
    animation: slideR 0.45s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  @keyframes slideL {
    from { transform: translateX(-80px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideR {
    from { transform: translateX(80px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .hand-label {
    color: #444;
    font-size: 12px;
    margin-top: 4px;
  }

  /* 结果气泡 */
  .result-card {
    position: absolute;
    bottom: 100px;
    background: #fff;
    color: #000;
    padding: 20px 36px;
    border-radius: 16px;
    text-align: center;
    opacity: 0;
    transform: scale(0.7);
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 90vw;
  }

  .result-card.show {
    opacity: 1;
    transform: scale(1);
  }

  .result-card .rc-main {
    font-size: 38px;
    font-weight: 600;
    display: block;
    letter-spacing: -1px;
  }

  .result-card .rc-sub {
    font-size: 14px;
    color: #888;
    margin-top: 4px;
    display: block;
  }

  @keyframes cardShake {
    0%,100% { transform: translateX(0) scale(1); }
    20% { transform: translateX(-10px) scale(1.04); }
    40% { transform: translateX(10px) scale(1.04); }
    60% { transform: translateX(-5px) scale(1.02); }
    80% { transform: translateX(5px) scale(1.02); }
  }

  .result-card.shake { animation: cardShake 0.55s ease; }

  .tap-hint {
    position: absolute;
    bottom: 30px;
    color: #444;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="display-formula" id="formula"></div>
    <div class="display-result" id="result">0</div>
  </div>
  <div class="keypad">
    <button class="btn btn-fn" onclick="clearAll()">AC</button>
    <button class="btn btn-fn" onclick="toggleSign()">±</button>
    <button class="btn btn-fn" onclick="percent()">%</button>
    <button class="btn btn-op" onclick="setOp('÷')">÷</button>

    <button class="btn btn-num" onclick="inputDigit('7')">7</button>
    <button class="btn btn-num" onclick="inputDigit('8')">8</button>
    <button class="btn btn-num" onclick="inputDigit('9')">9</button>
    <button class="btn btn-op" onclick="setOp('×')">×</button>

    <button class="btn btn-num" onclick="inputDigit('4')">4</button>
    <button class="btn btn-num" onclick="inputDigit('5')">5</button>
    <button class="btn btn-num" onclick="inputDigit('6')">6</button>
    <button class="btn btn-op" onclick="setOp('-')">−</button>

    <button class="btn btn-num" onclick="inputDigit('1')">1</button>
    <button class="btn btn-num" onclick="inputDigit('2')">2</button>
    <button class="btn btn-num" onclick="inputDigit('3')">3</button>
    <button class="btn btn-op" onclick="setOp('+')">+</button>

    <button class="btn btn-num btn-zero" onclick="inputDigit('0')">0</button>
    <button class="btn btn-num" onclick="inputDigit('.')">.</button>
    <button class="btn btn-op" onclick="equals()">=</button>
  </div>
</div>

<!-- 动画遮罩 -->
<div class="overlay" id="overlay" onclick="dismiss()">
  <div class="overlay-hint" id="overlayHint"></div>
  <div class="overlay-formula" id="overlayFormula"></div>
  <div class="hands-area" id="handsArea"></div>
  <div class="result-card" id="resultCard">
    <span class="rc-main" id="rcMain"></span>
    <span class="rc-sub" id="rcSub"></span>
  </div>
  <div class="tap-hint">点击继续</div>
</div>

<script>
// ====== 状态 ======
let formula = '';
let displayValue = '0';
let lastResult = null;
let justEquals = false;

// ====== 显示 ======
function updateDisplay() {
  document.getElementById('formula').textContent = formula
    .replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  const el = document.getElementById('result');
  el.textContent = displayValue;
  if (displayValue.length > 6) el.className = 'display-result xlarge';
  else if (displayValue.length > 9) el.className = 'display-result xxlarge';
  else el.className = 'display-result';
}

// ====== 按键 ======
function inputDigit(d) {
  if (justEquals) {
    formula = '';
    justEquals = false;
    displayValue = '0';
  }
  if (displayValue === '0' && d !== '.') displayValue = d;
  else if (d === '.' && displayValue.includes('.')) return;
  else displayValue += d;
  updateDisplay();
}

function setOp(op) {
  if (justEquals && lastResult !== null) {
    formula = String(lastResult);
    justEquals = false;
  }
  formula += displayValue + op;
  displayValue = '0';
  updateDisplay();
}

function clearAll() {
  formula = '';
  displayValue = '0';
  lastResult = null;
  justEquals = false;
  updateDisplay();
}

function toggleSign() {
  if (displayValue !== '0') {
    displayValue = displayValue.startsWith('-')
      ? displayValue.slice(1)
      : '-' + displayValue;
    updateDisplay();
  }
}

function percent() {
  displayValue = String((parseFloat(displayValue) || 0) / 100);
  updateDisplay();
}

function backspace() {
  if (justEquals) return;
  displayValue = displayValue.length > 1 ? displayValue.slice(0,-1) : '0';
  updateDisplay();
}

// ====== 计算 ======
function equals() {
  if (!formula) return;
  const expr = formula + displayValue;
  const jsExpr = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  let real;
  try {
    if (!/^[\d+\-*/.() ]+$/.test(jsExpr)) throw new Error();
    // eslint-disable-next-line no-eval
    real = eval(jsExpr);
    if (!isFinite(real)) throw new Error();
  } catch(e) {
    displayValue = 'Error';
    updateDisplay();
    return;
  }
  lastResult = real;
  displayValue = String(real);
  justEquals = true;
  updateDisplay();
  // 触发动画
  setTimeout(() => animateCount(expr, real), 400);
}

// ====== 动画 ======
function animateCount(expr, real) {
  const overlay = document.getElementById('overlay');
  const hint = document.getElementById('overlayHint');
  const formulaEl = document.getElementById('overlayFormula');
  const handsArea = document.getElementById('handsArea');
  const card = document.getElementById('resultCard');

  overlay.classList.add('active');
  handsArea.innerHTML = '';
  card.classList.remove('show', 'shake');

  const displayExpr = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  formulaEl.textContent = displayExpr + ' = ';
  hint.textContent = '正在计算…';

  // 计算要数多少"堆"
  const target = Math.abs(Math.round(real));
  const handsNeeded = Math.min(8, Math.ceil(target / 5));
  const handCount = Math.max(1, handsNeeded);
  const extras = target - handCount * 5;

  let delay = 600;
  for (let i = 0; i < handCount; i++) {
    setTimeout(() => {
      const wrap = document.createElement('div');
      wrap.className = 'hand-wrap ' + (i % 2 === 0 ? 'slide-left' : 'slide-right');
      const svg = createHandSVG(0);
      const label = document.createElement('div');
      label.className = 'hand-label';
      label.textContent = i % 2 === 0 ? '左手' : '右手';
      wrap.appendChild(svg);
      wrap.appendChild(label);
      handsArea.appendChild(wrap);
    }, delay + i * 180);
    delay += 180;
  }

  // 数数动画
  let counted = 0;
  let handIdx = 0;
  let fingersUp = 0;

  const countStep = () => {
    if (counted >= target) return;
    const hwrap = handsArea.children[handIdx];
    if (!hwrap) return;
    fingersUp = Math.min(5, counted % 5 + 1);
    hwrap.innerHTML = '';
    const svg = createHandSVG(fingersUp);
    hwrap.appendChild(svg);
    hwrap.appendChild(hwrap.querySelector('.hand-label') || document.createElement('div'));
    hwrap.classList.add('show');
    hint.textContent = `正在数第 ${counted + 1} 个…`;
    counted++;
    if (counted % 5 === 0) handIdx++;
    setTimeout(countStep, 280);
  };

  setTimeout(countStep, delay + 200);

  // 显示结果
  const doneTime = delay + target * 280 + 400;
  setTimeout(() => {
    hint.textContent = '';
    formulaEl.textContent = displayExpr + ' = ';
    const funny = getFunnyAnswer(real);
    card.classList.add('show', 'shake');
    document.getElementById('rcMain').textContent = funny.main;
    document.getElementById('rcSub').textContent = funny.sub;
  }, doneTime);
}

function dismiss() {
  document.getElementById('overlay').classList.remove('active');
  clearAll();
}

// ====== 无厘头答案 ======
function getFunnyAnswer(n) {
  const abs = Math.abs(n);
  if (abs <= 3) {
    const opts = [
      { main: n + 1, sub: '手比较实诚，多算了一个' },
      { main: Math.max(0, n - 1), sub: '偷偷藏了一个' },
      { main: n + 2, sub: '刚才手抖了' },
    ];
    return opts[Math.floor(Math.random() * opts.length)];
  }
  if (abs <= 10) {
    const off = Math.floor(Math.random() * 7) - 2;
    const main = Math.round(n + off);
    if (off > 0) return { main, sub: `数到一半发现脚趾也能派上用场` };
    if (off < 0) return { main, sub: `数完手指发现还不够` };
    return { main, sub: '刚好数完，运气不错' };
  }
  if (abs <= 50) {
    const mult = 0.6 + Math.random() * 0.8;
    const main = Math.round(n * mult);
    const s = ['手脚并用数完了', '头发贡献了两根', '耳朵也算上了', '胳膊肘派上用场了'][Math.floor(Math.random()*4)];
    return { main, sub: s };
  }
  if (abs <= 999) {
    const main = Math.floor(Math.random() * 999) + 1;
    const s = ['手指脚趾全用上还是不够','数着数着随便报了个数','太多数不过来了'][Math.floor(Math.random()*3)];
    return { main, sub: s };
  }
  return {
    main: '∞',
    sub: ['数到天荒地老也没算出来','数字太大直接放弃了'][Math.floor(Math.random()*2)]
  };
}

// ====== 真实感手型SVG ======
function createHandSVG(fingersExtended) {
  // fingersExtended: 0-5 (拇指独立)
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '72');
  svg.setAttribute('height', '130');
  svg.setAttribute('viewBox', '0 0 72 130');

  // 手掌
  const palm = document.createElementNS(NS, 'path');
  palm.setAttribute('d', 'M18 75 C10 75 5 82 5 90 C5 108 8 120 16 122 C24 124 48 124 56 122 C64 120 67 108 67 90 C67 82 62 75 54 75 Z');
  palm.setAttribute('fill', '#fad6a5');
  palm.setAttribute('stroke', '#d4a574');
  palm.setAttribute('stroke-width', '1.5');
  svg.appendChild(palm);

  // 食指
  const fingers = [
    { cx: 22, baseY: 75, tilt: -6,  len: 40, bend: 0 },
    { cx: 32, baseY: 73, tilt: -1,  len: 46, bend: 0 },
    { cx: 42, baseY: 73, tilt: 2,   len: 44, bend: 0 },
    { cx: 51, baseY: 75, tilt: 7,   len: 38, bend: 0 },
  ];

  for (let i = 0; i < 4; i++) {
    const f = fingers[i];
    const extended = fingersExtended > i;
    const bendY = extended ? 0 : 14;
    const tipY = f.baseY - f.len + bendY;
    const curve = extended ? 0 : 8;

    const path = document.createElementNS(NS, 'path');
    const d = `M${f.cx-5} ${f.baseY}
               C${f.cx-6+f.tilt*0.3} ${f.baseY-15} ${f.cx-4+f.tilt} ${tipY+curve} ${f.cx} ${tipY}
               C${f.cx+4+f.tilt} ${tipY+curve} ${f.cx+6+f.tilt*0.3} ${f.baseY-15} ${f.cx+5} ${f.baseY} Z`;
    path.setAttribute('d', d);
    path.setAttribute('fill', '#fad6a5');
    path.setAttribute('stroke', '#d4a574');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-linejoin', 'round');
    if (!extended) {
      // 弯曲的手指：加个关节线
      const joint = document.createElementNS(NS, 'path');
      joint.setAttribute('d', `M${f.cx-3+f.tilt*0.5} ${tipY+curve+6} Q${f.cx} ${tipY+curve+10} ${f.cx+3+f.tilt*0.5} ${tipY+curve+6}`);
      joint.setAttribute('stroke', '#d4a574');
      joint.setAttribute('stroke-width', '1');
      joint.setAttribute('fill', 'none');
      svg.appendChild(joint);
    }
    svg.appendChild(path);
  }

  // 拇指（侧面）
  const thumbExt = fingersExtended > 3;
  const thumbPath = document.createElementNS(NS, 'path');
  const tx = thumbExt ? 6 : 10;
  const ty = thumbExt ? 50 : 60;
  thumbPath.setAttribute('d', `M12 72 C8 68 4 62 6 54 C8 46 14 42 18 46 C22 50 20 58 16 64 C14 68 13 70 12 72 Z`);
  thumbPath.setAttribute('fill', '#fad6a5');
  thumbPath.setAttribute('stroke', '#d4a574');
  thumbPath.setAttribute('stroke-width', '1.5');
  svg.appendChild(thumbPath);

  return svg;
}

// ====== 键盘支持 ======
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
  else if (e.key === '.') inputDigit('.');
  else if (e.key === '+') setOp('+');
  else if (e.key === '-') setOp('-');
  else if (e.key === '*') setOp('×');
  else if (e.key === '/') setOp('÷');
  else if (e.key === 'Enter' || e.key === '=') equals();
  else if (e.key === 'Escape') clearAll();
  else if (e.key === 'Backspace') backspace();
});

updateDisplay();
</script>
</body>
</html>
