<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .calculator {
    background: #2d2d2d;
    border-radius: 30px;
    padding: 20px;
    box-shadow:
      0 25px 60px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.1);
    width: min(320px, 90vw);
  }

  .display {
    background: #0d0d0d;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: right;
    margin-bottom: 16px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .display-expression {
    color: #888;
    font-size: 20px;
    min-height: 28px;
    word-break: break-all;
    line-height: 1.2;
  }

  .display-result {
    color: #fff;
    font-size: 48px;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1.1;
    transition: all 0.15s;
  }

  .display-result.big { font-size: 36px; }
  .display-result.huge { font-size: 26px; }
  .display-result.error { color: #ff6b6b; font-size: 18px; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .btn {
    height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 26px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.1s;
  }

  .btn:active { transform: scale(0.93); }
  .btn-num { background: #333; color: #fff; }
  .btn-num:hover { background: #3d3d3d; }
  .btn-op { background: #ff9f0a; color: #fff; }
  .btn-op:hover { background: #ffb03a; }
  .btn-fn { background: #616161; color: #000; }
  .btn-fn:hover { background: #757575; }
  .btn-eq { background: #ff9f0a; color: #fff; border-radius: 50%; }

  /* ===== 动画遮罩 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,26,46,0.97);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    cursor: pointer;
  }

  .overlay.active { display: flex; }

  .thinking {
    color: #4ecca3;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 16px;
    min-height: 30px;
    text-align: center;
  }

  .scene {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 340px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* 小孩手臂 + 手 */
  .arm-container {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
  }

  .arm-container.show { opacity: 1; }

  .arm-sleeve {
    width: 60px;
    height: 90px;
    background: linear-gradient(180deg, #5b9bd5 0%, #4a8bc2 100%);
    border-radius: 8px 8px 0 0;
    position: relative;
  }

  /* 卡通手 */
  .cartoon-hand {
    position: relative;
    width: 120px;
    height: 140px;
  }

  /* 手掌 */
  .palm {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 55px;
    background: #fad6a5;
    border-radius: 35% 35% 40% 40%;
    border: 2px solid #d4a574;
    z-index: 2;
  }

  /* 手指 */
  .finger-group {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    z-index: 3;
  }

  .finger {
    width: 14px;
    height: 40px;
    background: #fad6a5;
    border: 2px solid #d4a574;
    border-radius: 7px 7px 5px 5px;
    transform-origin: bottom center;
    transition: transform 0.25s ease;
  }

  .finger.bent {
    transform: rotate(-55deg) translateY(-8px);
    height: 32px;
  }

  /* 拇指 */
  .thumb {
    position: absolute;
    bottom: 30px;
    left: -8px;
    width: 18px;
    height: 30px;
    background: #fad6a5;
    border: 2px solid #d4a574;
    border-radius: 9px;
    transform: rotate(-30deg);
    transform-origin: bottom right;
    transition: transform 0.25s ease;
    z-index: 4;
  }

  .thumb.bent {
    transform: rotate(-70deg);
  }

  /* 面部表情（数数时） */
  .face {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .face.show { opacity: 1; }

  .eyes {
    display: flex;
    gap: 10px;
    margin-bottom: 4px;
  }

  .eye {
    width: 8px;
    height: 8px;
    background: #333;
    border-radius: 50%;
    animation: blink 3s infinite;
  }

  .mouth {
    width: 12px;
    height: 6px;
    border: 2px solid #333;
    border-top: none;
    border-radius: 0 0 10px 10px;
  }

  .mouth.open {
    width: 14px;
    height: 10px;
    background: #333;
    border-radius: 50%;
    border: none;
  }

  .mouth.think {
    width: 8px;
    height: 8px;
    border: 2px solid #333;
    border-radius: 50%;
    background: transparent;
  }

  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  /* 数数气泡 */
  .count-bubble {
    position: absolute;
    top: 10px;
    right: -10px;
    background: #fff;
    color: #333;
    font-size: 22px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s;
    z-index: 10;
  }

  .count-bubble.show {
    opacity: 1;
    transform: scale(1);
  }

  /* 思考气泡 */
  .think-bubble {
    position: absolute;
    top: -20px;
    left: -20px;
    background: #fff;
    color: #333;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 16px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
  }

  .think-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 20px;
    border: 6px solid transparent;
    border-top-color: #fff;
  }

  .think-bubble.show { opacity: 1; }

  /* 脚趾模式 */
  .feet-container {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .feet-container.show { opacity: 1; }

  .foot {
    position: relative;
    width: 55px;
    height: 35px;
  }

  .foot-palm {
    width: 55px;
    height: 22px;
    background: #fad6a5;
    border: 2px solid #d4a574;
    border-radius: 30px 30px 20px 20px;
  }

  .toes {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
  }

  .toe {
    width: 10px;
    height: 14px;
    background: #fad6a5;
    border: 2px solid #d4a574;
    border-radius: 5px 5px 3px 3px;
    transition: transform 0.2s;
  }

  .toe.bent {
    transform: rotate(-40deg) translateY(-4px);
    height: 10px;
  }

  /* 结果气泡 */
  .result-card {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) scale(0.5);
    background: #fff;
    color: #000;
    padding: 16px 30px;
    border-radius: 20px;
    text-align: center;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 90vw;
  }

  .result-card.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .rc-eq {
    font-size: 13px;
    color: #999;
    margin-bottom: 2px;
  }

  .rc-result {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
    display: block;
  }

  .rc-sub {
    font-size: 12px;
    color: #bbb;
    margin-top: 4px;
    display: block;
  }

  @keyframes shake {
    0%,100% { transform: translateX(-50%) scale(1); }
    20% { transform: translateX(calc(-50% - 10px)) scale(1.04); }
    40% { transform: translateX(calc(-50% + 10px)) scale(1.04); }
    60% { transform: translateX(calc(-50% - 5px)) scale(1.02); }
    80% { transform: translateX(calc(-50% + 5px)) scale(1.02); }
  }

  .result-card.shake { animation: shake 0.55s ease; }

  .tap-hint {
    position: absolute;
    bottom: 5%;
    color: #444;
    font-size: 13px;
  }

  /* 数错了重新来 */
  .wrong-mark {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    color: #ff6b6b;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 20;
  }

  .wrong-mark.show { opacity: 1; }

  .sweat {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 12px;
    height: 16px;
    background: #87ceeb;
    border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    opacity: 0;
    animation: none;
  }

  .sweat.show {
    opacity: 1;
    animation: sweatDrop 0.8s ease-in infinite;
  }

  @keyframes sweatDrop {
    0% { transform: translateY(0); opacity: 0.8; }
    100% { transform: translateY(20px); opacity: 0; }
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="display-expression" id="expression"></div>
    <div class="display-result" id="result">0</div>
  </div>
  <div class="keypad">
    <button class="btn btn-fn" onclick="clearCalc()">AC</button>
    <button class="btn btn-fn" onclick="backspace()">⌫</button>
    <button class="btn btn-fn" onclick="appendOp('÷')">÷</button>
    <button class="btn btn-op" onclick="appendOp('×')">×</button>

    <button class="btn btn-num" onclick="appendNum('7')">7</button>
    <button class="btn btn-num" onclick="appendNum('8')">8</button>
    <button class="btn btn-num" onclick="appendNum('9')">9</button>
    <button class="btn btn-op" onclick="appendOp('-')">−</button>

    <button class="btn btn-num" onclick="appendNum('4')">4</button>
    <button class="btn btn-num" onclick="appendNum('5')">5</button>
    <button class="btn btn-num" onclick="appendNum('6')">6</button>
    <button class="btn btn-op" onclick="appendOp('+')">+</button>

    <button class="btn btn-num" onclick="appendNum('1')">1</button>
    <button class="btn btn-num" onclick="appendNum('2')">2</button>
    <button class="btn btn-num" onclick="appendNum('3')">3</button>
    <button class="btn btn-eq" onclick="calculate()">=</button>

    <button class="btn btn-num" onclick="appendNum('0')" style="grid-column: span 2; border-radius: 32px; text-align: left; padding-left: 28px;">0</button>
    <button class="btn btn-num" onclick="appendOp('.')">.</button>
  </div>
</div>

<!-- 动画遮罩 -->
<div class="overlay" id="overlay" onclick="closeAnim()">
  <div class="thinking" id="thinking">🤔 让我想想…</div>

  <div class="scene" id="scene">
    <!-- 小孩手臂+手 -->
    <div class="arm-container" id="arm">
      <div class="face" id="face">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth" id="mouth"></div>
      </div>
      <div class="cartoon-hand" id="hand">
        <div class="count-bubble" id="countBubble">1</div>
        <div class="think-bubble" id="thinkBubble">手指头…</div>
        <div class="sweat" id="sweat"></div>
        <div class="finger-group">
          <div class="finger" id="f0"></div>
          <div class="finger" id="f1"></div>
          <div class="finger" id="f2"></div>
          <div class="finger" id="f3"></div>
        </div>
        <div class="thumb" id="thumb"></div>
        <div class="palm"></div>
      </div>
      <div class="arm-sleeve"></div>
    </div>

    <!-- 脚趾 -->
    <div class="feet-container" id="feet">
      <div class="foot" id="footL">
        <div class="toes">
          <div class="toe" id="tL0"></div>
          <div class="toe" id="tL1"></div>
          <div class="toe" id="tL2"></div>
          <div class="toe" id="tL3"></div>
          <div class="toe" id="tL4"></div>
        </div>
        <div class="foot-palm"></div>
      </div>
      <div class="foot" id="footR">
        <div class="toes">
          <div class="toe" id="tR0"></div>
          <div class="toe" id="tR1"></div>
          <div class="toe" id="tR2"></div>
          <div class="toe" id="tR3"></div>
          <div class="toe" id="tR4"></div>
        </div>
        <div class="foot-palm"></div>
      </div>
    </div>

    <!-- 错号 -->
    <div class="wrong-mark" id="wrongMark">✗</div>

    <!-- 结果 -->
    <div class="result-card" id="resultCard">
      <div class="rc-eq" id="rcEq"></div>
      <span class="rc-result" id="rcResult"></span>
      <span class="rc-sub" id="rcSub"></span>
    </div>
  </div>

  <div class="tap-hint">点击继续</div>
</div>

<script>
// ====== 状态 ======
let expression = '';
let justCalculated = false;

const resultEl = document.getElementById('result');
const expEl = document.getElementById('expression');

function updateDisplay() {
  expEl.textContent = expression
    .replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  if (resultEl.textContent.length > 6) resultEl.className = 'display-result big';
  else if (resultEl.textContent.length > 9) resultEl.className = 'display-result huge';
  else resultEl.className = 'display-result';
}

// ====== 按键 ======
function appendNum(n) {
  if (justCalculated) { expression = ''; justCalculated = false; }
  expression += n;
  updateDisplay();
}

function appendOp(op) {
  if (justCalculated && expression) {
    expression = resultEl.textContent + op;
    justCalculated = false;
  } else {
    expression += op;
  }
  updateDisplay();
}

function clearCalc() {
  expression = '';
  justCalculated = false;
  resultEl.textContent = '0';
  resultEl.className = 'display-result';
  updateDisplay();
}

function backspace() {
  if (justCalculated) return;
  expression = expression.slice(0, -1);
  updateDisplay();
}

// ====== 计算 ======
function calculate() {
  if (!expression || justCalculated) return;
  const jsExpr = expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  let realResult;
  try {
    if (!/^[\d+\-*/.() ]+$/.test(jsExpr)) throw new Error();
    // eslint-disable-next-line no-eval
    realResult = eval(jsExpr);
    if (!isFinite(realResult)) throw new Error();
  } catch(e) {
    resultEl.textContent = 'Error';
    resultEl.classList.add('error');
    justCalculated = true;
    return;
  }
  justCalculated = true;
  resultEl.textContent = realResult;
  updateDisplay();
  setTimeout(() => startCounting(expression, realResult), 350);
}

// ====== 动画核心 ======
function startCounting(expr, result) {
  const overlay = document.getElementById('overlay');
  const thinking = document.getElementById('thinking');
  const arm = document.getElementById('arm');
  const face = document.getElementById('face');
  const mouth = document.getElementById('mouth');
  const bubble = document.getElementById('countBubble');
  const thinkBbl = document.getElementById('thinkBubble');
  const sweat = document.getElementById('sweat');
  const wrongMark = document.getElementById('wrongMark');
  const feet = document.getElementById('feet');
  const resultCard = document.getElementById('resultCard');
  const displayExpr = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');

  overlay.classList.add('active');
  resultCard.classList.remove('show','shake');
  bubble.classList.remove('show');
  thinkBbl.classList.remove('show');
  sweat.classList.remove('show');
  wrongMark.classList.remove('show');
  feet.classList.remove('show');
  face.classList.remove('show');

  thinking.textContent = '🤔 等等…';

  // 重置手指
  for (let i = 0; i < 4; i++) {
    document.getElementById('f'+i).classList.remove('bent');
  }
  document.getElementById('thumb').classList.remove('bent');

  let t = 500;

  // 手臂出现
  setTimeout(() => {
    thinking.textContent = '📱 算算…';
    arm.classList.add('show');
    face.classList.add('show');
    mouth.className = 'mouth';
  }, t);
  t += 600;

  // 出现思考气泡
  setTimeout(() => {
    const thoughts = ['手指头…', '要数几个？', '让我想想…', '等等…', '🤔'];
    thinkBbl.textContent = thoughts[Math.floor(Math.random() * thoughts.length)];
    thinkBbl.classList.add('show');
  }, t);
  t += 600;

  // 开始数数
  const abs = Math.abs(Math.round(result));
  const n = Math.min(abs, 20); // 最多数20个（演示用）
  let count = 0;
  let wrongCount = 0;
  const maxWrong = Math.random() > 0.6 ? 1 : 0; // 随机决定是否数错一次

  const fingerEls = [
    document.getElementById('f0'),
    document.getElementById('f1'),
    document.getElementById('f2'),
    document.getElementById('f3'),
    document.getElementById('thumb'),
  ];

  const mouthStates = ['', 'open', '', 'think', 'open', ''];

  const countStep = () => {
    if (count >= n) {
      // 数完了，显示结果
      showResult(displayExpr, result, resultCard, thinking);
      return;
    }

    // 偶尔出错（整蛊点）
    if (count === Math.floor(n * 0.4) && wrongCount < maxWrong) {
      wrongCount++;
      // 突然停下来思考
      thinking.textContent = '呃…数到哪了？';
      mouth.className = 'mouth think';
      thinkBbl.textContent = '刚才数到几了…';
      thinkBbl.classList.add('show');
      sweat.classList.add('show');

      setTimeout(() => {
        wrongMark.classList.add('show');
        thinking.textContent = '啊！数错了！重新来！';
      }, 500);

      setTimeout(() => {
        wrongMark.classList.remove('show');
        sweat.classList.remove('show');
        thinkBbl.classList.remove('show');
        // 重置所有手指，重新数
        fingerEls.forEach(f => f.classList.remove('bent'));
        count = 0;
        thinking.textContent = '📱 重新数…';
        mouth.className = 'mouth';
        setTimeout(countStep, 400);
      }, 1200);
      return;
    }

    const fi = count % 5;
    // 弯手指
    fingerEls[fi].classList.add('bent');

    // 更新气泡数字
    bubble.textContent = count + 1;
    bubble.classList.add('show');
    setTimeout(() => bubble.classList.remove('show'), 250);

    // 更新表情
    const ms = mouthStates[count % mouthStates.length];
    if (ms) mouth.className = 'mouth ' + ms;

    // 更新思考气泡（偶尔）
    if (count === Math.floor(n * 0.3)) {
      thinkBbl.textContent = '还没数完…';
      thinkBbl.classList.add('show');
      setTimeout(() => thinkBbl.classList.remove('show'), 800);
    }
    if (count === Math.floor(n * 0.7)) {
      thinkBbl.textContent = '快了吧！';
      thinkBbl.classList.add('show');
      setTimeout(() => thinkBbl.classList.remove('show'), 800);
    }

    // 数到10的时候提示脚趾
    if (count === 4) {
      setTimeout(() => {
        thinkBbl.textContent = '手指用完了！';
        thinkBbl.classList.add('show');
      }, 200);
    }
    if (count === 9) {
      thinking.textContent = '🦶 用脚趾帮忙…';
      feet.classList.add('show');
      setTimeout(() => thinkBbl.classList.remove('show'), 600);
    }

    count++;
    setTimeout(countStep, 350 + Math.random() * 150);
  };

  setTimeout(countStep, t);
}

function showResult(displayExpr, result, resultCard, thinking) {
  thinking.textContent = '✅ 算出来了！';
  const subs = [
    '一个一个数的，没有偷懒',
    '数完了！就是有点费手指',
    '答案正确，就是费了九牛二虎之力',
    '手指头都数酸了…',
    '终于数完了！',
  ];
  document.getElementById('rcEq').textContent = displayExpr + ' =';
  document.getElementById('rcResult').textContent = result;
  document.getElementById('rcSub').textContent = subs[Math.floor(Math.random() * subs.length)];
  setTimeout(() => {
    resultCard.classList.add('show', 'shake');
  }, 300);
}

function closeAnim() {
  document.getElementById('overlay').classList.remove('active');
  resultEl.classList.remove('error');
  expression = '';
  justCalculated = false;
  resultEl.textContent = '0';
  updateDisplay();
}

// ====== 键盘 ======
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') appendNum(e.key);
  else if (e.key === '.') appendOp('.');
  else if (e.key === '+') appendOp('+');
  else if (e.key === '-') appendOp('-');
  else if (e.key === '*') appendOp('×');
  else if (e.key === '/') appendOp('÷');
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Escape' || e.key === 'Backspace') backspace();
  else if (e.key === 'Delete') clearCalc();
});

updateDisplay();
</script>
</body>
</html>
