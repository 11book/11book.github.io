<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .calculator {
    background: #2d2d2d;
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    width: min(320px, 90vw);
  }

  .display {
    background: #0d0d0d;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: right;
    margin-bottom: 16px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .display-expression {
    color: #888;
    font-size: 20px;
    min-height: 28px;
    word-break: break-all;
    line-height: 1.2;
  }

  .display-result {
    color: #fff;
    font-size: 48px;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1.1;
    transition: all 0.15s;
  }

  .display-result.big { font-size: 36px; }
  .display-result.huge { font-size: 26px; }
  .display-result.waiting {
    color: #555;
    font-size: 36px;
    letter-spacing: 0;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .btn {
    height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 26px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.1s;
  }

  .btn:active { transform: scale(0.93); }
  .btn-num { background: #333; color: #fff; }
  .btn-num:hover { background: #3d3d3d; }
  .btn-op { background: #ff9f0a; color: #fff; }
  .btn-op:hover { background: #ffb03a; }
  .btn-fn { background: #616161; color: #000; }
  .btn-fn:hover { background: #757575; }
  .btn-eq { background: #ff9f0a; color: #fff; border-radius: 50%; }

  /* ===== 动画遮罩 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #1a1a2e 0%, #0f0f1a 100%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    cursor: pointer;
  }

  .overlay.active { display: flex; }

  .expr-bar {
    position: absolute;
    top: max(env(safe-area-inset-top), 30px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.07);
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 20px;
    color: #888;
    letter-spacing: 2px;
  }

  .thinking {
    color: #4ecca3;
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    min-height: 28px;
    text-align: center;
  }

  /* ===== 卡通手区域 ===== */
  .hand-stage {
    position: relative;
    width: 300px;
    height: 320px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* 手掌SVG */
  .hand-svg {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.4s;
  }

  .hand-svg.show { opacity: 1; }

  /* 表情气泡 */
  .speech-bubble {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff;
    color: #333;
    font-size: 20px;
    font-weight: bold;
    padding: 6px 18px;
    border-radius: 20px;
    white-space: nowrap;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #fff;
    border-bottom: none;
  }

  .speech-bubble.show {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }

  /* 思考气泡 */
  .thought-bubble {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,0.9);
    color: #555;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 16px;
    opacity: 0;
    transition: opacity 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .thought-bubble::after {
    content: '';
    position: absolute;
    bottom: -7px;
    right: 20px;
    border: 6px solid transparent;
    border-top-color: rgba(255,255,255,0.9);
    border-bottom: none;
  }

  .thought-bubble.show { opacity: 1; }

  /* 数数气泡 */
  .count-ring {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 52px;
    height: 52px;
    background: #4ecca3;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 4px 16px rgba(78,204,163,0.4);
  }

  .count-ring.show { transform: translateX(-50%) scale(1); }
  .count-ring.pop {
    animation: ringPop 0.3s ease;
  }

  @keyframes ringPop {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.3); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* 错号 */
  .cross-mark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%) scale(0);
    font-size: 80px;
    color: #ff6b6b;
    opacity: 0;
    transition: all 0.3s;
  }

  .cross-mark.show {
    transform: translate(-50%,-50%) scale(1);
    opacity: 1;
  }

  /* 脚趾区域 */
  .feet-row {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .feet-row.show { opacity: 1; }

  .foot-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .foot-toes {
    display: flex;
    gap: 3px;
  }

  .ft {
    width: 12px;
    height: 14px;
    background: #f5c5a3;
    border: 1.5px solid #d4a574;
    border-radius: 6px 6px 3px 3px;
    transition: transform 0.2s;
  }

  .ft.bent { transform: rotate(-45deg) translateY(-4px); height: 10px; }

  .foot-sole {
    width: 40px;
    height: 18px;
    background: #f5c5a3;
    border: 1.5px solid #d4a574;
    border-radius: 20px 20px 10px 10px;
  }

  /* 结果卡片 */
  .result-card {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) scale(0.7);
    background: #fff;
    color: #000;
    padding: 18px 36px 16px;
    border-radius: 20px;
    text-align: center;
    opacity: 0;
    transition: all 0.45s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .result-card.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .rc-eq {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 2px;
  }

  .rc-result {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -1px;
    display: block;
  }

  .rc-sub {
    font-size: 12px;
    color: #bbb;
    margin-top: 4px;
    display: block;
  }

  @keyframes cardShake {
    0%,100% { transform: translateX(-50%) scale(1); }
    20% { transform: translateX(calc(-50% - 8px)) scale(1.03); }
    40% { transform: translateX(calc(-50% + 8px)) scale(1.03); }
    60% { transform: translateX(calc(-50% - 4px)) scale(1.01); }
    80% { transform: translateX(calc(-50% + 4px)) scale(1.01); }
  }

  .result-card.shake { animation: cardShake 0.5s ease; }

  .tap-hint {
    position: absolute;
    bottom: 5%;
    color: #444;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="display-expression" id="expression"></div>
    <div class="display-result" id="result">0</div>
  </div>
  <div class="keypad">
    <button class="btn btn-fn" onclick="clearCalc()">AC</button>
    <button class="btn btn-fn" onclick="backspace()">⌫</button>
    <button class="btn btn-fn" onclick="appendOp('÷')">÷</button>
    <button class="btn btn-op" onclick="appendOp('×')">×</button>

    <button class="btn btn-num" onclick="appendNum('7')">7</button>
    <button class="btn btn-num" onclick="appendNum('8')">8</button>
    <button class="btn btn-num" onclick="appendNum('9')">9</button>
    <button class="btn btn-op" onclick="appendOp('-')">−</button>

    <button class="btn btn-num" onclick="appendNum('4')">4</button>
    <button class="btn btn-num" onclick="appendNum('5')">5</button>
    <button class="btn btn-num" onclick="appendNum('6')">6</button>
    <button class="btn btn-op" onclick="appendOp('+')">+</button>

    <button class="btn btn-num" onclick="appendNum('1')">1</button>
    <button class="btn btn-num" onclick="appendNum('2')">2</button>
    <button class="btn btn-num" onclick="appendNum('3')">3</button>
    <button class="btn btn-eq" onclick="calculate()">=</button>

    <button class="btn btn-num" onclick="appendNum('0')" style="grid-column: span 2; border-radius: 32px; text-align: left; padding-left: 28px;">0</button>
    <button class="btn btn-num" onclick="appendOp('.')">.</button>
  </div>
</div>

<!-- 动画遮罩 -->
<div class="overlay" id="overlay" onclick="closeAnim()">

  <div class="expr-bar" id="exprBar"></div>
  <div class="thinking" id="thinking">🤔 让我想想…</div>

  <div class="hand-stage" id="handStage">
    <!-- 手SVG -->
    <div class="hand-svg" id="handSvg">
      <svg width="180" height="200" viewBox="0 0 180 200" id="mainHand">
        <!-- 手臂/袖子 -->
        <rect x="55" y="140" width="70" height="60" rx="8" fill="#5b9bd5"/>
        <!-- 手掌 -->
        <ellipse cx="90" cy="138" rx="38" ry="28" fill="#f5c5a3" stroke="#d4a574" stroke-width="2"/>
        <!-- 拇指 -->
        <path id="thumbPath" d="M48 120 C38 110 32 100 38 92 C44 84 55 86 58 96 C60 104 56 114 52 120 Z" fill="#f5c5a3" stroke="#d4a574" stroke-width="1.5"/>
        <!-- 食指 -->
        <rect id="fi0" x="60" y="68" width="14" height="42" rx="7" fill="#f5c5a3" stroke="#d4a574" stroke-width="1.5" transform="rotate(-8, 67, 110)"/>
        <!-- 中指 -->
        <rect id="fi1" x="76" y="62" width="14" height="46" rx="7" fill="#f5c5a3" stroke="#d4a574" stroke-width="1.5"/>
        <!-- 无名指 -->
        <rect id="fi2" x="92" y="64" width="14" height="44" rx="7" fill="#f5c5a3" stroke="#d4a574" stroke-width="1.5" transform="rotate(5, 99, 108)"/>
        <!-- 小指 -->
        <rect id="fi3" x="106" y="72" width="12" height="38" rx="6" fill="#f5c5a3" stroke="#d4a574" stroke-width="1.5" transform="rotate(12, 112, 110)"/>
        <!-- 关节线 -->
        <line x1="63" y1="88" x2="71" y2="86" stroke="#d4a574" stroke-width="1" transform="rotate(-8, 67, 110)"/>
        <line x1="79" y1="82" x2="87" y2="82" stroke="#d4a574" stroke-width="1"/>
        <line x1="95" y1="84" x2="103" y2="86" stroke="#d4a574" stroke-width="1" transform="rotate(5, 99, 108)"/>
        <line x1="109" y1="92" x2="115" y2="95" stroke="#d4a574" stroke-width="1" transform="rotate(12, 112, 110)"/>
        <!-- 掌心纹路 -->
        <path d="M70 130 Q90 138 110 130" stroke="#e8b89a" stroke-width="1" fill="none"/>
        <path d="M75 125 Q90 130 105 125" stroke="#e8b89a" stroke-width="1" fill="none"/>
      </svg>
    </div>

    <!-- 气泡 -->
    <div class="speech-bubble" id="speechBbl">1</div>
    <div class="count-ring" id="countRing">1</div>
    <div class="thought-bubble" id="thoughtBbl">手指头…</div>
    <div class="cross-mark" id="crossMark">✗</div>

    <!-- 脚趾 -->
    <div class="feet-row" id="feetRow">
      <div class="foot-icon" id="footL">
        <div class="foot-toes">
          <div class="ft" id="tL0"></div>
          <div class="ft" id="tL1"></div>
          <div class="ft" id="tL2"></div>
          <div class="ft" id="tL3"></div>
          <div class="ft" id="tL4"></div>
        </div>
        <div class="foot-sole"></div>
      </div>
      <div class="foot-icon" id="footR">
        <div class="foot-toes">
          <div class="ft" id="tR0"></div>
          <div class="ft" id="tR1"></div>
          <div class="ft" id="tR2"></div>
          <div class="ft" id="tR3"></div>
          <div class="ft" id="tR4"></div>
        </div>
        <div class="foot-sole"></div>
      </div>
    </div>

    <!-- 结果 -->
    <div class="result-card" id="resultCard">
      <div class="rc-eq" id="rcEq"></div>
      <span class="rc-result" id="rcResult"></span>
      <span class="rc-sub" id="rcSub"></span>
    </div>
  </div>

  <div class="tap-hint">点击继续</div>
</div>

<script>
// ====== 状态 ======
let expression = '';
let justCalculated = false;
let pendingResult = null;

const resultEl = document.getElementById('result');
const expEl = document.getElementById('expression');

// ====== 按键 ======
function appendNum(n) {
  if (justCalculated) { expression = ''; justCalculated = false; }
  expression += n;
  updateDisplay();
}

function appendOp(op) {
  if (justCalculated && expression) {
    expression = resultEl.textContent + op;
    justCalculated = false;
  } else {
    expression += op;
  }
  updateDisplay();
}

function clearCalc() {
  expression = '';
  justCalculated = false;
  pendingResult = null;
  resultEl.textContent = '0';
  resultEl.className = 'display-result';
  updateDisplay();
}

function backspace() {
  if (justCalculated) return;
  expression = expression.slice(0, -1);
  updateDisplay();
}

function updateDisplay() {
  expEl.textContent = expression
    .replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  if (resultEl.textContent.length > 6) resultEl.className = 'display-result big';
  else if (resultEl.textContent.length > 9) resultEl.className = 'display-result huge';
  else resultEl.className = 'display-result';
}

// ====== 计算 ======
function calculate() {
  if (!expression || justCalculated) return;

  // 显示"正在算…"状态，不显示结果
  resultEl.textContent = '…';
  resultEl.className = 'display-result waiting';

  const jsExpr = expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  let realResult;
  try {
    if (!/^[\d+\-*/.() ]+$/.test(jsExpr)) throw new Error();
    // eslint-disable-next-line no-eval
    realResult = eval(jsExpr);
    if (!isFinite(realResult)) throw new Error();
  } catch(e) {
    resultEl.textContent = 'Error';
    resultEl.className = 'display-result error';
    justCalculated = true;
    return;
  }

  justCalculated = true;
  pendingResult = realResult; // 先存着，动画完再显示

  setTimeout(() => startCounting(expression, realResult), 200);
}

// ====== 动画 ======
function startCounting(expr, result) {
  const overlay = document.getElementById('overlay');
  const exprBar = document.getElementById('exprBar');
  const thinking = document.getElementById('thinking');
  const handSvg = document.getElementById('handSvg');
  const speechBbl = document.getElementById('speechBbl');
  const countRing = document.getElementById('countRing');
  const thoughtBbl = document.getElementById('thoughtBbl');
  const crossMark = document.getElementById('crossMark');
  const feetRow = document.getElementById('feetRow');
  const resultCard = document.getElementById('resultCard');

  overlay.classList.add('active');
  exprBar.textContent = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−') + ' =';

  resetAnim();
  resultCard.classList.remove('show','shake');

  let t = 400;

  // 手出现
  setTimeout(() => {
    thinking.textContent = '📱 让我数数…';
    handSvg.classList.add('show');
  }, t);
  t += 600;

  // 思考气泡
  setTimeout(() => {
    const thoughts = ['手指头…', '有几个？', '等等…', '让我想想'];
    thoughtBbl.textContent = thoughts[Math.floor(Math.random() * thoughts.length)];
    thoughtBbl.classList.add('show');
  }, t);
  t += 500;

  // 重置手指
  const fingerIds = ['fi0','fi1','fi2','fi3'];
  const fingerEls = fingerIds.map(id => document.getElementById(id));
  const thumbEl = document.getElementById('thumbPath');

  // 开始数数
  const abs = Math.abs(Math.round(result));
  const n = Math.min(abs, 20);
  let count = 0;
  let wrongDone = false;

  const countStep = () => {
    if (count >= n) {
      showFinalResult(expr, result, resultCard, thinking);
      return;
    }

    // 数到一半时随机出错（整蛊）
    if (!wrongDone && count === Math.floor(n * 0.5) && n >= 4) {
      wrongDone = true;
      thinking.textContent = '呃…数到哪了？';
      speechBbl.textContent = '?';
      speechBbl.classList.add('show');
      thoughtBbl.textContent = '刚才几个来着…';
      thoughtBbl.classList.add('show');

      setTimeout(() => {
        crossMark.classList.add('show');
        thinking.textContent = '啊！数错了！';
      }, 600);

      setTimeout(() => {
        crossMark.classList.remove('show');
        speechBbl.classList.remove('show');
        thoughtBbl.classList.remove('show');
        // 重置手指
        fingerEls.forEach(el => el.setAttribute('transform', el.dataset.original || el.getAttribute('transform')));
        thumbEl.setAttribute('d', thumbEl.dataset.original);
        thinking.textContent = '重新数！';
        count = 0;
        setTimeout(countStep, 500);
      }, 1400);
      return;
    }

    const fi = count % 5;

    // 气泡数字
    countRing.textContent = count + 1;
    countRing.classList.remove('pop');
    void countRing.offsetWidth; // reflow
    countRing.classList.add('show', 'pop');

    // 弯曲对应手指
    if (fi < 4) {
      const el = fingerEls[fi];
      const orig = el.getAttribute('transform');
      el.dataset.original = orig;
      el.setAttribute('transform', orig + ' rotate(-45, ' + (fi === 0 ? 67 : fi === 2 ? 99 : fi === 3 ? 112 : 83) + ', 110)');
    } else {
      // 拇指
      thumbEl.setAttribute('d', 'M52 120 C46 112 44 106 48 100 C52 94 58 96 57 104 C56 110 55 116 52 120 Z');
    }

    // 思考气泡（随机）
    if (count === 3) {
      thoughtBbl.textContent = '继续…';
      thoughtBbl.classList.add('show');
      setTimeout(() => thoughtBbl.classList.remove('show'), 600);
    }
    if (count === 9) {
      thoughtBbl.textContent = '手指用完啦！';
      thoughtBbl.classList.add('show');
      thinking.textContent = '🦶 用脚趾帮忙…';
      feetRow.classList.add('show');
    }

    count++;
    setTimeout(countStep, 320 + Math.random() * 120);
  };

  // 存储手指原始transform
  fingerEls.forEach(el => el.dataset.original = el.getAttribute('transform'));
  thumbEl.dataset.original = thumbEl.getAttribute('d');

  setTimeout(countStep, t);
}

function showFinalResult(expr, result, resultCard, thinking) {
  thinking.textContent = '✅ 算好了！';
  const subs = [
    '一个一个数的，没偷懒',
    '数完手指数脚趾，终于算出来了',
    '答案正确，就是费了好大劲',
    '数完了！手指都有点酸…',
  ];
  document.getElementById('rcEq').textContent = expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−') + ' =';
  document.getElementById('rcResult').textContent = result;
  document.getElementById('rcSub').textContent = subs[Math.floor(Math.random() * subs.length)];
  setTimeout(() => {
    resultCard.classList.add('show', 'shake');
    // 最后才在计算器屏上显示结果
    resultEl.textContent = result;
    resultEl.className = 'display-result';
    updateDisplay();
  }, 300);
}

function resetAnim() {
  document.getElementById('countRing').classList.remove('show','pop');
  document.getElementById('speechBbl').classList.remove('show');
  document.getElementById('thoughtBbl').classList.remove('show');
  document.getElementById('crossMark').classList.remove('show');
  document.getElementById('feetRow').classList.remove('show');
  document.getElementById('handSvg').classList.remove('show');
}

function closeAnim() {
  document.getElementById('overlay').classList.remove('active');
  justCalculated = false;
  expression = '';
  if (pendingResult !== null) {
    resultEl.textContent = pendingResult;
    pendingResult = null;
  } else {
    resultEl.textContent = '0';
  }
  resultEl.className = 'display-result';
  updateDisplay();
}

// ====== 键盘 ======
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') appendNum(e.key);
  else if (e.key === '.') appendOp('.');
  else if (e.key === '+') appendOp('+');
  else if (e.key === '-') appendOp('-');
  else if (e.key === '*') appendOp('×');
  else if (e.key === '/') appendOp('÷');
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Escape' || e.key === 'Backspace') backspace();
  else if (e.key === 'Delete') clearCalc();
});

updateDisplay();
</script>
</body>
</html>
