<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>那天夜里 - 悬疑翻页</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --paper: #f5f0e8;
      --text-dark: #1a1a1a;
      --accent: #8b0000;
      --accent-light: #c0392b;
      --glow: rgba(139, 0, 0, 0.3);
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Noto Serif SC', serif;
    }

    /* 书本容器 */
    .book {
      width: 100vw;
      height: 100vh;
      perspective: 2000px;
      position: relative;
    }

    /* 翻页区域 */
    .flip-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* 每一页 */
    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .page.active {
      opacity: 1;
      pointer-events: all;
    }

    /* 封面 */
    .page-cover {
      background: #0a0a0a;
      color: #f5f0e8;
    }

    .page-cover .title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 0.3em;
      color: #8b0000;
      text-shadow: 0 0 30px rgba(139,0,0,0.6), 0 0 60px rgba(139,0,0,0.3);
      animation: pulse-red 3s ease-in-out infinite;
    }

    .page-cover .subtitle {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #555;
      letter-spacing: 0.2em;
    }

    .page-cover .hint {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      color: #333;
      letter-spacing: 0.15em;
      animation: breathe 2s ease-in-out infinite;
    }

    @keyframes pulse-red {
      0%, 100% { text-shadow: 0 0 30px rgba(139,0,0,0.6), 0 0 60px rgba(139,0,0,0.3); }
      50% { text-shadow: 0 0 50px rgba(139,0,0,0.9), 0 0 100px rgba(139,0,0,0.5); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    /* 内页通用 */
    .page-inner {
      background: #f5f0e8;
      color: #1a1a1a;
    }

    .page-inner .bg-text {
      position: absolute;
      font-size: 25vw;
      color: rgba(0,0,0,0.03);
      font-weight: 900;
      letter-spacing: -0.05em;
      user-select: none;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 悬疑文字 */
    .page-inner .line {
      font-size: clamp(1.4rem, 5vw, 2.8rem);
      line-height: 2;
      color: #1a1a1a;
      font-weight: 400;
      position: relative;
      z-index: 2;
      letter-spacing: 0.05em;
    }

    .page-inner .line.small {
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      color: #666;
      margin-top: 20px;
      letter-spacing: 0.1em;
    }

    /* 省略号效果 */
    .ellipsis {
      display: inline-block;
      width: 0.6em;
      text-align: left;
      overflow: hidden;
      animation: ellipsis-anim 1.5s steps(4, end) infinite;
      color: #8b0000;
    }

    @keyframes ellipsis-anim {
      0% { width: 0; }
      25% { width: 0.3em; }
      50% { width: 0.6em; }
      75% { width: 0.9em; }
      100% { width: 1.2em; }
    }

    /* 页码 */
    .page-num {
      position: absolute;
      bottom: 30px;
      right: 40px;
      font-size: 0.75rem;
      color: #bbb;
      letter-spacing: 0.1em;
    }

    /* 翻页提示 */
    .turn-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 0.15em;
      animation: breathe 2s ease-in-out infinite;
    }

    /* 音效按钮 */
    .sound-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(139,0,0,0.8);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      z-index: 100;
      font-family: 'Noto Serif SC', serif;
      transition: background 0.3s;
    }
    .sound-btn:hover { background: #8b0000; }

    /* 最后一页 - 反转 */
    .page-end {
      background: #0a0a0a;
      color: #f5f0e8;
      overflow: hidden;
    }

    .page-end .revelation {
      font-size: clamp(2rem, 7vw, 4rem);
      color: #f5f0e8;
      line-height: 1.8;
      letter-spacing: 0.1em;
      position: relative;
      z-index: 2;
    }

    .page-end .revelation .highlight {
      color: #e8a838;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(232,168,56,0.5);
    }

    .page-end .mood {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30vw;
      color: rgba(245,240,232,0.03);
      font-weight: 900;
      user-select: none;
      pointer-events: none;
    }

    .page-end .tagline {
      position: absolute;
      bottom: 50px;
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 0.2em;
    }

    /* 翻页动画 - 淡入淡出 */
    .page.flip-next {
      animation: flipNext 0.6s ease forwards;
    }

    .page.flip-prev {
      animation: flipPrev 0.6s ease forwards;
    }

    @keyframes flipNext {
      0% { opacity: 0; transform: translateX(30px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes flipPrev {
      0% { opacity: 0; transform: translateX(-30px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* 文字逐字出现 */
    .reveal-char {
      opacity: 0;
      display: inline-block;
    }

    .reveal-char.show {
      animation: charReveal 0.1s ease forwards;
    }

    @keyframes charReveal {
      to { opacity: 1; }
    }

    /* 进度条 */
    .progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 2px;
      background: #8b0000;
      box-shadow: 0 0 10px rgba(139,0,0,0.5);
      transition: width 0.4s ease;
      z-index: 100;
    }

    /* 氛围光效 - 封面 */
    .atmosphere {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,0,0,0.15), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: atmo-pulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes atmo-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
    }

    /* 封面页的额外诡异效果 */
    .page-cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 80%, rgba(139,0,0,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(139,0,0,0.05) 0%, transparent 40%);
      pointer-events: none;
    }
  </style>
</head>
<body>

<button class="sound-btn" id="soundBtn">🔇 音效关</button>
<div class="progress-bar" id="progressBar"></div>

<div class="book">
  <div class="flip-container" id="flipContainer">

    <!-- 封面 -->
    <div class="page page-cover active" data-page="0">
      <div class="atmosphere"></div>
      <div class="title">那天夜里</div>
      <div class="subtitle">一个真实的故事</div>
      <div class="hint">点击屏幕，开始阅读</div>
    </div>

    <!-- 第1页 -->
    <div class="page page-inner" data-page="1">
      <div class="bg-text">饥</div>
      <div class="line" id="p1text">那天夜里，我突然感觉到——</div>
      <div class="line small" id="p1sub" style="margin-top:30px; opacity:0; transition: opacity 0.5s;">
        ……一阵难以忍受的空虚
      </div>
      <div class="page-num">I</div>
      <div class="turn-hint">点击继续</div>
    </div>

    <!-- 第2页 -->
    <div class="page page-inner" data-page="2">
      <div class="bg-text">起</div>
      <div class="line" id="p2text">我不得不从床上爬起来</div>
      <div class="line small" style="margin-top:30px;">
        脚踩在冰凉的地板上<br>那一刻，世界仿佛静止了
      </div>
      <div class="page-num">II</div>
      <div class="turn-hint">点击继续</div>
    </div>

    <!-- 第3页 -->
    <div class="page page-inner" data-page="3">
      <div class="bg-text">唤</div>
      <div class="line" id="p3text">冰箱门打开的那一刻</div>
      <div class="line small" style="margin-top:30px;">
        我仿佛听到了……<span class="ellipsis"> </span>
      </div>
      <div class="page-num">III</div>
      <div class="turn-hint">点击继续</div>
    </div>

    <!-- 第4页 -->
    <div class="page page-inner" data-page="4">
      <div class="bg-text">面</div>
      <div class="line" id="p4text">里面空空如也</div>
      <div class="line small" style="margin-top:30px;">
        只有两包方便面<br>孤零零地躺在那里
      </div>
      <div class="page-num">IV</div>
      <div class="turn-hint">点击继续</div>
    </div>

    <!-- 第5页 -->
    <div class="page page-inner" data-page="5">
      <div class="bg-text">泡</div>
      <div class="line" id="p5text">我烧了开水</div>
      <div class="line small" style="margin-top:30px;">
        将它们轻轻泡下<br>……等待着
      </div>
      <div class="page-num">V</div>
      <div class="turn-hint">点击继续</div>
    </div>

    <!-- 第6页 - 真相 -->
    <div class="page page-end" data-page="6">
      <div class="mood">饱</div>
      <div class="revelation">
        吃饱了<br>
        <span class="highlight">就不饿了</span>
      </div>
      <div class="tagline">—— 完 ——</div>
    </div>

  </div>
</div>

<script>
  // ============ 音效系统 ============
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let soundOn = false;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
  }

  function playCreak() {
    if (!soundOn || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.8);
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
    osc.start(); osc.stop(audioCtx.currentTime + 0.8);
  }

  function playPageTurn() {
    if (!soundOn || !audioCtx) return;
    const bufSize = audioCtx.sampleRate * 0.15;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.1));
    }
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 2000; filter.Q.value = 0.5;
    src.buffer = buf; src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    src.start();
  }

  function playCreepy() {
    if (!soundOn || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc2.type = 'sine';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc2.frequency.setValueAtTime(183, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 2);
    osc2.frequency.linearRampToValueAtTime(117, audioCtx.currentTime + 2);
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
    osc.start(); osc2.start();
    osc.stop(audioCtx.currentTime + 2);
    osc2.stop(audioCtx.currentTime + 2);
  }

  function playLaugh() {
    if (!soundOn || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(280, audioCtx.currentTime + 0.2);
    osc.frequency.setValueAtTime(450, audioCtx.currentTime + 0.3);
    osc.frequency.setValueAtTime(350, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
    osc.start(); osc.stop(audioCtx.currentTime + 0.7);
  }

  // ============ 翻页系统 ============
  let currentPage = 0;
  const totalPages = 7;
  const pages = document.querySelectorAll('.page');
  const progressBar = document.getElementById('progressBar');

  function updateProgress() {
    const pct = (currentPage / (totalPages - 1)) * 100;
    progressBar.style.width = pct + '%';
  }

  function goToPage(n, direction = 'next') {
    if (n < 0 || n >= totalPages) return;
    
    const oldPage = pages[currentPage];
    oldPage.classList.remove('active');
    oldPage.classList.add(direction === 'next' ? 'flip-next' : 'flip-prev');
    
    setTimeout(() => {
      oldPage.classList.remove('flip-next', 'flip-prev');
    }, 600);

    currentPage = n;
    const newPage = pages[currentPage];
    newPage.classList.add('active');

    updateProgress();
    playPageTurn();

    // 触发各页特效
    if (currentPage === 1) {
      setTimeout(() => {
        document.getElementById('p1sub').style.opacity = '1';
      }, 800);
    }
    if (currentPage === 3) {
      setTimeout(playCreepy, 500);
    }
    if (currentPage === 4) {
      setTimeout(playCreak, 600);
    }
    if (currentPage === 6) {
      setTimeout(playLaugh, 300);
      setTimeout(playLaugh, 800);
    }
  }

  function nextPage() {
    if (currentPage === 0) {
      // 封面 → 第1页，需要先 init audio
      initAudio();
    }
    if (currentPage < totalPages - 1) {
      goToPage(currentPage + 1, 'next');
    }
  }

  function prevPage() {
    if (currentPage > 0) {
      goToPage(currentPage - 1, 'prev');
    }
  }

  // 点击翻页
  document.getElementById('flipContainer').addEventListener('click', nextPage);

  // 键盘翻页
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      nextPage();
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      prevPage();
    }
  });

  // 触摸滑动翻页
  let touchStartX = 0;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  });
  document.addEventListener('touchend', (e) => {
    const dx = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(dx) > 50) {
      if (dx > 0) nextPage();
      else prevPage();
    }
  });

  // 音效开关
  document.getElementById('soundBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊 音效开' : '🔇 音效关';
  });

  // 初始化
  updateProgress();
</script>

</body>
</html>
