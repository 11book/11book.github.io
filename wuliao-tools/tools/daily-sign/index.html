<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日日签</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #1a1a2e;
      font-family: "Noto Sans SC", sans-serif;
      padding: 20px;
      padding-bottom: 120px;
    }

    /* 第一部分：手机竖屏预览区 */
    .preview-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .phone-frame {
      width: 100%;
      max-width: 375px;
      aspect-ratio: 9 / 16;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 
        0 0 0 2px rgba(255,255,255,0.1),
        0 25px 80px rgba(0,0,0,0.5);
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
    }

    /* 左侧大日期装饰 */
    .date-decor {
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .date-num {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(100px, 28vw, 130px);
      font-weight: 900;
      color: rgba(255,255,255,0.12);
      line-height: 1;
      letter-spacing: -4px;
      writing-mode: vertical-rl;
    }

    .date-line {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
      margin-top: 8px;
    }

    /* 装饰线条 */
    .deco-lines {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 2;
    }

    .deco-line {
      height: 2px;
      background: rgba(255,255,255,0.15);
      border-radius: 1px;
    }

    .deco-line:nth-child(1) { width: 40px; }
    .deco-line:nth-child(2) { width: 25px; }
    .deco-line:nth-child(3) { width: 50px; }
    .deco-line:nth-child(4) { width: 18px; }

    /* 装饰圆点 */
    .deco-dots {
      position: absolute;
      left: 20px;
      bottom: 80px;
      display: flex;
      gap: 6px;
      z-index: 2;
    }

    .deco-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
    }

    .deco-dot:nth-child(2) { background: rgba(255,255,255,0.4); }
    .deco-dot:nth-child(3) { background: rgba(255,255,255,0.55); }

    /* 装饰方块 */
    .deco-square {
      position: absolute;
      right: 15px;
      top: 60px;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      transform: rotate(15deg);
      z-index: 2;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.55;
    }
    .orb-1 {
      width: 260px;
      height: 260px;
      top: -90px;
      right: -70px;
      animation: orbFloat 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 200px;
      height: 200px;
      bottom: 60px;
      left: -60px;
      animation: orbFloat 10s ease-in-out infinite reverse;
    }
    .orb-3 {
      width: 160px;
      height: 160px;
      bottom: -20px;
      right: 30px;
      animation: orbFloat 7s ease-in-out infinite 2s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(12px, -18px) scale(1.05); }
      66% { transform: translate(-8px, 8px) scale(0.95); }
    }

    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 40px 28px 52px;
    }

    .weekday-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 7px 16px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      width: fit-content;
      animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .weekday-badge .emoji {
      font-size: 14px;
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 70px;
      animation: fadeUp 1s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .main-quote {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(21px, 6vw, 28px);
      font-weight: 700;
      color: white;
      line-height: 1.7;
      text-shadow: 0 4px 30px rgba(0,0,0,0.25);
    }

    .main-quote .highlight {
      background: linear-gradient(135deg, var(--highlight-from, #fff), var(--highlight-to, #fff));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-quote .big {
      font-size: clamp(32px, 9vw, 42px);
      display: block;
      margin: 6px 0;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: rgba(255,255,255,0.55);
      border-radius: 2px;
      margin: 20px 0 16px;
      animation: expandIn 0.8s 0.8s both;
    }

    @keyframes expandIn {
      0% { width: 0; opacity: 0; }
      100% { width: 40px; opacity: 1; }
    }

    .emoji-row {
      display: flex;
      gap: 10px;
      font-size: 24px;
    }

    .emoji-row span {
      animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .emoji-row span:nth-child(1) { animation-delay: 1s; }
    .emoji-row span:nth-child(2) { animation-delay: 1.15s; }
    .emoji-row span:nth-child(3) { animation-delay: 1.3s; }
    .emoji-row span:nth-child(4) { animation-delay: 1.45s; }
    .emoji-row span:nth-child(5) { animation-delay: 1.6s; }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0) rotate(-20deg); }
      60% { transform: scale(1.3) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .sub-quote {
      font-size: clamp(13px, 3.8vw, 15px);
      color: rgba(255,255,255,0.9);
      font-weight: 400;
      line-height: 1.7;
      margin-top: 12px;
    }

    /* 第二部分：导出按钮区 */
    .export-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, #1a1a2e 60%, transparent);
      padding: 20px;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .export-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 16px 48px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      font-family: "Noto Sans SC", sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(102, 126, 234, 0.5);
    }

    .export-btn:active {
      transform: translateY(0);
    }

    .export-btn .icon {
      font-size: 20px;
    }

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

      5: {
        gradient: 'linear-gradient(160deg, #f093fb 0%, #f5576c 100%)',

          { main: '<b>周五</>到！<b>一周</>辛苦<br>换来做五休二的<b>幸福</>！', sub: '辛苦了一周，你值得所有的欢呼和放松' },

        ]
      },
      6: {
        gradient: 'linear-gradient(160deg, #96fbc4 0%, #f9f586 100%)',
        orb1: '#96fbc4', orb2: '#f9f586', orb3: '#ffd89b',
        highlightFrom: '#f9f586', highlightTo: '#96fbc4',
        badge: '🌴', badgeText: '休闲周六',
        emojis: ['🌴', '☀️', '🍉', '🎮', '😴'],
        quotes: [
          { main: '<b>周六</>到！<br>睡到自然醒，只做<b>快乐</>的事！', sub: '工作日努力，周末尽情浪，这就是最好的生活' },

        highlightFrom: '#a8d8ea', highlightTo: '#6a85b6',
        badge: '📖', badgeText: '充周日',
        emojis: ['📖', '🎯', '💭', '🌙', '✨'],
        quotes: [
          { main: '周日夜晚，<b>收心</>一下<br>明天<b>继续战斗</>！', sub: '好好休息，调整状态，新的一周会更精彩' },
          { main: '<b>周日</>余额不足<br>但<b>心态</>要满格！', sub: '用最好的状态迎接明天，相信自己一定行' },
          { main: '今天好好<b>充电</><br>明天满血<b>复活</>！', sub: '周末的每一点放松，都是为了下周的全力以赴' }

    };

    let currentDay = 0;
    let currentTheme = null;
    let currentQuote = null;

    function init() {
      const now = new Date();
      currentDay = now.getDay();
      const date = now.getDate();
      currentTheme = THEMES[currentDay];

      const bg = document.getElementById('bg');
      bg.style.background = currentTheme.gradient;

      document.getElementById('date-num').textContent = date;

      document.querySelector('.orb-1').style.background = currentTheme.orb1;
      document.querySelector('.orb-2').style.background = currentTheme.orb2;
      document.querySelector('.orb-3').style.background = currentTheme.orb3;

      document.documentElement.style.setProperty('--highlight-from', currentTheme.highlightFrom);
      document.documentElement.style.setProperty('--highlight-to', currentTheme.highlightTo);

      const badge = document.getElementById('weekday-badge');
      badge.innerHTML = `<span class="emoji">${currentTheme.badge}</span> ${currentTheme.badgeText}`;

      currentQuote = currentTheme.quotes[Math.floor(Math.random() * currentTheme.quotes.length)];

      const mainQuote = document.getElementById('main-quote');
      mainQuote.innerHTML = currentQuote.main.replace(/<b>(.*?)<\/b>/g, '<span class="highlight">$1</span>');

      const emojiRow = document.getElementById('emoji-row');
      emojiRow.innerHTML = currentTheme.emojis.map(e => `<span>${e}</span>`).join('');

      document.getElementById('sub-quote').textContent = currentQuote.sub;
    }

    init();

    document.getElementById('exportBtn').addEventListener('click', exportImage);

    // 清理HTML标签，保留纯文本
    function stripHtml(html) {
      return html.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
    }

    // 解析带格式的文案，返回纯文本行和 highlight 信息
    function parseQuoteText(html) {
      // 先把<br>换成换行符
      const withNewlines = html.replace(/<br\s*\/?>/gi, '\n');
      const lines = withNewlines.split('\n');
      return lines.map(line => {
        const parts = [];
        let lastIndex = 0;
        const regex = /<b>(.*?)<\/b>/g;
        let match;
        while ((match = regex.exec(line)) !== null) {
          if (match.index > lastIndex) {
            parts.push({ text: line.slice(lastIndex, match.index), highlight: false });
          }
          parts.push({ text: match[1], highlight: true });
          lastIndex = regex.lastIndex;
        }
        if (lastIndex < line.length) {
          parts.push({ text: line.slice(lastIndex), highlight: false });
        }
        return parts.length > 0 ? parts : [{ text: line, highlight: false }];
      });
    }

    function exportImage() {
      const toast = document.getElementById('toast');
      toast.textContent = '正在生成高清图片...';
      toast.classList.add('show');

      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1920;
      const ctx = canvas.getContext('2d');
      const theme = currentTheme;
      const now = new Date();
      const date = now.getDate();

      // 绘制渐变背景
      const grad = ctx.createLinearGradient(0, 0, 0, 1920);
      const colors = theme.gradient.match(/#[a-fA-F0-9]{6}/g) || ['#667eea', '#764ba2'];
      colors.forEach((c, i) => {
        grad.addColorStop(i / (colors.length - 1), c);
      });
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1920);

      // 绘制光圈
      const orbData = [
        { x: 1080 - 70, y: -90, size: 260 },
        { x: -60, y: 1920 * 0.6, size: 200 },
        { x: 1080 * 0.7, y: 1920 - 20, size: 160 }
      ];
      const orbColors = [theme.orb1, theme.orb2, theme.orb3];
      orbData.forEach((orb, i) => {
        const grd = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.size);
        grd.addColorStop(0, orbColors[i]);
        grd.addColorStop(1, 'transparent');
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, 1080, 1920);
      });
      ctx.globalAlpha = 1;

      // 绘制装饰方块
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      roundRect(ctx, 1080 - 55, 60, 40, 40, 8);
      ctx.stroke();

      // 绘制右侧装饰线条
      const lineX = 1080 - 35;
      const lineYs = [1920 * 0.35, 1920 * 0.35 + 16, 1920 * 0.35 + 32, 1920 * 0.35 + 48];
      const lineWidths = [40, 25, 50, 18];
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      lineYs.forEach((y, i) => {
        ctx.fillRect(lineX, y, lineWidths[i], 2);
      });

      // 绘制底部装饰圆点
      const dotX = 30;
      const dotY = 1920 - 100;
      const dotSizes = [6, 6, 6];
      const dotOpacities = [0.25, 0.4, 0.55];
      dotSizes.forEach((size, i) => {
        ctx.beginPath();
        ctx.arc(dotX + i * 18, dotY, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${dotOpacities[i]})`;
        ctx.fill();
      });

      // 绘制左侧日期装饰（竖排文字）
      ctx.save();
      ctx.font = `900 130px "Noto Serif SC", serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // 竖排文字效果
      ctx.translate(40, 1920 / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(date, 0, 0);
      ctx.restore();

      // 绘制左侧日期下划线
      const lineGrad = ctx.createLinearGradient(40, 1920 / 2 + 80, 40, 1920 / 2 + 140);
      lineGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
      lineGrad.addColorStop(1, 'transparent');
      ctx.strokeStyle = lineGrad;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(40, 1920 / 2 + 80);
      ctx.lineTo(40, 1920 / 2 + 140);
      ctx.stroke();

      // 绘制星期标签
      const badgeText = `${theme.badge} ${theme.badgeText}`;
      const badgeW = 130;
      const badgeH = 34;
      const badgeX = (1080 - badgeW) / 2;
      const badgeY = 40;

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath();
      roundRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      roundRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
      ctx.stroke();

      ctx.font = `500 12px "Noto Sans SC", sans-serif`;
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, 540, badgeY + badgeH / 2);

      // 绘制主文案
      const quoteLines = parseQuoteText(currentQuote.main);
      const mainStartY = 1920 * 0.38;
      const lineH = 58;

      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';

      quoteLines.forEach((parts, lineIdx) => {
        let x = 540 - 150;
        const y = mainStartY + lineIdx * lineH;

        parts.forEach(part => {
          ctx.font = `700 28px "Noto Serif SC", serif`;
          if (part.highlight) {
            const grad = ctx.createLinearGradient(x, y, x + 200, y);
            grad.addColorStop(0, theme.highlightFrom);
            grad.addColorStop(1, theme.highlightTo);
            ctx.fillStyle = grad;
          } else {
            ctx.fillStyle = 'white';
          }
          ctx.fillText(part.text, x, y);
          x += ctx.measureText(part.text).width;
        });
      });

      // 绘制分割线
      const dividerY = mainStartY + quoteLines.length * lineH + 20;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(540 - 150, dividerY, 40, 3);

      // 绘制emoji
      const emojiY = dividerY + 35;
      ctx.font = '24px sans-serif';
      ctx.fillStyle = 'white';
      ctx.fillText(theme.emojis.join('  '), 540 - 150, emojiY);

      // 绘制底部文案
      const subY = emojiY + 45;
      ctx.font = `400 15px "Noto Sans SC", sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      // 底部文案自动换行
      const subLines = wrapText(ctx, currentQuote.sub, 540 - 150, subY, 540 + 150, 26);
      subLines.forEach((line, i) => {
        ctx.fillText(line.text, line.x, line.y);
      });

      // 下载
      canvas.toBlob(function(blob) {
        if (blob) {
          const dateStr = `${now.getMonth()+1}月${now.getDate()}日`;
          const dayName = WEEKDAYS[currentDay];
          const filename = `日签_${dateStr}${dayName}.png`;

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          toast.textContent = '✅ 已保存！1080×1920高清图';
          setTimeout(() => toast.classList.remove('show'), 3000);
        } else {
          toast.textContent = '❌ 导出失败，请重试';
          setTimeout(() => toast.classList.remove('show'), 2000);
        }
      }, 'image/png', 1.0);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // 文字换行辅助
    function wrapText(ctx, text, x, startY, maxX, lineHeight) {
      const lines = [];
      let current = '';
      const words = text.split('');
      let y = startY;
      const maxWidth = maxX - x;

      words.forEach(char => {
        const test = current + char;
        if (ctx.measureText(test).width > maxWidth && current.length > 0) {
          lines.push({ text: current, x, y });
          current = char;
          y += lineHeight;
        } else {
          current = test;
        }
      });
      if (current) {
        lines.push({ text: current, x, y });
      }
      return lines;
    }
  </script>
