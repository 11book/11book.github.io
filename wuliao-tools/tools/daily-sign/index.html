<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日日签</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #1a1a2e;
      font-family: "Noto Sans SC", sans-serif;
      padding: 20px;
      padding-bottom: 120px;
    }

    .preview-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .phone-frame {
      width: 100%;
      max-width: 375px;
      aspect-ratio: 9 / 16;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 
        0 0 0 2px rgba(255,255,255,0.1),
        0 25px 80px rgba(0,0,0,0.5);
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
    }

    /* 右上角大日期装饰 - 下移，让三分之一延伸到文案下方 */
    .date-huge {
      position: absolute;
      top: 38%;
      right: 10px;
      font-family: "Noto Serif SC", serif;
      font-size: clamp(120px, 32vw, 150px);
      font-weight: 900;
      color: rgba(255,255,255,0.07);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }

    /* 左上角小装饰 - 星期标签 */
    .top-left {
      position: absolute;
      top: 36px;
      left: 24px;
      z-index: 10;
    }

    .weekday-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 7px 16px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 底部装饰线 */
    .bottom-deco {
      position: absolute;
      bottom: 48px;
      left: 24px;
      right: 24px;
      z-index: 10;
    }

    .bottom-deco-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .deco-short {
      width: 30px;
      height: 2px;
      background: rgba(255,255,255,0.3);
      border-radius: 1px;
    }

    .deco-dots {
      display: flex;
      gap: 5px;
    }

    .deco-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
    }

    .deco-dot:nth-child(2) { background: rgba(255,255,255,0.4); }
    .deco-dot:nth-child(3) { background: rgba(255,255,255,0.55); }

    /* 右上角小装饰 */
    .corner-deco {
      position: absolute;
      top: 36px;
      right: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .corner-line {
      height: 2px;
      background: rgba(255,255,255,0.2);
      border-radius: 1px;
    }

    .corner-line:nth-child(1) { width: 35px; }
    .corner-line:nth-child(2) { width: 20px; }
    .corner-line:nth-child(3) { width: 45px; }

    /* 光圈 */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.55;
    }
    .orb-1 {
      width: 280px;
      height: 280px;
      top: -100px;
      right: -80px;
      animation: orbFloat 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 220px;
      height: 220px;
      bottom: 80px;
      left: -70px;
      animation: orbFloat 10s ease-in-out infinite reverse;
    }
    .orb-3 {
      width: 150px;
      height: 150px;
      bottom: -20px;
      right: 50px;
      animation: orbFloat 7s ease-in-out infinite 2s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(12px, -18px) scale(1.05); }
      66% { transform: translate(-8px, 8px) scale(0.95); }
    }

    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 36px 24px 48px;
    }

    /* 主内容区 */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fadeUp 1s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .main-quote {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(22px, 6.5vw, 30px);
      font-weight: 700;
      color: white;
      line-height: 1.75;
      text-shadow: 0 4px 30px rgba(0,0,0,0.2);
    }

    .main-quote .highlight {
      background: linear-gradient(135deg, var(--highlight-from, #fff), var(--highlight-to, #fff));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-quote .big {
      font-size: clamp(34px, 10vw, 44px);
      display: block;
      margin: 6px 0;
    }

    .divider {
      width: 44px;
      height: 3px;
      background: rgba(255,255,255,0.5);
      border-radius: 2px;
      margin: 24px 0 18px;
      animation: expandIn 0.8s 0.8s both;
    }

    @keyframes expandIn {
      0% { width: 0; opacity: 0; }
      100% { width: 44px; opacity: 1; }
    }

    .emoji-row {
      display: flex;
      gap: 10px;
      font-size: 24px;
    }

    .emoji-row span {
      animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .emoji-row span:nth-child(1) { animation-delay: 1s; }
    .emoji-row span:nth-child(2) { animation-delay: 1.15s; }
    .emoji-row span:nth-child(3) { animation-delay: 1.3s; }
    .emoji-row span:nth-child(4) { animation-delay: 1.45s; }
    .emoji-row span:nth-child(5) { animation-delay: 1.6s; }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0) rotate(-20deg); }
      60% { transform: scale(1.3) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .sub-quote {
      font-size: clamp(14px, 4vw, 16px);
      color: rgba(255,255,255,0.9);
      font-weight: 400;
      line-height: 1.75;
      margin-top: 14px;
    }

    /* 导出按钮 */
    .export-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, #1a1a2e 60%, transparent);
      padding: 20px;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .export-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 16px 48px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      font-family: "Noto Sans SC", sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(102, 126, 234, 0.5);
    }

    .export-btn .icon { font-size: 20px; }

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>
  <div class="preview-wrapper">
    <div class="phone-frame">
      <div class="card" id="card">
        <div class="bg" id="bg">
          <div class="date-huge" id="date-huge"></div>
          <div class="orb orb-1"></div>
          <div class="orb orb-2"></div>
          <div class="orb orb-3"></div>
        </div>

        <div class="top-left">
          <div class="weekday-badge" id="weekday-badge"></div>
        </div>

        <div class="corner-deco">
          <div class="corner-line"></div>
          <div class="corner-line"></div>
          <div class="corner-line"></div>
        </div>

        <div class="content">
          <div class="main-area">
            <div class="main-quote" id="main-quote"></div>
            <div class="divider"></div>
            <div class="emoji-row" id="emoji-row"></div>
            <div class="sub-quote" id="sub-quote"></div>
          </div>
        </div>

        <div class="bottom-deco">
          <div class="bottom-deco-line">
            <div class="deco-short"></div>
            <div class="deco-dots">
              <div class="deco-dot"></div>
              <div class="deco-dot"></div>
              <div class="deco-dot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="export-section">
    <button class="export-btn" id="exportBtn">
      <span class="icon">📸</span>
      <span>导出高清图片</span>
    </button>
  </div>

  <div class="toast" id="toast">正在导出...</div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    const THEMES = {
      1: {
        gradient: 'linear-gradient(160deg, #667eea 0%, #764ba2 60%, #f093fb 100%)',
        orb1: '#667eea', orb2: '#764ba2', orb3: '#f093fb',
        highlightFrom: '#fff700', highlightTo: '#ff9500',
        badge: '🌟', badgeText: '元气周一',
        emojis: ['💪', '🔥', '⚡', '✨', '🌟'],
        quotes: [
          { main: '这周只有5天了<br>今天过完就剩4天，冲！', sub: '每一天都是新的开始，坚持下去，胜利就在眼前' },
          { main: '周一到！困难都是纸老虎<br>一个一个消灭它！', sub: '别人可以，你也可以。加油，我们都在！' },
          { main: '新的一周满血复活！<br>今天也要全力以赴！', sub: '不逼自己一把，永远不知道自己能多优秀' }
        ]
      },
      2: {
        gradient: 'linear-gradient(160deg, #4facfe 0%, #00f2fe 100%)',
        orb1: '#4facfe', orb2: '#00f2fe', orb3: '#38f9d7',
        highlightFrom: '#00f2fe', highlightTo: '#4facfe',
        badge: '🔥', badgeText: '加油周二',
        emojis: ['💪', '🎯', '📈', '🚀', '💎'],
        quotes: [
          { main: '周二的你最努力<br>离周末还有3天，稳！', sub: '路虽远行则将至，事虽难做则必成' },
          { main: '坚持住！周二正在流逝<br>周三马上到来！', sub: '不要假装努力，结果不会陪你演戏' },
          { main: '第二天状态拉满！<br>今天效率翻倍！', sub: '专注当下，每一步都是在靠近目标' }
        ]
      },
      3: {
        gradient: 'linear-gradient(160deg, #fa709a 0%, #fee140 100%)',
        orb1: '#fa709a', orb2: '#fee140', orb3: '#ff9a44',
        highlightFrom: '#fee140', highlightTo: '#fa709a',
        badge: '⚡', badgeText: '突破周三',
        emojis: ['⚡', '💥', '🔥', '🌈', '💫'],
        quotes: [
          { main: '周三分水岭！过了一半<br>胜利在向你招手！', sub: '最困难的时候，往往是转折的开始' },
          { main: '周三不努力，周末徒伤悲<br>现在就是巅峰！', sub: '熬过最难的日子，就会看见不一样的风景' },
          { main: '今天要超神！<br>把困难踩在脚下，大步向前！', sub: '不是因为有希望才坚持，是坚持了才有希望' }
        ]
      },
      4: {
        gradient: 'linear-gradient(160deg, #a18cd1 0%, #fbc2eb 100%)',
        orb1: '#a18cd1', orb2: '#fbc2eb', orb3: '#ffecd2',
        highlightFrom: '#fbc2eb', highlightTo: '#a18cd1',
        badge: '🚀', badgeText: '冲刺周四',
        emojis: ['🚀', '🎯', '💪', '🔥', '⭐'],
        quotes: [
          { main: '周四啦！最后一天上班<br>明天就是周五！', sub: '咬紧牙关，再坚持一下，曙光就在前方' },
          { main: '疯狂星期四疯狂冲刺！<br>V我效率！', sub: '每一天的付出，都在为周末的自由铺路' },
          { main: '胜利在望！<br>就差一步，冲到就是胜利！', sub: '不是因为看到希望才努力，是努力了才看到希望' }
        ]
      },
      5: {
        gradient: 'linear-gradient(160deg, #f093fb 0%, #f5576c 100%)',
        orb1: '#f093fb', orb2: '#f5576c', orb3: '#ffd89b',
        highlightFrom: '#ffd89b', highlightTo: '#f5576c',
        badge: '🎉', badgeText: '解放周五',
        emojis: ['🎉', '🥳', '🎊', '🍾', '🎈'],
        quotes: [
          { main: '周五到！一周辛苦<br>换来做五休二的幸福！', sub: '辛苦了一周，你值得所有的欢呼和放松' },
          { main: '冲鸭！最后一天<br>完美收官就在今天！', sub: '周末是用来回血的，好好休息也是战斗力' },
          { main: '周五心情最好！<br>把本周收尾，下周再战！', sub: '完成比完美更重要，先完成再完美' }
        ]
      },
      6: {
        gradient: 'linear-gradient(160deg, #96fbc4 0%, #f9f586 100%)',
        orb1: '#96fbc4', orb2: '#f9f586', orb3: '#ffd89b',
        highlightFrom: '#f9f586', highlightTo: '#96fbc4',
        badge: '🌴', badgeText: '休闲周六',
        emojis: ['🌴', '☀️', '🍉', '🎮', '😴'],
        quotes: [
          { main: '周六到！<br>睡到自然醒，只做快乐的事！', sub: '工作日努力，周末尽情浪，这就是最好的生活' },
          { main: '周末模式ON！<br>躺平是对一周辛苦的最好奖励！', sub: '休息是为了走更远的路，今天只负责开心' },
          { main: '周六的阳光格外甜<br>想干嘛就干嘛！', sub: '难得的闲暇，就让自己彻底放松一下吧' }
        ]
      },
      0: {
        gradient: 'linear-gradient(160deg, #6a85b6 0%, #bac8e0 100%)',
        orb1: '#6a85b6', orb2: '#bac8e0', orb3: '#a8d8ea',
        highlightFrom: '#a8d8ea', highlightTo: '#6a85b6',
        badge: '📖', badgeText: '充周日',
        emojis: ['📖', '🎯', '💭', '🌙', '✨'],
        quotes: [
          { main: '周日夜晚，收心一下<br>明天继续战斗！', sub: '好好休息，调整状态，新的一周会更精彩' },
          { main: '周日余额不足<br>但心态要满格！', sub: '用最好的状态迎接明天，相信自己一定行' },
          { main: '今天好好充电<br>明天满血复活！', sub: '周末的每一点放松，都是为了下周的全力以赴' }
        ]
      }
    };

    let currentDay = 0;
    let currentTheme = null;
    let currentQuote = null;

    function init() {
      const now = new Date();
      currentDay = now.getDay();
      currentTheme = THEMES[currentDay];

      const bg = document.getElementById('bg');
      bg.style.background = currentTheme.gradient;

      document.getElementById('date-huge').textContent = now.getDate();

      document.querySelector('.orb-1').style.background = currentTheme.orb1;
      document.querySelector('.orb-2').style.background = currentTheme.orb2;
      document.querySelector('.orb-3').style.background = currentTheme.orb3;

      document.documentElement.style.setProperty('--highlight-from', currentTheme.highlightFrom);
      document.documentElement.style.setProperty('--highlight-to', currentTheme.highlightTo);

      const badge = document.getElementById('weekday-badge');
      badge.innerHTML = `${currentTheme.badge} ${currentTheme.badgeText}`;

      currentQuote = currentTheme.quotes[Math.floor(Math.random() * currentTheme.quotes.length)];

      const mainQuote = document.getElementById('main-quote');
      mainQuote.innerHTML = currentQuote.main;

      const emojiRow = document.getElementById('emoji-row');
      emojiRow.innerHTML = currentTheme.emojis.map(e => `<span>${e}</span>`).join('');

      document.getElementById('sub-quote').textContent = currentQuote.sub;
    }

    init();

    document.getElementById('exportBtn').addEventListener('click', exportImage);

    function exportImage() {
      const toast = document.getElementById('toast');
      toast.textContent = '正在生成高清图片...';
      toast.classList.add('show');

      const card = document.getElementById('card');

      html2canvas(card, {
        scale: 3,
        useCORS: true,
        backgroundColor: null,
        logging: false,
        width: card.offsetWidth,
        height: card.offsetHeight
      }).then(canvas => {
        canvas.toBlob(function(blob) {
          if (blob) {
            const now = new Date();
            const dateStr = `${now.getMonth()+1}月${now.getDate()}日`;
            const dayName = WEEKDAYS[currentDay];
            const filename = `日签_${dateStr}${dayName}.png`;

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            toast.textContent = '✅ 已保存！高清图片';
            setTimeout(() => toast.classList.remove('show'), 3000);
          } else {
            toast.textContent = '❌ 导出失败，请重试';
            setTimeout(() => toast.classList.remove('show'), 2000);
          }
        }, 'image/png', 1.0);
      }).catch(err => {
        console.error('Export error:', err);
        toast.textContent = '❌ 导出失败';
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }
  </script>
</body>
</html>
