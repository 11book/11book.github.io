<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日日签</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: "Noto Sans SC", sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    .card {
      position: relative;
      background: linear-gradient(145deg, #ffffff 0%, #f0f4ff 100%);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 25px 60px rgba(0,0,0,0.4),
        0 0 80px rgba(102, 126, 234, 0.15);
      animation: cardIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes cardIn {
      0% { opacity: 0; transform: scale(0.8) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .date-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 8px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      margin-bottom: 32px;
      animation: fadeDown 0.8s 0.3s both;
    }

    @keyframes fadeDown {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .quote-mark {
      font-family: "Noto Serif SC", serif;
      font-size: 72px;
      color: #667eea;
      opacity: 0.2;
      line-height: 1;
      animation: fadeIn 1s 0.5s both;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 0.2; }
    }

    .main-text {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 600;
      color: #2d3748;
      line-height: 1.8;
      margin: 16px 0 32px;
      animation: textIn 1s 0.6s both;
    }

    @keyframes textIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .highlight {
      color: #667eea;
      font-weight: 700;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      margin: 0 auto 24px;
      border-radius: 2px;
      animation: expandWidth 0.8s 0.8s both;
    }

    @keyframes expandWidth {
      0% { width: 0; }
      100% { width: 60px; }
    }

    .sub-text {
      font-size: 14px;
      color: #718096;
      line-height: 1.8;
      animation: fadeIn 1s 1s both;
    }

    .emoji-row {
      font-size: 28px;
      margin-bottom: 20px;
      animation: bounceIn 1s 0.9s both;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .tag {
      display: inline-block;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 20px;
      animation: fadeIn 1s 1.1s both;
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 6px;
      height: 6px;
      background: rgba(102, 126, 234, 0.4);
      border-radius: 50%;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
    }

    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 80%; animation-delay: 1s; }
    .particle:nth-child(3) { left: 80%; top: 30%; animation-delay: 2s; }
    .particle:nth-child(4) { left: 70%; top: 70%; animation-delay: 3s; }
    .particle:nth-child(5) { left: 50%; top: 10%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
      50% { transform: translateY(-30px) rotate(180deg); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="card">
    <div class="date-badge">周一 · 早安</div>
    
    <div class="quote-mark">"</div>
    
    <div class="main-text">
      这周<span class="highlight">只有5天</span>了<br>
      今天也要快过去了<br>
      <span class="highlight">还有四天</span>，就放假啦<br>
      加油！冲！💪
    </div>

    <div class="divider"></div>

    <div class="emoji-row">🌟 ⏰ 🔥 ✨ 🌟</div>
    
    <div class="sub-text">
      每一天都是新的开始<br>
      坚持下去，胜利在望
    </div>

    <div class="tag">🌈 正能量日签</div>
  </div>
</body>
</html>
