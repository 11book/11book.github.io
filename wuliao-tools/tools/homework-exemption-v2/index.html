<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>免作业券 v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #E8F4FD;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 50px;
      font-family: "Noto Sans SC", sans-serif;
    }

    /* =============================================
       A4 纸张：210mm × 297mm
       布局：3列 × 8行 = 24张券
       每格：宽 70mm，高 37mm
    ============================================= */
    .a4-page {
      width: 210mm;
      height: 297mm;
      background: #FFFFFF;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(8, 1fr);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      position: relative;
    }

    /* 裁剪参考线 */
    .cut-h1, .cut-h2, .cut-h3, .cut-h4, .cut-h5, .cut-h6, .cut-h7 {
      position: absolute; left: 0; right: 0;
      border-top: 1px dashed #C0C0C0;
      pointer-events: none; z-index: 10;
    }
    .cut-h1 { top: 37mm; }   .cut-h2 { top: 74mm; }   .cut-h3 { top: 111mm; }
    .cut-h4 { top: 148mm; }  .cut-h5 { top: 185mm; }  .cut-h6 { top: 222mm; }
    .cut-h7 { top: 259mm; }
    .cut-v1, .cut-v2 {
      position: absolute; top: 0; bottom: 0;
      border-left: 1px dashed #C0C0C0;
      pointer-events: none; z-index: 10;
    }
    .cut-v1 { left: 70mm; }
    .cut-v2 { left: 140mm; }

    /* =============================================
       单张免作业券（70mm × 37mm）
    ============================================= */
    .coupon {
      position: relative;
      background: var(--coupon-bg);
      break-inside: avoid;
      display: flex;
      flex-direction: column;
      padding: 2.5mm 3mm 2mm;
      overflow: hidden;
    }

    /* ========== 标题区 ========== */
    .card-header {
      text-align: center;
      flex-shrink: 0;
    }

    .card-header h1 {
      font-family: "Noto Serif SC", "STSong", "SimSun", serif;
      font-size: 17pt;
      font-weight: 900;
      color: #1a1a1a;
      letter-spacing: 2px;
      line-height: 1.1;
    }

    /* 标题下说明文字 */
    .card-desc {
      text-align: center;
      margin-top: 2mm;
      flex-shrink: 0;
    }

    .card-desc span {
      font-size: 8pt;
      color: #CC3333;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* ========== 金色分隔线 ========== */
    .card-divider {
      height: 1px;
      background: var(--divider-color);
      margin: 1.2mm 4mm 0;
      flex-shrink: 0;
    }

    /* ========== 信息区（2×2 网格） ========== */
    .card-info {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0;
      padding: 0.8mm 1mm 0;
    }

    /* 每个格子：图标 + 标签 + 内容 */
    .info-cell {
      display: flex;
      align-items: center;
      gap: 0.5mm;
      padding: 0 0.5mm;
      font-size: 5pt;
      color: #555;
      line-height: 1;
      border-right: 1px solid var(--cell-border);
    }

    /* 右侧两个格子去掉右边框 */
    .info-cell:nth-child(2),
    .info-cell:nth-child(4) {
      border-right: none;
    }

    /* 下方两个格子去掉上边框 */
    .info-cell:nth-child(3),
    .info-cell:nth-child(4) {
      border-top: 1px solid var(--cell-border);
    }

    .info-icon {
      width: 4mm;
      height: 4mm;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5pt;
      flex-shrink: 0;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }

    .icon-person  { background: #FFF0F5; }
    .icon-date    { background: #FFF8E6; }
    .icon-teacher { background: #EEF6FF; }
    .icon-term    { background: #F0FFF4; }

    .info-label {
      font-weight: 700;
      color: var(--label-color);
      font-size: 5pt;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .info-line {
      flex: 1;
      border-bottom: 1px dashed var(--line-color);
      height: 3.5mm;
      display: flex;
      align-items: center;
    }

    .info-fixed {
      flex: 1;
      font-weight: 700;
      color: var(--fixed-color);
      font-size: 5pt;
      word-break: break-all;
    }

    /* 角花 */
    .corner-decor {
      position: absolute;
      font-size: 4.5pt;
      opacity: 0.35;
      color: var(--deco-color);
    }
    .deco-tl { top: 1mm; left: 1mm; }
    .deco-br { bottom: 1mm; right: 1mm; }

    /* =============================================
       设置面板
    ============================================= */
    .settings-panel {
      margin-top: 20px;
      width: 210mm;
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .settings-label {
      font-size: 12px;
      font-weight: 700;
      color: #444;
      min-width: 48px;
    }

    .theme-btn {
      padding: 6px 14px;
      border: 2px solid #ddd;
      border-radius: 50px;
      background: #fff;
      font-size: 12px;
      font-family: "Noto Sans SC", sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .theme-btn:hover { border-color: #aaa; }

    .theme-btn.active {
      font-weight: 700;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px currentColor;
    }

    .settings-input {
      padding: 6px 10px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
      font-family: "Noto Sans SC", sans-serif;
      outline: none;
      transition: border-color 0.2s;
      min-width: 80px;
    }

    .settings-input:focus { border-color: #FF9A3C; }

    /* =============================================
       导出按钮
    ============================================= */
    .export-bar {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .export-btn {
      padding: 12px 36px;
      background: linear-gradient(135deg, #FF9A3C, #FFD93D);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-family: "Noto Sans SC", sans-serif;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(255,154,60,0.35);
      transition: all 0.2s;
    }

    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,154,60,0.45);
    }

    .export-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      font-size: 12px;
      color: #888;
    }

    /* =============================================
       打印
    ============================================= */
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .a4-page { width: 210mm; height: 297mm; box-shadow: none; }
      .export-bar, .settings-panel { display: none !important; }
      .coupon, .info-icon { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="a4-page" id="a4Page">
  <div class="cut-h1"></div><div class="cut-h2"></div><div class="cut-h3"></div>
  <div class="cut-h4"></div><div class="cut-h5"></div><div class="cut-h6"></div>
  <div class="cut-h7"></div>
  <div class="cut-v1"></div>
  <div class="cut-v2"></div>
</div>

<!-- 设置面板 -->
<div class="settings-panel">
  <div class="settings-section">
    <span class="settings-label">🎨 主题</span>
    <button class="theme-btn active" data-theme="rainbow" onclick="setTheme('rainbow')">🌈 彩虹糖果</button>
    <button class="theme-btn" data-theme="classic" onclick="setTheme('classic')">⚫ 经典学院</button>
    <button class="theme-btn" data-theme="nature" onclick="setTheme('nature')">💚 清新绿野</button>
    <button class="theme-btn" data-theme="pink" onclick="setTheme('pink')">🌸 可爱粉嫩</button>
  </div>
  <div class="settings-section">
    <span class="settings-label">📝 发放人</span>
    <input class="settings-input" id="inputTeacher" value="郑老师" oninput="updateTeacher(this.value)">
    <span class="settings-label" style="margin-left:12px">📅 有效期</span>
    <input class="settings-input" id="inputTerm" value="本学期" oninput="updateTerm(this.value)">
  </div>
</div>

<div class="export-bar">
  <button class="export-btn" id="exportPng">📥 导出 A4 PNG 图片</button>
  <p class="hint">支持直接打印：文件 → 打印 → 选择「无边距」效果更佳</p>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  const THEMES = {
    rainbow: {
      '--coupon-bg': '#FFFCF5',
      '--divider-color': '#F5D87A',
      '--cell-border': '#F0E8D0',
      '--label-color': '#444',
      '--line-color': '#FFD93D',
      '--fixed-color': '#5B8DBE',
      '--deco-color': '#FFB347',
    },
    classic: {
      '--coupon-bg': '#F8FAFF',
      '--divider-color': '#C9A84C',
      '--cell-border': '#D8D8D8',
      '--label-color': '#1B4F8A',
      '--line-color': '#C9A84C',
      '--fixed-color': '#1B4F8A',
      '--deco-color': '#1B4F8A',
    },
    nature: {
      '--coupon-bg': '#F0FFF4',
      '--divider-color': '#7CB87A',
      '--cell-border': '#D0E8D0',
      '--label-color': '#2D7A3A',
      '--line-color': '#7CB87A',
      '--fixed-color': '#2D7A3A',
      '--deco-color': '#7CB87A',
    },
    pink: {
      '--coupon-bg': '#FFF5F8',
      '--divider-color': '#FFB3CC',
      '--cell-border': '#FFD0DC',
      '--label-color': '#C04870',
      '--line-color': '#FFB3CC',
      '--fixed-color': '#C04870',
      '--deco-color': '#FF8FAB',
    }
  };

  let teacher = '郑老师';
  let term = '本学期';

  function renderCoupons() {
    const a4Page = document.getElementById('a4Page');
    for (let i = 0; i < 24; i++) {
      const div = document.createElement('div');
      div.className = 'coupon';
      div.innerHTML = `
        <div class="card-header"><h1>免作业券</h1></div>
        <div class="card-desc"><span>本券可免除一次日常作业</span></div>
        <div class="card-divider"></div>
        <div class="card-info">
          <div class="info-cell">
            <div class="info-icon icon-person">🎒</div>
            <span class="info-label">使用人：</span>
            <div class="info-line"></div>
          </div>
          <div class="info-cell">
            <div class="info-icon icon-teacher">🏫</div>
            <span class="info-label">发放人：</span>
            <span class="info-fixed teacher-text">${teacher}</span>
          </div>
          <div class="info-cell">
            <div class="info-icon icon-date">📅</div>
            <span class="info-label">使用日期：</span>
            <div class="info-line"></div>
          </div>
          <div class="info-cell">
            <div class="info-icon icon-term">📚</div>
            <span class="info-label">有效期：</span>
            <span class="info-fixed term-text">${term}</span>
          </div>
        </div>
        <div class="corner-decor deco-tl">✿</div>
        <div class="corner-decor deco-br">❀</div>
      `;
      a4Page.appendChild(div);
    }
  }

  function setTheme(name) {
    const root = document.documentElement;
    const t = THEMES[name];
    for (const [k, v] of Object.entries(t)) root.style.setProperty(k, v);
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === name);
    });
  }

  function updateTeacher(val) {
    teacher = val || '郑老师';
    document.querySelectorAll('.teacher-text').forEach(el => el.textContent = teacher);
  }

  function updateTerm(val) {
    term = val || '本学期';
    document.querySelectorAll('.term-text').forEach(el => el.textContent = term);
  }

  document.getElementById('exportPng').addEventListener('click', async function () {
    const btn = this;
    const a4Page = document.getElementById('a4Page');
    btn.disabled = true;
    btn.textContent = '⏳ 正在生成图片...';
    try {
      const canvas = await html2canvas(a4Page, {
        scale: 3,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        windowWidth: Math.round(a4Page.offsetWidth),
        windowHeight: Math.round(a4Page.offsetHeight)
      });
      const link = document.createElement('a');
      link.download = '免作业券-v2-A4.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    } catch (e) {
      alert('生成失败: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '📥 导出 A4 PNG 图片';
    }
  });

  renderCoupons();
  setTheme('rainbow');
</script>
</body>
</html>
