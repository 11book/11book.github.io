<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>免作业券 v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #E8F4FD;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 50px;
      font-family: "Noto Sans SC", sans-serif;
    }

    /* =============================================
       A4 纸张：210mm × 297mm
       布局：3列 × 8行 = 24张券
       每格：宽 70mm，高 37mm
    ============================================= */
    .a4-page {
      width: 210mm;
      height: 297mm;
      background: #FFFFFF;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(8, 1fr);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      position: relative;
    }

    /* 裁剪参考线 */
    .cut-h1, .cut-h2, .cut-h3, .cut-h4, .cut-h5, .cut-h6, .cut-h7 {
      position: absolute; left: 0; right: 0;
      border-top: 1px dashed #C0C0C0;
      pointer-events: none; z-index: 10;
    }
    .cut-h1 { top: 37mm; }   .cut-h2 { top: 74mm; }   .cut-h3 { top: 111mm; }
    .cut-h4 { top: 148mm; }  .cut-h5 { top: 185mm; }  .cut-h6 { top: 222mm; }
    .cut-h7 { top: 259mm; }

    .cut-v1 { position: absolute; top: 0; bottom: 0; left: 70mm; border-left: 1px dashed #C0C0C0; pointer-events: none; z-index: 10; }
    .cut-v2 { position: absolute; top: 0; bottom: 0; left: 140mm; border-left: 1px dashed #C0C0C0; pointer-events: none; z-index: 10; }

    /* =============================================
       单张免作业券
       每格 70mm × 37mm（横向扁长）
       内容紧凑排满
    ============================================= */
    .coupon {
      position: relative;
      background: var(--coupon-bg);
      break-inside: avoid;
      display: flex;
      flex-direction: column;
      padding: 2.5mm 3mm 2mm;
      overflow: hidden;
    }

    /* ========== 标题区（顶部居中） ========== */
    .card-title {
      text-align: center;
      flex-shrink: 0;
    }

    .card-title h1 {
      font-family: "Noto Serif SC", "STSong", "SimSun", serif;
      font-size: 11pt;
      font-weight: 900;
      color: var(--title-color);
      letter-spacing: 1.5px;
      line-height: 1;
    }

    /* ========== 说明文字（标题下方） ========== */
    .card-desc {
      text-align: center;
      flex-shrink: 0;
      margin-top: 0.3mm;
    }

    .card-desc span {
      font-size: 5.5pt;
      color: var(--desc-color);
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* ========== 分隔线 ========== */
    .card-divider {
      height: 1px;
      background: var(--divider-color);
      margin: 1mm 2mm 0;
      flex-shrink: 0;
    }

    /* ========== 内容区（两列：左使用人/日期，右发放人/有效期） ========== */
    .card-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      padding: 1mm 1.5mm 0;
      align-items: start;
    }

    .col-left, .col-right {
      display: flex;
      flex-direction: column;
      gap: 1.2mm;
    }

    .col-right {
      padding-left: 1mm;
      border-left: 1px solid var(--col-border);
    }

    .info-item {
      display: flex;
      align-items: baseline;
      gap: 0.5mm;
      font-size: 6pt;
      color: var(--label-color);
      line-height: 1;
    }

    .info-label {
      font-weight: 700;
      color: var(--label-color);
      white-space: nowrap;
      font-size: 6pt;
    }

    .info-line {
      flex: 1;
      border-bottom: 1px solid var(--line-color);
      height: 4.5mm;
      display: flex;
      align-items: center;
      min-width: 2mm;
    }

    .info-fixed {
      font-weight: 700;
      color: var(--fixed-color);
      font-size: 6pt;
      word-break: break-all;
    }

    /* 角花 */
    .corner-decor {
      position: absolute;
      font-size: 5pt;
      opacity: 0.3;
      color: var(--deco-color);
    }
    .deco-tl { top: 1mm; left: 1.5mm; }
    .deco-br { bottom: 1mm; right: 1.5mm; }

    /* =============================================
       设置面板
    ============================================= */
    .settings-panel {
      margin-top: 20px;
      width: 210mm;
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .settings-label {
      font-size: 12px;
      font-weight: 700;
      color: #444;
      min-width: 48px;
    }

    .theme-btn {
      padding: 6px 14px;
      border: 2px solid #ddd;
      border-radius: 50px;
      background: #fff;
      font-size: 12px;
      font-family: "Noto Sans SC", sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .theme-btn:hover { border-color: #aaa; }

    .theme-btn.active {
      font-weight: 700;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px currentColor;
    }

    .settings-input {
      padding: 6px 10px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
      font-family: "Noto Sans SC", sans-serif;
      outline: none;
      transition: border-color 0.2s;
      min-width: 80px;
    }

    .settings-input:focus { border-color: #FF9A3C; }

    /* =============================================
       导出按钮
    ============================================= */
    .export-bar {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .export-btn {
      padding: 12px 36px;
      background: linear-gradient(135deg, #FF9A3C, #FFD93D);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-family: "Noto Sans SC", sans-serif;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(255,154,60,0.35);
      transition: all 0.2s;
    }

    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,154,60,0.45);
    }

    .export-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      font-size: 12px;
      color: #888;
    }

    /* =============================================
       打印
    ============================================= */
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .a4-page { width: 210mm; height: 297mm; box-shadow: none; }
      .export-bar, .settings-panel { display: none !important; }
      .coupon { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="a4-page" id="a4Page">
  <div class="cut-h1"></div><div class="cut-h2"></div><div class="cut-h3"></div>
  <div class="cut-h4"></div><div class="cut-h5"></div><div class="cut-h6"></div>
  <div class="cut-h7"></div>
  <div class="cut-v1"></div>
  <div class="cut-v2"></div>
</div>

<!-- 设置面板 -->
<div class="settings-panel">
  <div class="settings-section">
    <span class="settings-label">🎨 主题</span>
    <button class="theme-btn active" data-theme="classic" onclick="setTheme('classic')">⚫ 经典黑白</button>
    <button class="theme-btn" data-theme="warm" onclick="setTheme('warm')">🧡 暖橙活力</button>
    <button class="theme-btn" data-theme="nature" onclick="setTheme('nature')">💚 清新绿野</button>
    <button class="theme-btn" data-theme="sky" onclick="setTheme('sky')">💙 天空蓝调</button>
  </div>
  <div class="settings-section">
    <span class="settings-label">📝 发放人</span>
    <input class="settings-input" id="inputTeacher" value="郑老师" oninput="updateTeacher(this.value)">
    <span class="settings-label" style="margin-left:12px">📅 有效期</span>
    <input class="settings-input" id="inputTerm" value="本学期" oninput="updateTerm(this.value)">
  </div>
</div>

<div class="export-bar">
  <button class="export-btn" id="exportPng">📥 导出 A4 PNG 图片</button>
  <p class="hint">支持直接打印：文件 → 打印 → 选择「无边距」效果更佳</p>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  const THEMES = {
    classic: {
      '--coupon-bg': '#FFFFFF',
      '--title-color': '#1a1a1a',
      '--desc-color': '#CC3333',
      '--label-color': '#333',
      '--line-color': '#888',
      '--fixed-color': '#1a1a1a',
      '--divider-color': '#CCC',
      '--col-border': '#E0E0E0',
      '--deco-color': '#888',
    },
    warm: {
      '--coupon-bg': '#FFF9F0',
      '--title-color': '#1a1a1a',
      '--desc-color': '#D44A20',
      '--label-color': '#5C3317',
      '--line-color': '#C8834A',
      '--fixed-color': '#5C3317',
      '--divider-color': '#E8C090',
      '--col-border': '#E8C090',
      '--deco-color': '#C8834A',
    },
    nature: {
      '--coupon-bg': '#F0FFF4',
      '--title-color': '#1a1a1a',
      '--desc-color': '#2D7A3A',
      '--label-color': '#2D7A3A',
      '--line-color': '#7CB87A',
      '--fixed-color': '#2D7A3A',
      '--divider-color': '#B8D8B8',
      '--col-border': '#D0E8D0',
      '--deco-color': '#7CB87A',
    },
    sky: {
      '--coupon-bg': '#F0F7FF',
      '--title-color': '#1a1a1a',
      '--desc-color': '#1A5FA8',
      '--label-color': '#1A5FA8',
      '--line-color': '#6B9FD4',
      '--fixed-color': '#1A5FA8',
      '--divider-color': '#B8CFEE',
      '--col-border': '#D0E0F0',
      '--deco-color': '#6B9FD4',
    }
  };

  let teacher = '郑老师';
  let term = '本学期';

  function renderCoupons() {
    const a4Page = document.getElementById('a4Page');
    for (let i = 0; i < 24; i++) {
      const div = document.createElement('div');
      div.className = 'coupon';
      div.innerHTML = `
        <div class="card-title"><h1>免作业券</h1></div>
        <div class="card-desc"><span>本券可免除一次日常作业</span></div>
        <div class="card-divider"></div>
        <div class="card-body">
          <div class="col-left">
            <div class="info-item"><span class="info-label">使用人：</span><div class="info-line"></div></div>
            <div class="info-item"><span class="info-label">使用日期：</span><div class="info-line"></div></div>
          </div>
          <div class="col-right">
            <div class="info-item"><span class="info-label">发放人：</span><span class="info-fixed teacher-text">${teacher}</span></div>
            <div class="info-item"><span class="info-label">有效期：</span><span class="info-fixed term-text">${term}</span></div>
          </div>
        </div>
        <div class="corner-decor deco-tl">✿</div>
        <div class="corner-decor deco-br">❀</div>
      `;
      a4Page.appendChild(div);
    }
  }

  function setTheme(name) {
    const root = document.documentElement;
    const t = THEMES[name];
    for (const [k, v] of Object.entries(t)) root.style.setProperty(k, v);
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === name);
    });
  }

  function updateTeacher(val) {
    teacher = val || '郑老师';
    document.querySelectorAll('.teacher-text').forEach(el => el.textContent = teacher);
  }

  function updateTerm(val) {
    term = val || '本学期';
    document.querySelectorAll('.term-text').forEach(el => el.textContent = term);
  }

  document.getElementById('exportPng').addEventListener('click', async function () {
    const btn = this;
    const a4Page = document.getElementById('a4Page');
    btn.disabled = true;
    btn.textContent = '⏳ 正在生成图片...';
    try {
      const canvas = await html2canvas(a4Page, {
        scale: 3,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        windowWidth: Math.round(a4Page.offsetWidth),
        windowHeight: Math.round(a4Page.offsetHeight)
      });
      const link = document.createElement('a');
      link.download = '免作业券-v2-A4.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    } catch (e) {
      alert('生成失败: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '📥 导出 A4 PNG 图片';
    }
  });

  renderCoupons();
  setTheme('classic');
</script>
</body>
</html>
