<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QPST</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #cc6600;
      font-family: "Courier New", Consolas, monospace;
      color: #1a0600;
      min-height: 100vh;
      position: relative;
    }

    /* 扫描线 — 工程屏固有瑕疵感 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.05) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* 左侧内容 */
    .left {
      position: absolute;
      top: 0;
      left: 0;
      padding: 28px 20px;
      font-size: clamp(10px, 2.8vw, 13px);
      line-height: 2;
      letter-spacing: 0.3px;
    }

    /* 闪烁光标 */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #1a0600;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 底部状态栏 */
    .statusbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 20px;
      font-size: clamp(8px, 2vw, 10px);
      color: rgba(26,6,0,0.55);
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(0,0,0,0.15);
      letter-spacing: 0.3px;
    }

    /* 右上角小闪烁点 */
    .indicator {
      position: absolute;
      top: 12px;
      right: 16px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a0600;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    /* 右侧进度区 */
    .right {
      position: absolute;
      top: 0;
      right: 0;
      padding: 28px 20px;
      text-align: right;
      font-size: clamp(9px, 2.2vw, 11px);
      line-height: 2;
      color: rgba(26,6,0,0.6);
    }

    .progress-label {
      font-size: clamp(8px, 2vw, 10px);
      color: rgba(26,6,0,0.45);
      margin-bottom: 4px;
    }

    .progress-bar {
      width: 120px;
      height: 4px;
      background: rgba(0,0,0,0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-left: auto;
    }

    .progress-fill {
      height: 100%;
      background: #1a0600;
      border-radius: 2px;
      animation: load 4s linear infinite;
      width: 0%;
    }
    @keyframes load {
      0% { width: 0%; }
      40% { width: 60%; }
      70% { width: 85%; }
      100% { width: 100%; }
    }

    .counter {
      margin-top: 6px;
      font-size: clamp(8px, 2vw, 10px);
      color: rgba(26,6,0,0.5);
    }
  </style>
</head>
<body>

  <!-- 右上角状态点 -->
  <div class="indicator"></div>

  <!-- 左侧主信息 -->
  <div class="left">
    <div>QUSB_BULK_SN: E8AC606F<span class="cursor"></span></div>
    <div style="margin-top:10px;">Qualcomm CrashDump Mode v2.0</div>
    <div style="border-top:1px dashed rgba(0,0,0,0.25);margin:10px 0;padding-top:10px;">
      <div>Sahara protocol mismatch</div>
      <div>FIREHOSE version: 3.1</div>
      <div>Loader handshake failed</div>
    </div>
    <div style="border-top:1px dashed rgba(0,0,0,0.25);padding-top:10px;">
      <div>HW: QCOM_SDM845</div>
      <div>RAM: 8GB LPDDR4X</div>
      <div>eMMC: 256GB UFS</div>
    </div>
    <div style="border-top:1px dashed rgba(0,0,0,0.25);margin-top:10px;padding-top:10px;">
      <div>Port: QDLoader 9008</div>
      <div>COM: 3&nbsp;&nbsp;Speed: 460800</div>
      <div>Driver: installed</div>
    </div>
  </div>

  <!-- 右侧进度 -->
  <div class="right">
    <div class="progress-label"> analyzing...</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="counter" id="counter">00:00:00</div>
  </div>

  <!-- 底部状态栏 -->
  <div class="statusbar">
    <span>USB: connected</span>
    <span>Battery: 78%</span>
    <span>Temp: 36°C</span>
  </div>

  <script>
    // 计时器
    var seconds = 0;
    setInterval(function() {
      seconds++;
      var h = Math.floor(seconds / 3600);
      var m = Math.floor((seconds % 3600) / 60);
      var s = seconds % 60;
      document.getElementById('counter').textContent =
        String(h).padStart(2,'0') + ':' +
        String(m).padStart(2,'0') + ':' +
        String(s).padStart(2,'0');
    }, 1000);
  </script>
</body>
</html>
