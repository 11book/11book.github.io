<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CrashDump Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #cc6600;
      font-family: "Courier New", Consolas, monospace;
      color: #1a0800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* 扫描线 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.06) 2px,
        rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .screen {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      text-align: left;
      position: relative;
      z-index: 2;
    }

    /* XIAOMI 标题 */
    .header {
      font-size: clamp(13px, 4vw, 16px);
      font-weight: 700;
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(0,0,0,0.25);
      padding-bottom: 10px;
      margin-bottom: 18px;
    }

    /* 主描述 */
    .desc {
      font-size: clamp(10px, 3vw, 12px);
      line-height: 1.9;
      opacity: 0.85;
      margin-bottom: 16px;
    }

    /* 分隔线 */
    .sep {
      border: none;
      border-top: 1px dashed rgba(0,0,0,0.3);
      margin: 16px 0;
    }

    /* 错误信息 */
    .error {
      font-size: clamp(9px, 2.8vw, 11px);
      line-height: 2;
      opacity: 0.7;
    }

    /* 状态行 */
    .status {
      font-size: clamp(9px, 2.8vw, 11px);
      line-height: 2;
      opacity: 0.6;
      margin-top: 12px;
    }

    /* 底部指示 */
    .footer {
      position: fixed;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      font-size: clamp(8px, 2.2vw, 10px);
      color: rgba(26,8,0,0.5);
      letter-spacing: 0.5px;
      z-index: 5;
      animation: blink 2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    /* 揭晓 */
    .reveal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }
    .reveal.show { display: flex; }

    .reveal h2 {
      font-size: 30px;
      color: #e8a838;
      margin-bottom: 14px;
    }
    .reveal p {
      font-size: 15px;
      color: #aaa;
      line-height: 1.8;
      max-width: 280px;
    }
    .reveal button {
      margin-top: 28px;
      padding: 12px 36px;
      background: #e8a838;
      border: none;
      border-radius: 50px;
      color: #1a0a00;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .hint {
      position: fixed;
      top: 10px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(26,8,0,0.45);
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hint">👆 把屏幕展示给朋友看，然后点一下屏幕</div>

  <div class="screen">
    <div class="header">XIAOMI CrashDump Mode</div>

    <div class="desc">
      Your device has crashed,<br>
      you can either get full memory dump using qpst,<br>
      or select to save it in fact partition!
    </div>

    <hr class="sep">

    <div class="error">
      Ramdump partition not found,<br>
      enter QPST mode!
    </div>

    <div class="status">
      Dump Region — all ok
    </div>
  </div>

  <div class="footer">[ POWER OFF TO EXIT ]</div>

  <!-- 揭晓 -->
  <div class="reveal" id="reveal">
    <h2>😂 整蛊成功！</h2>
    <p>手机其实没坏<br>这是整蛊工具 😄</p>
    <button onclick="closeReveal()">关闭</button>
  </div>

  <script>
    document.body.addEventListener('click', () => {
      document.getElementById('reveal').classList.add('show');
    });
    function closeReveal() {
      document.getElementById('reveal').classList.remove('show');
    }
  </script>
</body>
</html>
