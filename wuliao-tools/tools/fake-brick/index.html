<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QPST</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      /* 纯橙屏，不是浅橙，是那种工程模式原生的深橙 */
      background: #cc6600;
      font-family: "Courier New", Consolas, monospace;
      color: #1a0600;
      min-height: 100vh;
      position: relative;
    }

    /* 左上角主内容区 */
    .content {
      position: absolute;
      top: 0;
      left: 0;
      padding: 32px 24px;
      font-size: clamp(11px, 3vw, 14px);
      line-height: 1.9;
      letter-spacing: 0.5px;
    }

    /* 分隔线 */
    .sep {
      border: none;
      border-top: 1px dashed rgba(0,0,0,0.3);
      margin: 12px 0;
      width: 100%;
    }

    /* 底部提示 */
    .footer {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: clamp(9px, 2.5vw, 11px);
      color: rgba(26,6,0,0.5);
      letter-spacing: 0.5px;
      animation: blink 2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* 扫描线 */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 5;
    }

    /* 揭晓 */
    .reveal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }
    .reveal.show { display: flex; }
    .reveal h2 { font-size: 30px; color: #e8a838; margin-bottom: 14px; }
    .reveal p { font-size: 15px; color: #aaa; line-height: 1.8; max-width: 280px; }
    .reveal button {
      margin-top: 28px; padding: 12px 36px; background: #e8a838;
      border: none; border-radius: 50px; color: #1a0a00;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .hint {
      position: fixed; top: 10px; right: 16px;
      font-size: 11px; color: rgba(26,6,0,0.4); z-index: 20; pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hint">点屏幕揭晓</div>

  <!-- 左上角贴边，模拟真实工程模式屏幕 -->
  <div class="content">
    <div>QUSB_BULK_SN: E8AC606F</div>
    <div style="margin-top:8px;">Qualcomm CrashDump Mode</div>

    <hr class="sep">

    <div>Sahara: protocol mismatch</div>
    <div style="margin-top:6px;">FIREHOSE version: 3.1</div>
    <div>Loader mismatch</div>

    <hr class="sep">

    <div>Device: QCOM_SDM845</div>
    <div>Memory: 8GB LPDDR4</div>
    <div>Storage: 256GB UFS</div>

    <hr class="sep">

    <div>Port: QDLoader 9008 (COM3)</div>
    <div>Status: connected</div>
  </div>

  <div class="footer">[ POWER OFF TO EXIT ]</div>

  <!-- 揭晓 -->
  <div class="reveal" id="reveal">
    <h2>😂 整蛊成功！</h2>
    <p>手机其实没坏<br>这是整蛊工具 😄</p>
    <button onclick="closeReveal()">关闭</button>
  </div>

  <script>
    document.body.addEventListener('click', () => {
      document.getElementById('reveal').classList.add('show');
    });
    function closeReveal() {
      document.getElementById('reveal').classList.remove('show');
    }
  </script>
</body>
</html>
