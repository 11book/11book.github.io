<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九月九日忆山东兄弟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "ZCOOL XiaoWei", "Ma Shan Zheng", serif;
      background: linear-gradient(180deg, #c8602a 0%, #e8874a 30%, #f5c87a 60%, #fde8b8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 手绘云朵 */
    .cloud {
      position: fixed;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      filter: blur(8px);
    }

    .cloud-1 { width: 200px; height: 60px; top: 8%; left: 10%; animation: float 12s ease-in-out infinite; }
    .cloud-2 { width: 160px; height: 50px; top: 15%; right: 15%; animation: float 10s ease-in-out infinite reverse; }
    .cloud-3 { width: 120px; height: 40px; top: 22%; left: 55%; animation: float 14s ease-in-out infinite 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-12px) translateX(8px); }
    }

    /* 远山剪影 */
    .hills {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45vh;
      pointer-events: none;
    }

    .hills svg { width: 100%; height: 100%; }

    /* 飘叶 */
    .leaf {
      position: fixed;
      width: 20px;
      height: 20px;
      background: #c8602a;
      border-radius: 0 50% 50% 50%;
      transform: rotate(45deg);
      animation: fall linear infinite;
      pointer-events: none;
      opacity: 0.7;
    }

    @keyframes fall {
      0% { opacity: 0; transform: rotate(45deg) translateY(-5vh) translateX(0); }
      10% { opacity: 0.7; }
      90% { opacity: 0.5; }
      100% { opacity: 0; transform: rotate(405deg) translateY(105vh) translateX(50px); }
    }

    /* 内容 */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 28px;
    }

    .title {
      font-size: clamp(20px, 5vw, 30px);
      letter-spacing: 6px;
      color: #5a2a0a;
      margin-bottom: 48px;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
      opacity: 0;
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
    }
    .title .red { color: #c83010; }
    .poem {
      font-size: clamp(20px, 5vw, 30px);
      line-height: 2.8;
      letter-spacing: 6px;
      color: #5a2a0a;
      margin-bottom: 64px;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
    }

    .poem .line {
      display: block;
      opacity: 0;
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .poem .line:nth-child(1) { animation-delay: 0.4s; }
    .poem .line:nth-child(2) { animation-delay: 0.7s; }
    .poem .line:nth-child(3) { animation-delay: 1.0s; }
    .poem .line:nth-child(4) { animation-delay: 1.3s; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .greeting {
      font-size: clamp(22px, 6vw, 38px);
      letter-spacing: 10px;
      color: #7a3010;
      opacity: 0;
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1.8s forwards;
    }

    /* 手绘装饰线 */
    .deco-line {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c8602a, transparent);
      opacity: 0;
      animation: fadeIn 1s ease 2.5s forwards;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <div class="hills">
    <svg viewBox="0 0 1440 500" preserveAspectRatio="none">
      <!-- 山1 -->
      <path fill="#b85c28" opacity="0.6" d="M0,500 L0,350 Q180,250 360,320 Q540,390 720,280 Q900,170 1080,260 Q1260,350 1440,300 L1440,500 Z"/>
      <!-- 山2 -->
      <path fill="#d4784a" opacity="0.5" d="M0,500 L0,400 Q300,320 540,380 Q780,440 1020,360 Q1260,280 1440,360 L1440,500 Z"/>
      <!-- 树 -->
      <circle cx="120" cy="420" r="40" fill="#a04a1a" opacity="0.5"/>
      <circle cx="200" cy="400" r="30" fill="#a04a1a" opacity="0.4"/>
      <circle cx="1300" cy="410" r="35" fill="#a04a1a" opacity="0.5"/>
      <circle cx="1380" cy="430" r="25" fill="#a04a1a" opacity="0.4"/>
    </svg>
  </div>

  <div id="leaves"></div>

  <div class="container">
    <div class="title">九月九日忆<span class="red">山东</span>兄弟</div>
    <div class="poem">
      <span class="line">独在异乡为异客，</span>
      <span class="line">每逢佳节倍思亲。</span>
      <span class="line">遥知兄弟登高处，</span>
      <span class="line">遍插茱萸少一人。</span>
    </div>
    <div class="greeting"><span class="red">山西</span>的朋友，你们好吗？</div>
  </div>

  <div class="deco-line"></div>

  <script>
    const container = document.getElementById('leaves');
    for (let i = 0; i < 10; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'leaf';
      leaf.style.left = Math.random() * 100 + 'vw';
      leaf.style.animationDuration = (6 + Math.random() * 8) + 's';
      leaf.style.animationDelay = Math.random() * 10 + 's';
      const colors = ['#c8602a','#e8874a','#d4a84a','#b85030'];
      leaf.style.background = colors[Math.floor(Math.random() * colors.length)];
      container.appendChild(leaf);
    }
  </script>

</body>
</html>
