<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>国庆节补贴福利来了</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #000;
    }

    /* ========== 第一页 ========== */
    .p1 {
      min-height: 100vh;
      background: linear-gradient(180deg, #3d0000 0%, #0d0000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .flash-tag {
      display: inline-block;
      background: #e63946;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 4px;
      padding: 8px 24px;
      border-radius: 4px;
      margin-bottom: 48px;
      animation: flash 0.8s ease infinite alternate;
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0.3; }
    }

    .line1 {
      font-size: 52px;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 2px;
      margin-bottom: 18px;
      text-shadow: 0 0 40px rgba(255,215,0,0.4);
    }

    .line2 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .line3 {
      font-size: 16px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1px;
      margin-bottom: 80px;
    }

    .scroll-hint {
      font-size: 12px;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.2);
      animation: blink 2s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.7; }
    }

    /* ========== 第二页 ========== */
    .p2 {
      min-height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .p2-text {
      font-size: 96px;
      font-weight: 900;
      color: #e63946;
      letter-spacing: 20px;
    }
  </style>
</head>
<body>

  <!-- 第一页 -->
  <div class="p1">
    <div class="flash-tag">🔥 限时抢购 🔥</div>
    <div class="line1">国庆节补贴福利来了</div>
    <div class="line2">定好闹钟及时查收，先到先得！</div>
    <div class="line3">明天（9月20日）上午9:00准时到账</div>
    <div class="scroll-hint">↓ 滑 动</div>
  </div>

  <!-- 第二页 -->
  <div class="p2">
    <div class="p2-text">周日上班！</div>
  </div>

</body>
</html>
