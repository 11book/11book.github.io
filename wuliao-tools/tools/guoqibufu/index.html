<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>国庆节补贴到账提醒</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #0d0d1a;
      color: #fff;
    }

    /* 第一页：喜庆紧张 */
    .page1 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: radial-gradient(ellipse at top, #1a0a0a 0%, #0d0d1a 60%);
    }

    .badge {
      font-size: 12px;
      letter-spacing: 4px;
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 32px;
      opacity: 0.8;
    }

    .title {
      font-size: 36px;
      font-weight: 900;
      color: #ffd700;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      margin-bottom: 48px;
    }

    .money-box {
      background: rgba(230, 57, 70, 0.1);
      border: 2px solid rgba(255, 215, 0, 0.4);
      border-radius: 16px;
      padding: 32px 48px;
      text-align: center;
      margin-bottom: 40px;
    }

    .money-label {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .money-amount {
      font-size: 56px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    }

    .alarm-note {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      line-height: 2;
      margin-bottom: 48px;
    }

    .alarm-icon {
      font-size: 48px;
      margin-bottom: 16px;
      animation: ring 0.5s ease infinite alternate;
      display: block;
    }

    @keyframes ring {
      from { transform: rotate(-10deg); }
      to { transform: rotate(10deg); }
    }

    .scroll-hint {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      animation: fadeInOut 2s ease infinite;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }

    /* 分隔线 */
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
      margin: 0 auto 48px;
    }

    /* 第二页：周日上班 */
    .page2 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      background: #0d0d1a;
    }

    .big-text {
      font-size: 72px;
      font-weight: 900;
      color: #e63946;
      letter-spacing: 8px;
      text-align: center;
      line-height: 1.1;
    }

    .sub-text {
      font-size: 18px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-top: 24px;
      letter-spacing: 2px;
    }

    .detail {
      margin-top: 48px;
      border: 1px solid rgba(230, 57, 70, 0.3);
      border-radius: 12px;
      padding: 24px 32px;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 2;
    }
  </style>
</head>
<body>

  <!-- 第一页 -->
  <div class="page1">
    <div class="badge">💰 国庆节专属福利</div>
    <div class="title">补贴明天到账</div>
    <div class="subtitle">请各位同事提前做好查收准备</div>

    <div class="money-box">
      <div class="money-label">预 到 账 金 额</div>
      <div class="money-amount">人均 ¥200</div>
    </div>

    <span class="alarm-icon">⏰</span>
    <div class="alarm-note">
      请设置手机闹钟<br>
      明天上午9:00准时查收
    </div>

    <div class="divider"></div>

    <div class="scroll-hint">↓ 向下滑动</div>
  </div>

  <!-- 第二页 -->
  <div class="page2">
    <div class="big-text">周日上班！</div>
    <div class="sub-text">9月21日（明天）正常上班</div>
    <div class="detail">
      9月21日（周日）正常上班<br>
      9月28日（周六）也正常上班<br>
      补贴？没多发过，那是工资的一部分
    </div>
  </div>

</body>
</html>
