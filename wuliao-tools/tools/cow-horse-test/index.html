<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>测测你是什么牛马 🐴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a0f;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .screen {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    text-align: center;
  }
  .screen.active { display: flex; }

  /* ─── START ─── */
  #screen-start { background: linear-gradient(160deg, #1a1a2e 0%, #0f0f1a 100%); }
  .start-title {
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 3s ease infinite;
    background-size: 300% 300%;
  }
  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .start-sub {
    font-size: 15px;
    color: #888;
    margin-bottom: 48px;
    line-height: 1.6;
  }
  .stickman-office {
    position: relative;
    width: 120px;
    height: 180px;
    margin: 0 auto 40px;
  }
  .btn-start {
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    border: none;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 16px 48px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(255,107,107,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    animation: pulse 2s ease infinite;
  }
  .btn-start:active { transform: scale(0.96); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 8px 30px rgba(255,107,107,0.4); }
    50% { box-shadow: 0 8px 50px rgba(255,107,107,0.7); }
  }

  /* ─── QUESTION ─── */
  #screen-question { background: #0a0a0f; }
  .q-progress {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }
  .q-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #333;
    transition: all 0.4s ease;
  }
  .q-dot.done { background: #6bcb77; }
  .q-dot.current { background: #ffd93d; width: 28px; border-radius: 5px; }
  .q-number {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .q-text {
    font-size: clamp(20px, 5.5vw, 28px);
    font-weight: 700;
    margin-bottom: 40px;
    line-height: 1.4;
    animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .options { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
  .opt-btn {
    background: #1a1a2e;
    border: 2px solid #2a2a3e;
    color: #fff;
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 16px;
    cursor: pointer;
    text-align: left;
    transition: all 0.25s ease;
    animation: fadeUp 0.4s ease backwards;
  }
  .opt-btn:nth-child(1) { animation-delay: 0.05s; }
  .opt-btn:nth-child(2) { animation-delay: 0.1s; }
  .opt-btn:nth-child(3) { animation-delay: 0.15s; }
  .opt-btn:hover, .opt-btn:active {
    border-color: #ffd93d;
    background: #1f1f35;
    transform: translateX(4px);
  }
  .opt-btn.selected {
    border-color: #6bcb77;
    background: #1a2e1a;
  }
  .opt-icon {
    display: inline-block;
    margin-right: 8px;
  }

  /* ─── RESULT ─── */
  #screen-result { background: #0a0a0f; }
  .result-badge {
    font-size: 12px;
    color: #ffd93d;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    animation: fadeUp 0.5s ease;
  }
  .result-type {
    font-size: clamp(32px, 8vw, 48px);
    font-weight: 900;
    margin-bottom: 16px;
    animation: fadeUp 0.6s ease;
    line-height: 1.2;
  }
  .result-desc {
    font-size: 15px;
    color: #aaa;
    line-height: 1.7;
    max-width: 320px;
    margin: 0 auto 32px;
    animation: fadeUp 0.7s ease;
  }
  .result-score {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
    animation: fadeUp 0.6s ease;
  }
  .stickman-result {
    margin: 0 auto 32px;
    animation: fadeUp 0.6s ease;
    position: relative;
    width: 160px;
    height: 220px;
  }

  /* stickman base */
  .sk { position: absolute; width: 100%; height: 100%; }
  .sk-head { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; }
  .sk-body { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; }
  .sk-limb { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; }

  /* animations */
  @keyframes typing {
    0%,100% { stroke-dashoffset: 0; }
    50% { stroke-dashoffset: 20; }
  }
  @keyframes nod {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
  @keyframes typingLeft {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(-30deg); }
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .typing .sk-limb { animation: typing 0.6s ease infinite; }

  /* color themes */
  .theme-red .result-type { color: #ff6b6b; }
  .theme-green .result-type { color: #6bcb77; }
  .theme-blue .result-type { color: #4d96ff; }
  .theme-gold .result-type { color: #ffd93d; }
  .theme-purple .result-type { color: #c77dff; }

  .restart-btn {
    margin-top: 8px;
    background: transparent;
    border: 2px solid #333;
    color: #666;
    font-size: 14px;
    padding: 12px 32px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .restart-btn:hover { border-color: #666; color: #fff; }

  /* reaction flash */
  .reaction-flash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .reaction-flash.show { opacity: 1; }
</style>
</head>

      <line x1="80" y1="90" x2="118" y2="78" class="sk-limb" stroke="#c77dff"/>
      <!-- pointing finger -->
      <circle cx="118" cy="78" r="3" fill="#c77dff"/>
      <!-- legs walking -->
      <line x1="80" y1="138" x2="50" y2="175" class="sk-limb" stroke="#c77dff"/>
      <line x1="80" y1="138" x2="110" y2="175" class="sk-limb" stroke="#c77dff"/>
      <!-- podium -->
      <rect x="5" y="130" width="35" height="55" rx="4" fill="#1a1a2e" stroke="#c77dff" stroke-width="1.5"/>
      <rect x="10" y="138" width="25" height="3" fill="#c77dff" opacity="0.5"/>
      <rect x="10" y="145" width="20" height="3" fill="#c77dff" opacity="0.3"/>
      <rect x="10" y="152" width="22" height="3" fill="#c77dff" opacity="0.3"/>
      <!-- light effect -->
      <circle cx="120" cy="60" r="30" fill="#c77dff" opacity="0.05"/>
      <circle cx="120" cy="60" r="15" fill="#c77dff" opacity="0.08"/>
      <style>
        .sk { animation: nod 1.2s ease-in-out infinite; transform-origin: 80px 50px; }
      </style>
    </svg>`
  }
];

let currentQ = 0;
let scores = [];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQ = 0;
  scores = [];
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  // progress dots
  let dots = '';
  for (let i = 0; i < questions.length; i++) {
    if (i < currentQ) dots += '<div class="q-dot done"></div>';
    else if (i === currentQ) dots += '<div class="q-dot current"></div>';
    else dots += '<div class="q-dot"></div>';
  }
  document.getElementById('qProgress').innerHTML = dots;
  document.getElementById('qNumber').textContent = `第 ${currentQ + 1} 题`;
  document.getElementById('qText').textContent = q.text;

  let opts = '';
  q.options.forEach((opt, i) => {
    opts += `<button class="opt-btn" onclick="selectOption(${opt.value})">
      <span class="opt-icon">${opt.icon}</span>${opt.text}
    </button>`;
  });
  document.getElementById('options').innerHTML = opts;
}

function selectOption(val) {
  // flash
  const flash = document.getElementById('reactionFlash');
  flash.style.background = `rgba(${val === 1 ? '77,150,255' : val === 2 ? '255,217,61' : '107,203,119'},0.15)`;
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 300);

  // show selected
  document.querySelectorAll('.opt-btn').forEach((btn, i) => {
    const v = questions[currentQ].options[i].value;
    if (v === val) btn.classList.add('selected');
  });

  scores.push(val);

  setTimeout(() => {
    currentQ++;
    if (currentQ < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 500);
}

function showResult() {
  const total = scores.reduce((a, b) => a + b, 0);
  const res = results.find(r => total >= r.min && total <= r.max) || results[results.length - 1];

  const screen = document.getElementById('screen-result');
  screen.className = `screen ${res.color}`;
  document.getElementById('resultType').textContent = res.name;
  document.getElementById('resultDesc').textContent = res.desc;
  document.getElementById('resultScore').textContent = `得分：${total} / 9`;
  document.getElementById('stickmanResult').innerHTML = res.svg;

  showScreen('screen-result');
}

function restart() {
  showScreen('screen-start');
}
</script>
