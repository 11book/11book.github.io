<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>格局要大</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Noto Sans SC", sans-serif;
      background: #0f0a12;
      color: #ece4f0;
      display: grid;
      grid-template-rows: 10vh 1fr 10vh;
      grid-template-columns: 100%;
    }
    /* tag 贴顶 + 居中 */
    .tag {
      grid-row: 1;
      grid-column: 1;
      justify-self: center;
      align-self: center;
      font-size: clamp(18px, 4.5vw, 42px);
      font-weight: 700;
      letter-spacing: 0.7em;
      text-transform: uppercase;
      color: #9b59b6;
      border: 2px solid rgba(155,89,182,0.4);
      padding: 1.2vh 4vw;
      border-radius: 50px;
      background: rgba(155,89,182,0.06);
      white-space: nowrap;
    }
    /* 主内容区：垂直水平居中 */
    .main {
      grid-row: 2;
      grid-column: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .icon { font-size: clamp(80px, 20vw, 240px); line-height: 1; margin-bottom: 4vh; }
    .surface-text {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(60px, 14vw, 180px);
      font-weight: 900;
      text-align: center;
      line-height: 1.1;
      color: #ece4f0;
      letter-spacing: 0.05em;
      max-width: 95%;
    }
    .divider { width: clamp(60px, 12vw, 160px); height: 3px; background: linear-gradient(90deg, transparent, #9b59b6, transparent); margin: 4vh 0; }
    .btn-wrap { position: relative; display: inline-block; }
    .btn-glow { position: absolute; inset: -6px; border-radius: 50px; border: 2px solid transparent; pointer-events: none; }
    .btn-glow:nth-child(1) { animation: glowPulse 5s ease-in-out infinite; border-color: rgba(155,89,182,0.9); inset: -4px; }
    .btn-glow:nth-child(2) { animation: glowPulse 5s ease-in-out infinite 0.4s; border-color: rgba(155,89,182,0.7); }
    .btn-glow:nth-child(3) { animation: glowPulse 5s ease-in-out infinite 0.8s; border-color: rgba(155,89,182,0.5); }
    .btn-glow:nth-child(4) { animation: glowPulse 5s ease-in-out infinite 1.2s; border-color: rgba(155,89,182,0.3); }
    .btn-glow:nth-child(5) { animation: glowPulse 5s ease-in-out infinite 1.6s; border-color: rgba(155,89,182,0.15); }
    @keyframes glowPulse { 0%, 100% { opacity: 0.15; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .reveal-btn {
      background: rgba(15,10,18,0.85);
      border: 2px solid rgba(155,89,182,0.35);
      color: rgba(155,89,182,0.7);
      font-family: "Noto Sans SC", sans-serif;
      font-size: clamp(18px, 4vw, 38px);
      padding: 1.8vh 6vw;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.3em;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }
    .reveal-btn:hover { border-color: rgba(155,89,182,0.8); color: rgba(155,89,182,1); box-shadow: 0 0 20px rgba(155,89,182,0.3); }
    .reveal-btn.hidden { border-color: rgba(255,255,255,0.06); color: rgba(255,255,255,0.15); pointer-events: none; }
    .truth-section {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      opacity: 0; visibility: hidden;
      transform: translateY(4vh);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0.7s;
    }
    .truth-section.show { opacity: 1; visibility: visible; transform: translateY(0); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0s; }
    .truth-text, .truth-quote { opacity: 0; transition: opacity 0.5s ease 0.3s; }
    .truth-section.show .truth-text, .truth-section.show .truth-quote { opacity: 1; }
    .truth-arrow { font-size: clamp(50px, 10vw, 120px); margin-bottom: 2vh; animation: bounce 1s ease infinite; }
    .truth-label { font-size: clamp(14px, 3vw, 32px); letter-spacing: 0.8em; color: #e74c3c; text-transform: uppercase; font-weight: 700; margin-bottom: 3vh; }
    .truth-text { font-size: clamp(48px, 11vw, 140px); font-weight: 900; color: #ece4f0; line-height: 1.2; margin-bottom: 4vh; }
    .truth-quote { font-size: clamp(16px, 3.5vw, 48px); color: #8a6a9a; font-style: italic; line-height: 1.7; max-width: 90%; }
    /* 入场动画 */
    .main > * { opacity: 0; animation: fadeUp 0.7s ease forwards; }
    .icon { animation-delay: 0.3s; }
    .surface-text { animation-delay: 0.6s; }
    .divider { animation-delay: 0.9s; }
    .btn-wrap { animation-delay: 1.2s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(2vh); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5vh); } }
  </style>
</head>
<body>
  <div class="tag">领导相处</div>
  <div class="main">
    <div class="icon">👑</div>
    <div class="surface-text">格局要大</div>
    <div class="divider"></div>
    <div class="btn-wrap">
      <div class="btn-glow"></div><div class="btn-glow"></div><div class="btn-glow"></div><div class="btn-glow"></div><div class="btn-glow"></div>
      <button class="reveal-btn" onclick="reveal()">↓ 揭示真相</button>
    </div>
  </div>
  <div class="truth-section" id="truth">
    <div class="truth-arrow">👇</div>
    <div class="truth-label">打工人翻译</div>
    <div class="truth-text">忍吧<br>别计较</div>
    <div class="truth-quote">"格局大 = 加班别要钱，背锅别抱怨；<br>领导的意思是：吃亏的总是你。"</div>
  </div>
  <script>
    function reveal() {
      document.getElementById('truth').classList.add('show');
      document.querySelector('.reveal-btn').classList.add('hidden');
    }
  </script>
</body>
</html>
