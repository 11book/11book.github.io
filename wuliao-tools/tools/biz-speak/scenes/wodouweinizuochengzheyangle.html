<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我都为你做成这样了</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1a14;
    --text: #e8f5e9;
    --text-dim: rgba(102,187,106,0.55);
    --gold: #66bb6a;
    --red: #ffa726;
    --tag-bg: rgba(102,187,106,0.2);
    --tag-border: rgba(102,187,106,0.4);
    --tag-text: #66bb6a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"Noto Sans SC",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
  }
  body::before {
    content:''; position:absolute; top:0; left:0; right:0; height:45%;
    background:radial-gradient(ellipse at 50% 0%, rgba(102,187,106,0.1) 0%, transparent 65%);
    pointer-events:none; z-index:0;
  }
  .top { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:4px 28px 8px; position:relative; z-index:1; }
  .tag { font-size:11px; letter-spacing:3px; color:var(--tag-text); background:var(--tag-bg); border:1px solid var(--tag-border); padding:5px 16px; border-radius:50px; margin-bottom:20px; }
  .main-title { font-family:'Noto Serif SC'; font-size:68px; font-weight:900; text-align:center; line-height:1.15; letter-spacing:3px; min-width:0; overflow-wrap:break-word; max-width:92%; }
  .sub-title { font-size:26px; color:var(--text-dim); text-align:center; margin-top:14px; }
  .divider { width:100%; height:3px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:0.35; flex-shrink:0; position:relative; z-index:1; }
  .bottom { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:8px 28px 4px; position:relative; z-index:1; }
  .truth-label { font-size:28px; font-weight:700; color:var(--red); display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .truth-lines { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .truth-line { font-size:36px; font-weight:700; color:var(--text); text-align:center; line-height:1.2; }
  .quote { font-size:17px; color:var(--text-dim); font-style:italic; text-align:center; line-height:1.8; margin-top:18px; padding:0 12px; }
</style>
</head>
<body>
  <div class="top">
    <div class="tag">情感拿捏</div>
    <div class="main-title">我都为你做成这样了</div>
    <div class="sub-title">你自己看着办吧</div>
  </div>
  <div class="divider"></div>
  <div class="bottom">
    <div class="truth-label">💬 潜台词</div>
    <div class="truth-lines">
      <div class="truth-line">放大我的付出</div><div class="truth-line">让你产生愧疚</div><div class="truth-line">最后你不得不让步</div>
    </div>
    <div class="quote">"总跟你说付出的人，都是在等你还债。"</div>
  </div>
</body>
</html>
