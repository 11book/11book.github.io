<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>人员优化</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d08; }
    body { display: flex; align-items: center; justify-content: center; }
    .stage { position: relative; width: 100vw; height: 100vh; max-width: calc(100vh * 9 / 16); max-height: calc(100vw * 16 / 9); display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0d0d08; }
    .canvas { width: 1080px; height: 1920px; transform-origin: center center; position: relative; font-family: "Noto Sans SC", sans-serif; color: #f0f0e4; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tag { position: absolute; top: 170px; left: 50%; transform: translateX(-50%); width: fit-content; max-width: 90%; font-size: 42px; font-weight: 700; letter-spacing: 8px; text-transform: uppercase; color: #f5c518; border: 4px solid rgba(245,197,24,0.4); padding: 22px 70px; border-radius: 108px; background: rgba(245,197,24,0.06); white-space: nowrap; z-index: 10; }
    .icon { font-size: 260px; line-height: 1; margin-bottom: 80px; }
    .surface-text { font-family: "Noto Serif SC", serif; font-size: 156px; font-weight: 900; text-align: center; line-height: 1.15; color: #f0f0e4; padding: 0 40px; white-space: nowrap; }
    .divider { width: 220px; height: 6px; background: linear-gradient(90deg, transparent, #f5c518, transparent); margin: 70px 0; }
    .btn-wrap { position: relative; display: inline-block; }
    .btn-glow { position: absolute; inset: -12px; border-radius: 120px; border: 4px solid transparent; pointer-events: none; }
    .btn-glow:nth-child(1) { animation: glowPulse 5s ease-in-out infinite; border-color: rgba(245,197,24,0.9); inset: -8px; }
    .btn-glow:nth-child(2) { animation: glowPulse 5s ease-in-out infinite 0.4s; border-color: rgba(245,197,24,0.7); }
    .btn-glow:nth-child(3) { animation: glowPulse 5s ease-in-out infinite 0.8s; border-color: rgba(245,197,24,0.5); }
    .btn-glow:nth-child(4) { animation: glowPulse 5s ease-in-out infinite 1.2s; border-color: rgba(245,197,24,0.3); }
    .btn-glow:nth-child(5) { animation: glowPulse 5s ease-in-out infinite 1.6s; border-color: rgba(245,197,24,0.15); }
    @keyframes glowPulse { 0%, 100% { opacity: 0.15; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .reveal-btn { background: rgba(13,13,8,0.85); border: 4px solid rgba(245,197,24,0.35); color: rgba(245,197,24,0.7); font-family: "Noto Sans SC", sans-serif; font-size: 56px; padding: 36px 124px; border-radius: 108px; cursor: pointer; letter-spacing: 7px; transition: all 0.3s ease; position: relative; z-index: 1; }
    .reveal-btn:hover { border-color: rgba(245,197,24,0.8); color: rgba(245,197,24,1); box-shadow: 0 0 60px rgba(245,197,24,0.3); }
    .reveal-btn.hidden { border-color: rgba(255,255,255,0.06); color: rgba(255,255,255,0.15); pointer-events: none; }
    .truth-section { text-align: center; opacity: 0; visibility: hidden; transform: translateY(88px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0.7s; }
    .truth-section.show { opacity: 1; visibility: visible; transform: translateY(0); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0s; }
    .truth-text, .truth-quote { opacity: 0; transition: opacity 0.5s ease 0.3s; }
    .truth-section.show .truth-text, .truth-section.show .truth-quote { opacity: 1; }
    .truth-arrow { font-size: 160px; margin-bottom: 36px; animation: bounce 1s ease infinite; }
    .truth-label { font-size: 42px; letter-spacing: 12px; color: #ff4444; text-transform: uppercase; font-weight: 700; margin-bottom: 50px; }
    .truth-text { font-size: 110px; font-weight: 900; color: #f0f0e4; line-height: 1.2; margin-bottom: 64px; }
    .truth-quote { font-size: 56px; color: #8a8a5a; font-style: italic; line-height: 1.6; }
    .canvas > .tag { opacity: 0; animation: fadeUp 0.7s ease forwards 0.2s; }
    .canvas > .icon { opacity: 0; animation: fadeUp 0.7s ease forwards 0.5s; }
    .canvas > .surface-text { opacity: 0; animation: fadeUp 0.7s ease forwards 0.8s; }
    .canvas > .divider { opacity: 0; animation: fadeUp 0.7s ease forwards 1.1s; }
    .canvas > .btn-wrap { opacity: 0; animation: fadeUp 0.7s ease forwards 1.4s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="canvas" id="canvas">
      <div class="tag">人员优化</div>
      <div class="icon">⚠️</div>
      <div class="surface-text">人员优化</div>
      <div class="divider"></div>
      <div class="btn-wrap">
        <div class="btn-glow"></div><div class="btn-glow"></div><div class="btn-glow"></div><div class="btn-glow"></div><div class="btn-glow"></div>
        <button class="reveal-btn" onclick="reveal()">↓ 揭示真相</button>
      </div>
      <div class="truth-section" id="truth">
        <div class="truth-arrow">👇</div>
        <div class="truth-label">打工人翻译</div>
        <div class="truth-text">裁员<br>N+1不一定</div>
        <div class="truth-quote">"优化的不是人员，是成本；<br>留下的不是功臣，是没赔偿预算的。"</div>
      </div>
    </div>
  </div>
  <script>
    function reveal() {
      document.getElementById('truth').classList.add('show');
      document.querySelector('.reveal-btn').classList.add('hidden');
    }
    function scaleCanvas() {
      const stage = document.querySelector('.stage');
      const canvas = document.getElementById('canvas');
      const sw = stage.clientWidth;
      const sh = stage.clientHeight;
      const scale = Math.min(sw / 1080, sh / 1920);
      canvas.style.transform = `scale(${scale})`;
    }
    window.addEventListener('load', scaleCanvas);
    window.addEventListener('resize', scaleCanvas);
    scaleCanvas();
  </script>
</body>
</html>
