<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大家畅所欲言</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d12;
      --text: #f0ece4;
      --text-dim: #8a8a9a;
      --gold: #d4a843;
      --red: #e85454;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    /* 背景光晕 */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: radial-gradient(ellipse at 50% 0%, rgba(212,168,67,0.12) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ========== 上半屏：词语 ========== */
    .top {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 32px;
      gap: 0;
    }

    /* 分类标签 */
    .tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(212,168,67,0.1);
      border: 1px solid rgba(212,168,67,0.3);
      padding: 5px 18px;
      border-radius: 50px;
      margin-bottom: 32px;
    }

    /* 词语大字 - 撑满上半屏 */
    .word {
      font-family: "Noto Serif SC", serif;
      font-size: 80px;
      font-weight: 900;
      text-align: center;
      line-height: 1.0;
      color: var(--text);
      letter-spacing: 3px;
    }

    /* 副文案 */
    .sub {
      font-size: 28px;
      font-weight: 400;
      color: var(--text-dim);
      text-align: center;
      margin-top: 16px;
    }

    /* ========== 金色分隔线 ========== */
    .gold-line {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 20%, var(--gold) 80%, transparent 100%);
      opacity: 0.4;
      flex-shrink: 0;
    }

    /* ========== 下半屏：真相 ========== */
    .bottom {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 32px 48px;
      gap: 0;
    }

    /* 真相标签 */
    .truth-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 20px;
    }

    /* 真相大字 */
    .truth {
      font-size: 40px;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      color: var(--text);
    }

    /* 真相语录 */
    .quote {
      font-size: 18px;
      color: var(--text-dim);
      font-style: italic;
      text-align: center;
      line-height: 1.8;
      margin-top: 20px;
      padding: 0 16px;
    }
  </style>
</head>
<body>

  <div class="top">
    <div class="tag">开会现场</div>
    <div class="word">大家畅所欲言</div>
    <div class="sub">有意见尽管提</div>
  </div>

  <div class="gold-line"></div>

  <div class="bottom">
    <div class="truth-label">打工人翻译</div>
    <div class="truth">
      走个过场<br>
      看看谁站错队<br>
      敢唱反调
    </div>
    <div class="quote">"会上让你提,是给你面子;<br>真提了,是你不识相。"</div>
  </div>

</body>
</html>
