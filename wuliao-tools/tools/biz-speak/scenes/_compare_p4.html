<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案4：SVG描边光带流动</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0d12;
      --text: #e8e4dc;
      --text-dim: #7a7a8a;
      --primary: #c9a84c;
      --danger: #e85454;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .tag {
      position: fixed; top: 100px; left: 0; right: 0; width: fit-content; max-width: 90%; margin: 0 auto;
      font-size: 26px; font-weight: 700; letter-spacing: 8px; text-transform: uppercase; color: var(--primary);
      border: 2px solid rgba(201,168,76,0.4); padding: 12px 40px; border-radius: 60px;
      background: rgba(201,168,76,0.06); white-space: nowrap; z-index: 10;
    }

    .main { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 36px; }
    .icon { font-size: 180px; line-height: 1; margin-bottom: 48px; }
    .surface-text { font-family: "Noto Serif SC", serif; font-size: 130px; font-weight: 900; text-align: center; line-height: 1.05; color: var(--text); letter-spacing: 4px; width: 100%; }
    .divider { width: 120px; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); margin: 40px 0; }

    /* ===== 方案4：SVG stroke描边光带 =====
       两条SVG光线，一快一慢，同时在边框上流动
    */
    .btn-wrap {
      position: relative;
      width: 388px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 光线1：快一点，亮金色 */
    .light1 {
      fill: none;
      stroke: rgba(255,220,100,0.9);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 60 900;
      stroke-dashoffset: 0;
      filter: drop-shadow(0 0 8px rgba(255,220,100,0.8));
      animation: flowFast 4s linear infinite;
    }

    /* 光线2：慢一点，暗金色，跟随 */
    .light2 {
      fill: none;
      stroke: rgba(255,200,80,0.5);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 30 930;
      stroke-dashoffset: -30;
      animation: flowSlow 5s linear infinite;
    }

    @keyframes flowFast {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -960; }
    }
    @keyframes flowSlow {
      from { stroke-dashoffset: -30; }
      to   { stroke-dashoffset: -960; }
    }

    .reveal-btn {
      background: rgba(13,13,18,0.85);
      border: 2px solid rgba(255,220,100,0.2);
      color: rgba(255,220,100,0.6);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 32px;
      padding: 20px 70px;
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 4px;
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .reveal-btn:hover {
      border-color: rgba(255,220,100,0.6);
      color: rgba(255,220,100,0.9);
    }

    .truth-section { text-align: center; opacity: 0; visibility: hidden; transform: translateY(50px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34,1.56,0.64,1), visibility 0s 0.7s; }
    .truth-section.show { opacity: 1; visibility: visible; transform: translateY(0); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34,1.56,0.64,1), visibility 0s 0s; }
    .truth-text, .truth-quote { opacity: 0; transition: opacity 0.5s ease 0.3s; }
    .truth-section.show .truth-text, .truth-section.show .truth-quote { opacity: 1; }

    .truth-arrow { font-size: 90px; margin-bottom: 20px; animation: bounce 1s ease infinite; }
    .truth-label { font-size: 24px; letter-spacing: 10px; color: var(--danger); text-transform: uppercase; font-weight: 700; margin-bottom: 28px; }
    .truth-text { font-size: 96px; font-weight: 900; color: var(--text); line-height: 1.15; margin-bottom: 36px; }
    .truth-quote { font-size: 36px; color: var(--text-dim); font-style: italic; line-height: 1.6; }

    .main > * { opacity: 0; animation: fadeUp 0.7s ease forwards; }
    .icon { animation-delay: 0.5s; }
    .surface-text { animation-delay: 0.8s; }
    .divider { animation-delay: 1.1s; }
    .btn-wrap { animation-delay: 1.4s; opacity: 0; animation: fadeUp 0.7s ease forwards 1.4s; }

    .retract-btn {
      background: transparent; border: 2px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.25);
      font-family: "Noto Sans SC", sans-serif; font-size: 28px; padding: 16px 60px; border-radius: 60px;
      cursor: pointer; letter-spacing: 4px; transition: all 0.3s ease;
    }
    .retract-btn:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.5); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  </style>
</head>
<body>

  <div class="tag">开会现场</div>

  <div class="main">
    <div class="icon">📋</div>
    <div class="surface-text">我简单补充两句</div>
    <div class="divider"></div>

    <div class="btn-wrap">
      <svg class="btn-svg" viewBox="0 0 388 96" preserveAspectRatio="none">
        <rect class="light2" x="2" y="2" width="384" height="92" rx="46" ry="46" />
        <rect class="light1" x="2" y="2" width="384" height="92" rx="46" ry="46" />
      </svg>
      <button class="reveal-btn" id="revealBtn" onclick="reveal()">↓ 揭示真相</button>
    </div>

    <div class="truth-section" id="truth">
      <div class="truth-arrow">👇</div>
      <div class="truth-label">打工人翻译</div>
      <div class="truth-text">至少再讲半小时<br>没个结束</div>
      <div class="truth-quote">"补充两句，PPT翻十页；<br>说散就散，那是别人的会。"</div>
    </div>
    <div id="retractWrap" style="display:none; margin-top: 24px;">
      <button class="retract-btn" onclick="retract()">↑ 收回真相</button>
    </div>
  </div>

  <script>
    function reveal() {
      document.getElementById('truth').classList.add('show');
      document.getElementById('revealBtn').style.display = 'none';
      document.getElementById('retractWrap').style.display = 'block';
    }
    function retract() {
      document.getElementById('truth').classList.remove('show');
      document.getElementById('revealBtn').style.display = 'block';
      document.getElementById('retractWrap').style.display = 'none';
    }
  </script>

</body>
</html>
