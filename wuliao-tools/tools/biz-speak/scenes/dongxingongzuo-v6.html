<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>弹性工作制</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0f0d;
    --gold:#4caf50;
    --red:#ff5722;
    --text-dim:rgba(255,255,255,0.5);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { display:flex; flex-direction:column; height:100vh; height:100dvh; background:var(--bg); color:#fff; font-family:'Noto Sans SC',sans-serif; }
  .top { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 28px; }
  .tag { font-size:11px; letter-spacing:3px; color:var(--gold); border:1px solid rgba(76,175,80,0.3); padding:5px 16px; border-radius:50px; margin-bottom:28px; }
  .word { font-family:'Noto Serif SC',serif; font-size:76px; font-weight:900; text-align:center; line-height:1.0; letter-spacing:3px; }
  .sub { font-size:26px; color:var(--text-dim); margin-top:14px; }
  .divider { width:100%; height:3px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:0.35; }
  .bottom { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 28px 44px; }
  .truth-label { font-size:28px; font-weight:700; color:var(--red); display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .truth { font-size:38px; font-weight:700; text-align:center; line-height:1.45; }
  .quote { font-size:17px; color:var(--text-dim); font-style:italic; text-align:center; line-height:1.8; margin-top:18px; }
</style>
</head>
<body>
  <div class="top">
    <div class="tag">绩效</div>
    <div class="word">弹性工作制</div>
    <div class="sub">早上晚来会儿就行</div>
  </div>
  <div class="divider"></div>
  <div class="bottom">
    <div class="truth-label">💬 潜台词</div>
    <div class="truth">白天摸鱼<br>晚上随时待命<br>加班费没有</div>
    <div class="quote">"弹性是给你的自由，不弹性是我的自由。"</div>
  </div>
</body>
</html>
