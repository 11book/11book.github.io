<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>既然大家都这么说 - 职场潜台词</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #DC2626, #EF4444);
        }
        .tag {
            display: inline-block;
            background: #DC2626;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .main-title {
            font-size: 32px;
            font-weight: 800;
            color: #1a1a2e;
            line-height: 1.3;
            margin-bottom: 12px;
        }
        .subtitle {
            font-size: 16px;
            color: #888;
            margin-bottom: 32px;
            font-weight: 400;
        }
        .quote-box {
            background: #FEF2F2;
            border-left: 4px solid #DC2626;
            border-radius: 0 12px 12px 0;
            padding: 20px 24px;
            margin-bottom: 24px;
        }
        .quote-text {
            font-size: 18px;
            font-weight: 600;
            color: #DC2626;
            line-height: 1.6;
        }
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e5e7eb, transparent);
            margin: 24px 0;
        }
        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .subtext {
            font-size: 15px;
            color: #666;
            line-height: 2;
            font-weight: 400;
        }
        .subtext span {
            display: inline;
            color: #999;
        }
        .subtext-item {
            margin-bottom: 6px;
        }
        .card-footer {
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #bbb;
            font-size: 13px;
        }
        .法则-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #FEF2F2;
            color: #DC2626;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tag">顺势下台</div>
        <h1 class="main-title">既然大家都这么说</h1>
        <p class="subtitle">那我就再考虑考虑</p>
        
        <div class="quote-box">
            <p class="quote-text">给台阶就下的人，不是怂，是懂体面。</p>
        </div>
        
        <div class="divider"></div>
        
        <p class="section-label">潜台词</p>
        <p class="subtext">本来就想让步 / 刚好借大家的话下台 / 还显得是听了意见</p>
        
        <div class="card-footer">
            <span class="法则-badge">法则</span>
            <span>职场潜台词图解</span>
        </div>
    </div>
</body>
</html>
