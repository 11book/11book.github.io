<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大家畅所欲言</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d12;
      --text: #e8e4dc;
      --text-dim: #7a7a8a;
      --primary: #c9a84c;
      --danger: #e85454;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0;
      position: relative;
    }

    /* 全屏背景微光 */
    body::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 60%;
      background: radial-gradient(ellipse at center, rgba(201,168,76,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ========== 顶部：词语区 ========== */
    .top-section {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 60px 48px 40px;
      gap: 20px;
    }

    /* 分类标签 */
    .category-tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.25);
      padding: 6px 20px;
      border-radius: 50px;
    }

    /* 词语大字 */
    .word-text {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(56px, 14vw, 96px);
      font-weight: 900;
      text-align: center;
      line-height: 1.1;
      color: var(--text);
      letter-spacing: 2px;
    }

    /* 副标题 */
    .word-sub {
      font-size: clamp(18px, 4vw, 28px);
      font-weight: 400;
      color: var(--text-dim);
      text-align: center;
      margin-top: 8px;
    }

    /* ========== 中间：分隔 ========== */
    .divider {
      flex: 0 0 auto;
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin: 0 auto;
    }

    /* ========== 底部：真相区 ========== */
    .bottom-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 48px 80px;
      gap: 16px;
    }

    /* 真相标签 */
    .truth-label {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--danger);
      font-weight: 700;
    }

    /* 真相文字 */
    .truth-text {
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 700;
      text-align: center;
      line-height: 1.5;
      color: var(--text);
    }

    /* 真相语录 */
    .truth-quote {
      font-size: clamp(14px, 3.5vw, 18px);
      color: var(--text-dim);
      font-style: italic;
      text-align: center;
      line-height: 1.8;
      margin-top: 8px;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <div class="top-section">
    <div class="category-tag">开会现场</div>
    <div class="word-text">大家畅所欲言</div>
    <div class="word-sub">有意见尽管提</div>
  </div>

  <div class="divider"></div>

  <div class="bottom-section">
    <div class="truth-label">打工人翻译</div>
    <div class="truth-text">
      走个过场<br>
      看看谁站错队<br>
      敢唱反调
    </div>
    <div class="truth-quote">"会上让你提,是给你面子;<br>真提了,是你不识相。"</div>
  </div>

</body>
</html>
