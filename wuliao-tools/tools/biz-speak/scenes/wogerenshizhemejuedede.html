<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我个人是这么觉得的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Background decorations */
    body::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      opacity: 0.15;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      opacity: 0.1;
    }

    /* theme-1: 深红 + 藏青 */
    .theme-1 { background: linear-gradient(135deg, #1a0a0a 0%, #0d1b2a 100%); }
    .theme-1 body::before { background: #e63946; }
    .theme-1 body::after { background: #e63946; }
    .theme-1 .card { border-color: rgba(230, 57, 70, 0.3); }
    .theme-1 .tag { background: rgba(230, 57, 70, 0.2); color: #e63946; }
    .theme-1 .subtitle { color: rgba(255,255,255,0.6); }
    .theme-1 .quote { color: #e63946; border-color: rgba(230, 57, 70, 0.3); }
    .theme-1 .quote-icon { color: #e63946; }
    .theme-1 .subtext { color: rgba(255,255,255,0.5); }
    .theme-1 .main-title { color: #ffffff; }

    /* theme-2: 深紫 + 粉 */
    .theme-2 { background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 100%); }
    .theme-2 body::before { background: #f72585; }
    .theme-2 body::after { background: #f72585; }
    .theme-2 .card { border-color: rgba(247, 37, 133, 0.3); }
    .theme-2 .tag { background: rgba(247, 37, 133, 0.2); color: #f72585; }
    .theme-2 .subtitle { color: rgba(255,255,255,0.6); }
    .theme-2 .quote { color: #f72585; border-color: rgba(247, 37, 133, 0.3); }
    .theme-2 .quote-icon { color: #f72585; }
    .theme-2 .subtext { color: rgba(255,255,255,0.5); }
    .theme-2 .main-title { color: #ffffff; }

    /* theme-3: 深蓝 + 青 */
    .theme-3 { background: linear-gradient(135deg, #0a0f1a 0%, #0d2137 100%); }
    .theme-3 body::before { background: #00b4d8; }
    .theme-3 body::after { background: #00b4d8; }
    .theme-3 .card { border-color: rgba(0, 180, 216, 0.3); }
    .theme-3 .tag { background: rgba(0, 180, 216, 0.2); color: #00b4d8; }
    .theme-3 .subtitle { color: rgba(255,255,255,0.6); }
    .theme-3 .quote { color: #00b4d8; border-color: rgba(0, 180, 216, 0.3); }
    .theme-3 .quote-icon { color: #00b4d8; }
    .theme-3 .subtext { color: rgba(255,255,255,0.5); }
    .theme-3 .main-title { color: #ffffff; }

    /* theme-4: 深绿 + 浅绿 */
    .theme-4 { background: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 100%); }
    .theme-4 body::before { background: #52b788; }
    .theme-4 body::after { background: #52b788; }
    .theme-4 .card { border-color: rgba(82, 183, 136, 0.3); }
    .theme-4 .tag { background: rgba(82, 183, 136, 0.2); color: #52b788; }
    .theme-4 .subtitle { color: rgba(255,255,255,0.6); }
    .theme-4 .quote { color: #52b788; border-color: rgba(82, 183, 136, 0.3); }
    .theme-4 .quote-icon { color: #52b788; }
    .theme-4 .subtext { color: rgba(255,255,255,0.5); }
    .theme-4 .main-title { color: #ffffff; }

    /* theme-5: 深橙 + 金 */
    .theme-5 { background: linear-gradient(135deg, #1a0f00 0%, #2e1a00 100%); }
    .theme-5 body::before { background: #fb8500; }
    .theme-5 body::after { background: #fb8500; }
    .theme-5 .card { border-color: rgba(251, 133, 0, 0.3); }
    .theme-5 .tag { background: rgba(251, 133, 0, 0.2); color: #fb8500; }
    .theme-5 .subtitle { color: rgba(255,255,255,0.6); }
    .theme-5 .quote { color: #fb8500; border-color: rgba(251, 133, 0, 0.3); }
    .theme-5 .quote-icon { color: #fb8500; }
    .theme-5 .subtext { color: rgba(255,255,255,0.5); }
    .theme-5 .main-title { color: #ffffff; }

    /* theme-6: 深粉 + 玫红 */
    .theme-6 { background: linear-gradient(135deg, #1a0510 0%, #2e0a1a 100%); }
    .theme-6 body::before { background: #ff5c8a; }
    .theme-6 body::after { background: #ff5c8a; }
    .theme-6 .card { border-color: rgba(255, 92, 138, 0.3); }
    .theme-6 .tag { background: rgba(255, 92, 138, 0.2); color: #ff5c8a; }
    .theme-6 .subtitle { color: rgba(255,255,255,0.6); }
    .theme-6 .quote { color: #ff5c8a; border-color: rgba(255, 92, 138, 0.3); }
    .theme-6 .quote-icon { color: #ff5c8a; }
    .theme-6 .subtext { color: rgba(255,255,255,0.5); }
    .theme-6 .main-title { color: #ffffff; }

    /* theme-7: 深靛 + 紫 */
    .theme-7 { background: linear-gradient(135deg, #0d0a1a 0%, #1a0d2e 100%); }
    .theme-7 body::before { background: #9d4edd; }
    .theme-7 body::after { background: #9d4edd; }
    .theme-7 .card { border-color: rgba(157, 78, 221, 0.3); }
    .theme-7 .tag { background: rgba(157, 78, 221, 0.2); color: #9d4edd; }
    .theme-7 .subtitle { color: rgba(255,255,255,0.6); }
    .theme-7 .quote { color: #9d4edd; border-color: rgba(157, 78, 221, 0.3); }
    .theme-7 .quote-icon { color: #9d4edd; }
    .theme-7 .subtext { color: rgba(255,255,255,0.5); }
    .theme-7 .main-title { color: #ffffff; }

    .card {
      border: 1px solid;
      border-radius: 24px;
      padding: 60px 50px;
      max-width: 720px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .main-title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 20px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }

    .subtitle {
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 40px;
    }

    .divider {
      width: 60px;
      height: 3px;
      margin: 0 auto 40px;
      border-radius: 2px;
      opacity: 0.4;
    }
    .theme-1 .divider { background: #e63946; }
    .theme-2 .divider { background: #f72585; }
    .theme-3 .divider { background: #00b4d8; }
    .theme-4 .divider { background: #52b788; }
    .theme-5 .divider { background: #fb8500; }
    .theme-6 .divider { background: #ff5c8a; }
    .theme-7 .divider { background: #9d4edd; }

    .quote-box {
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 30px 36px;
      margin-bottom: 36px;
      position: relative;
    }

    .quote-icon {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
      opacity: 0.7;
    }

    .quote {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.5;
    }

    .subtext {
      font-size: 15px;
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 40px;
      font-size: 13px;
      opacity: 0.3;
      letter-spacing: 3px;
    }
  </style>
</head>
<body class="theme-1">
  <div class="card">
    <div class="tag">沟通分寸</div>
    <h1 class="main-title">我个人是这么觉得的</h1>
    <p class="subtitle">仅供参考，你们自己定</p>
    <div class="divider"></div>
    <div class="quote-box">
      <div class="quote-icon">❝</div>
      <p class="quote">话说七分满，留着三分好甩锅。</p>
    </div>
    <p class="subtext">话我说到了 / 出事别赖我 / 你们自己决策自己担</p>
    <div class="footer-note">BUSINESS SPEAK · 职场黑话解读</div>
  </div>
</body>
</html>
