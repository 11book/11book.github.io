<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>我简单补充两句</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d12;
      --text: #e8e4dc;
      --text-dim: #7a7a8a;
      --primary: #c9a84c;
      --danger: #e85454;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 顶部标签 - 固定定位，居中，往下移 */
    .tag {
      position: fixed;
      top: 100px;
      left: 0;
      right: 0;
      width: fit-content;
      max-width: 90%;
      margin: 0 auto;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--primary);
      border: 2px solid rgba(201,168,76,0.4);
      padding: 12px 40px;
      border-radius: 60px;
      background: rgba(201,168,76,0.06);
      white-space: nowrap;
      z-index: 10;
    }

    /* 主内容 - 撑满全屏，垂直居中 */
    .main {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 36px;
      gap: 0;
    }

    .icon {
      font-size: 180px;
      line-height: 1;
      margin-bottom: 48px;
    }

    .surface-text {
      font-family: "Noto Serif SC", serif;
      font-size: 130px;
      font-weight: 900;
      text-align: center;
      line-height: 1.05;
      color: var(--text);
      letter-spacing: 4px;
      width: 100%;
    }

    .divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin: 40px 0;
    }

    /* 按钮 wrapper：套渐变边框 */
    .btn-wrap {
      position: relative;
      border-radius: 66px;
      padding: 3px;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(201,168,76,0.4) 60deg,
        rgba(201,168,76,1) 120deg,
        rgba(201,168,76,0.6) 180deg,
        rgba(201,168,76,0.4) 240deg,
        transparent 360deg
      );
      animation: borderSpin 3s linear infinite;
    }

    .reveal-btn {
      background: var(--bg);
      border: none;
      color: var(--text-dim);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 32px;
      padding: 20px 70px;
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 4px;
      transition: color 0.3s ease;
      display: block;
      width: 100%;
    }

    .btn-wrap:hover .reveal-btn {
      color: var(--primary);
    }

    @keyframes borderSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .reveal-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* 真相区 */
    .truth-section {
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(50px);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0.7s;
    }

    .truth-section.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0s;
    }

    .truth-arrow {
      font-size: 90px;
      margin-bottom: 20px;
      animation: bounce 1s ease infinite;
    }

    .truth-label {
      font-size: 24px;
      letter-spacing: 10px;
      color: var(--danger);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .truth-text {
      font-size: 96px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 36px;
    }

    .truth-quote {
      font-size: 36px;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.6;
    }

    /* 入场动画 */
    .main > * {
      opacity: 0;
      animation: fadeUp 0.7s ease forwards;
    }
    .icon { animation-delay: 0.5s; }
    .surface-text { animation-delay: 0.8s; }
    .divider { animation-delay: 1.1s; }
    .reveal-btn { animation-delay: 1.4s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }
  </style>
</head>
<body>

  <div class="tag">开会现场</div>

  <div class="main">
    <div class="icon">📋</div>
    <div class="surface-text">我简单补充两句</div>
    <div class="divider"></div>
    <div class="btn-wrap">
      <button class="reveal-btn" onclick="reveal()">↓ 揭示真相</button>
    </div>
    <div class="truth-section" id="truth">
      <div class="truth-arrow">👇</div>
      <div class="truth-label">打工人翻译</div>
      <div class="truth-text">至少再讲半小时<br>没个结束</div>
      <div class="truth-quote">"补充两句，PPT翻十页；<br>说散就散，那是别人的会。"</div>
    </div>
  </div>

  <script>
    function reveal() {
      document.getElementById('truth').classList.add('show');
      document.querySelector('.reveal-btn').classList.add('hidden');
      let wrap = document.querySelector('.btn-wrap');
      wrap.style.transition = 'opacity 0.4s ease';
      wrap.style.opacity = '0';
      setTimeout(() => wrap.style.display = 'none', 400);
    }
  </script>

</body>
</html>
