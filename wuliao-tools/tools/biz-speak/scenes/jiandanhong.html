<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>我简单补充两句</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0d12;
      --text: #e8e4dc;
      --text-dim: #7a7a8a;
      --primary: #c9a84c;
      --danger: #e85454;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .tag {
      position: fixed; top: 100px; left: 0; right: 0; width: fit-content; max-width: 90%; margin: 0 auto;
      font-size: 26px; font-weight: 700; letter-spacing: 8px; text-transform: uppercase; color: var(--primary);
      border: 2px solid rgba(201,168,76,0.4); padding: 12px 40px; border-radius: 60px;
      background: rgba(201,168,76,0.06); white-space: nowrap; z-index: 10;
    }

    .main { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 36px; }
    .icon { font-size: 180px; line-height: 1; margin-bottom: 48px; }
    .surface-text { font-family: "Noto Serif SC", serif; font-size: 130px; font-weight: 900; text-align: center; line-height: 1.05; color: var(--text); letter-spacing: 4px; width: 100%; }
    .divider { width: 120px; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); margin: 40px 0; }

    /* ===== 方案3：box-shadow多层光晕 =====
       5层同心阴影，依次延迟0.4s，缓慢呼吸脉动，5秒一周期
    */
    .btn-wrap { position: relative; display: inline-block; }

    .btn-glow {
      position: absolute;
      inset: -6px;
      border-radius: 66px;
      border: 2px solid transparent;
      pointer-events: none;
    }

    .btn-glow:nth-child(1) { animation: glowPulse 5s ease-in-out infinite; border-color: rgba(255,220,100,0.9); inset: -4px; }
    .btn-glow:nth-child(2) { animation: glowPulse 5s ease-in-out infinite 0.4s; border-color: rgba(255,220,100,0.7); }
    .btn-glow:nth-child(3) { animation: glowPulse 5s ease-in-out infinite 0.8s; border-color: rgba(255,220,100,0.5); }
    .btn-glow:nth-child(4) { animation: glowPulse 5s ease-in-out infinite 1.2s; border-color: rgba(255,220,100,0.3); }
    .btn-glow:nth-child(5) { animation: glowPulse 5s ease-in-out infinite 1.6s; border-color: rgba(255,220,100,0.15); }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .reveal-btn {
      background: rgba(13,13,18,0.85);
      border: 2px solid rgba(255,220,100,0.35);
      color: rgba(255,220,100,0.7);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 32px;
      padding: 20px 70px;
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 4px;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .reveal-btn:hover {
      border-color: rgba(255,220,100,0.8);
      color: rgba(255,220,100,1);
      box-shadow: 0 0 30px rgba(255,220,100,0.3);
    }

    .reveal-btn.hidden {
      border-color: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.15);
      pointer-events: none;
    }

    .truth-section { text-align: center; opacity: 0; visibility: hidden; transform: translateY(50px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34,1.56,0.64,1), visibility 0s 0.7s; }
    .truth-section.show { opacity: 1; visibility: visible; transform: translateY(0); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34,1.56,0.64,1), visibility 0s 0s; }
    .truth-text, .truth-quote { opacity: 0; transition: opacity 0.5s ease 0.3s; }
    .truth-section.show .truth-text, .truth-section.show .truth-quote { opacity: 1; }

    .truth-arrow { font-size: 90px; margin-bottom: 20px; animation: bounce 1s ease infinite; }
    .truth-label { font-size: 24px; letter-spacing: 10px; color: var(--danger); text-transform: uppercase; font-weight: 700; margin-bottom: 28px; }
    .truth-text { font-size: 96px; font-weight: 900; color: var(--text); line-height: 1.15; margin-bottom: 36px; }
    .truth-quote { font-size: 36px; color: var(--text-dim); font-style: italic; line-height: 1.6; }

    .main > * { opacity: 0; animation: fadeUp 0.7s ease forwards; }
    .icon { animation-delay: 0.5s; }
    .surface-text { animation-delay: 0.8s; }
    .divider { animation-delay: 1.1s; }
    .btn-wrap { animation-delay: 1.4s; opacity: 0; animation: fadeUp 0.7s ease forwards 1.4s; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  </style>
</head>
<body>

  <div class="tag">开会现场</div>

  <div class="main">
    <div class="icon">📋</div>
    <div class="surface-text">我简单补充两句</div>
    <div class="divider"></div>

    <div class="btn-wrap">
      <div class="btn-glow"></div>
      <div class="btn-glow"></div>
      <div class="btn-glow"></div>
      <div class="btn-glow"></div>
      <div class="btn-glow"></div>
      <button class="reveal-btn" onclick="reveal()">↓ 揭示真相</button>
    </div>

    <div class="truth-section" id="truth">
      <div class="truth-arrow">👇</div>
      <div class="truth-label">打工人翻译</div>
      <div class="truth-text">至少再讲半小时<br>没个结束</div>
      <div class="truth-quote">"补充两句，PPT翻十页；<br>说散就散，那是别人的会。"</div>
    </div>
  </div>

  <script>
    function reveal() {
      document.getElementById('truth').classList.add('show');
      document.querySelector('.reveal-btn').classList.add('hidden');
    }
  </script>

</body>
</html>
