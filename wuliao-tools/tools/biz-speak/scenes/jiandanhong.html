<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我简单补充两句</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* theme-1 开会现场：深蓝+金色 */
    :root {
      --bg: #0d0d12;
      --border: #2a2a3a;
      --text: #e8e4dc;
      --text-dim: #7a7a8a;
      --primary: #c9a84c;
      --primary-glow: rgba(201,168,76,0.15);
      --danger: #e85454;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 70%;
      background: radial-gradient(ellipse at center, rgba(201,168,76,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .category-tag {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.25);
      padding: 5px 16px;
      border-radius: 50px;
    }

    .main-card {
      width: 100%;
      max-width: 400px;
      padding: 0 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards 0.3s;
    }

    .surface-text {
      font-family: "Noto Serif SC", serif;
      font-size: 30px;
      font-weight: 900;
      text-align: center;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 36px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards 0.6s;
      letter-spacing: 1px;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 1.0s;
    }

    .reveal-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 13px;
      padding: 10px 28px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 1.3s;
    }

    .reveal-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .reveal-btn.hidden { display: none; }

    .truth-section {
      width: 100%;
      text-align: center;
      display: none;
    }

    .truth-section.show {
      display: block;
      animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .arrow-icon {
      font-size: 28px;
      margin-bottom: 16px;
      animation: bounce 1s ease infinite;
    }

    .truth-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--danger);
      text-transform: uppercase;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .truth-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .truth-quote {
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.8;
      margin-bottom: 24px;
      opacity: 0.85;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <div class="category-tag">开会现场</div>

  <div class="main-card">

    <div class="icon">📋</div>

    <div class="surface-text">我简单补充两句</div>

    <div class="divider"></div>

    <button class="reveal-btn" onclick="reveal()">↓ 揭示真相</button>

    <div class="truth-section" id="truth">
      <div class="arrow-icon">👇</div>
      <div class="truth-label">打工人翻译</div>
      <div class="truth-text">
        至少再讲半小时<br>没个结束
      </div>
      <div class="truth-quote">"补充两句，PPT翻十页；<br>说散就散，那是别人的会。"</div>
    </div>

  </div>

  <script>
    function reveal() {
      document.getElementById('truth').classList.add('show');
      document.querySelector('.reveal-btn').classList.add('hidden');
    }
  </script>

</body>
</html>
