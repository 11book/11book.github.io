<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>我简单补充两句</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d12;
      --border: #2a2a3a;
      --text: #e8e4dc;
      --text-dim: #7a7a8a;
      --primary: #c9a84c;
      --primary-glow: rgba(201,168,76,0.15);
      --danger: #e85454;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    /* 填满整屏的主容器 */
    .container {
      width: 100%;
      padding: 0 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    /* 顶部标签 - 小而精致 */
    .category-tag {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.3);
      padding: 6px 20px;
      border-radius: 50px;
      white-space: nowrap;
    }

    /* 图标 */
    .icon {
      font-size: 88px;
      line-height: 1;
      margin-bottom: 32px;
    }

    /* 表面说法 - 大字撑满 */
    .surface-text {
      font-family: "Noto Serif SC", serif;
      font-size: 56px;
      font-weight: 900;
      text-align: center;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: 36px;
      letter-spacing: 2px;
      /* 确保撑满宽度 */
      width: 100%;
    }

    /* 分隔线 */
    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin-bottom: 36px;
    }

    /* 揭示按钮 */
    .reveal-btn {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text-dim);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 20px;
      padding: 14px 48px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 3px;
    }

    .reveal-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 30px var(--primary-glow);
    }

    .reveal-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* 真相区 */
    .truth-section {
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(40px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0.6s;
    }

    .truth-section.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0s;
    }

    .arrow-icon {
      font-size: 52px;
      margin-bottom: 20px;
      animation: bounce 1s ease infinite;
    }

    .truth-label {
      font-size: 16px;
      letter-spacing: 6px;
      color: var(--danger);
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .truth-text {
      font-size: 44px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.45;
      margin-bottom: 24px;
    }

    .truth-quote {
      font-size: 22px;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.7;
    }

    /* 入场动画 */
    .container > * {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s ease forwards;
    }
    .category-tag { animation-delay: 0.2s; }
    .icon { animation-delay: 0.5s; }
    .surface-text { animation-delay: 0.8s; }
    .divider { animation-delay: 1.1s; }
    .reveal-btn { animation-delay: 1.4s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="category-tag">开会现场</div>

  <div class="container">
    <div class="icon">📋</div>
    <div class="surface-text">我简单补充两句</div>
    <div class="divider"></div>
    <button class="reveal-btn" onclick="reveal()">↓ 揭示真相</button>
    <div class="truth-section" id="truth">
      <div class="arrow-icon">👇</div>
      <div class="truth-label">打工人翻译</div>
      <div class="truth-text">至少再讲半小时<br>没个结束</div>
      <div class="truth-quote">"补充两句，PPT翻十页；<br>说散就散，那是别人的会。"</div>
    </div>
  </div>

  <script>
    function reveal() {
      document.getElementById('truth').classList.add('show');
      document.querySelector('.reveal-btn').classList.add('hidden');
    }
  </script>

</body>
</html>
