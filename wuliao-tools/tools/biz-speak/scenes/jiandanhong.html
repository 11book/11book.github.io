<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>我简单补充两句</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d12;
      --text: #e8e4dc;
      --text-dim: #7a7a8a;
      --primary: #c9a84c;
      --danger: #e85454;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== 顶部标签 ===== */
    .tag {
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      width: fit-content;
      max-width: 90%;
      margin: 0 auto;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--primary);
      border: 2px solid rgba(201,168,76,0.4);
      padding: 14px 44px;
      border-radius: 60px;
      background: rgba(201,168,76,0.06);
      white-space: nowrap;
      z-index: 10;
    }

    /* ===== 主内容区 ===== */
    .main {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 120px 40px 0;
    }

    /* 每个元素的入场：opacity + 轻微Y偏移，结束时归位 */
    @keyframes enter {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 160px;
      line-height: 1;
      margin-bottom: 28px;
      animation: enter 0.7s ease forwards;
      animation-delay: 0.5s;
      opacity: 0;
    }

    .surface-text {
      font-family: "Noto Serif SC", serif;
      font-size: 112px;
      font-weight: 900;
      text-align: center;
      line-height: 1.08;
      color: var(--text);
      letter-spacing: 3px;
      width: 100%;
      animation: enter 0.7s ease forwards;
      animation-delay: 0.8s;
      opacity: 0;
    }

    .divider {
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin: 32px 0;
      animation: enterOpacity 0.7s ease forwards;
      animation-delay: 1.1s;
      opacity: 0;
    }

    .reveal-btn {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.15);
      color: var(--text-dim);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 30px;
      padding: 18px 64px;
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 4px;
      transition: all 0.3s ease;
      animation: enter 0.7s ease forwards;
      animation-delay: 1.4s;
      opacity: 0;
    }

    .reveal-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 40px rgba(201,168,76,0.2);
    }

    .reveal-btn.hidden {
      opacity: 0 !important;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* ===== 真相区 ===== */
    .truth-section {
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(50px);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0.7s;
    }

    .truth-section.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s 0s;
    }

    .truth-arrow {
      font-size: 80px;
      margin-bottom: 16px;
      animation: bounce 1s ease infinite;
    }

    .truth-label {
      font-size: 22px;
      letter-spacing: 10px;
      color: var(--danger);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .truth-text {
      font-size: 84px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 32px;
    }

    .truth-quote {
      font-size: 30px;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.6;
    }

    /* ===== 底部氛围区 ===== */
    .hint-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 40px;
    }

    .hint-text {
      font-size: 20px;
      color: var(--text-dim);
      letter-spacing: 2px;
      animation: enterOpacity 1s ease forwards;
      animation-delay: 2.5s;
      opacity: 0;
    }

    .hint-dots {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      animation: enterOpacity 1s ease forwards;
      animation-delay: 2.8s;
      opacity: 0;
    }

    .hint-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0.3;
      animation: pulse 1.5s ease infinite;
    }
    .hint-dots span:nth-child(2) { animation-delay: 0.2s; }
    .hint-dots span:nth-child(3) { animation-delay: 0.4s; }

    .hint-area.hidden {
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    /* 动画 */
    @keyframes enter {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes enterOpacity {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.3); }
    }
  </style>
</head>
<body>

  <div class="tag">开会现场</div>

  <div class="main">
    <div class="icon">📋</div>
    <div class="surface-text">我简单补充两句</div>
    <div class="divider"></div>
    <button class="reveal-btn" onclick="reveal()">↓ 揭示真相</button>
    <div class="truth-section" id="truth">
      <div class="truth-arrow">👇</div>
      <div class="truth-label">打工人翻译</div>
      <div class="truth-text">至少再讲半小时<br>没个结束</div>
      <div class="truth-quote">"补充两句，PPT翻十页；<br>说散就散，那是别人的会。"</div>
    </div>
  </div>

  <div class="hint-area" id="hint">
    <div class="hint-text">点击按钮，揭示真相</div>
    <div class="hint-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script>
    function reveal() {
      document.getElementById('truth').classList.add('show');
      document.querySelector('.reveal-btn').classList.add('hidden');
      document.getElementById('hint').classList.add('hidden');
    }
  </script>

</body>
</html>
