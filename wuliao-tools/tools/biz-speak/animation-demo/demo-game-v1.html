<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心灵疗愈 · 游戏版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#0a0a0e;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overflow:hidden;
    font-family:"Noto Sans SC",sans-serif;
    color:#f0ece4;
    user-select:none;
  }

  /* ===== 游戏顶部HUD ===== */
  .hud {
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 20px;
    background:rgba(255,255,255,0.03);
    border-bottom:1px solid rgba(212,168,67,0.2);
    position:relative; z-index:10;
  }
  .hud-title {
    font-family:'Noto Serif SC'; font-size:22px; font-weight:900;
    color:#d4a843; letter-spacing:3px;
    text-shadow:0 0 20px rgba(212,168,67,0.5);
  }
  .hud-tag {
    font-size:10px; color:#d4a843; letter-spacing:2px;
    border:1px solid rgba(212,168,67,0.3);
    padding:3px 10px; border-radius:20px;
    opacity:0.8;
  }
  .hud-time {
    font-size:13px; color:#8a8a9a; letter-spacing:1px;
  }

  /* ===== 场景舞台 ===== */
  .stage {
    flex:1; position:relative; overflow:hidden;
    background:linear-gradient(180deg, #0d0d18 0%, #0a0a0e 60%, #0d0d14 100%);
  }

  /* 舞台背景装饰 */
  .stage::before {
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212,168,67,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 30% 30% at 80% 80%, rgba(232,84,84,0.04) 0%, transparent 60%);
    pointer-events:none;
  }

  /* 地面线 */
  .ground {
    position:absolute; bottom:70px; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(212,168,67,0.3), transparent);
  }
  .ground-label {
    position:absolute; bottom:74px; left:50%; transform:translateX(-50%);
    font-size:10px; color:rgba(212,168,67,0.3); letter-spacing:3px;
  }

  /* 角色通用 */
  .char {
    position:absolute; bottom:71px;
    overflow:hidden;
    image-rendering:-webkit-optimize-contrast;
    image-rendering:pixelated;
  }

  /* Boss */
  .boss {
    right:80px; width:140px; height:140px;
    overflow:visible;
  }
  .boss-sprite {
    width:140px; height:140px;
    background-image:url('boss-sprite.png');
    background-size:560px 140px;
    background-repeat:no-repeat;
    background-position:0 0;
    /* 4帧steps动画 */
    animation: bossAnim 1.6s steps(4) infinite;
  }

  /* Boss位移动画 */
  .boss-appear  { animation: bossAppear 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
  .boss-speaking { animation: bossAnim 2s steps(4) infinite; }
  .boss-running  { animation: bossAnim 0.8s steps(4) infinite, bossSlide 0.5s ease forwards; }
  .boss-thumbsup { animation: bossAnim 2s steps(4) infinite; }

  /* Dog */
  .dog {
    left:80px; width:120px; height:120px;
  }
  .dog-sprite {
    width:120px; height:120px;
    background-image:url('dog-sprite.png');
    background-size:480px 120px;
    background-repeat:no-repeat;
    background-position:0 0;
    animation: dogAnim 1.6s steps(4) infinite;
  }
  .dog-idle     { animation: dogAnim 2s steps(4) infinite; }
  .dog-running  { animation: dogAnim 0.8s steps(4) infinite, dogShake 0.4s ease-in-out infinite; }
  .dog-collapse { animation: dogAnim 2s steps(4) infinite, dogTumble 0.6s ease-in-out infinite; }

  /* 角色阴影 */
  .char-shadow {
    position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
    width:60%; height:8px;
    background:radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%);
    border-radius:50%;
  }

  /* ===== 气泡 ===== */
  .bubble {
    position:absolute;
    background:rgba(255,255,255,0.97);
    border-radius:14px;
    padding:10px 16px;
    font-size:16px; font-weight:700; color:#1a1a2e;
    box-shadow:0 4px 24px rgba(0,0,0,0.4), 0 0 0 2px rgba(212,168,67,0.2);
    opacity:0; transform:scale(0.7) translateY(10px);
    transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    z-index:20; white-space:nowrap;
    max-width:200px; text-align:center;
  }
  .bubble.show { opacity:1; transform:scale(1) translateY(0); }
  .bubble::after {
    content:''; position:absolute;
    bottom:-9px; left:24px;
    border:9px solid transparent;
    border-top-color:rgba(255,255,255,0.97);
    border-bottom:0;
  }
  .bubble-boss {
    top:60px; right:60px;
  }

  /* 气泡掉落动画 */
  .bubble-fall {
    animation: bubbleFall 0.5s ease-in forwards;
  }
  @keyframes bubbleFall {
    0% { transform:scale(1) translateY(0); opacity:1; }
    100% { transform:scale(0.9) translateY(20px); opacity:0; }
  }

  /* ===== 场景标签 ===== */
  .scene-tag {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:3px; color:#d4a843;
    opacity:0; transition:opacity 0.4s;
    text-transform:uppercase;
  }
  .scene-tag.show { opacity:0.6; }

  /* 潜台词面板 */
  .truth-panel {
    position:absolute; bottom:76px; left:50%; transform:translateX(-50%);
    text-align:center;
    opacity:0; transition:opacity 0.5s;
    pointer-events:none;
  }
  .truth-panel.show { opacity:1; }
  .truth-label {
    font-size:16px; font-weight:700; color:#e85454;
    margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .truth-lines { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .truth-line {
    font-size:20px; font-weight:700; color:#f0ece4;
    opacity:0; transform:translateY(6px);
    transition:all 0.3s ease;
    text-shadow:0 2px 8px rgba(0,0,0,0.8);
  }
  .truth-line.show { opacity:1; transform:translateY(0); }
  .quote {
    font-size:13px; color:#8a8a9a; font-style:italic;
    margin-top:6px; text-shadow:0 2px 8px rgba(0,0,0,0.8);
  }

  /* ===== 底部进度条 ===== */
  .timeline {
    padding:0 20px 14px;
    background:rgba(0,0,0,0.3);
  }
  .timeline-track {
    height:4px; background:rgba(255,255,255,0.08);
    border-radius:2px; overflow:hidden;
  }
  .timeline-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#d4a843,#e85454);
    border-radius:2px;
    transition:width 0.1s linear;
  }
  .timeline-dots {
    display:flex; justify-content:space-between;
    margin-top:6px; padding:0 2px;
  }
  .timeline-dot {
    font-size:10px; color:#8a8a9a; letter-spacing:0px;
    opacity:0.5; transition:all 0.3s;
  }
  .timeline-dot.active { color:#d4a843; opacity:1; }

  /* 闪光 */
  .flash {
    position:absolute; inset:0;
    background:rgba(255,220,150,0.15);
    opacity:0; pointer-events:none;
    z-index:30;
  }
  .flash.go { animation:flash 0.3s ease; }
  @keyframes flash { 0%{opacity:1} 100%{opacity:0} }

  /* ===== 关键帧 ===== */
  @keyframes bossAnim {
    from { background-position:0 0; }
    to   { background-position:-560px 0; }
  }
  @keyframes dogAnim {
    from { background-position:0 0; }
    to   { background-position:-480px 0; }
  }
  @keyframes bossAppear {
    0%  { transform:translateX(80px) scale(0.5); opacity:0; }
    100%{ transform:translateX(0) scale(1); opacity:1; }
  }
  @keyframes bossSlide {
    0%  { transform:translateX(0); }
    100%{ transform:translateX(-50px); }
  }
  @keyframes dogShake {
    0%,100%{ transform:rotate(0deg); }
    25%  { transform:rotate(-6deg) translateY(-3px); }
    75%  { transform:rotate(4deg) translateY(-1px); }
  }
  @keyframes dogTumble {
    0%  { transform:rotate(0deg) translateX(0); }
    30% { transform:rotate(-10deg) translateX(10px); }
    60% { transform:rotate(6deg) translateX(5px); }
    100%{ transform:rotate(-4deg) translateX(15px); }
  }
</style>
</head>
<body>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-title">心灵疗愈</div>
    <div class="hud-tag">职场黑话</div>
    <div class="hud-time" id="hudTime">00:00 / 20s</div>
  </div>

  <!-- 舞台 -->
  <div class="stage" id="stage">
    <div class="flash" id="flash"></div>
    <div class="scene-tag" id="sceneTag">领导登场</div>
    <div class="ground"></div>
    <div class="ground-label">— SCENE —</div>

    <!-- Boss -->
    <div class="char boss" id="boss">
      <div class="boss-sprite" id="bossSprite"></div>
      <div class="char-shadow"></div>
      <div class="bubble bubble-boss" id="bubbleBoss">大家辛苦了~</div>
    </div>

    <!-- Dog -->
    <div class="char dog" id="dog">
      <div class="dog-sprite" id="dogSprite"></div>
      <div class="char-shadow"></div>
    </div>

    <!-- 潜台词 -->
    <div class="truth-panel" id="truthPanel">
      <div class="truth-label">💬 潜台词</div>
      <div class="truth-lines">
        <div class="truth-line" id="tl1">饼先画着</div>
        <div class="truth-line" id="tl2">苦还得继续吃</div>
        <div class="truth-line" id="tl3">治愈只是传说</div>
      </div>
      <div class="quote" id="quoteText">"疗愈是假的，透支是真的。"</div>
    </div>
  </div>

  <!-- 时间线 -->
  <div class="timeline">
    <div class="timeline-track">
      <div class="timeline-fill" id="timelineFill"></div>
    </div>
    <div class="timeline-dots">
      <span class="timeline-dot active" id="dot0">登场</span>
      <span class="timeline-dot" id="dot1">说教</span>
      <span class="timeline-dot" id="dot2">跑路</span>
      <span class="timeline-dot" id="dot3">收工</span>
    </div>
  </div>

<script>
(function() {
  const TOTAL = 20000; // 20秒
  const PH = TOTAL / 4;

  const bossEl = document.getElementById('boss');
  const bossSprite = document.getElementById('bossSprite');
  const dogEl = document.getElementById('dog');
  const dogSprite = document.getElementById('dogSprite');
  const bubbleBoss = document.getElementById('bubbleBoss');
  const sceneTag = document.getElementById('sceneTag');
  const truthPanel = document.getElementById('truthPanel');
  const tl1 = document.getElementById('tl1');
  const tl2 = document.getElementById('tl2');
  const tl3 = document.getElementById('tl3');
  const quoteText = document.getElementById('quoteText');
  const timelineFill = document.getElementById('timelineFill');
  const hudTime = document.getElementById('hudTime');
  const flash = document.getElementById('flash');
  const dots = [
    document.getElementById('dot0'),
    document.getElementById('dot1'),
    document.getElementById('dot2'),
    document.getElementById('dot3')
  ];

  function reset() {
    bossEl.className = 'char boss';
    bossSprite.className = 'boss-sprite';
    dogEl.className = 'char dog';
    dogSprite.className = 'dog-sprite';
    bubbleBoss.className = 'bubble bubble-boss';
    sceneTag.className = 'scene-tag';
    truthPanel.className = 'truth-panel';
    tl1.className = 'truth-line'; tl2.className = 'truth-line'; tl3.className = 'truth-line';
    quoteText.style.opacity = '0';
    dots.forEach(d => d.classList.remove('active'));
  }

  function setTime(sec) {
    const s = Math.floor(sec);
    const displaySec = s % (TOTAL/1000);
    hudTime.textContent = `${String(Math.floor(displaySec/60)).padStart(2,'0')}:${String(displaySec%60).padStart(2,'0')} / 20s`;
  }

  function flashScreen() {
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');
  }

  let lastPhase = -1;
  let startTime = null;

  function animate(ts) {
    if (!startTime) startTime = ts;
    const cycle = (ts - startTime) % TOTAL;
    const progress = (cycle / TOTAL * 100).toFixed(1);
    timelineFill.style.width = progress + '%';
    setTime(cycle);

    reset();

    if (cycle < PH) {
      // ===== 阶段0：登场 (0-5s) =====
      const p = cycle / PH;
      bossSprite.classList.add('boss-appear');
      dogSprite.classList.add('dog-idle');
      sceneTag.textContent = p > 0.3 ? '领导登场' : '开会啦~';
      sceneTag.classList.add('show');
      if (p > 0.4) bubbleBoss.classList.add('show');
      if (p > 0.6) truthPanel.classList.add('show');
      if (p > 0.7) tl1.classList.add('show');
      dots[0].classList.add('active');

    } else if (cycle < PH * 2) {
      // ===== 阶段1：说教 (5-10s) =====
      const p = (cycle - PH) / PH;
      bossSprite.classList.add('boss-speaking');
      dogSprite.classList.add('dog-idle');
      sceneTag.textContent = '「心灵疗愈」';
      sceneTag.classList.add('show');
      bubbleBoss.classList.add('show');
      truthPanel.classList.add('show');
      if (p > 0.2) { dots[0].classList.add('active'); dots[1].classList.add('active'); }
      if (p > 0.3) tl1.classList.add('show');
      if (p > 0.5) tl2.classList.add('show');
      if (p > 0.7) tl3.classList.add('show');
      if (p > 0.75 && lastPhase !== 1) { flashScreen(); }
      lastPhase = 1;

    } else if (cycle < PH * 3) {
      // ===== 阶段2：跑路 (10-15s) =====
      const p = (cycle - PH*2) / PH;
      bossSprite.classList.add('boss-running');
      dogSprite.classList.add('dog-running');
      sceneTag.textContent = '又要加班了！';
      sceneTag.classList.add('show');
      // 气泡消失
      bubbleBoss.classList.add('bubble-fall');
      setTimeout(() => bubbleBoss.classList.remove('show'), 300);
      truthPanel.classList.add('show');
      tl1.classList.add('show'); tl2.classList.add('show'); tl3.classList.add('show');
      dots[0].classList.add('active'); dots[1].classList.add('active'); dots[2].classList.add('active');
      if (p > 0.6) { quoteText.style.opacity = '1'; }

    } else {
      // ===== 阶段3：收工 (15-20s) =====
      const p = (cycle - PH*3) / PH;
      bossSprite.classList.add('boss-thumbsup');
      dogSprite.classList.add('dog-collapse');
      sceneTag.textContent = '领导：完美收工~';
      sceneTag.classList.add('show');
      bubbleBoss.textContent = '辛苦了！';
      bubbleBoss.classList.add('show');
      truthPanel.classList.add('show');
      tl1.classList.add('show'); tl2.classList.add('show'); tl3.classList.add('show');
      quoteText.style.opacity = '1';
      dots.forEach(d => d.classList.add('active'));
      if (p > 0.85 && lastPhase !== 3) { flashScreen(); }
      lastPhase = 3;
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
