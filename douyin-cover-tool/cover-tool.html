<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抖音封面工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;color:#222;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid #e6e8eb;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:9}
header h1{font-size:17px;margin:0}
header span{color:#8a9099;font-size:12px}
.wrap{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:340px 1fr;gap:18px}
.card{background:#fff;border:1px solid #e6e8eb;border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:13px;color:#8a9099;margin:0 0 10px;font-weight:600;letter-spacing:.5px}
label{display:block;margin-bottom:12px;font-size:13px;color:#555}
label input,label textarea{width:100%;margin-top:5px;padding:9px 11px;border:1px solid #dcdfe4;border-radius:8px;font-size:14px;background:#fafbfc;font-family:inherit}
label input:focus,label textarea:focus{outline:none;border-color:#3b6ef6;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border:1px solid #dcdfe4;border-radius:999px;cursor:pointer;font-size:13px;background:#fff}
.chip.on{background:#222;border-color:#222;color:#fff}
.drop{border:2px dashed #c9ced6;border-radius:12px;padding:22px;text-align:center;color:#8a9099;cursor:pointer;background:#fafbfc}
.drop:hover,.drop.hot{border-color:#3b6ef6;color:#3b6ef6;background:#f5f8ff}
.drop img{max-width:100%;max-height:120px;border-radius:8px;margin-bottom:8px}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.t{border:2px solid #e6e8eb;border-radius:10px;overflow:hidden;cursor:pointer;background:#fff}
.t.on{border-color:#222;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.t canvas{width:100%;display:block}
.t .n{padding:7px 9px;font-size:12px;color:#555;display:flex;justify-content:space-between}
.t.on .n{color:#222;font-weight:600}
.stage{display:flex;gap:18px;flex-wrap:wrap}
.preview{background:#fff;border:1px solid #e6e8eb;border-radius:12px;padding:14px}
.preview canvas{width:270px;display:block;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.preview h4{margin:0 0 10px;font-size:12px;color:#8a9099;font-weight:600}
.btns{display:flex;flex-direction:column;gap:10px;min-width:190px}
button.big{background:#222;color:#fff;border:none;border-radius:10px;padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
button.big:hover{background:#000}
button.ghost{background:#fff;color:#333;border:1px solid #dcdfe4;border-radius:10px;padding:12px 16px;font-size:14px;cursor:pointer;font-family:inherit}
button.ghost:hover{border-color:#222}
.tips{font-size:12px;color:#8a9099;line-height:1.8}
.ok{color:#12a150}.bad{color:#e5484d}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>抖音封面工具</h1>
  <span>填名称 → 传图 → 选模板 → 导出 1080×1440 / 1080×1920</span>
</header>
<div class="wrap">
  <div>
    <div class="card">
      <h2>① 填写名称</h2>
      <label>主标题（建议 ≤8 字）
        <input id="title" placeholder="例：纸杯塔能有多高"></label>
      <label>副标题 / 钩子
        <input id="sub" placeholder="例：今天实验做到第 12 轮"></label>
      <label>角标（期数 / 地点 / 编号）
        <input id="badge" placeholder="例：实验 012"></label>
      <label>标签
        <input id="tag" placeholder="例：亲子游戏"></label>
    </div>

    <div class="card">
      <h2>② 上传图片</h2>
      <div class="drop" id="drop">
        <div id="dropTxt">点击选择图片，或把图片拖进来<br><span style="font-size:12px">竖图更佳 · 不上传则用示例图</span></div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </div>

    <div class="card">
      <h2>③ 选择合集（决定配色与标签）</h2>
      <div class="chips" id="cols"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>④ 选择模板（点击切换）</h2>
      <div class="tpl" id="tpls"></div>
    </div>

    <div class="card">
      <h2>预览与导出</h2>
      <div class="stage">
        <div class="preview">
          <h4>封面 1080×1440（3:4，主页/合集显示）</h4>
          <canvas id="pv" width="1080" height="1440" style="width:270px"></canvas>
        </div>
        <div class="preview">
          <h4>竖屏 1080×1920（9:16）</h4>
          <canvas id="pv9" width="1080" height="1920" style="width:180px"></canvas>
        </div>
        <div class="btns">
          <button class="big" id="exp34">导出封面 1080×1440（PNG）</button>
          <button class="ghost" id="exp916">导出竖屏 1080×1920（PNG）</button>
          <button class="ghost" id="expjpg">导出封面 JPG</button>
          <button class="ghost" id="exptrio">导出三联屏 3240×1440</button>
          <div class="tips" id="check"></div>
        </div>
      </div>
    </div>
  </div>
</div>

/* ---------- 工具函数 ---------- */
const F = (w,s)=>`${w} ${s}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`;
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function coverDraw(ctx,img,x,y,w,h,r){ctx.save();if(r){rr(ctx,x,y,w,h,r);ctx.clip();}const ir=img.width/img.height,tr=w/h;let sw,sh,sx,sy;if(ir>tr){sh=img.height;sw=sh*tr;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=sw/tr;sx=0;sy=(img.height-sh)/2;}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);ctx.restore();}
function fitText(ctx,txt,maxW,size,weight=900,min=28){let s=size;ctx.font=F(weight,s);while(ctx.measureText(txt).width>maxW&&s>min){s-=2;ctx.font=F(weight,s);}return s;}
function drawText(ctx,txt,x,y,maxW,size,color,weight=900,align='left'){
  const s=fitText(ctx,txt,maxW,size,weight);ctx.font=F(weight,s);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(txt,x,y);ctx.textAlign='left';return s;
}
function wrapLines(ctx,txt,maxW,size,weight,maxLines){
  ctx.font=F(weight,size);const out=[];let line='';
  for(const ch of txt){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=ch;if(out.length>=maxLines)break;}else line=t;}
  if(line&&out.length<maxLines)out.push(line);
  return out;
}
function shadow(ctx,blur,color,ox=0,oy=0){ctx.shadowBlur=blur;ctx.shadowColor=color;ctx.shadowOffsetX=ox;ctx.shadowOffsetY=oy;}
function noshadow(ctx){ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}

/* ---------- 排版基线常量 ----------
   画布 1080×1920；3:4 裁切区 y=240..1680
   关键文字带 y=300..1400；次要信息 y=1400..1620
   ------------------------------------------------ */
const TXT_TOP=300, TXT_BOT=1400;

/* 单行自适应字号（下限 min），返回实际字号 */
function fit1(ctx,txt,maxW,size,weight,min){return fitText(ctx,txt,maxW,size,weight,min);}
/* 标题：优先单行；装不下再折成两行 */
function titleBlock(ctx,txt,x,yBase,maxW,size,min,maxLines){
  let s=size;
  ctx.font=F(900,s);
  while(ctx.measureText(txt).width>maxW&&s>min){s-=2;ctx.font=F(900,s);}
  if(ctx.measureText(txt).width<=maxW){return {lines:[txt],size:s};}
  const lines=wrapLines(ctx,txt,maxW,s,900,maxLines||2);
  return {lines,size:s};
}
/* 描边文字（复杂背景可读性） */
function strokeTxt(ctx,txt,x,y,size,fill,stroke,weight=900,align='left',maxW){
  let s=size;if(maxW)s=fitText(ctx,txt,maxW,size,weight,60);
  ctx.font=F(weight,s);ctx.textAlign=align;ctx.lineJoin='round';ctx.miterLimit=2;
  ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(6,s*0.07);ctx.strokeText(txt,x,y);
  ctx.fillStyle=fill;ctx.fillText(txt,x,y);ctx.textAlign='left';
  return s;
}
/* 居中标题块，返回最后一行基线 y */
function drawTitle(ctx,txt,cx,yBase,maxW,size,fill,stroke,min,maxLines,align){
  const b=titleBlock(ctx,txt,0,yBase,maxW,size,min,maxLines);
  let y=yBase;
  b.lines.forEach((l,i)=>{
    const yy=yBase-(b.lines.length-1-i)*Math.round(b.size*1.18);
    strokeTxt(ctx,l,cx,yy,b.size,fill,stroke,900,align,maxW);
  });
  return y;
}

  o.push(n===0?['bad','还没填主标题']:(n<=8?['ok','标题 '+n+' 字，手机上看得清 ✓']:['bad','标题 '+n+' 字，建议 ≤8 字']));
  const banned=['爆款','热播','强推','第一','全网最低','国家级','绝对'];
  const hit=banned.filter(w=>((d.title+d.sub+d.badge+d.tag).includes(w)));
  o.push(hit.length?['bad','命中敏感词：'+hit.join('、')]:['ok','无违禁/营销词 ✓']);
  o.push(['ok','AI 素材请在发布页勾选「含有 AI 生成内容」并用官方 AI 标识工具标注']);
  document.getElementById('check').innerHTML=o.map(v=>`<div class="${v[0]}">${v[0]==='ok'?'✓':'⚠'} ${v[1]}</div>`).join('');
}
/* 合集选择 */
function buildCols(){
  const box=document.getElementById('cols');box.innerHTML='';
  Object.keys(COLLECTIONS).forEach(k=>{
    const b=document.createElement('div');
    b.className='chip'+(state.col===k?' on':'');
    b.textContent=COLLECTIONS[k].icon+' '+COLLECTIONS[k].name;
    b.onclick=()=>{state.col=k;state.layout=LAYOUTS.find(l=>l.col===k).id;buildCols();buildTpls();refresh();};
    box.appendChild(b);
  });
}
/* 模板卡片 */
function buildTpls(){
  const box=document.getElementById('tpls');box.innerHTML='';
  LAYOUTS.filter(l=>l.col===state.col).forEach(l=>{
    const d=document.createElement('div');
    d.className='t'+(state.layout===l.id?' on':'');
    const c=document.createElement('canvas');c.width=300;c.height=400;
    const t=document.createElement('canvas');t.width=1080;t.height=1920;
    drawDesign(t.getContext('2d'),l.id);
    c.getContext('2d').drawImage(t,0,240,1080,1440,0,0,300,400);
    const n=document.createElement('div');n.className='n';
    n.innerHTML='<span>'+l.name+'</span><span style="color:#b0b6bf">'+l.id+'</span>';
    d.appendChild(c);d.appendChild(n);
    d.onclick=()=>{state.layout=l.id;buildTpls();refresh();};
    box.appendChild(d);
  });
}
/* 上传 */
function useFile(f){
  const u=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{state.img=im;
    document.getElementById('dropTxt').innerHTML='<img src="'+u+'"><div style="font-size:12px;color:#12a150">已使用上传的图片 · 再次点击可更换</div>';
    buildTpls();refresh();};
  im.src=u;
}
document.getElementById('drop').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{if(e.target.files[0])useFile(e.target.files[0]);};
['dragover','dragenter'].forEach(ev=>document.getElementById('drop').addEventListener(ev,e=>{e.preventDefault();document.getElementById('drop').classList.add('hot');}));
['dragleave','drop'].forEach(ev=>document.getElementById('drop').addEventListener(ev,e=>{e.preventDefault();document.getElementById('drop').classList.remove('hot');}));
document.getElementById('drop').addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))useFile(f);});
/* 输入 */
['title','sub','badge','tag'].forEach(k=>{
  document.getElementById(k).oninput=e=>{state[k]=e.target.value;refresh();};
});
/* 导出 */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function exportCanvas(w,h,type,name){
  const t=document.createElement('canvas');t.width=1080;t.height=1920;
  drawDesign(t.getContext('2d'),state.layout);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  if(w===1080&&h===1920)x.drawImage(t,0,0);else x.drawImage(t,0,240,1080,1440,0,0,w,h);
  c.toBlob(b=>dl(b,name),type||'image/png',0.92);
}
document.getElementById('exp34').onclick=()=>exportCanvas(1080,1440,'image/png','cover-1080x1440.png');
document.getElementById('exp916').onclick=()=>exportCanvas(1080,1920,'image/png','cover-1080x1920.png');
document.getElementById('expjpg').onclick=()=>exportCanvas(1080,1440,'image/jpeg','cover-1080x1440.jpg');
document.getElementById('exptrio').onclick=()=>{
  const ids=LAYOUTS.filter(l=>l.col===state.col).map(l=>l.id);
  const c=document.createElement('canvas');c.width=3240;c.height=1440;const x=c.getContext('2d');
  const t=document.createElement('canvas');t.width=1080;t.height=1920;
  ids.forEach((id,i)=>{t.getContext('2d').clearRect(0,0,1080,1920);drawDesign(t.getContext('2d'),id);
    x.drawImage(t,0,240,1080,1440,i*1080,0,1080,1440);});
  c.toBlob(b=>dl(b,'trio-3240x1440.png'),'image/png');
};
/* 启动 */
let pending=3;
Object.values(COLLECTIONS).forEach(C=>{
  const im=new Image();
  im.onload=im.onerror=()=>{if(--pending===0)start();};
  im.src=C.img;
});
function start(){buildCols();buildTpls();refresh();}
</script>
</body>
</html>
