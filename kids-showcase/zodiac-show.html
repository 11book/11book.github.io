<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#120b2e">
<title>十二生肖送祝福 · 幼儿排练动画</title>
<style>
:root{
  --bg1:#1b1040; --bg2:#3a1c6b; --bg3:#0d0824;
  --panel:rgba(255,255,255,.08); --panel-b:rgba(255,255,255,.20);
  --txt:#ffffff; --txt2:rgba(255,255,255,.72);
  --gold:#ffd45e; --pink:#ff7eb3; --cyan:#5ee7ff; --green:#6ef0a5;
  --radius:26px; --sp:clamp(8px,1.4vw,18px);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);color:var(--txt);
  background:
    radial-gradient(1200px 700px at 50% -10%, #6a2ea8 0%, transparent 60%),
    radial-gradient(900px 600px at 12% 105%, #d43f7a 0%, transparent 55%),
    radial-gradient(900px 600px at 90% 100%, #1f6fb2 0%, transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg3));
  background-attachment:fixed;
  overflow:hidden;
}
body::before{ /* 舞台追光 */
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 8%, rgba(255,255,255,.10), transparent 70%);
}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;gap:var(--sp);padding:var(--sp)}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(15px,2vw,24px);letter-spacing:.5px}
.brand .logo{font-size:1.35em;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.act{
  padding:.42em .85em;border-radius:999px;font-size:clamp(11px,1.25vw,16px);font-weight:700;
  background:var(--panel);border:1px solid var(--panel-b);color:var(--txt2);backdrop-filter:blur(8px);
  transition:.3s;white-space:nowrap
}
.act.on{background:linear-gradient(135deg,var(--gold),#ff9d4d);color:#3a1c00;border-color:transparent;box-shadow:0 4px 16px rgba(255,180,60,.35)}
.act.done{color:var(--green)}

/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.18));border:1px solid var(--panel-b);
  overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.25)}
#stage.glow{box-shadow:inset 0 0 60px rgba(0,0,0,.25),0 0 0 2px rgba(255,212,94,.45),0 0 50px rgba(255,190,80,.35)}
/* 舞台背景：幕布 + 星光 + 地板 */
#stage::before{content:"";position:absolute;inset:0 0 auto;height:34%;pointer-events:none;
  background:
    radial-gradient(2px 2px at 12% 30%,rgba(255,255,255,.85),transparent),
    radial-gradient(2px 2px at 28% 12%,rgba(255,255,255,.6),transparent),
    radial-gradient(2px 2px at 46% 26%,rgba(255,255,255,.75),transparent),
    radial-gradient(2px 2px at 63% 10%,rgba(255,255,255,.55),transparent),
    radial-gradient(2px 2px at 78% 22%,rgba(255,255,255,.8),transparent),
    radial-gradient(2px 2px at 91% 14%,rgba(255,255,255,.6),transparent),
    radial-gradient(2px 2px at 36% 38%,rgba(255,255,255,.4),transparent),
    radial-gradient(2px 2px at 70% 36%,rgba(255,255,255,.45),transparent),
    linear-gradient(180deg,rgba(120,30,110,.75),transparent);
  animation:twinkle 4s ease-in-out infinite}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,190,90,.10) 55%,rgba(255,190,90,.16));
  border-top:1px solid rgba(255,212,94,.18)}
@keyframes twinkle{0%,100%{opacity:.75}50%{opacity:1}}
.stage-floor{position:absolute;left:6%;right:6%;bottom:4px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,212,94,.30),transparent 70%);pointer-events:none}
#cast{display:flex;align-items:flex-end;justify-content:center;gap:clamp(2px,.7vw,12px);padding:10px 8px 8px;flex-wrap:nowrap;overflow:visible}
.actor{position:relative;flex:1 1 0;min-width:0;max-width:clamp(46px,8vw,118px);transition:transform .55s cubic-bezier(.34,1.56,.64,1),filter .35s,opacity .35s;cursor:pointer;transform-origin:bottom center}
.actor svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.actor .ring{position:absolute;left:50%;bottom:-4%;transform:translateX(-50%);width:88%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);opacity:0;transition:.4s;z-index:-1}
.actor .tag{
  position:absolute;left:50%;transform:translate(-50%,-4px) scale(.8);bottom:-4px;
  background:linear-gradient(135deg,var(--gold),#ff9d4d);color:#3a1c00;font-weight:900;font-size:clamp(11px,1.5vw,19px);
  padding:.1em .5em;border-radius:999px;opacity:0;transition:.35s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)
}
.actor.speak{transform:translateY(-10%) scale(1.42);z-index:9}
.actor.speak .ring{opacity:1;animation:pulse 1.6s ease-out infinite}
.actor.speak .tag{opacity:1;transform:translate(-50%,0) scale(1)}
.actor.dim{filter:brightness(.5) saturate(.55);opacity:.72}
.actor.cheer{animation:cheer .55s ease-in-out}
.actor.finale{transform:translateY(-4%) scale(1.12)}
.actor.hop{animation:hop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes hop{0%{transform:translateY(30%) scale(.9)}55%{transform:translateY(-18%) scale(1.06)}100%{transform:translateY(0) scale(1)}}
@keyframes pulse{0%{transform:translateX(-50%) scale(.8);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14%) rotate(-6deg)}60%{transform:translateY(-6%) rotate(6deg)}}
.talking .mouth{transform-box:fill-box;transform-origin:center;animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
.blink{animation:blink 4.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* 幕布大字 */
#banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;
  font-size:clamp(26px,5vw,64px);font-weight:900;text-shadow:0 6px 24px rgba(0,0,0,.6);opacity:0;transition:.4s}
#banner.on{opacity:1}
#banner span{background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

/* MUSIC 覆盖层 */
#music{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  background:radial-gradient(60% 60% at 50% 50%,rgba(94,231,255,.22),rgba(0,0,0,.35));backdrop-filter:blur(3px)}
#music.on{display:flex}
#music .note{font-size:clamp(40px,8vw,90px);animation:float 1.6s ease-in-out infinite}
#music .note:nth-child(2){animation-delay:.25s}#music .note:nth-child(3){animation-delay:.5s}
#music .txt{font-size:clamp(20px,3.4vw,44px);font-weight:900;color:var(--cyan)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-22px) rotate(8deg)}}

/* 吉祥话卡片 */
#cards{display:none;gap:8px;padding:0 4px 2px;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
#cards::-webkit-scrollbar{display:none}
#cards.on{display:flex}
.card{flex:0 0 auto;width:clamp(116px,13vw,186px);padding:8px 10px;border-radius:16px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid var(--panel-b);
  transform:rotateY(90deg);opacity:.35;transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .5s}
.card.flip{transform:rotateY(0);opacity:1;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card .z{font-size:clamp(20px,2.6vw,34px);font-weight:900;color:var(--gold)}
.card .b{font-size:clamp(11px,1.35vw,17px);font-weight:700;margin-top:2px;line-height:1.3;height:3.9em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

/* ---------- 台词区 ---------- */
#dialog{background:var(--panel);border:1px solid var(--panel-b);border-radius:var(--radius);padding:clamp(10px,1.6vw,20px) clamp(14px,2.4vw,30px);
  backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:6px;min-height:clamp(120px,22vh,240px)}
#speaker{display:flex;align-items:center;gap:10px;font-size:clamp(16px,2.4vw,30px);font-weight:900;color:var(--gold)}
#speaker .who{background:linear-gradient(135deg,var(--gold),#ff9d4d);color:#3a1c00;border-radius:999px;padding:.1em .7em}
#speaker .tag2{font-size:clamp(11px,1.3vw,16px);font-weight:700;color:var(--cyan);border:1px solid rgba(94,231,255,.5);border-radius:999px;padding:.05em .6em}
#line{font-size:clamp(24px,4.6vw,60px);font-weight:900;line-height:1.3;letter-spacing:.5px;min-height:1.35em;text-shadow:0 4px 14px rgba(0,0,0,.45)}
#line .kw{color:var(--gold);text-shadow:0 0 22px rgba(255,212,94,.6)}
#cue{font-size:clamp(12px,1.5vw,19px);color:var(--txt2);min-height:1.2em}
#cue b{color:var(--pink)}

/* ---------- 控制条 ---------- */
#controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{padding:.55em 1.1em;border-radius:999px;border:1px solid var(--panel-b);background:var(--panel);color:var(--txt);
  font-family:var(--font);font-size:clamp(13px,1.6vw,20px);font-weight:800;cursor:pointer;backdrop-filter:blur(8px);transition:.2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--gold),#ff9d4d);color:#3a1c00;border-color:transparent}
.btn.on{background:linear-gradient(135deg,var(--cyan),#3aa7ff);color:#05202b;border-color:transparent}
.seg{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--panel-b);border-radius:999px;padding:3px}
.seg .btn{border:none;background:transparent;padding:.35em .8em}
.seg .btn.on{background:linear-gradient(135deg,var(--green),#2ecf8f);color:#04301d}
#counter{font-size:clamp(11px,1.3vw,16px);color:var(--txt2);margin-left:auto;white-space:nowrap}

/* ---------- 台词本 ---------- */
#book{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,4,20,.92);backdrop-filter:blur(8px);flex-direction:column}
#book.on{display:flex}
#book h2{margin:0;padding:14px 18px;font-size:clamp(16px,2.4vw,26px);display:flex;align-items:center;gap:12px}
#book h2 button{margin-left:auto}
#bookList{flex:1;overflow:auto;padding:0 14px 24px;font-size:clamp(14px,1.9vw,22px);line-height:1.6}
.bl{padding:7px 10px;border-radius:12px;margin-bottom:6px;cursor:pointer;border-left:4px solid transparent}
.bl:hover{background:rgba(255,255,255,.07)}
.bl.cur{background:rgba(255,212,94,.16);border-left-color:var(--gold)}
.bl .r{color:var(--gold);font-weight:900;margin-right:8px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.hidden{display:none!important}
#readNext{display:none}
body.readmode #readNext{display:inline-block;background:linear-gradient(135deg,var(--green),#2ecf8f);color:#04301d;border-color:transparent;font-size:clamp(15px,2.2vw,26px);padding:.6em 1.4em}
body.readmode #line{font-size:clamp(28px,6.2vw,78px)}
body.readmode #cards{display:none!important}
@media (max-width:760px){
  #cast{flex-wrap:wrap;gap:2px;padding:6px 4px 4px}
  .actor{flex:0 0 calc(16.66% - 4px);max-width:none}
  .actor.speak{transform:translateY(-8%) scale(1.5)}
  #counter{margin-left:0;width:100%;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.12s!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app">
  <header>
    <div class="brand"><span class="logo">🐉</span><span>十二生肖送祝福 · 排练动画</span></div>
    <div class="acts" id="acts"></div>
  </header>

  <div id="stage">
    <div id="cast"></div>
    <div class="stage-floor"></div>
    <div id="banner"><span id="bannerTxt"></span></div>
    <div id="music"><div class="note">🎵</div><div class="txt">配乐播放</div><div class="note">🎶</div></div>
  </div>

  <div id="cards"></div>

  <div id="dialog">
    <div id="speaker"><span class="who" id="who">准备</span><span class="tag2" id="mood"></span></div>
    <div id="line"></div>
    <div id="cue"></div>
  </div>

  <div id="controls">
    <button class="btn" id="prev">⏮ 上一句</button>
    <button class="btn pri" id="play">▶ 播放</button>
    <button class="btn" id="next">下一句 ⏭</button>
    <button class="btn" id="loop">🔁 循环本幕</button>
    <button class="btn" id="read">🎤 跟读模式</button>
    <button class="btn pri" id="readNext">我读完啦 →</button>
    <button class="btn" id="bookBtn">📜 台词本</button>
    <div class="seg">
      <button class="btn" data-sp="0.5">0.5x</button>
      <button class="btn on" data-sp="1">1x</button>
      <button class="btn" data-sp="1.5">1.5x</button>
    </div>
    <span id="counter">—</span>
  </div>
</div>

<div id="book">
  <h2>📜 全部台词 <button class="btn" id="bookClose">关闭 ✕</button></h2>
  <div id="bookList"></div>
</div>

/* ============ 状态 ============ */
let idx=0, playing=false, speed=1, loopAct=false, readMode=false, timer=null;
const $=s=>document.querySelector(s);
const castEl=$('#cast'), cardsEl=$('#cards'), lineEl=$('#line'), whoEl=$('#who'), moodEl=$('#mood'), cueEl=$('#cue');
const actors={};
const KW=/[！!？?。]/;

/* 建立角色 */
ORDER.forEach(k=>{
  const d=document.createElement('div');
  d.className='actor'; d.dataset.k=k;
  d.innerHTML=`<div class="ring"></div>${svgFor(k)}<div class="tag">${Z[k].cn}</div>`;
  d.onclick=()=>jumpToActor(k);
  castEl.appendChild(d); actors[k]=d;
});
/* 吉祥话卡片 */
ORDER.forEach(k=>{const c=document.createElement('div');c.className='card';c.dataset.k=k;
  c.innerHTML=`<div class="z">${Z[k].cn}</div><div class="b"></div>`;cardsEl.appendChild(c);});

/* 幕次按钮 */
const ACTS=[0,1,2,3,4];
ACTS.forEach(a=>{const b=document.createElement('button');b.className='act';b.textContent=A[a+1].replace('第','第');
  b.onclick=()=>{const i=LINES.findIndex(l=>l.a===a);if(i>=0)show(i);};$('#acts').appendChild(b);});

/* ============ 渲染 ============ */
function currentAct(){return LINES[idx].a;}
function show(i,keepScroll){
  idx=(i+LINES.length)%LINES.length;
  const L0=LINES[idx], r=L0.r;
  // 幕次高亮
  [...$('#acts').children].forEach((b,k)=>{
    b.classList.toggle('on',ACTS[k]===L0.a);
    b.classList.toggle('done',ACTS[k]<L0.a);
  });
  // 角色状态
  Object.keys(actors).forEach(k=>{
    const a=actors[k];
    a.classList.remove('speak','dim','cheer','finale','hop','talking');
    if(r===k){a.classList.add('speak','hop','talking');}
    else if(r==='all'){a.classList.add('cheer');}
    else if(r==='narr'||r==='music'||r==='aud'){ /* 保持全亮 */ }
    else {a.classList.add('dim');}
  });
  if(r==='all'){Object.values(actors).forEach(a=>{a.classList.add('speak','cheer');});}
  if(L0.a===4){Object.values(actors).forEach(a=>a.classList.add('finale'));}
  // 台词
  whoEl.textContent=ROLENAME[r]||'';
  moodEl.textContent=L0.mood||'';
  cueEl.innerHTML=L0.cue?('👉 '+L0.cue):'';
  typeLine(L0.t);
  // 幕布大字
  const bn=$('#banner');
  if(L0.a===0){bn.querySelector('span').textContent='《十二生肖送祝福》';bn.classList.add('on');}
  else if(L0.a===1){bn.querySelector('span').textContent='十二生肖 · 依次亮相';bn.classList.add('on');}
  else if(L0.a===3){bn.querySelector('span').textContent='一人一句吉祥话';bn.classList.add('on');}
  else if(L0.a===4){bn.querySelector('span').textContent='祝大家新年快乐！';bn.classList.add('on');}
  else bn.classList.remove('on');
  // MUSIC
  $('#music').classList.toggle('on', r==='music');
  // 卡片
  cardsEl.classList.toggle('on', L0.a>=3);
  if(L0.a===3 && r!=='all' && r!=='narr' && r!=='aud' && r!=='music'){
    const c=cardsEl.querySelector(`.card[data-k="${r}"]`);
    if(c){c.classList.add('flip');c.querySelector('.b').textContent=L0.t;}
  }
  // 计数
  $('#counter').textContent=`第 ${idx+1} / ${LINES.length} 句 · ${A[L0.a+1]}`;
  // 台词本
  [...$('#bookList').children].forEach((el,k)=>el.classList.toggle('cur',k===idx));
  if(!keepScroll){const cur=$('#bookList').children[idx];if(cur)cur.scrollIntoView({block:'center'});}
  // 撒花
  if(L0.a===4 && r==='all') burstConfetti();
  schedule();
}

let typeTimer=null;
function typeLine(text){
  clearInterval(typeTimer);
  lineEl.textContent='';
  let i=0;
  const full=text;
  typeTimer=setInterval(()=>{
    i++;
    lineEl.textContent=full.slice(0,i);
    if(i%3===0 && full[i-1] && KW.test(full[i-1])) spark();
    if(i>=full.length){clearInterval(typeTimer);}
  }, Math.max(18, 62/speed));
}

/* 自动播放节奏 */
function schedule(){
  clearTimeout(timer);
  if(!playing||readMode) return;
  const L0=LINES[idx];
  let dur;
  if(L0.r==='music') dur=4000;
  else dur=Math.min(9000, Math.max(2200, 1400+L0.t.length*260))/speed;
  timer=setTimeout(()=>{
    if(loopAct){
      const a=currentAct();
      const idxs=LINES.map((l,k)=>l.a===a?k:-1).filter(k=>k>=0);
      const pos=idxs.indexOf(idx);
      show(idxs[(pos+1)%idxs.length]);
    } else show(idx+1);
  }, dur);
}
function togglePlay(){
  playing=!playing;
  $('#play').textContent=playing?'⏸ 暂停':'▶ 播放';
  if(playing) schedule();
}
function jumpToActor(k){
  const i=LINES.findIndex(l=>l.r===k);
  if(i>=0) show(i);
}

/* ============ 控制 ============ */
$('#play').onclick=togglePlay;
$('#next').onclick=()=>show(idx+1);
$('#prev').onclick=()=>show(idx-1);
$('#loop').onclick=e=>{loopAct=!loopAct;e.target.classList.toggle('on',loopAct);schedule();};
$('#read').onclick=e=>{readMode=!readMode;e.target.classList.toggle('on',readMode);
  if(readMode){playing=false;$('#play').textContent='▶ 播放';clearTimeout(timer);}
  document.body.classList.toggle('readmode',readMode);};
document.querySelectorAll('.seg .btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.seg .btn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');speed=parseFloat(b.dataset.sp);schedule();});
$('#bookBtn').onclick=()=>{$('#book').classList.add('on');buildBook();};
$('#readNext').onclick=()=>show(idx+1);
$('#bookClose').onclick=()=>$('#book').classList.remove('on');
/* 键盘 */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')show(idx+1);
  if(e.key==='ArrowLeft')show(idx-1);
  if(e.key===' '){e.preventDefault();togglePlay();}
});
/* 点台词区翻页 */
$('#dialog').addEventListener('click',()=>{ if(readMode) show(idx+1); });

function buildBook(){
  const box=$('#bookList');
  if(box.children.length) return;
  LINES.forEach(l=>{
    const d=document.createElement('div');d.className='bl';
    d.innerHTML=`<span class="r">${ROLENAME[l.r]}</span>${l.t}`;
    d.onclick=()=>{show(LINES.indexOf(l));$('#book').classList.remove('on');};
    box.appendChild(d);
  });
}

/* ============ 特效 ============ */
function spark(){
  const st=$('#stage');
  const s=document.createElement('div');
  s.style.cssText='position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd45e;pointer-events:none;left:'+(40+Math.random()*20)+'%;bottom:18%;box-shadow:0 0 18px #ffd45e;transition:transform .6s ease-out,opacity .6s';
  st.appendChild(s);
  requestAnimationFrame(()=>{s.style.transform='translateY(-90px) scale(2.4)';s.style.opacity='0';});
  setTimeout(()=>s.remove(),700);
}
const cv=$('#confetti'),cx=cv.getContext('2d');
function sizeCanvas(){cv.width=innerWidth;cv.height=innerHeight;}
sizeCanvas();addEventListener('resize',sizeCanvas);
let parts=[];
function burstConfetti(){
  const cols=['#ffd45e','#ff7eb3','#5ee7ff','#6ef0a5','#ffffff','#ff9d4d'];
  for(let i=0;i<140;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35+Math.random()*60,
    vx:(Math.random()-.5)*9,vy:-6-Math.random()*9,w:6+Math.random()*8,h:8+Math.random()*10,c:cols[i%cols.length],r:Math.random()*6});
}
function loopC(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;p.r+=0.12;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40);
  requestAnimationFrame(loopC);
}
loopC();

/* 初始化 */
show(0);
</script>
</body>
</html>
