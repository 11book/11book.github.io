<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>春夜喜雨 · 水墨意境</title>
<style>
:root{
  --ink:#f4f8ff; --dim:#a4b8ce; --gold:#e6c079; --seal:#b8463a;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070b}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}

#paper{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.34;mix-blend-mode:overlay}
#vig{position:fixed;inset:0;pointer-events:none;z-index:7;
  background:radial-gradient(ellipse at 52% 46%,transparent 26%,rgba(0,0,0,.34) 72%,rgba(0,0,0,.86) 100%)}

#scenes{position:fixed;inset:0;z-index:0;overflow:hidden;background:#05070b}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;transform-origin:center}
.scene.on{opacity:1}
.scene svg{position:absolute;inset:0;width:100%;height:100%}

/* 竖排题名 */
#brand{position:fixed;left:3.6vw;top:7vh;z-index:9;writing-mode:vertical-rl;display:flex;gap:.5rem;align-items:flex-start}
#brand .t{font-family:var(--kai);font-size:clamp(30px,3.6vw,48px);letter-spacing:.3em;color:#eef4fb;
  text-shadow:0 2px 20px rgba(0,0,0,.9)}
#brand .a{font-family:var(--kai);font-size:clamp(14px,1.5vw,18px);letter-spacing:.34em;color:#9fb3ca;padding-top:.6em}
#seal{margin-top:1rem;width:30px;height:30px;border:1.5px solid var(--seal);border-radius:3px;color:var(--seal);
  font-family:var(--kai);font-size:15px;line-height:32px;text-align:center;opacity:.9;
  box-shadow:0 0 18px rgba(184,70,58,.28)}

/* 诗句 */
#scrim{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;
  width:min(84vw,840px);height:clamp(64px,8vw,104px);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(1,2,5,.72) 0%,rgba(1,2,5,.42) 46%,rgba(1,2,5,0) 78%);
  filter:blur(12px)}
#poem{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;pointer-events:none;padding:6vh 4vw}
.ln{position:relative;width:min(94vw,940px);height:clamp(46px,5.4vw,72px);display:flex;align-items:center;justify-content:center}
.ln svg{width:100%;height:100%;overflow:visible}
.ln text{font-family:var(--kai);font-size:50px;letter-spacing:.2em;fill:#f6fafe;opacity:0}
.ln.past text{opacity:.11;fill:#8fa6c0}
.ln.future text{opacity:.035;fill:#7f93ab}
.ln.cur text{opacity:1;fill:#ffffff;
  filter:drop-shadow(0 2px 26px rgba(0,0,0,.95)) drop-shadow(0 0 34px rgba(190,215,255,.25))}
.ln .brush{position:absolute;left:50%;transform:translateX(-50%);bottom:.15em;height:1.5px;width:0;
  background:linear-gradient(90deg,transparent,var(--gold) 35%,var(--gold) 65%,transparent);transition:width .8s ease}
.ln.cur .brush{width:min(38vw,260px)}
.ln .sub{position:absolute;left:50%;transform:translateX(-50%);bottom:-.9em;font-size:14px;color:#cfdcea;
  white-space:nowrap;opacity:0;transition:opacity .45s ease;text-shadow:0 1px 8px #000}
.ln.cur .sub{opacity:.92}
.ln .sub[style]{opacity:.92}

/* 题跋 */
#quote{position:fixed;left:0;right:0;bottom:13vh;z-index:9;text-align:center;font-family:var(--kai);
  font-size:clamp(13px,1.5vw,19px);color:var(--gold);letter-spacing:.16em;opacity:0;transition:opacity .7s ease;
  text-shadow:0 2px 14px #000;padding:0 6vw}
#quote.on{opacity:.9}

/* 控件：去现代感 */
#bar{position:fixed;left:50%;bottom:3.2vh;transform:translateX(-50%);z-index:10;display:flex;gap:0;
  align-items:center;justify-content:center;flex-wrap:wrap;max-width:96vw;
  opacity:.72;transition:opacity .6s ease}
#bar:hover{opacity:1}
#bar .sep{width:1px;height:13px;background:rgba(150,175,205,.22);margin:0 12px}
.b{background:none;border:none;color:#b6c6d8;font-family:var(--kai);font-size:14px;letter-spacing:.12em;
  padding:5px 13px;cursor:pointer;position:relative;transition:color .25s;white-space:nowrap}
.b:hover{color:#fff}
.b.on{color:var(--gold)}
.b.on::after{content:'';position:absolute;left:13px;right:13px;bottom:1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.b i{font-style:normal;opacity:.45;margin:0 5px}
#counter{font-size:12px;color:#7d90a6;letter-spacing:.1em;padding:0 10px;opacity:.8}

#acts{position:fixed;left:50%;top:3vh;transform:translateX(-50%);z-index:10;display:flex;gap:0;justify-content:center;flex-wrap:wrap}
.act{background:none;border:none;color:#8fa3ba;font-family:var(--kai);font-size:13px;letter-spacing:.16em;
  padding:4px 12px;cursor:pointer;position:relative;transition:color .3s;white-space:nowrap}
.act:hover{color:#dbe7f4}
.act.on{color:var(--gold)}
.act.on::after{content:'';position:absolute;left:12px;right:12px;bottom:-2px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}

#hint{position:fixed;right:14px;bottom:3.6vh;z-index:10;font-size:11.5px;color:#77899d;text-align:right;line-height:1.9}
#hint b{color:var(--gold);font-weight:400}
@media(max-width:720px){
  #brand{left:3vw;top:5vh}
  #quote{bottom:17vh}
  #hint{display:none}
  .b{font-size:13px;padding:5px 9px}
}
</style>
</head>

<div id="scenes"></div>
<canvas id="fx"></canvas>
<svg id="paper" xmlns="http://www.w3.org/2000/svg"><filter id="fib"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#fib)"/></svg>

<script>

/* 皴笔：披麻皴——沿山势方向的连贯长线，模拟中锋用笔 */
function cun(seed,n,x0,y0,w,h,col,op){
  let s=seed,out='';
  const rnd=()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};
  for(let i=0;i<n;i++){
    const x=x0+rnd()*w, y=y0+rnd()*h;
    const len=30+rnd()*90;               // 长披麻线
    const a=1.02+rnd()*.5;                // 偏陡的皴势
    const ex=x+len*Math.cos(a), ey=y+len*Math.sin(a);
    const mx=x+len*.5*Math.cos(a)+(rnd()-.5)*14, my=y+len*.5*Math.sin(a)+(rnd()-.5)*14;
    out+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" `
       +`stroke="${col}" stroke-width="${(2.2+rnd()*4.2).toFixed(1)}" fill="none" `
       +`stroke-linecap="round" opacity="${(op*(.55+rnd()*.45)).toFixed(2)}"/>`;
  }
  return out;
}
/* 点苔：浓墨点，厚重墨感 */
function moss(seed,n,x0,y0,w,h,col,op){
  let s=seed,out='';
  const rnd=()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};
  for(let i=0;i<n;i++){
    const x=x0+rnd()*w,y=y0+rnd()*h,r=2.4+rnd()*6.5;
    out+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${r.toFixed(1)}" ry="${(r*.62).toFixed(1)}" fill="${col}" opacity="${(op*(.5+rnd()*.5)).toFixed(2)}"/>`;
  }
  return out;
}
/* 飞白：沿轮廓的丝缕状枯笔（带斜向与弧向，避免排线感） */
function flying(seed,n,x0,y0,w,h,col,op){
  let s=seed,out='';
  const rnd=()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};
  for(let i=0;i<n;i++){
    const x=x0+rnd()*w,y=y0+rnd()*h,l=24+rnd()*120;
    const ang=(rnd()-.5)*0.55;                 // 斜向幅度
    const ex=x+l*Math.cos(ang), ey=y+l*Math.sin(ang);
    const bow=(rnd()-.5)*26;                  // 弧度
    out+=`<path d="M${x.toFixed(0)} ${y.toFixed(0)} Q${((x+ex)/2+bow).toFixed(0)} ${((y+ey)/2+bow*.4).toFixed(0)} ${ex.toFixed(0)} ${ey.toFixed(0)}" `
       +`stroke="${col}" stroke-width="${(1.1+rnd()*2.6).toFixed(1)}" fill="none" `
       +`opacity="${(op*(.35+rnd()*.65)).toFixed(2)}" stroke-linecap="round"/>`;
  }
  return out;
}
/* 长斜笔：雨势扫过的方向感，打破水平排线 */
function slant(seed,n,x0,y0,w,h,col,op,lenMin,lenMax){
  let s=seed,out='';
  const rnd=()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};
  for(let i=0;i<n;i++){
    const x=x0+rnd()*w,y=y0+rnd()*h,l=lenMin+rnd()*(lenMax-lenMin);
    const ang=1.02+rnd()*.5;
    out+=`<path d="M${x.toFixed(0)} ${y.toFixed(0)} L${(x+l*Math.cos(ang)).toFixed(0)} ${(y+l*Math.sin(ang)).toFixed(0)}" `
       +`stroke="${col}" stroke-width="${(1+rnd()*2.2).toFixed(1)}" stroke-linecap="round" `
       +`opacity="${(op*(.3+rnd()*.7)).toFixed(2)}"/>`;
  }
  return out;
}
/* 墨点飞溅 */
function spatter(seed,n,col){
  let s=seed,out='';
  const rnd=()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};
  for(let i=0;i<n;i++){
    out+=`<circle cx="${(rnd()*1600).toFixed(0)}" cy="${(rnd()*900).toFixed(0)}" r="${(0.6+rnd()*2.2).toFixed(1)}" fill="${col}" opacity="${(0.05+rnd()*0.2).toFixed(2)}"/>`;
  }
  return out;
}

const InkStage=(function(){
 let idx=0,playing=false,speed=1,timer=null;
 let showNote=false,reciteMode=false,readMode=false,voiceOn=false;
 const $=s=>document.querySelector(s);
 const sceneBox=$('#scenes'),poemBox=$('#poem'),fx=$('#fx'),ctx=fx.getContext('2d');
 let W=0,H=0,DPR=1,parts=[],sparks=[],inks=[],curScene='';

 function buildScenes(){
  sceneBox.innerHTML=ACTS.map(a=>`<div class="scene" data-k="${a.scene}" id="sc-${a.scene}">${SCENES[a.scene]()}</div>`).join('')+DYN;
 }
 function buildPoem(){
  poemBox.innerHTML=LINES.map((l,i)=>`<div class="ln" data-i="${i}">
    <svg viewBox="0 0 940 100" preserveAspectRatio="xMidYMid meet">
      <defs><mask id="mk${i}" maskUnits="userSpaceOnUse" x="0" y="0" width="940" height="100">
        <rect id="mk${i}r" x="0" y="0" width="940" height="100" fill="#fff" transform="translate(-940,0)"/>
      </mask></defs>
      <text x="470" y="68" text-anchor="middle" mask="url(#mk${i})">${l.text}</text>
    </svg>
    <div class="brush"></div><div class="sub"></div></div>`).join('');
 }
 function buildActs(){
  $('#acts').innerHTML=ACTS.map(a=>`<button class="act" data-id="${a.id}">${a.name}</button>`).join('');
  [...document.querySelectorAll('.act')].forEach(b=>b.onclick=()=>{
   const i=LINES.findIndex(l=>l.act==b.dataset.id); if(i>=0)show(i,true);});
 }
 const sceneOf=i=>ACTS.find(a=>a.id===LINES[i].act).scene;

 function setScene(k){
  if(curScene===k)return; curScene=k;
  [...sceneBox.querySelectorAll('.scene')].forEach(el=>{
   const on=el.dataset.k===k; el.classList.toggle('on',on);
   el.style.transform=on?'scale(1.04)':'scale(1.14)';
  });
  // 墨色晕开转场
  inks.push({x:W*.5,y:H*.5,r:0,life:1});
  for(let i=0;i<26;i++){
   const a=Math.random()*Math.PI*2,sp=2+Math.random()*9;
   inks.push({x:W*.5+Math.cos(a)*20,y:H*.5+Math.sin(a)*20,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2+Math.random()*9,life:.6+Math.random()*.5,ink:1});
  }
  parts=[];
  if(k==='s1')for(let i=0;i<260;i++){const long=i%9===0;parts.push({t:'rain',x:Math.random()*W,y:Math.random()*H,l:long?52+Math.random()*46:14+Math.random()*24,s:long?26+Math.random()*16:15+Math.random()*13,o:(long?.22:.1)+Math.random()*(long?.3:.34),a:(Math.random()-.5)*.34,w:long?1.5:1});}
  if(k==='s2')for(let i=0;i<80;i++)parts.push({t:'mist',x:Math.random()*W,y:H*.55+Math.random()*H*.45,r:40+Math.random()*110,v:.1+Math.random()*.28,o:.025+Math.random()*.05});
  if(k==='s4')for(let i=0;i<44;i++)parts.push({t:'petal',x:Math.random()*W,y:Math.random()*H,s:3+Math.random()*4.4,vy:.5+Math.random()*.9,vx:(Math.random()-.4)*.7,rot:Math.random()*360,vr:(Math.random()-.5)*2.2,o:.5+Math.random()*.45});
  if(k==='s3')for(let i=0;i<30;i++)parts.push({t:'spark',x:820+Math.random()*250,y:490+Math.random()*100,v:.2+Math.random()*.7,o:.3+Math.random()*.6,r:.8+Math.random()*1.7});
  if(k==='s0')for(let i=0;i<26;i++)parts.push({t:'mote',x:Math.random()*W,y:Math.random()*H*.85,r:.6+Math.random()*1.7,vy:-(.06+Math.random()*.2),vx:(Math.random()-.5)*.22,o:.12+Math.random()*.3});
 }

 function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  fx.width=W*DPR;fx.height=H*DPR;fx.style.width=W+'px';fx.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
 }

 function loop(){
  ctx.clearRect(0,0,W,H);
  for(const p of parts){
   if(p.t==='rain'){
    const dx=-p.s*.26*(1+p.a*.9), dy=p.l*(1+p.a*.5);
    ctx.strokeStyle=`rgba(196,220,255,${p.o})`;ctx.lineWidth=p.w||1;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+dx,p.y+dy);ctx.stroke();
    p.y+=p.s;p.x+=dx*.55;
    if(p.y>H){p.y=-40;p.x=Math.random()*W+W*.35;}
   }else if(p.t==='mist'){
    ctx.fillStyle=`rgba(196,214,238,${p.o})`;
    ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.3,0,0,Math.PI*2);ctx.fill();
    p.x+=p.v;if(p.x>W+p.r)p.x=-p.r;
   }else if(p.t==='petal'){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=`rgba(226,108,98,${p.o})`;
    ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.52,0,0,Math.PI*2);ctx.fill();ctx.restore();
    p.y+=p.vy;p.x+=p.vx+Math.sin(p.y*.02)*.7;p.rot+=p.vr;
    if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}
   }else if(p.t==='spark'){
    ctx.fillStyle=`rgba(255,192,92,${p.o})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    p.y-=p.v;p.x+=Math.sin(p.y*.03)*.22;
    if(p.y<420){p.y=620;p.x=820+Math.random()*250;}
   }else if(p.t==='mote'){
    ctx.fillStyle=`rgba(214,230,255,${p.o})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    p.y+=p.vy;p.x+=p.vx;if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
   }
  }
  for(let i=sparks.length-1;i>=0;i--){
   const s=sparks[i];
   ctx.fillStyle=`rgba(255,252,240,${s.o})`;
   ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
   s.x+=s.vx;s.y+=s.vy;s.vy+=.14;s.o-=.022;s.r*=.95;
   if(s.o<=0)sparks.splice(i,1);
  }
  for(let i=inks.length-1;i>=0;i--){
   const k=inks[i];
   if(k.ink){
    ctx.fillStyle=`rgba(8,12,20,${Math.min(.75,k.life*.7)})`;
    ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,Math.PI*2);ctx.fill();
    k.x+=k.vx;k.y+=k.vy;k.vy+=.18;k.r*=.985;k.life-=.014;
    if(k.life<=0)inks.splice(i,1);
   }else{
    ctx.fillStyle=`rgba(6,9,16,${k.life*.5})`;
    ctx.beginPath();ctx.arc(k.x,k.y,60+k.r*26,0,Math.PI*2);ctx.fill();
    k.r+=14;k.life-=.018;
    if(k.life<=0)inks.splice(i,1);
   }
  }
  requestAnimationFrame(loop);
 }

 /* 毛笔书写 */
 function brushIn(i){
  const r=document.getElementById('mk'+i+'r'); if(!r)return;
  r.style.transition='none'; r.style.transform='translate(-940px,0px)';
  r.setAttribute('transform','translate(-940,0)');
  void r.getBoundingClientRect();
  const dur=760/speed;
  r.style.transition=`transform ${dur}ms cubic-bezier(.32,.72,.36,1)`;
  r.style.transform='translate(0px,0px)';
  /* 终态兜底：无论 transition 是否推进，都保证遮罩完全展开 */
  setTimeout(()=>{ r.style.transition='none'; r.style.transform=''; r.setAttribute('transform','translate(0,0)'); },dur+120);
  setTimeout(()=>burst(i),dur);
 }
 function burst(i){
  const el=poemBox.querySelector(`.ln[data-i="${i}"]`); if(!el)return;
  const r=el.getBoundingClientRect();
  for(let k=0;k<18;k++){
   const a=Math.random()*Math.PI*2,sp=1+Math.random()*3.6;
   sparks.push({x:r.left+r.width/2+(Math.random()-.5)*r.width*.62,y:r.top+r.height*.5,
    vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,r:1+Math.random()*2.6,o:.85});
  }
 }

 function show(i,stop){
  if(stop){playing=false;$('#play').textContent='▶ 播放';clearTimeout(timer);}
  idx=(i+LINES.length)%LINES.length;
  const L=LINES[idx];
  setScene(sceneOf(idx));
  [...poemBox.children].forEach((el,k)=>{
   el.classList.remove('cur','past','future');
   el.classList.add(k===idx?'cur':(k<idx?'past':'future'));
   const t=el.querySelector('text');
   if(k===idx){
    el.querySelector('.sub').textContent=showNote?(L.note||''):'';
    t.textContent=reciteMode?maskText(L.text):L.text;
    t.setAttribute('mask','url(#mk'+k+')');
    t.style.opacity='1'; t.style.fill='#fff';
    brushIn(k);
   }else{
    t.removeAttribute('mask');
    t.textContent=LINES[k].text;
    t.style.opacity=k<idx?'.11':'.035';
    t.style.fill=k<idx?'#8fa6c0':'#7f93ab';
    el.querySelector('.sub').textContent='';
   }
  });
  const q=QUOTES[L.act]||'';
  $('#quote').textContent=q;$('#quote').classList.toggle('on',!!q);
  [...document.querySelectorAll('.act')].forEach(b=>b.classList.toggle('on',b.dataset.id==String(L.act)));
  $('#counter').textContent=`${idx+1} / ${LINES.length}`;
  schedule();
 }
 function maskText(t){return t.replace(/[^\s，。？！、]/g,'＿');}

 function schedule(){
  clearTimeout(timer);
  if(!playing||readMode)return;
  const L=LINES[idx];
  const dur=Math.min(11000,Math.max(4400,3500+L.text.length*400))/speed;
  timer=setTimeout(()=>show(idx+1),dur);
 }
 function speak(){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(LINES[idx].text);
  u.lang='zh-CN';u.rate=.85*speed;speechSynthesis.speak(u);
 }
 function parallax(e){
  const cx=(e.clientX/W-.5),cy=(e.clientY/H-.5);
  sceneBox.querySelectorAll('.pf').forEach(el=>{
   const d=parseFloat(el.dataset.depth||20);
   el.style.transform=`translate(${(-cx*d).toFixed(1)}px,${(-cy*d*.42).toFixed(1)}px)`;
  });
 }
 function bind(){
  $('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'⏸ 暂停':'▶ 播放';
   if(playing)schedule();else clearTimeout(timer);};
  $('#next').onclick=()=>show(idx+1);
  $('#prev').onclick=()=>show(idx-1);
  $('#read').onclick=e=>{readMode=!readMode;e.target.classList.toggle('on',readMode);
   if(readMode){playing=false;$('#play').textContent='▶ 播放';clearTimeout(timer);}};
  $('#recite').onclick=e=>{reciteMode=!reciteMode;e.target.classList.toggle('on',reciteMode);show(idx,true);};
  $('#note').onclick=e=>{showNote=!showNote;e.target.classList.toggle('on',showNote);
   const c=poemBox.querySelector('.ln.cur .sub');if(c)c.textContent=showNote?(LINES[idx].note||''):'';};
  $('#voice').onclick=e=>{voiceOn=!voiceOn;e.target.classList.toggle('on',voiceOn);
   if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();else speak();};
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{
   document.querySelectorAll('[data-sp]').forEach(x=>x.classList.remove('on'));
   b.classList.add('on');speed=parseFloat(b.dataset.sp);schedule();});
  document.addEventListener('keydown',e=>{
   if(e.key==='ArrowRight')show(idx+1);
   else if(e.key==='ArrowLeft')show(idx-1);
   else if(e.key===' '){e.preventDefault();$('#play').click();}
   else if(e.key==='y'||e.key==='Y')$('#voice').click();
   else if(e.key==='n'||e.key==='N')$('#note').click();
   else if(e.key==='r'||e.key==='R')$('#recite').click();
  });
  addEventListener('resize',resize);
  addEventListener('mousemove',parallax);
  poemBox.onclick=()=>show(idx+1);
 }
 function init(){
  buildScenes();buildPoem();buildActs();bind();resize();
  const h=(location.hash||'').replace(/[^0-9]/g,'');
  show(h?parseInt(h,10)-1:0,true);loop();
 }
 return {init};
})();
InkStage.init();
</script>
