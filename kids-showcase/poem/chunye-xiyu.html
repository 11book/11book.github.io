<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>春夜喜雨 · 意境闯关</title>
<style>
:root{
  --ink:#141a24; --ink2:#2b3646; --ink3:#4b5c74; --ink4:#7b8ca4;
  --paper:#e9eff7; --paper2:#c8d6e6;
  --sky1:#33507a; --sky2:#4d6b98; --sky3:#88a2c4;
  --gold:#e0b06a; --rose:#d2727e; --jade:#7fae93;
  --kai:'Kaiti SC','STKaiti','KaiTi','Songti SC','Noto Serif CJK SC',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1420;overflow:hidden;
  font-family:var(--kai);color:var(--paper);user-select:none}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;padding:14px 22px;
  display:flex;align-items:flex-start;gap:18px;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,14,24,.62),rgba(8,14,24,0))}
#brand{pointer-events:none}
#brand .t{font-size:clamp(20px,2.4vw,30px);letter-spacing:.28em;color:#f0f5fb;
  text-shadow:0 2px 14px rgba(0,0,0,.7)}
#brand .a{font-size:12px;letter-spacing:.3em;color:#9fb2c9;margin-top:3px}
#chapters{display:flex;gap:8px;margin-left:auto;pointer-events:auto;flex-wrap:wrap}
.chip{font-size:13px;letter-spacing:.12em;padding:5px 13px;cursor:pointer;
  border:1px solid rgba(200,220,245,.28);border-radius:2px;
  background:rgba(12,20,32,.42);color:#b8c9dd;transition:.25s;white-space:nowrap}
.chip:hover{background:rgba(40,60,92,.6);color:#fff;border-color:rgba(200,225,255,.55)}
.chip.on{background:rgba(215,232,255,.92);color:#101a28;border-color:transparent;font-weight:600}
.chip.lock{opacity:.4;cursor:not-allowed}
.chip .n{font-size:11px;opacity:.7;margin-right:4px}

/* quest bar */
#quest{position:absolute;left:22px;bottom:78px;z-index:20;max-width:min(46vw,430px);
  pointer-events:none;transition:.35s}
#quest .card{background:rgba(10,17,28,.72);border:1px solid rgba(190,215,245,.22);
  border-left:3px solid var(--gold);padding:11px 16px;border-radius:2px;
  backdrop-filter:blur(3px)}
#quest .lb{font-size:11px;letter-spacing:.3em;color:var(--gold)}
#quest .tx{font-size:14px;line-height:1.5;margin-top:4px;color:#e8f0fa}
#quest .pg{margin-top:8px;height:3px;background:rgba(255,255,255,.13)}
#quest .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f3dca6);
  width:0;transition:width .45s}
#quest.done .card{border-left-color:var(--jade)}
#quest.done .lb{color:var(--jade)}
#quest.done .pg i{background:var(--jade)}

/* collector */
#collect{position:absolute;right:22px;bottom:78px;z-index:20;text-align:right;pointer-events:none}
#collect .lb{font-size:11px;letter-spacing:.3em;color:#9fb2c9}
#collect .n{font-size:28px;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
#collect .n small{font-size:15px;color:#8fa2b9}
#collect .sub{font-size:12px;color:#7f92a9;letter-spacing:.1em}

/* toast */
#toast{position:absolute;left:50%;top:78px;transform:translateX(-50%) translateY(-16px);
  z-index:40;padding:9px 22px;background:rgba(12,20,32,.9);border:1px solid rgba(220,180,110,.5);
  color:#f3dca6;font-size:15px;letter-spacing:.1em;opacity:0;transition:.35s;pointer-events:none;
  border-radius:2px;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* bubble for hotspots */
#bubble{position:absolute;z-index:30;width:min(300px,72vw);padding:15px 18px;
  background:rgba(9,15,25,.93);border:1px solid rgba(190,215,245,.3);
  border-radius:3px;opacity:0;pointer-events:none;transition:.28s;
  box-shadow:0 16px 44px rgba(0,0,0,.55)}
#bubble.on{opacity:1;pointer-events:auto}
#bubble .h{font-size:17px;color:#f0f5fb;letter-spacing:.1em;display:flex;align-items:center;gap:8px}
#bubble .h i{width:7px;height:7px;border-radius:50%;background:var(--gold);font-style:normal}
#bubble .q{font-size:15px;line-height:1.6;color:#cfe0f2;margin-top:9px}
#bubble .x{position:absolute;right:11px;top:9px;cursor:pointer;color:#7f92a9;font-size:16px}
#bubble .x:hover{color:#fff}

/* quiz panel */
#quiz{position:absolute;inset:0;z-index:45;display:none;place-items:center;
  background:rgba(6,11,20,.72);backdrop-filter:blur(4px)}
#quiz.on{display:grid}
#quiz .box{width:min(620px,90vw);background:linear-gradient(180deg,rgba(18,27,42,.97),rgba(12,19,30,.97));
  border:1px solid rgba(200,220,245,.28);padding:30px 34px;border-radius:3px;
  box-shadow:0 30px 90px rgba(0,0,0,.6);animation:pop .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
#quiz .tag{font-size:11px;letter-spacing:.35em;color:var(--gold)}
#quiz .q{font-size:23px;line-height:1.8;margin:12px 0 20px;color:#f2f7fd;letter-spacing:.06em}
#quiz .q u{text-decoration:none;color:var(--gold);border-bottom:2px dashed rgba(224,176,106,.6);padding:0 4px}
#quiz .opts{display:flex;gap:10px;flex-wrap:wrap}
#quiz .opt{font-size:18px;padding:9px 20px;border:1px solid rgba(190,215,245,.3);
  background:rgba(30,44,66,.55);color:#e6eefa;cursor:pointer;border-radius:2px;transition:.2s}
#quiz .opt:hover{background:rgba(56,86,132,.8);border-color:rgba(200,225,255,.7);transform:translateY(-2px)}
#quiz .opt.ok{background:rgba(90,170,130,.75);border-color:#7fae93}
#quiz .opt.no{background:rgba(190,90,90,.7);border-color:#d2727e}
#quiz .fb{margin-top:16px;font-size:14px;color:#a8bdd4;min-height:20px}
#quiz .fb.ok{color:var(--jade)}
#quiz .fb.no{color:var(--rose)}
#quiz .next{margin-top:18px;font-size:14px;padding:8px 20px;border:1px solid rgba(224,176,106,.55);
  color:var(--gold);background:transparent;cursor:pointer;border-radius:2px;display:none}
#quiz .next:hover{background:rgba(224,176,106,.14)}

/* bottom bar */
#bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;
  display:flex;gap:0;align-items:center;opacity:.95;transition:.4s;
  box-shadow:0 2px 18px rgba(4,9,17,.45)}
#bar button{font-family:var(--kai);font-size:13px;letter-spacing:.14em;padding:6px 14px;
  background:rgba(12,20,33,.72);color:#dbe7f5;border:1px solid rgba(190,215,245,.34);
  border-right:none;cursor:pointer;transition:.22s}
#bar button:first-child{border-radius:2px 0 0 2px}
#bar button:last-child{border-radius:0 2px 2px 0;border-right:1px solid rgba(190,215,245,.24)}
#bar button:hover{background:rgba(48,72,110,.9);color:#fff;border-color:rgba(200,225,255,.55)}
#bar button.on{background:rgba(200,225,255,.9);color:#0f1723}

/* poem lines on stage */
.ln{pointer-events:none}
#heroText{font-family:var(--kai);font-size:52px;letter-spacing:.22em;fill:#fbfdff;
  paint-order:stroke;stroke:rgba(8,14,24,.62);stroke-width:10px}
#heroSub{font-family:var(--kai);font-size:17px;fill:#d5e4f4;
  paint-order:stroke;stroke:rgba(8,14,24,.55);stroke-width:6px}
#poemIndex{pointer-events:auto;cursor:pointer}
.pidx{transition:opacity .35s}
.pidx text{font-family:var(--kai)}

/* hotspot markers */
.hot{cursor:pointer}
.hot .ring{fill:rgba(224,176,106,.16);stroke:rgba(240,205,140,.85);stroke-width:1.6;
  transition:.25s;transform-box:fill-box;transform-origin:center}
.hot .dot{fill:#f0cd8c;transition:.25s}
.hot:hover .ring{fill:rgba(224,176,106,.36);stroke:#ffe0a8}
.hot:hover .dot{r:7}
.hot.got .ring{stroke:rgba(127,174,147,.9);fill:rgba(127,174,147,.18)}
.hot.got .dot{fill:#9fd0b4}
.hot.hide{display:none}

/* drop zone hint */
#hint{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:19;
  font-size:13px;letter-spacing:.14em;color:rgba(200,220,245,.72);pointer-events:none;
  background:rgba(8,14,24,.42);padding:5px 15px;border-radius:2px;transition:.3s}
#hint.hide{opacity:0}

/* draggable */
.drag{cursor:grab}
.drag:active{cursor:grabbing}

/* character motion */
@keyframes sway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.7deg)}}
.sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.85}50%{opacity:1}}
.flicker{animation:flicker 1.9s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(1700px)}}
.drift{animation:drift linear infinite}
@keyframes ripple{from{transform:scale(.2);opacity:.75}to{transform:scale(2.6);opacity:0}}
.ripple{animation:ripple 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}

@media (max-width:760px){
  #brand .a{display:none}
  #quest{left:12px;right:12px;bottom:70px;max-width:none}
  #collect{right:12px;bottom:132px}
  .ln text{font-size:34px}
}
</style>
</head>
<body>
<div id="app">
  <svg id="stage" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg>
  <canvas id="fx"></canvas>

  <div id="hud">
    <div id="brand"><div class="t">春夜喜雨</div><div class="a">唐 · 杜甫 &nbsp;|&nbsp; 意境闯关</div></div>
    <div id="chapters"></div>
  </div>

  <div id="quest"><div class="card">
    <div class="lb">任 务</div><div class="tx" id="qtx">—</div>
    <div class="pg"><i id="qpg"></i></div>
  </div></div>

  <div id="collect">
    <div class="lb">雨 珠</div>
    <div class="n"><span id="cn">0</span><small id="cm">/0</small></div>
    <div class="sub" id="cs">收集雨珠以解锁下一幕</div>
  </div>

  <div id="hint" class="hide"></div>
  <div id="toast"></div>

  <div id="bubble">
    <div class="x">✕</div>
    <div class="h"><i></i><span id="bt"></span></div>
    <div class="q" id="bq"></div>
  </div>

  <div id="quiz"><div class="box">
    <div class="tag">诗 句 闯 关</div>
    <div class="q" id="qq"></div>
    <div class="opts" id="qo"></div>
    <div class="fb" id="qf"></div>
    <button class="next" id="qn">继续 →</button>
  </div></div>

  <div id="bar">
    <button id="bPrev">◀ 上幕</button>
    <button id="bPlay">暂停</button>
    <button id="bNext">下幕 ▶</button>
    <button id="bQuiz">诗句闯关</button>
    <button id="bHelp">玩法</button>
  </div>
</div>

<script>
/* ============================================================
   春夜喜雨 · 意境闯关
   纯 SVG + Canvas + CSS，零位图。意象驱动渲染 + 游戏化交互。
   ============================================================ */
const W=1600, H=1000;

/* ---------- 诗与数据 ---------- */
const LINES=[
  {t:'好雨知时节，当春乃发生。',s:'好雨知道下雨的时节，正当春天万物萌发的时候。'},
  {t:'随风潜入夜，润物细无声。',s:'它随着风在夜里悄悄潜来，无声地滋润着万物。'},
  {t:'野径云俱黑，江船火独明。',s:'野外小路和云都是漆黑一片，只有江上渔船的灯火独自明亮。'},
  {t:'晓看红湿处，花重锦官城。',s:'清晨看那被雨打湿的花，红艳艳地开满成都城。'}
];
const SCENES=[
  {k:'night-cloud', name:'春夜云生', line:0, rain:'云气酿雨', tip:'点击落下的雨珠，收集它们'},
  {k:'rain',        name:'随风潜入', line:1, rain:'潜入夜雨', tip:'拖动画面改变风向，让雨随风潜入'},
  {k:'sprout',      name:'润物无声', line:1, rain:'细雨润苗', tip:'点苗上的水珠，看它慢慢长高'},
  {k:'boat',        name:'江船火明', line:2, rain:'江上烟雨', tip:'拖动灯笼，让渔火照亮水面'},
  {k:'dawn',        name:'晓看红湿', line:3, rain:'晓风残雨', tip:'点开名句，填出那个字'}
];
const HOTSPOTS={
  0:[{n:'云',q:'好雨知时节——雨不是偶然落下，是懂得时令的云先酝酿好了它。'},
     {n:'时',q:'“时节”是节令、时令。杜甫写雨，暗写的是对农时、对春天生机的牵挂。'},
     {n:'发生',q:'“发生”在这里是“催发万物生长”的意思，不是“出事”。'}],
  1:[{n:'随风潜入',q:'雨不是硬砸下来，是趁着夜风悄悄潜入——这是农人最需要的润物细无声。'},
     {n:'细无声',q:'好雨落在地上几乎没有声音，润物也从不喧哗。'},
     {n:'农人',q:'戴斗笠的农人冒雨而来，他等的正是这样一场不吵不闹的雨。'}],
  2:[{n:'润物细无声',q:'万物被润泽却察觉不到，这是诗里最温柔的一层。'},
     {n:'新芽',q:'雨后新芽破土而出，芽尖的露珠就是那场无声细雨留下的记号。'},
     {n:'泥土',q:'春雨落下先入土，再养根，最后才看得见芽。'}],
  3:[{n:'江船火独明',q:'四野漆黑，唯有江上一豆灯火——这“独明”里有孤独，也有温暖。'},
     {n:'渔翁',q:'披蓑戴笠的老翁，摇橹归来，一船灯火在雨里晃。'},
     {n:'倒影',q:'灯火落进江里，被水纹揉碎，又慢慢聚拢。'}],
  4:[{n:'红湿',q:'“红湿”写花被雨打湿后更红更沉，不是单纯的鲜红。'},
     {n:'花重',q:'雨水沉在花瓣上，花便“重”了，开得沉甸甸的。'},
     {n:'锦官城',q:'成都别称。杜甫在成都草堂写下此诗，题目是“喜”，喜的是雨，更是春。'}]
};
const QUIZ=[
  {q:'好雨知时节，<u>____</u>乃发生。',o:['当春','春风','暮春'],a:0,why:'“当春乃发生”＝正当春天万物萌发之时。'},
  {q:'随风潜入夜，<u>____</u>细无声。',o:['润物','滋养','无声'],a:0,why:'“润物细无声”是千古名句，润物即滋润万物。'},
  {q:'野径云俱黑，<u>____</u>火独明。',o:['江船','渔火','孤舟'],a:0,why:'江上渔船的灯火，是整首诗里唯一的光。'},
  {q:'晓看红湿处，<u>____</u>锦官城。',o:['花重','花落','花香'],a:0,why:'花被雨打湿而显得沉重饱满，故曰“花重”。'}
];

/* ---------- 状态 ---------- */
const state={
  scene:0, playing:true, t:0,
  rain:[], drops:[], ripples:[],
  gems:0, gemTarget:5, total:0, gemGot:[false,false,false,false,false],
  gotHot:[], sceneDone:[false,false,false,false,false],
  unlocked:1,
  wind:0, windTarget:0,
  lantern:{x:0,y:0}, sproutH:0,
  quizDone:[false,false,false,false]
};
const svg=document.getElementById('stage');
const fx=document.getElementById('fx'), fxc=fx.getContext('2d');
let Wpx=1600, Hpx=1000;

/* ---------- 工具 ---------- */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);
  if(attrs)for(const k in attrs)n.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(n);return n;}
function $(id){return document.getElementById(id);}
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;
  return ()=>((s=s*16807%2147483647)-1)/2147483646;}
const lerp=(a,b,t)=>a+(b-a)*t;

/* ============================================================
   一、笔法生成器（矢量水墨）
   ============================================================ */
// 披麻皴：长弧线，成组
function cun(x,y,w,h,seed,color,op,n){
  const r=rnd(seed);n=n||Math.floor(h/16)+8;let o='';
  for(let i=0;i<n;i++){
    const sx=x+r()*w, sy=y+r()*h*0.35;
    const len=(h*0.5+r()*h*0.55), sw=0.7+r()*1.5;
    const cx=sx+len*0.22+r()*12, cy=sy+len*0.55;
    o+=`<path d="M${sx.toFixed(1)} ${sy.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${(sx+len*0.12).toFixed(1)} ${(sy+len).toFixed(1)}" stroke="${color}" stroke-width="${sw.toFixed(2)}" fill="none" opacity="${(0.35+r()*0.5).toFixed(2)}" stroke-linecap="round"/>`;
  }return o;
}
// 点苔
function moss(x,y,w,h,seed,color,op,n){
  const r=rnd(seed);n=n||14;let o='';
  for(let i=0;i<n;i++){
    const px=x+r()*w, py=y+r()*h, s=1.6+r()*3.4;
    o+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${s.toFixed(1)}" ry="${(s*0.62).toFixed(1)}" fill="${color}" opacity="${(0.3+r()*0.5).toFixed(2)}" transform="rotate(${(r()*90-45).toFixed(0)} ${px.toFixed(1)} ${py.toFixed(1)})"/>`;
  }return o;
}
// 飞白：枯笔丝缕
function flying(x,y,w,h,seed,color,op,n){
  const r=rnd(seed);n=n||18;let o='';
  for(let i=0;i<n;i++){
    const px=x+r()*w, py=y+r()*h*.5, len=18+r()*70;
    o+=`<path d="M${px.toFixed(1)} ${py.toFixed(1)} q${(len*0.5).toFixed(1)} ${(r()*10-5).toFixed(1)} ${len.toFixed(1)} ${(r()*6-3).toFixed(1)}" stroke="${color}" stroke-width="${(0.6+r()*1.1).toFixed(2)}" fill="none" opacity="${(0.2+r()*0.45).toFixed(2)}"/>`;
  }return o;
}
// 长斜笔
function slant(x,y,w,h,seed,color,op,n,ang){
  const r=rnd(seed);n=n||10;let o='';
  for(let i=0;i<n;i++){
    const px=x+r()*w, py=y+r()*h;
    o+=`<path d="M${px.toFixed(1)} ${py.toFixed(1)} l${(ang||50).toFixed(0)} ${(ang||50)*0.5}" stroke="${color}" stroke-width="${(0.5+r()*1.3).toFixed(2)}" fill="none" opacity="${(0.15+r()*0.4).toFixed(2)}"/>`;
  }return o;
}
// 墨点飞溅
function burst(cx,cy,r0,seed,color,n){
  const r=rnd(seed);n=n||18;let o='';
  for(let i=0;i<n;i++){
    const a=r()*Math.PI*2, d=r()*r0, s=0.6+r()*2.4;
    o+=`<circle cx="${(cx+Math.cos(a)*d).toFixed(1)}" cy="${(cy+Math.sin(a)*d).toFixed(1)}" r="${s.toFixed(1)}" fill="${color}" opacity="${(0.25+r()*0.5).toFixed(2)}"/>`;
  }return o;
}

/* ============================================================
   二、人物系统 —— 白描 + 淡墨 + 淡赭，有形象不黑影
   ============================================================ */
const INK='#151b26', INK2='#2f3c50', INK3='#5a6c85', SKIN='#d7b79a', SKIN2='#b9937a';
/* 通用人物：返回 <g> 内容字符串
   x,y = 脚下位置；s = 缩放；pose = 'stand'|'walk'|'sit'|'row'
   颜色层次：轮廓浓墨 / 衣纹淡墨 / 面部淡赭 —— 不使用纯黑实心 */
function figure(o){
  const s=o.s||1, P=o.pose||'stand';
  const robe=o.robe||'#44577a', robe2=o.robe2||'#2a3549', trim=o.trim||'#d6e2ef';

function buildPoem(){

  const t=el('text',{id:'heroText',x:800,y:158,'text-anchor':'middle',mask:'url(#pmHero)'},hero);
  const s2=el('text',{id:'heroSub',x:800,y:206,'text-anchor':'middle'},hero);
  // 右侧诗卷索引（像展开的手卷）
  const idx=el('g',{id:'poemIndex'},g);
  el('rect',{x:1284,y:250,width:276,height:262,rx:3,fill:'rgba(7,12,21,.42)',
    stroke:'rgba(190,215,245,.1)','stroke-width':1},idx);
  LINES.forEach((L,i)=>{
    const y=286+i*62;
    const gg=el('g',{class:'pidx','data-i':i},idx);
    el('rect',{x:1296,y:y-26,width:252,height:40,rx:2,fill:'rgba(8,14,24,.6)',
      stroke:'rgba(190,215,245,.16)','stroke-width':1},gg);
    el('circle',{cx:1314,cy:y-6,r:3,fill:'#e0b06a',opacity:.45},gg);
    const tx=el('text',{x:1328,y:y,'font-size':17.5,fill:'#dbe6f2','letter-spacing':'1.5'},gg);
    tx.textContent=L.t;
  });
  // 进度点
  const pr=el('g',{id:'poemDots'},g);
  for(let i=0;i<4;i++){
    el('circle',{class:'pdot','data-i':i,cx:800-i*22+33,cy:238,r:4.5,fill:'#e0b06a',opacity:.3},pr);
  }
}
function brushIn(i){
  const t=svg.querySelector('#heroText'), m=svg.querySelector('#pmHero rect');
  if(!t||!m)return;
  t.textContent=LINES[i].t;
  const s2=svg.querySelector('#heroSub'); if(s2)s2.textContent=LINES[i].s;
  let st=null;
  const step=(ts)=>{
    if(!st)st=ts;
    const k=Math.min(1,(ts-st)/1400);
    const e=k<.55?2*k*k:1-Math.pow(-2*k+2,2)/2;
    m.setAttribute('width',(1600*e).toFixed(1));
    t.setAttribute('opacity',k<1?.4+.6*e:1);
    if(s2)s2.setAttribute('opacity',k<1?.2+.72*e:.92);
    if(k<1)requestAnimationFrame(step);
    else{m.setAttribute('width',1600);t.setAttribute('opacity',1);if(s2)s2.setAttribute('opacity',.92);}
  };
  requestAnimationFrame(step);
}
function setLineStates(cur){
  const t=svg.querySelector('#heroText'), s2=svg.querySelector('#heroSub');
  if(t){t.textContent=LINES[cur].t;t.setAttribute('opacity',1);}
  if(s2){s2.textContent=LINES[cur].s;s2.setAttribute('opacity',.92);}
  svg.querySelectorAll('.pidx').forEach(g=>{
    g.style.cursor='pointer';
    g.onclick=()=>{const i=+g.dataset.i;setLineStates(i);brushIn(i);};
    const i=+g.dataset.i, on=i===cur;
    g.setAttribute('opacity',on?1:.42);
    const tx=g.querySelector('text');
    tx.setAttribute('fill',on?'#fff':'#9fb4cc');
    tx.setAttribute('font-size',on?21:18);
    const r=g.querySelector('rect');
    r.setAttribute('fill',on?'rgba(224,176,106,.16)':'rgba(10,18,30,.34)');
    r.setAttribute('stroke',on?'rgba(240,205,140,.7)':'rgba(190,215,245,.16)');
    const c=g.querySelector('circle');
    c.setAttribute('opacity',on?1:.4); c.setAttribute('r',on?5:3.4);
  });
  svg.querySelectorAll('.pdot').forEach(c=>{
    const i=+c.dataset.i;
    c.setAttribute('opacity',i===cur?1:.28);
    c.setAttribute('r',i===cur?6:4);
  });
}

/* ============================================================
   六、Canvas 粒子：雨丝 + 可收集雨珠
   ============================================================ */
function resize(){
  Wpx=fx.clientWidth; Hpx=fx.clientHeight;
  fx.width=Wpx; fx.height=Hpx;
}
addEventListener('resize',resize);

function initRain(){
  state.rain=[]; state.drops=[];
  for(let i=0;i<190;i++) state.rain.push({
    x:Math.random()*Wpx,y:Math.random()*Hpx,l:12+Math.random()*30,
    v:6+Math.random()*9,w:.7+Math.random()*.9,a:.1+Math.random()*.28
  });
  state.drops=[];
  for(let i=0;i<12;i++) state.drops.push(mkDrop());
}
function mkDrop(){
  return {x:60+Math.random()*(Wpx-120),y:80+Math.random()*(Hpx*.6),
    r:13+Math.random()*5,vy:1.2+Math.random()*1.4,ph:Math.random()*6.28,got:false};
}
function drawRain(dt){
  fxc.clearRect(0,0,Wpx,Hpx);
  const wx=state.wind;
  fxc.lineCap='round';
  for(const r of state.rain){
    r.y+=r.v*dt; r.x+=wx*r.v*dt*.42;
    if(r.y>Hpx+30){r.y=-30;r.x=Math.random()*Wpx;}
    if(r.x>Wpx+40)r.x-=Wpx+80; if(r.x<-40)r.x+=Wpx+80;
    const dx=wx*.55;
    fxc.strokeStyle=`rgba(206,228,250,${Math.min(1,r.a*1.25)})`;
    fxc.lineWidth=r.w*1.15;
    fxc.beginPath(); fxc.moveTo(r.x,r.y); fxc.lineTo(r.x+dx,r.y+r.l); fxc.stroke();
  }
  // 雨珠（可点）
  for(const d of state.drops){
    if(d.got)continue;
    d.y+=d.vy*dt; d.ph+=dt*2.2;
    if(d.y>Hpx-40){d.y=60;d.x=40+Math.random()*(Wpx-80);}
    const p=.55+.45*Math.sin(d.ph);
    const g=fxc.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*2.4);
    g.addColorStop(0,`rgba(255,244,214,${.55*p})`);
    g.addColorStop(.35,`rgba(238,190,116,${.18*p})`);
    g.addColorStop(1,'rgba(238,186,108,0)');
    fxc.fillStyle=g; fxc.beginPath(); fxc.arc(d.x,d.y,d.r*3,0,7); fxc.fill();
    fxc.fillStyle=`rgba(255,250,230,${.72*p})`;
    fxc.beginPath(); fxc.arc(d.x,d.y,d.r*.55,0,7); fxc.fill();
  }
  // 涟漪
  for(const rp of state.ripples){
    rp.t+=dt; const k=rp.t/2.4;
    if(k>=1){state.ripples.splice(state.ripples.indexOf(rp),1);continue;}
    fxc.strokeStyle=`rgba(200,225,250,${(1-k)*.5})`;
    fxc.lineWidth=1.6;
    fxc.beginPath(); fxc.arc(rp.x,rp.y,6+k*46,0,7); fxc.stroke();
  }
}

/* ============================================================
   七、交互：雨珠收集 / 热点 / 拖拽 / 闯关
   ============================================================ */
function toast(t){const n=$('toast');n.textContent=t;n.classList.add('on');
  clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('on'),1900);}

function addGem(n){
  state.gems=Math.min(state.gemTarget,state.gems+n);
  state.total+=n;
  updateCollect();
  const sc=SCENES[state.scene];
  if(state.gems>=state.gemTarget && !state.sceneDone[state.scene]){
    state.sceneDone[state.scene]=true;
    if(state.unlocked<5){state.unlocked++;buildChapters();}
    toast('✓ '+sc.name+' 已通 · 下一幕解锁');
  }
  updateQuest();
}
function updateCollect(){
  $('cn').textContent=state.gems;
  $('cm').textContent='/'+state.gemTarget;
  $('cs').textContent=state.gems>=state.gemTarget?'本幕已通 · 累计 '+state.total+' 颗':'收集雨珠以解锁下一幕';
}
function updateQuest(){
  const sc=SCENES[state.scene];
  const q=$('qtx'), p=$('qpg'), box=$('quest');
  let txt='',pg=0,done=false;

let dragMode=null, dragOff={x:0,y:0};
svg.addEventListener('pointerdown',e=>{

  if(!t)return;
  const r=svg.getBoundingClientRect();

  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const loc=pt.matrixTransform(m);
  if(dragMode==='lamp'){
    dragOff.x=loc.x-(900+state.lantern.x);
    dragOff.y=loc.y-(700+state.lantern.y);
  }else{

});

svg.addEventListener('pointerup',e=>{

/* ============================================================
   十、循环
   ============================================================ */
let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000); last=ts;
  state.t+=dt;
  tmx+=(mx-tmx)*.05; tmy+=(my-tmy)*.05;
  // 视差
  svg.querySelectorAll('#sceneLayer .pf').forEach(g=>{
    const d=+g.dataset.depth||0;
    g.setAttribute('transform',`translate(${(tmx*d).toFixed(2)},${(tmy*d*.5).toFixed(2)})`);
  });
  drawRain(dt);
  // 灯笼跟随 + 倒影
  if(SCENES[state.scene].k==='boat'){
    const lamp=$('lamp'), rf=$('reflect');
    if(lamp){
      const tx=900+state.lantern.x, ty=700+state.lantern.y;
      lamp.setAttribute('transform',`translate(${tx},${ty})`);
      if(rf){
        // 破碎倒影：按波纹错位的短笔触，不用直光柱
        const w=Math.sin(Date.now()/560)*2.6;
        const frags=[];
        for(let k=0;k<11;k++){
          const o=4+k*10;                       // 距光源纵向距离
          const spread=6+o*.42;                // 越远越散
          const j=(k%2?1:-1)*(1.5+k*.9)+w*(1+k*.12);
          const lw=Math.max(1,3.6-k*.26);
          const alpha=(.72-k*.055);
          const warm=k<4;
          const col=warm?'#f4c274':(k<7?'#d8a464':'#9fb0c4');
          frags.push(`<path d="M${(-spread*.5+j).toFixed(1)} ${o} q${(spread*.5).toFixed(1)} ${(j>0?2.4:-2).toFixed(1)} ${spread.toFixed(1)} 0"
            stroke="${col}" stroke-width="${lw.toFixed(2)}" fill="none" opacity="${alpha.toFixed(2)}" stroke-linecap="round"/>`);
        }
        rf.innerHTML=`<g transform="translate(${tx},798)">
          <ellipse cx="0" cy="10" rx="26" ry="46" fill="url(#lampG)" opacity=".26"/>
          ${frags.join('')}
          <ellipse cx="0" cy="6" rx="11" ry="4" fill="#ffe6b4" opacity=".5"/>
        </g>`;
      }
    }
  }
  // 嫩芽生长
  if(SCENES[state.scene].k==='sprout' && state.sproutH!==state._lastSh){
    state._lastSh=state.sproutH; buildSprouts(); updateQuest();
  }
  requestAnimationFrame(loop);
}

   十一、控制条 & 初始化
   ============================================================ */
$('bPrev').onclick=()=>setScene(Math.max(0,state.scene-1));
$('bNext').onclick=()=>{ if(state.scene+1<state.unlocked)setScene(state.scene+1); else toast('先收集雨珠解锁下一幕'); };
$('bPlay').onclick=e=>{ state.playing=!state.playing; e.target.textContent=state.playing?'暂停':'播放'; };
$('bQuiz').onclick=()=>openQuiz(SCENES[state.scene].line);
$('bHelp').onclick=()=>{
  showBubble('玩法','① 点雨珠收集（每幕 5 颗）② 点光圈看注释 ③ 拖画面改风向／拖灯笼 ④ 「诗句闯关」补名句',
    800,300);
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){$('bNext').click();}
  else if(e.key==='ArrowLeft'){$('bPrev').click();}
  else if(e.key===' '){e.preventDefault();$('bPlay').click();}
  else if(e.key==='Escape'){$('quiz').classList.remove('on');$('bubble').classList.remove('on');}
  else if(e.key==='r'||e.key==='R'){initRain();}
});

addEventListener('hashchange',()=>{
  const h=parseInt((location.hash||'').replace('#',''),10);
  if(h>=1&&h<=5){state.unlocked=5;if(h-1!==state.scene)setScene(h-1);}
});
function init(){
  resize(); initRain();
  state.gemTarget=5;
  const h=parseInt((location.hash||'').replace('#',''),10);
  if(h>=1&&h<=5){state.unlocked=5;state.hashScene=h-1;}
  buildStage(); buildPoem(); buildChapters();
  setLineStates(SCENES[0].line); brushIn(0);
  buildSprouts(); buildPuddles(); buildBranch(); buildBirds(); buildHotspots();
  updateCollect(); updateQuest();
  $('bPlay').textContent='暂停';
  const hint=$('hint'); hint.textContent=SCENES[0].tip; hint.classList.remove('hide');
  setTimeout(()=>hint.classList.add('hide'),4600);
  requestAnimationFrame(loop);
  if(h>=1&&h<=5)setScene(state.hashScene);
}
window.__STATE=state; window.__GAME={setScene,addGem,openQuiz,buildHotspots};
init();
</script>
</body>
