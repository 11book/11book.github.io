<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>春夜喜雨 · 水墨长卷</title>
<style>
:root{
  --ink:#05080f; --ink2:#0b1220; --ink3:#141d2e;
  --paper:#e8e2d4; --dim:#9fb0c6; --gold:#c9a86a; --gold2:#e6cf9a;
  --cinnabar:#b8452f; --cyan:#7fb6d6;
  --hair:rgba(201,168,106,.34);
  --pan:rgba(6,10,18,.78);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#04060b;
  font-family:"Songti SC","STSong","Kaiti SC","STKaiti",serif;color:var(--paper);
  -webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;
  cursor:grab;touch-action:none}
#stage.dragging{cursor:grabbing}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* ---------- 后期层 ---------- */
#grade{position:absolute;inset:0;pointer-events:none;z-index:7;
  background:radial-gradient(122% 96% at 50% 44%,transparent 48%,rgba(3,6,13,.38) 86%,rgba(2,3,8,.68) 100%);
  mix-blend-mode:multiply}
#fog{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.85}
#flash{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;
  background:radial-gradient(60% 60% at 50% 45%,rgba(255,232,190,.5),transparent 70%)}

/* 电影黑边 */
.bar{position:absolute;left:0;right:0;height:0;background:#04060b;z-index:9;
  pointer-events:none;transition:height .7s cubic-bezier(.22,1,.36,1)}
#barT{top:0}#barB{bottom:0}
body.cine .bar{height:8.5vh}

/* ---------- 载入 ---------- */
#load{position:absolute;inset:0;z-index:40;background:#04060b;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .8s ease}
#load.gone{opacity:0;pointer-events:none}
#load h1{margin:0;font-size:34px;font-weight:400;letter-spacing:.5em;text-indent:.5em;
  color:var(--paper);opacity:.95}
#load p{margin:0;font-size:13px;letter-spacing:.36em;text-indent:.36em;color:var(--dim);opacity:.7}
#lbar{width:240px;height:1px;background:rgba(255,255,255,.13);position:relative;overflow:hidden}
#lbar i{position:absolute;left:0;top:0;height:100%;width:0;background:var(--gold);
  transition:width .3s ease}

/* ---------- HUD 通用 ---------- */
.hud{position:absolute;z-index:20;pointer-events:none;
  background:var(--pan);border:1px solid var(--hair);
  backdrop-filter:blur(9px) saturate(1.1);-webkit-backdrop-filter:blur(9px)}
.hud *{pointer-events:auto}
.ttl{font-size:11px;letter-spacing:.34em;text-indent:.34em;color:var(--gold);
  opacity:.92;text-transform:uppercase}

/* 任务面板 */
#quest{left:20px;top:20px;width:274px;padding:14px 16px 15px;
  border-left:2px solid var(--cinnabar)}
#qTitle{font-size:17px;letter-spacing:.08em;margin:9px 0 6px;color:#f0e9d8}
#qDesc{font-size:12.5px;line-height:1.85;color:var(--dim)}
#qProg{display:flex;gap:5px;margin-top:12px}
#qProg i{flex:1;height:3px;background:rgba(255,255,255,.13);transition:background .4s}
#qProg i.on{background:var(--gold)}
#qSteps{margin-top:11px;font-size:11px;color:rgba(159,176,198,.62);letter-spacing:.06em;
  line-height:1.9;max-height:126px;overflow:hidden}
#qSteps b{color:var(--gold2);font-weight:400}
#qSteps .done{opacity:.45;text-decoration:line-through}

/* 目标箭头 */
#marker{position:absolute;z-index:22;pointer-events:none;width:0;height:0;
  opacity:0;transition:opacity .3s}
#marker .ring{position:absolute;left:-15px;top:-15px;width:30px;height:30px;
  border:1px solid var(--gold);border-radius:50%;animation:mk 2s ease-in-out infinite}
#marker .arw{position:absolute;left:-7px;top:-34px;width:0;height:0;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-bottom:10px solid var(--gold);filter:drop-shadow(0 0 5px rgba(201,168,106,.6))}
#marker .dot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;background:var(--gold);
  border-radius:50%}
#marker .dist{position:absolute;left:-30px;top:20px;width:60px;text-align:center;
  font-size:10px;letter-spacing:.1em;color:var(--gold2)}
@keyframes mk{0%,100%{transform:scale(.82);opacity:.95}50%{transform:scale(1.12);opacity:.45}}

/* 顶栏 */
#top{right:20px;top:20px;padding:12px 18px;min-width:212px;text-align:right}
#stars{font-size:19px;letter-spacing:.16em;color:var(--gold2);margin-top:7px}
#stars span{opacity:.22;transition:opacity .45s,text-shadow .45s}
#stars span.on{opacity:1;text-shadow:0 0 12px rgba(230,207,154,.65)}
#tLabel{font-size:12.5px;color:var(--dim);letter-spacing:.2em;margin-top:9px;
  padding-top:9px;border-top:1px solid rgba(201,168,106,.16)}

/* 时间轴 */
#time{left:50%;transform:translateX(-50%);bottom:20px;width:min(720px,74vw);
  padding:13px 20px 16px}
#tHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
#tHead .r{font-size:11px;color:rgba(159,176,198,.66);letter-spacing:.16em}
#track{position:relative;height:30px;cursor:ew-resize}
#track .rail{position:absolute;left:0;right:0;top:13px;height:1px;
  background:linear-gradient(90deg,rgba(127,182,214,.35),rgba(201,168,106,.5),rgba(217,154,92,.6))}
#track .knob{position:absolute;top:5px;width:17px;height:17px;margin-left:-8.5px;
  border:1px solid var(--gold2);background:rgba(10,16,28,.9);border-radius:50%;
  box-shadow:0 0 13px rgba(201,168,106,.55);transition:transform .18s}
#track:hover .knob{transform:scale(1.18)}
#track .tick{position:absolute;top:8px;width:1px;height:5px;background:rgba(201,168,106,.4)}
#track .lab{position:absolute;top:19px;transform:translateX(-50%);font-size:10.5px;
  color:rgba(159,176,198,.5);letter-spacing:.12em;white-space:nowrap}
#track .lab.act{color:var(--gold2)}
#tSub{font-size:11px;color:rgba(159,176,198,.58);margin-top:26px;letter-spacing:.08em;
  min-height:15px;text-align:center}

/* 风仪盘 */
#wind{left:20px;bottom:20px;width:150px;padding:11px 13px 10px}
#windDial{margin-top:8px;cursor:ew-resize;touch-action:none}
#windSvg{width:100%;height:auto;display:block;overflow:visible}
#windArrow{transition:transform .12s}
#windVal{text-align:center;margin-top:2px}

/* 小地图 */
#mini{right:20px;bottom:20px;width:206px;height:74px;padding:8px 10px}
#mini canvas{width:100%;height:100%;display:block}
#mini .cap{position:absolute;left:10px;top:5px;font-size:9px;letter-spacing:.28em;
  color:rgba(201,168,106,.6)}

/* 诗句索引 */
#idx{right:20px;top:132px;width:212px;padding:12px 4px 12px 12px;max-height:44vh;overflow:auto}
#idx .ln{font-size:13px;line-height:2.05;color:rgba(232,226,212,.62);cursor:pointer;
  padding-left:11px;border-left:1px solid transparent;transition:.25s;letter-spacing:.05em}
#idx .ln:hover{color:var(--paper);background:rgba(201,168,106,.07)}
#idx .ln.act{color:var(--gold2);border-left-color:var(--gold);
  background:linear-gradient(90deg,rgba(201,168,106,.13),transparent)}

/* 提示气泡 */
#bub{position:absolute;z-index:24;max-width:290px;padding:13px 16px;
  background:rgba(8,13,23,.93);border:1px solid var(--hair);border-left:2px solid var(--gold);
  font-size:13px;line-height:1.92;color:#ded7c6;pointer-events:none;opacity:0;
  transition:opacity .22s;box-shadow:0 16px 44px rgba(0,0,0,.6)}
#bub.on{opacity:1}
#bub .bn{font-size:14px;color:var(--gold2);letter-spacing:.1em;margin-bottom:5px}
#bub .bq{font-size:12px;color:rgba(159,176,198,.78);line-height:1.8}

/* 提示条 */
#toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);z-index:26;
  padding:10px 24px;background:rgba(8,13,23,.92);border:1px solid var(--hair);
  font-size:13.5px;letter-spacing:.08em;color:var(--paper);opacity:0;
  transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#toast .k{color:var(--gold2)}

/* 电影字幕 */
#subs{position:absolute;left:50%;transform:translateX(-50%);bottom:19vh;z-index:15;
  text-align:center;pointer-events:none;opacity:0;transition:opacity .7s}
#subs.on{opacity:1}
#subT{font-size:30px;letter-spacing:.3em;text-indent:.3em;color:#f2ecdc;
  text-shadow:0 3px 22px rgba(0,0,0,.85),0 0 46px rgba(120,160,200,.35)}
#subB{font-size:14px;letter-spacing:.24em;text-indent:.24em;color:rgba(210,224,240,.72);margin-top:11px}

/* 问答 */
#quiz{position:absolute;inset:0;z-index:34;display:none;align-items:center;
  justify-content:center;background:rgba(3,5,11,.76);backdrop-filter:blur(5px)}
#quiz.on{display:flex}
#qbox{width:min(560px,88vw);padding:30px 34px 26px;background:rgba(9,14,25,.96);
  border:1px solid var(--hair);box-shadow:0 26px 80px rgba(0,0,0,.72)}
#qbox .qt{font-size:20px;letter-spacing:.14em;margin-bottom:7px;color:#f2ebda}
#qbox .qs{font-size:12.5px;color:rgba(159,176,198,.72);margin-bottom:20px;line-height:1.85}
#opts{display:flex;flex-direction:column;gap:9px}
.opt{padding:11px 17px;border:1px solid rgba(201,168,106,.22);cursor:pointer;
  font-size:14.5px;letter-spacing:.06em;transition:.22s;background:rgba(255,255,255,.015)}
.opt:hover{border-color:var(--gold);background:rgba(201,168,106,.09);transform:translateX(3px)}
.opt.ok{border-color:#6fae7e;background:rgba(111,174,126,.15)}
.opt.no{border-color:var(--cinnabar);background:rgba(184,69,47,.15)}
.opt small{display:block;font-size:11px;color:rgba(159,176,198,.6);margin-top:4px;letter-spacing:.04em}

/* 帮助 */
#help{position:absolute;inset:0;z-index:36;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,11,.8)}
#help.on{display:flex}
#hbox{width:min(500px,88vw);padding:28px 32px;background:rgba(9,14,25,.96);
  border:1px solid var(--hair)}
#hbox h3{margin:0 0 16px;font-size:17px;font-weight:400;letter-spacing:.18em;color:var(--gold2)}
#hbox dl{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;margin:0;font-size:13px}
#hbox dt{color:var(--gold2);letter-spacing:.06em;white-space:nowrap}
#hbox dd{margin:0;color:rgba(159,176,198,.86);line-height:1.6}
#hbox .cl{margin-top:22px;text-align:center;font-size:12px;color:rgba(159,176,198,.6)}

@media (max-width:860px){
  #quest{width:222px;left:12px;top:12px;padding:11px 13px}
  #top{right:12px;top:12px;min-width:150px;padding:10px 13px}
  #idx{display:none}
  #mini{width:150px;height:56px;right:12px;bottom:12px}
  #wind{left:12px;bottom:12px;width:124px;padding:9px 10px}
  #time{width:92vw;bottom:12px}
}
</style>
</head>
<body>
<div id="app">

  <div class="hud" id="top">

  <div class="hud" id="time">

    <div id="track"><div class="rail"></div><div class="knob"></div></div>
    <div id="tSub"></div>
  </div>

  <div class="hud" id="mini"><div class="cap">长 卷 全 览</div><canvas id="mmc"></canvas></div>

  <div class="hud" id="idx"></div>

  <div id="bub"><div class="bn"></div><div class="bq"></div></div>
  <div id="toast"></div>
  <div id="subs"><div id="subT"></div><div id="subB"></div></div>

  <div id="quiz"><div id="qbox">
    <div class="ttl">诗 眼</div>
    <div class="qt"></div>
    <div class="qs"></div>
    <div id="opts"></div>
  </div></div>

  <div id="help"><div id="hbox">
    <h3>操 作</h3>
    <dl>
      <dt>拖动画面</dt><dd>左右拖动，走过长卷</dd>
      <dt>滚轮</dt><dd>放大 / 缩小视线</dd>
      <dt>拖动时辰尺</dt><dd>切换夜与晓</dd>
      <dt>← →</dt><dd>逐刻推移时间</dd>
      <dt>空格</dt><dd>自动播放时间</dd>
      <dt>W A S D</dt><dd>移动视线</dd>
      <dt>点击光点</dt><dd>查看注释 / 完成任务</dd>
      <dt>R</dt><dd>回到起手机位</dd>
      <dt>H</dt><dd>开关本帮助</dd>
    </dl>
    <div class="cl">— 点此关闭 —</div>
  </div></div>
</div>
<script>
const DEFS=`
  <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a3f63"/><stop offset=".45" stop-color="#435f88"/>
    <stop offset=".78" stop-color="#5d779c"/><stop offset="1" stop-color="#7d95b6"/>
  </linearGradient>
  <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">

  <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1">

  <radialGradient id="moonG"><stop offset="0" stop-color="#dfeaf8" stop-opacity=".55"/>

    <stop offset="1" stop-color="#7fa5cf" stop-opacity="0"/></radialGradient>
  <linearGradient id="dawnMist" x1="0" y1="0" x2="0" y2="1">

  </linearGradient>
  <radialGradient id="dawnG" cx=".72" cy=".78">

    <feGaussianBlur stdDeviation="1.1"/>

    <feTurbulence type="fractalNoise" baseFrequency="0.06 0.13" numOctaves="2" seed="19" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>

  <filter id="grain" x="0" y="0" width="100%" height="100%">

const INK='#151b26', INK2='#2f3c50', INK3='#5a6c85', SKIN='#d7b79a', SKIN2='#b9937a';

function cun(x,y,w,h,seed,color,op,n){
  const r=rnd(seed);n=n||Math.floor(h/16)+8;let o='';

  {t:0.00, sh:'子时', name:'万籁俱寂', sky:['#04070e','#0a1220'], glow:0.10, rain:0.00, moon:0.85, lamp:0.35, warm:0},
  {t:0.20, sh:'子时', name:'好雨知时节', sky:['#060b18','#101d33'], glow:0.18, rain:0.18, moon:0.72, lamp:0.45, warm:0},
  {t:0.42, sh:'丑时', name:'随风潜入夜', sky:['#070d1c','#0f1c31'], glow:0.14, rain:0.72, moon:0.42, lamp:0.72, warm:0},
  {t:0.62, sh:'寅时', name:'润物细无声', sky:['#08101f','#122036'], glow:0.12, rain:1.00, moon:0.26, lamp:0.92, warm:0},
  {t:0.82, sh:'寅时', name:'野径云俱黑', sky:['#04090f','#0a1220'], glow:0.08, rain:0.48, moon:0.14, lamp:1.00, warm:0},
  {t:0.93, sh:'卯时', name:'江船火独明', sky:['#131e36','#2b3c58'], glow:0.20, rain:0.22, moon:0.06, lamp:0.95, warm:0.34},
  {t:1.00, sh:'卯时', name:'晓看红湿处', sky:['#4a5f80','#b9b2ab'], glow:0.50, rain:0.06, moon:0.00, lamp:0.45, warm:0.86}
];
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const rgb2hex=c=>'#'+c.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
function mixHex(a,b,k){const A=hex2rgb(a),B=hex2rgb(b);
  return rgb2hex([lerp(A[0],B[0],k),lerp(A[1],B[1],k),lerp(A[2],B[2],k)]);}
function gradeAt(t){
  let a=TIMEKEY[0], b=TIMEKEY[TIMEKEY.length-1];
  for(let i=0;i<TIMEKEY.length-1;i++){
    if(t>=TIMEKEY[i].t&&t<=TIMEKEY[i+1].t){a=TIMEKEY[i];b=TIMEKEY[i+1];break;}
  }
  const k=(t-a.t)/Math.max(1e-6,(b.t-a.t));
  return {
    sh:a.sh, name:k<.5?a.name:b.name,
    sky:[mixHex(a.sky[0],b.sky[0],k), mixHex(a.sky[1],b.sky[1],k)],
    glow:lerp(a.glow,b.glow,k), rain:lerp(a.rain,b.rain,k),
    moon:lerp(a.moon,b.moon,k), lamp:lerp(a.lamp,b.lamp,k), warm:lerp(a.warm,b.warm,k)
  };
}

/* ============================================================
   世界构建：一条横向长卷，分 5 层做视差
   ============================================================ */
const L={};            // 各层 <g>
function initLayers(){
  svg.innerHTML='';
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  const defs=el('defs',{},svg);
  defs.innerHTML=DEFS;
  // 根：world 承载相机变换
  const world=el('g',{id:'world'},svg);
  L.sky  = el('g',{id:'Lsky'},world);
  L.far  = el('g',{id:'Lfar'},world);
  L.mid  = el('g',{id:'Lmid'},world);
  L.near = el('g',{id:'Lnear'},world);
  L.fore = el('g',{id:'Lfore'},world);
  L.sky.setAttribute('class','lyr');
  L.far.setAttribute('class','lyr');
  L.mid.setAttribute('class','lyr');
  L.near.setAttribute('class','lyr');
  L.fore.setAttribute('class','lyr');
}

  for(let i=0;i<260;i++){

/* ---------- 远山层 ---------- */
function buildFar(){
  const g=L.far; g.innerHTML='';
  let s='';
  // 三道山脊，横向延展
  const ridges=[
    {y:600,amp:120,col:'#0e1a2b',op:.95,seed:31,n:16},
    {y:660,amp:96, col:'#0c1626',op:.97,seed:57,n:14},
    {y:730,amp:70, col:'#0a111e',op:.99,seed:83,n:12}
  ];
  ridges.forEach((r,ri)=>{
    let d=`M${-1200} ${r.y+40}`;
    for(let i=0;i<r.n;i++){
      const x0=-1200+i*(WORLDW+2400)/r.n;
      const w=(WORLDW+2400)/r.n;
      const pk=r.y-r.amp*(0.45+((i*37)%11)/16);
      d+=` L${(x0+w*.5).toFixed(0)} ${pk.toFixed(0)} L${(x0+w).toFixed(0)} ${(r.y+30-r.amp*0.25).toFixed(0)}`;
    }
    d+=` L${WORLDW+1200} 1100 L${-1200} 1100 Z`;
    s+=`<path d="${d}" fill="${r.col}" opacity="${r.op}"/>`;
    // 山体皴
    s+=`<g opacity=".42">${cun(-1200,r.y-70,WORLDW+2400,190,r.seed,'#04080f',.6,120)}</g>`;
    // 山脊高光
    s+=`<g opacity=".2" stroke="#7d99bb" stroke-width="1.1" fill="none">`;
    for(let i=0;i<r.n;i++){
      const x0=-1200+i*(WORLDW+2400)/r.n, w=(WORLDW+2400)/r.n;
      const pk=r.y-r.amp*(0.45+((i*37)%11)/16);
      s+=`<path d="M${(x0+w*.18).toFixed(0)} ${(pk+r.amp*.4).toFixed(0)} Q${(x0+w*.5).toFixed(0)} ${(pk-6).toFixed(0)} ${(x0+w*.82).toFixed(0)} ${(pk+r.amp*.36).toFixed(0)}"/>`;

  s+=`<g id="ridgeLit" opacity="0" fill="none" stroke="#e9b98a" stroke-width="2.2" stroke-linecap="round">`;
  ridges.forEach((r,ri)=>{
    for(let i=0;i<r.n;i++){
      const x0=-1200+i*(WORLDW+2400)/r.n, w=(WORLDW+2400)/r.n;
      const pk=r.y-r.amp*(0.45+((i*37)%11)/16);
      s+=`<path d="M${(x0+w*.2).toFixed(0)} ${(pk+r.amp*.42).toFixed(0)} Q${(x0+w*.5).toFixed(0)} ${(pk-5).toFixed(0)} ${(x0+w*.8).toFixed(0)} ${(pk+r.amp*.38).toFixed(0)}"/>`;
    }
  });
  s+=`</g>`;
  // 远寺
  s+=`<g opacity=".9" class="hot" data-hot="temple" data-q="temple" transform="translate(2260,596)">
    <path d="M-30 0 L30 0 L20 -26 L-20 -26Z" fill="#0b1220"/>

    <circle class="hit" cx="0" cy="-30" r="40" fill="transparent"/>

  g.innerHTML=s;
}

/* ============================================================
   相机：拖动 / 滚轮缩放 / 惯性 / 边界
   ============================================================ */
function camClamp(){
  const z=S.cam.z;
  const halfW=W/(2*z), halfH=H/(2*z);
  // 两端各留 260 世界单位余量，保证最右的碑与最左的云都能进画
  const PAD=260;
  const minX=Math.max(halfW, -PAD+halfW), maxX=WORLDW+PAD-halfW;
  const minY=Math.min(halfH, H*0.58), maxY=Math.max(minY, WORLDH+PAD-halfH);
  S.cam.x=clamp(S.cam.x, Math.min(minX,maxX), Math.max(minX,maxX));
  S.cam.y=clamp(S.cam.y, minY, Math.max(minY,maxY));
}
function applyCam(){
  const c=S.cam;
  const vx=c.x-W/2/c.z, vy=c.y-H/2/c.z, vw=W/c.z, vh=H/c.z;
  svg.setAttribute('viewBox',`${vx.toFixed(2)} ${vy.toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}`);
  // 视差：每层按系数偏移
  const base=-vx, baseY=-vy;
  L.sky.setAttribute('transform',`translate(${(base*(1-LW.sky)).toFixed(1)},${(baseY*(1-LW.sky)).toFixed(1)})`);
  L.far.setAttribute('transform',`translate(${(base*(1-LW.far)).toFixed(1)},${(baseY*(1-LW.far)).toFixed(1)})`);
  L.mid.setAttribute('transform',`translate(${(base*(1-LW.mid)).toFixed(1)},${(baseY*(1-LW.mid)).toFixed(1)})`);
  L.near.setAttribute('transform',`translate(${(base*(1-LW.near)).toFixed(1)},${(baseY*(1-LW.near)).toFixed(1)})`);
  L.fore.setAttribute('transform',`translate(${(base*(1-LW.fore)).toFixed(1)},${(baseY*(1-LW.fore)).toFixed(1)})`);
  // 雨层（屏幕空间）跟随
  if(fx) fx.style.transform=`translate(${(-vx*LW.mid*0.4).toFixed(1)}px,${(-vy*0.5).toFixed(1)}px)`;
  drawMini();
}
function flyTo(x,y,z,dur){

  const mg=document.getElementById('moonG');

    const mx=lerp(1180,3880,t), my=lerp(182,690,easeIO(t));
    document.getElementById('moonCore').setAttribute('cx',mx);document.getElementById('moonCore').setAttribute('cy',my);
    document.getElementById('moonDark').setAttribute('cx',mx-16);document.getElementById('moonDark').setAttribute('cy',my-10);

  const stars=document.getElementById('stars');

  // 云：被风推着走
  const cl=document.getElementById('clouds');

  // 晨光
  const dg=document.getElementById('dawnGlow');

  const rl=document.getElementById('ridgeLit');
  if(rl) rl.setAttribute('opacity',clamp((g.warm-0.08)*1.15,0,1).toFixed(2));
  // 灯笼亮度
  const lg=document.getElementById('lampGlow');
  if(lg) lg.setAttribute('opacity',(0.25+g.lamp*0.85).toFixed(2));
  const rf=document.getElementById('reflect');
  if(rf){rf.setAttribute('opacity',(0.12+g.lamp*0.5).toFixed(2));
    rf.setAttribute('transform',`translate(2960,${(760+S.lantern.y).toFixed(1)}) scale(${(0.8+g.lamp*0.5).toFixed(2)},1)`);}
  // 雨量
  S.rain=g.rain;
  // 风仪盘显示
  const wa=document.getElementById('windArrow');
  if(wa) wa.setAttribute('transform',`translate(60,27) rotate(${(-40+S.wind*80).toFixed(1)})`);
  const wv=document.getElementById('windVal');
  if(wv) wv.textContent=(S.wind<0.4?'东风':S.wind<0.62?'南风':'西风')+' · '+Math.round(S.wind*100)+'%';
  // 全局色调
  // 色调作用于主画面（不是暗角层）
  const stg=document.getElementById('stage');
  if(stg) stg.style.filter=
    `saturate(${(0.86+g.warm*0.40).toFixed(2)}) brightness(${(1.06+g.warm*0.22).toFixed(2)}) sepia(${(g.warm*0.16).toFixed(2)}) contrast(${(1.02+g.warm*0.04).toFixed(2)})`;
  document.getElementById('fog').style.background=
    `radial-gradient(120% 80% at 50% 30%,rgba(${g.warm>0.4?'210,150,110':'80,110,160'},${(0.05+g.warm*0.1).toFixed(3)}),transparent 70%)`;
  // HUD
  const lab=$('tPct'); if(lab) lab.textContent=g.sh+' · '+g.name;
  $('tLabel').textContent=g.sh+' · '+g.name;
  $('tSub').textContent = t>0.86?'天将明，花上还挂着昨夜的雨':'时辰尺可拖动 · 左右方向键逐刻推移';
  // 滑块位置
  const knob=document.querySelector('#track .knob');
  if(knob) knob.style.left=(t*100)+'%';
  document.querySelectorAll('#track .lab').forEach(l=>{
    l.classList.toggle('act', Math.abs(parseFloat(l.dataset.t)-t)<0.09);});
}

/* ============================================================
   雨：屏幕空间 canvas + 世界空间可收集雨珠
   ============================================================ */
let fx,fxCtx,drops=[],gems=[];
function initFX(){
  fx=$('fx'); fxCtx=fx.getContext('2d');
  resizeFX();
  window.addEventListener('resize',resizeFX);
  for(let i=0;i<170;i++) drops.push(mkDrop(true));
  buildGems();
}
function resizeFX(){
  if(!fx)return;
  const d=Math.min(2,window.devicePixelRatio||1);
  fx.width=innerWidth*d; fx.height=innerHeight*d;
  fxCtx.setTransform(d,0,0,d,0,0);
}
function mkDrop(init){
  return {x:Math.random()*innerWidth*1.4-200, y:init?Math.random()*innerHeight: -20,
    v:520+Math.random()*760, len:8+Math.random()*22, o:.12+Math.random()*.4,
    w:.6+Math.random()*1.1};
}
function drawRain(dt){
  if(!fxCtx)return;
  fxCtx.clearRect(0,0,innerWidth,innerHeight);
  const amt=S.rain;
  const n=Math.floor(drops.length*amt);
  const wind=S.wind*140-40;
  for(let i=0;i<n;i++){
    const d=drops[i];
    d.y+=d.v*dt; d.x+=wind*dt;
    if(d.y>innerHeight+30){Object.assign(d,mkDrop(false));}
    if(d.x>innerWidth+40) d.x=-40; if(d.x<-40) d.x=innerWidth+40;
    fxCtx.strokeStyle=`rgba(180,208,236,${d.o*(0.5+amt*0.7).toFixed(3)})`;
    fxCtx.lineWidth=d.w;
    fxCtx.beginPath();
    fxCtx.moveTo(d.x,d.y); fxCtx.lineTo(d.x-wind*0.028,d.y+d.len);
    fxCtx.stroke();
  }
}

/* ============================================================
   任务链
   ============================================================ */
function questState(){
  const q=S.quest, Q=QUESTS[q];
  switch(Q.id){
    case 'cloud':  return {p:Object.keys(S.hotGot).filter(k=>k.indexOf('cloud')===0).length, need:3};
    case 'poet':   return {p:S.hotGot.poet?1:0, need:1};
    case 'farmer': return {p:S.hotGot.farmer?1:0, need:1};
    case 'wind':   return {p:Math.round(S.wind*100), need:72};
    case 'gems':   return {p:S.gems, need:S.gemTotal};
    case 'sprout': return {p:S.sprouts, need:S.sproutMax};
    case 'boat':   return {p:S.hotGot.boat?1:0, need:1};
    case 'lamp':   return {p:Math.round(Math.hypot(S.lanternT.x-S.lamp0.x,S.lanternT.y-S.lamp0.y)), need:45};
    case 'dawn':   return {p:Math.round(clamp((Math.max(S.t,S.tTarget)-0.86)/0.14,0,1)*100), need:100};
    case 'poem':   return {p:S.quizOk?1:0, need:1};
  }
  return {p:0,need:1};
}
function renderQuest(){
  const Q=QUESTS[S.quest];
  const st=questState();
  $('qTitle').textContent=Q.t;
  $('qDesc').textContent=Q.d;
  const pr=$('qProg'); pr.innerHTML='';
  const n=Math.min(6,Math.max(1,st.need>6?5:st.need));
  for(let i=0;i<n;i++){const b=document.createElement('i');
    if(st.p/st.need>= (i+1)/n) b.className='on'; pr.appendChild(b);}
  $('qStep').textContent=Q.id==='wind'?(st.p+'%'):Q.id==='gems'?(st.p+'/'+st.need):Q.id==='dawn'?(st.p+'%'):Q.id==='sprout'?(st.p+'/'+st.need):(st.p>=st.need?'已完成':'进行中');
  // 步骤列表
  const sl=$('qSteps');
  const st2=questState();
  let html='';
  const lo=Math.max(0,S.quest-2), hi=Math.min(QUESTS.length,S.quest+4);
  for(let i=lo;i<hi;i++){
    const q=QUESTS[i];
    const cls=i<S.quest?'done':i===S.quest?'cur':'';
    const txt=i<S.quest?'✓ ':i===S.quest?'▸ ':'· ';
    html+=`<div class="${cls}">${txt}${q.t}</div>`;
  }
  sl.innerHTML=html;
  // 星星
  const stEl=$('stars');
  stEl.innerHTML=[0,1,2,3,4].map(i=>`<span class="${i<S.stars?'on':''}">★</span>`).join('');
  // 目标箭头
  updateMarker();
}
let markerTarget=null;
function setMarker(fn){markerTarget=fn;updateMarker();}
function updateMarker(){
  const m=$('marker');
  if(!markerTarget){m.style.opacity=0;return;}
  const p=markerTarget();
  if(!p){m.style.opacity=0;return;}
  m.style.opacity=1;
  m.style.left=p.x+'px'; m.style.top=p.y+'px';
  m.querySelector('.dist').textContent=p.d||'';
}
function subtitle(i){
  const s=$('subs');
  if(i==null){s.classList.remove('on');return;}
  $('subT').textContent=LINES[i].t;
  $('subB').textContent=LINES[i].b+'　—　杜甫';
  s.classList.add('on');
}
function toast(msg){
  const t=$('toast'); t.innerHTML=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600);
}
function advanceQuest(){
  const Q=QUESTS[S.quest];
  if(S.quest>=QUESTS.length-1) return;
  S.quest++;
  S.stars=Math.min(5,S.stars+1);
  document.body.classList.add('cine');
  setTimeout(()=>document.body.classList.remove('cine'),1400);
  const fl=$('flash'); fl.style.transition='none'; fl.style.opacity=.55;
  requestAnimationFrame(()=>{fl.style.transition='opacity .9s';fl.style.opacity=0;});
  toast('★ 达成 · <span class="k">'+Q.t+'</span>');
  renderQuest();
  setupMarkerForQuest();
}
function setupMarkerForQuest(){
  const Q=QUESTS[S.quest];
  const marks={
    cloud:()=>{const n=document.querySelector('#Lmid [data-hot="cloud"]');return n?worldToScreen(n):null;},
    poet:()=>{const n=document.querySelector('[data-hot="poet"]');return n?worldToScreen(n):null;},
    farmer:()=>{const n=document.querySelector('[data-hot="farmer"]');return n?worldToScreen(n):null;},
    wind:()=>{const n=document.getElementById('windInd');return n?worldToScreen(n):null;},
    gems:()=>{const g=gems.find(x=>!S.gemGot.includes(x.id));return g?worldToScreen(g.node):null;},
    sprout:()=>{const n=document.querySelector('#sprouts .sprout');return n?worldToScreen(n):null;},
    boat:()=>{const n=document.querySelector('[data-hot="boat"]');return n?worldToScreen(n):null;},
    lamp:()=>{const n=document.getElementById('lampG2');return n?worldToScreen(n):null;},
    dawn:()=>({x:innerWidth/2,y:innerHeight-96,d:'时辰尺'}),
    poem:()=>null
  };
  setMarker(marks[Q.id]||null);
}
function worldToScreen(node){
  if(!node)return null;
  const r=node.getBoundingClientRect();
  if(r.width===0&&r.height===0)return null;
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}

  const Q=QUIZ[key]; if(!Q)return;

  box.querySelector('.qs').textContent=Q.q;
  const wrap=box.querySelector('#opts'); wrap.innerHTML='';
  Q.opts.forEach(([t,d,ok],i)=>{
    const o=document.createElement('div'); o.className='opt';

  });

/* 命中规则：仅 .hit 可交互，其余装饰穿透，保证前景不遮挡目标 */
function applyHitRules(){
  const all=svg.querySelectorAll('*');
  for(let i=0;i<all.length;i++){
    const n=all[i];
    if(n.classList&&n.classList.contains('hit')){ n.style.pointerEvents='all'; continue; }
    if(n.closest&&n.closest('[data-sprout]')){ n.style.pointerEvents='none'; continue; }
    n.style.pointerEvents='none';
  }
}
function svgPt(evt){
  const p=svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function onDown(evt){
  const t=evt.target;
  // 拖拽元素优先
  const dr=t.closest? t.closest('[data-drag]'):null;
  if(dr){
    const kind=dr.getAttribute('data-drag');
    S.drag={kind,node:dr,startX:evt.clientX,startY:evt.clientY,
      lamp0:{x:S.lanternT.x,y:S.lanternT.y},wind0:S.wind};
    S.moved=0;
    evt.preventDefault();
    svg.classList.add('dragging');
    return;
  }
  S.drag={kind:'cam',startX:evt.clientX,startY:evt.clientY,
    cam0:{x:S.cam.x,y:S.cam.y},vx:0,vy:0,moved:0};
  svg.classList.add('dragging');
}
function onMove(evt){
  if(!S.drag)return;
  if(S.drag.kind==='cam'){
    const dx=evt.clientX-S.drag.startX, dy=evt.clientY-S.drag.startY;
    S.drag.moved=Math.max(S.drag.moved,Math.hypot(dx,dy));
    const k=1/S.cam.z;
    S.cam.x=S.drag.cam0.x-dx*k;
    S.cam.y=S.drag.cam0.y-dy*k;
    S.drag.vx=-dx*k; S.drag.vy=-dy*k;
    camClamp();
  } else if(S.drag.kind==='lamp'||S.drag.kind==='wind'){
    const dx=evt.clientX-S.drag.startX, dy=evt.clientY-S.drag.startY;
    S.drag.moved=Math.max(S.drag.moved,Math.hypot(dx,dy));
    if(S.drag.kind==='lamp'){
      S.lanternT.x=clamp(S.drag.lamp0.x+dx*0.7,-90,170);
      S.lanternT.y=clamp(S.drag.lamp0.y+dy*0.7,-130,70);
      checkQuest();
    } else {
      // 风向：屏幕水平位移 → 0..1
      S.wind=clamp(S.drag.wind0+dx/220,0,1);
      S.windT=S.wind;
      const wi=document.getElementById('windInd');
      if(wi) wi.setAttribute('transform',`translate(300,150) rotate(${(-52+S.wind*104).toFixed(1)})`);
    }
  }
}
function onUp(evt){
  const wasDrag=S.drag;
  S.drag=null;
  svg.classList.remove('dragging');
  if(!wasDrag)return;
  if(wasDrag.kind==='cam'&&wasDrag.moved>6){ S.inertia={vx:wasDrag.vx,vy:wasDrag.vy}; return; }
  if((wasDrag.kind==='lamp'||wasDrag.kind==='wind')&&wasDrag.moved>6) return;
  if(wasDrag.kind==='cam'&&wasDrag.moved<=6) handleClick(evt);
}
function handleClick(evt){
  const t=evt.target;
  const hot=t.closest?t.closest('[data-hot]'):null;
  if(hot){
    const key=hot.getAttribute('data-hot');
    const qk=hot.getAttribute('data-q')||key;
    if(hot.classList.contains('gem')){
      const gi=gems.findIndex(g=>g.node===hot);
      if(gi>=0&&!S.gemGot.includes(gi)){
        S.gemGot.push(gi); S.gems++;
        hot.setAttribute('opacity','0'); hot.style.transition='opacity .4s';
        toast('雨珠 +1  <span class="k">'+S.gems+'/'+S.gemTotal+'</span>');
        checkQuest();
      }
      return;
    }
    S.hotGot[key]=1;
    const meta=QUOTES[qk]||['注','点击此处。'];
    showBubble(meta[0],meta[1],evt.clientX,evt.clientY);
    if(key==='boat'){ S.rowT=1; }
    if(key==='stele'){
      if(S.quest>=QUESTS.length-1){
        openQuiz('poem',ok=>{ if(ok){ S.quizOk=1; toast('诗魁 · 全卷已通'); checkQuest(); showEnding(); } });
      } else { toast('碑文未启 · 先完成前面的九事'); }
      return;
    }
    checkQuest();
    return;
  }
  const sp=t.closest?t.closest('[data-sprout]'):null;
  if(sp){
    const i=+sp.getAttribute('data-sprout');
    if(i===S.sprouts){ S.sprouts=i+1; buildSprouts(); toast('新芽破土  <span class="k">'+S.sprouts+'/'+S.sproutMax+'</span>'); checkQuest(); }
    return;
  }
}
function showBubble(name,q,x,y){
  const b=$('bub');
  b.querySelector('.bn').textContent=name;
  b.querySelector('.bq').textContent=q;
  b.classList.add('on');
  const r=b.getBoundingClientRect();
  b.style.left=clamp(x-r.width/2,12,innerWidth-r.width-12)+'px';
  b.style.top=Math.max(12,y-r.height-16)+'px';
  clearTimeout(b._h); b._h=setTimeout(()=>b.classList.remove('on'),5200);
}
function checkQuest(){
  const st=questState();
  if(st.p>=st.need&&S.quest<QUESTS.length-1){
    if(S.quest===QUESTS.length-2&&S.stars<5){ /* 诗魁需5星 */ }
    advanceQuest();
  } else renderQuest();
}

/* ============================================================
   诗句索引 + 飞行
   ============================================================ */
function buildIdx(){
  const box=$('idx');
  box.innerHTML='<div class="ttl" style="padding:0 0 8px 11px">诗 句</div>';
  LINES.forEach((l,i)=>{
    const d=document.createElement('div');
    d.className='ln'+(i===S.line?' act':'');
    d.innerHTML=l.t+'<br>'+l.b;
    d.onclick=()=>gotoLine(i);
    box.appendChild(d);
  });
}
function gotoLine(i){
  S.line=i;
  // 每句对应长卷上的一个机位 + 时间点
  const cams=[[760,500,1.15,0.16],[1250,470,1.2,0.42],[3050,540,1.25,0.82],[4150,500,1.05,0.98]];
  const c=cams[i];
  flyTo(c[0],c[1],c[2],1.0);
  S.tTarget=c[3];
  document.querySelectorAll('#idx .ln').forEach((n,k)=>n.classList.toggle('act',k===i));
  toast('「'+LINES[i].t+'」');
}

/* ============================================================
   小地图
   ============================================================ */
const mmc=$('mmc'), mctx=mmc.getContext('2d');
function drawMini(){
  if(!mctx)return;
  const w=mmc.clientWidth, h=mmc.clientHeight;
  if(!w||!h)return;
  const d=Math.min(2,window.devicePixelRatio||1);
  if(mmc.width!==w*d){mmc.width=w*d;mmc.height=h*d;}
  mctx.setTransform(d,0,0,d,0,0);
  mctx.clearRect(0,0,w,h);
  // 底：山影
  mctx.fillStyle='rgba(20,30,46,.7)'; mctx.fillRect(0,0,w,h);
  mctx.strokeStyle='rgba(120,150,185,.3)';
  mctx.beginPath();
  for(let i=0;i<=40;i++){
    const x=i/40*w, y=h*0.52-Math.sin(i*0.55)*h*0.16-Math.sin(i*0.21)*h*0.1;
    i?mctx.lineTo(x,y):mctx.moveTo(x,y);
  }
  mctx.stroke();
  // 江
  mctx.fillStyle='rgba(30,50,78,.7)'; mctx.fillRect(0,h*0.6,w,h*0.4);
  // 视口
  const z=S.cam.z;
  const vw=(W/z)/WORLDW*w;
  const vx=(S.cam.x-W/2/z)/WORLDW*w;
  mctx.fillStyle='rgba(201,168,106,.24)';
  mctx.fillRect(clamp(vx,0,w),0,Math.min(vw,w),h);
  mctx.strokeStyle='rgba(230,207,154,.75)'; mctx.lineWidth=1;
  mctx.strokeRect(clamp(vx,0,w)+.5,.5,Math.min(vw,w)-1,h-1);
  // 人物标记
  const marks=[[1720,'#e8dcc0'],[1080,'#c9b48a'],[2960,'#ff9d5c']];
  marks.forEach(([x,c])=>{
    mctx.fillStyle=c;
    mctx.beginPath(); mctx.arc(x/WORLDW*w,h*0.5,2.4,0,7); mctx.fill();
  });
}

/* ============================================================
   时间轴 UI 拖动
   ============================================================ */
function bindWindDial(){
  const d=$('windDial');
  if(!d)return;
  let drag=false;
  const set=cx=>{
    const r=d.getBoundingClientRect();
    S.wind=clamp((cx-r.left)/r.width,0,1);
    S.windT=S.wind;
    const wi=document.getElementById('windInd');
    if(wi) wi.setAttribute('transform',`translate(1150,158) rotate(${(-52+S.wind*104).toFixed(1)})`);
  };
  d.addEventListener('pointerdown',e=>{drag=true;d.setPointerCapture(e.pointerId);set(e.clientX);e.stopPropagation();});
  d.addEventListener('pointermove',e=>{if(drag){set(e.clientX);checkQuest();}});
  d.addEventListener('pointerup',e=>{drag=false;checkQuest();});
  d.addEventListener('pointercancel',()=>{drag=false;});
}
function bindTimeTrack(){
  const tr=$('track');
  let dragging=false;
  const setFromX=cx=>{
    const r=tr.getBoundingClientRect();
    const t=clamp((cx-r.left)/r.width,0,1);
    S.t=t; S.tTarget=t;
    applyTime(); renderQuest(); checkQuest();
  };
  tr.addEventListener('pointerdown',e=>{dragging=true;tr.setPointerCapture(e.pointerId);setFromX(e.clientX);});
  tr.addEventListener('pointermove',e=>{if(dragging)setFromX(e.clientX);});
  tr.addEventListener('pointerup',e=>{dragging=false;});
  tr.addEventListener('pointercancel',()=>{dragging=false;});
}

/* ============================================================
   主循环
   ============================================================ */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016); last=ts;
  S.time+=dt;
  // 时间推进
  if(S.tPlaying){
    S.t+=S.tSpeed*dt;
    if(S.t>=1){S.t=1;S.tPlaying=false;}
    S.tTarget=S.t;
  } else {
    S.t+=(S.tTarget-S.t)*Math.min(1,dt*6);
  }
  // 惯性
  if(S.inertia){
    S.cam.x+=S.inertia.vx; S.cam.y+=S.inertia.vy;
    S.inertia.vx*=0.90; S.inertia.vy*=0.90;
    if(Math.abs(S.inertia.vx)<0.05&&Math.abs(S.inertia.vy)<0.05) S.inertia=null;
    camClamp();
  }
  // 相机飞行
  if(S.fly){
    S.fly.t+=dt;
    const k=easeIO(clamp(S.fly.t/S.fly.dur,0,1));
    S.cam.x=lerp(S.fly.x0,S.fly.x1,k);
    S.cam.y=lerp(S.fly.y0,S.fly.y1,k);
    S.cam.z=lerp(S.fly.z0,S.fly.z1,k);
    if(S.fly.t>=S.fly.dur)S.fly=null;
    camClamp();
  }
  // 玩家移动 + 第三人称跟随
  S.player.x+=(S.playerT.x-S.player.x)*Math.min(1,dt*7);
  S.player.y+=(S.playerT.y-S.player.y)*Math.min(1,dt*7);
  S.player.step+=dt*Math.abs(S.playerT.x-S.player.x)*0.06;
  const pg=document.getElementById('playerG');
  if(pg){
    pg.setAttribute('transform',`translate(${S.player.x.toFixed(1)},${S.player.y.toFixed(1)})`);
    const pb=document.getElementById('pBody');
    if(pb) pb.setAttribute('transform',`scale(${S.player.face},1) rotate(${Math.sin(S.player.step)*1.6})`);
  }
  if(S.follow&&!S.drag&&!S.fly){
    const tx=S.player.x, ty=Math.min(S.player.y-140,WORLDH-260);
    S.cam.x+=(tx-S.cam.x)*Math.min(1,dt*1.1);
    S.cam.y+=(ty-S.cam.y)*Math.min(1,dt*0.8);
    camClamp();
  }
  // 灯笼缓动
  S.lantern.x+=(S.lanternT.x-S.lantern.x)*Math.min(1,dt*7);
  S.lantern.y+=(S.lanternT.y-S.lantern.y)*Math.min(1,dt*7);
  const lamp=document.getElementById('lampG2');
  if(lamp) lamp.setAttribute('transform',`translate(${(2960+S.lantern.x).toFixed(1)},${(760+S.lantern.y).toFixed(1)})`);
  // 雨幕透明度
  const rv=document.getElementById('rainVeil');
  if(rv) rv.setAttribute('opacity',(S.rain*0.9).toFixed(2));
  // 撑篙动画
  if(S.rowT>0){
    S.rowT=Math.max(0,S.rowT-dt*0.35);
    const oar=document.getElementById('oarG');
    if(oar) oar.setAttribute('transform',`rotate(${(Math.sin(S.time*2.2)*7).toFixed(2)} ${-0} 0)`);
  }
  // 船随波
  const boat=document.getElementById('boatG');
  if(boat) boat.setAttribute('transform',`translate(3050,${(900+Math.sin(S.time*0.8)*3).toFixed(1)})`);
  // 宝石脉动
  gems.forEach((g,i)=>{
    if(S.gemGot.includes(i))return;
    const p=0.7+Math.sin(S.time*2+i)*0.3;
    const cs=g.node.querySelectorAll('circle');
    if(cs[2]) cs[2].setAttribute('r',(5.4*p+2).toFixed(2));
    if(cs[3]) cs[3].setAttribute('opacity',(0.6+p*0.4).toFixed(2));
    if(cs[1]) cs[1].setAttribute('opacity',(0.10+p*0.09).toFixed(2));
  });
  applyCam();
  applyTime();
  drawRain(dt);
  updateMarker();
  requestAnimationFrame(loop);
}

/* ============================================================
   输入
   ============================================================ */
function bindInput(){
  svg.addEventListener('pointerdown',onDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const pt=svgPt(e);
    const z0=S.cam.z;
    const z=clamp(z0*(e.deltaY<0?1.12:0.89),0.62,2.6);
    // 以光标为锚点
    const wx=pt.x, wy=pt.y;
    S.cam.x=wx-(wx-S.cam.x)*(z0/z);
    S.cam.y=wy-(wy-S.cam.y)*(z0/z);
    S.cam.z=z;
    camClamp();
  },{passive:false});
  // 键盘
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='arrowright'){S.tTarget=clamp(S.tTarget+0.06,0,1);e.preventDefault();}
    else if(k==='arrowleft'){S.tTarget=clamp(S.tTarget-0.06,0,1);e.preventDefault();}
    else if(k===' '){S.tPlaying=!S.tPlaying;e.preventDefault();}
    else if(k==='r'){S.playerT.x=700;S.playerT.y=906;flyTo(760,500,1,0.8);S.tTarget=0.16;}
    else if(k==='h'){$('help').classList.toggle('on');}
    else if(k==='d'||k==='a'){S.playerT.x+=(k==='d'?1:-1)*22;S.player.face=k==='d'?1:-1;}
    else if(k==='w'||k==='s'){S.playerT.y+=(k==='w'?-1:1)*14;}
    else if(k==='='||k==='+'){S.cam.z=clamp(S.cam.z*1.12,0.62,2.6);camClamp();}
    else if(k==='-'||k==='_'){S.cam.z=clamp(S.cam.z*0.89,0.62,2.6);camClamp();}
  });
  $('help').addEventListener('click',()=>$('help').classList.remove('on'));
}

/* ============================================================
   启动
   ============================================================ */
function init(){
  initLayers();
  buildSky();
  buildFar();
  buildMid();
  buildNear();
  buildFore();
  buildWeather();
  S.lamp0={x:S.lanternT.x,y:S.lanternT.y};
  initFX();
  buildTicks();
  buildIdx();
  bindTimeTrack();
  bindWindDial();
  applyHitRules();
  bindInput();
  applyCam();
  applyTime();
  renderQuest();
  setupMarkerForQuest();
  // 载入进度
  const steps=[['构建长卷',.25],['绘制人物',.55],['布置雨云',.78],['就绪',1]];
  let i=0;
  const run=()=>{
    if(i<steps.length){
      document.querySelector('#lbar i').style.width=(steps[i][1]*100)+'%';
      i++; setTimeout(run,180);
    } else {
      setTimeout(()=>{
        $('load').classList.add('gone');
        document.body.classList.add('cine');
        setTimeout(()=>document.body.classList.remove('cine'),1500);
        toast('拖动画面浏览长卷 · 拖底部时辰尺切换昼夜');
        setTimeout(()=>subtitle(0),900);
      },240);
    }
  };
  run();
  requestAnimationFrame(loop);
}
window.__S=S; window.__G={flyTo,applyCam,applyTime,gotoLine,checkQuest,QUESTS};
let _inited=false;
function boot(){ if(_inited) return; _inited=true; init(); }
document.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading') boot();

</script>
